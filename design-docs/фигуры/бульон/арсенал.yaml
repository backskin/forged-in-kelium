    на поле жетоном на уровень выше из запаса. Не больше 1 раза за ход.'
  низ:
    когда:
      событие: ветка
      ветка: science
    плата:
      kelium: 1
    эффект:
      params:
        type: any
        cost: 0
      effect: upgrade_building
    предел: 1
- id: t_1007
  текст: Каждый раз, когда выполняешь задание, получи по монете за каждый свой запитанный добытчик (не больше 3). Не больше
    1 раза за ход.
  низ:
    когда:
      событие: задание
    эффект:
      params:
        per: own_powered_miner
        coin: 1
        max: 3
      effect: gain_per
    предел: 1
