# ЧЕРНОВИК СУПЕР-ЗАДАНИЙ 5.0 — двенадцать карт «суперутиль или накопитель».
#
# Это НЕ игровой набор: движок его не читает и партию по нему не сыграть. Файл
# существует ради одного — чтобы у черновика был ЕДИНЫЙ источник. Разбор лежит в
# «ЧЕРНОВИК — супер-задания 5.0 (12 карт).md», документ для правки собирается
# отсюда (tools/документ-супер-заданий.py). Когда дизайнер утвердит числа, из
# этого же файла соберётся настоящий набор super_objectives 5.0.0.
#
# Поля каждой карты:
#   имя          — печатное название
#   накопитель   — за что и сколько очков в конце партии
#   потолок      — предел выдачи; без него карта превращается в лотерею
#   против       — ЧТО в обычной игре эта ось ломает (иначе карта — доплата)
#   утиль        — разовый эффект чудовищной силы; сжигает карту
#   цена         — чем игрок платит за сжигание
#   спор         — в чём половины карты противоречат друг другу

meta:
  id: 5.0.0-черновик
  type: super_objectives_draft
  дата: 2026-08-25

карты:
  - имя: Смотр войск
    накопитель: 2 ПО за каждый РАЗНЫЙ род войск, стоящий у тебя на поле
    потолок: 8
    против: >-
      пехота и вышки набираются сами (1.29 и 1.66 на игрока), а техника и
      авиация почти не встречаются (0.16 и 0.26). Карта требует держать на поле
      все четыре рода одновременно.
    утиль: >-
      Наняй бесплатно по одному жетону КАЖДОГО рода войск, поставив их на любые
      свои гексы; энергия и здания при этом не нужны.
    цена: >-
      Утиль выдаёт ровно те войска, за которые накопитель платит очки, — и
      уничтожает саму возможность их получить.
    спор: даёт то же, что считает

  - имя: Дальний рубеж
    накопитель: 1 ПО за каждое своё войско на гексе, соседнем с чужим зданием
    потолок: 5
    против: >-
      войска жмутся к своей базе: рядом с чужим ЦУ войско стоит лишь в 15%
      ходов. Стоять у чужого здания опасно — по тебе бьют первым.
    утиль: >-
      Перенеси ЛЮБЫЕ свои войска с любых гексов на один гекс поля и сними с них
      весь урон.
    цена: >-
      Утиль собирает армию в кулак, а накопитель требует размазать её по чужим
      границам.
    спор: собирает то, что надо разбросать

  - имя: Раскинутая сеть
    накопитель: 1 ПО за каждый РАЗНЫЙ гекс, где стоит твоё здание
    потолок: 6
    против: >-
      строят кучно — так дешевле возить энергию и безопаснее держать оборону.
      Стройка занимает 20% всех действий, и почти вся она идёт возле своего ЦУ.
    утиль: >-
      Построй три здания бесплатно, игнорируя энергию и зону стройки.
    цена: >-
      Три здания разом решают партию, но шесть разных гексов надо ещё удержать
      до конца — а их будут сносить.
    спор: строит сразу то, что должно копиться

  - имя: Гарнизонная служба
    накопитель: 2 ПО за каждый гекс, где стоят ОДНОВРЕМЕННО твоё здание и твоё войско
    потолок: 6
    против: >-
      здания дома, войска на фронте — естественное разделение труда. Карта
      требует держать их вместе, то есть воевать там, где строишь.
    утиль: Сыграй подряд ДВА полных приказа со своей руки, оба целиком.
    цена: >-
      Два приказа — это половина раунда сверх раунда. Зато армия, привязанная к
      зданиям, воюет плохо.
    спор: даёт темп там, где накопитель требует осёдлости

  - имя: Архив штаба
    накопитель: 2 ПО за каждое ВЫПОЛНЕННОЕ задание, лежащее перед тобой сверх трёх
    потолок: 6
    против: >-
      задания жгут втрое чаще, чем выполняют: 28.9 сожжено против 9.9
      выполненных за партию. Карта требует переломить привычку.
    утиль: >-
      Возьми ВСЕ карты с витрины арсенала себе в руку и добери две карты
      задания.
    цена: >-
      Гора карт в руке очков не приносит: накопитель считает только доведённое
      до конца.
    спор: даёт карты, а платит за сыгранные

  - имя: Оружейная палата
    накопитель: 2 ПО за каждую УСТАНОВЛЕННУЮ карту арсенала сверх двух
    потолок: 6
    против: >-
      арсенал охотнее сжигают ради утиля, чем ставят: у установки выгода
      отложенная, а у утиля — немедленная.
    утиль: >-
      Сожги любое число установленных у себя карт арсенала и получи все их
      утиль-эффекты разом.
    цена: >-
      Карта предлагает обналичить всё сразу — ровно то, что убивает её
      собственный накопитель.
    спор: обналичивает то, что считает

  - имя: Золотая жила
    накопитель: 1 ПО за каждый келемий, оставшийся в твоём хранилище в конце партии
    потолок: 5
    против: >-
      келемий — самый ходовой товар: его тратят на рынок, на ячейки и на науку.
      Карта требует его копить, а не пускать в дело.
    утиль: >-
      Обменяй весь свой келемий по курсу «за каждый — любое действие бесплатно,
      вне очереди».
    цена: Утиль превращает запас в темп, накопитель — в очки. Оба считают один и тот же келемий.
    спор: тратит ровно тот ресурс, который надо сберечь

  - имя: Первая линия
    накопитель: 2 ПО за каждый трек науки, где твоя фишка стоит ВЫШЕ всех остальных
    потолок: 6
    против: >-
      по трекам ползут понемногу и всюду сразу; быть первым на одном треке
      дороже, чем третьим на трёх.
    утиль: Сделай четыре шага науки бесплатно, в любом порядке и по любым трекам.
    цена: >-
      Четыре бесплатных шага почти наверняка выведут тебя вперёд — но карта уже
      сожжена, и очков за первенство не будет.
    спор: выводит вперёд, отменяя награду за первенство

  - имя: Трофейный обоз
    накопитель: >-
      1 ПО за каждый ЧУЖОЙ жетон, уничтоженный тобой за партию, но только пока
      твоё ЦУ ни разу не разрушено
    потолок: 6
    против: >-
      воевать и не подставиться — редкое сочетание: агрессор обычно получает в
      ответ, а его ЦУ становится целью.
    утиль: >-
      Уничтожь любое чужое здание на поле без боя (кроме ЦУ) и забери его в
      трофеи.
    цена: >-
      Бесплатный снос — это чужие очки и твои трофеи разом. Зато накопитель
      требует воевать долго и чисто.
    спор: даёт разовый снос вместо длинной чистой войны

  - имя: Штабная игра
    накопитель: 2 ПО за каждый раунд, в котором ты был первым игроком
    потолок: 6
    против: >-
      жетон первого игрока ходит по кругу сам; удержать его — значит тратить на
      это карты и эффекты.
    утиль: >-
      Забери жетон первого игрока и немедленно сыграй ещё один полный круг, пока
      остальные ждут.
    цена: Лишний круг сейчас против регулярного первенства всю партию.
    спор: берёт первенство один раз вместо многих

  - имя: Неприкосновенный запас
    накопитель: 2 ПО за каждое своё здание ПЕРВОГО уровня, стоящее на поле в конце партии
    потолок: 6
    против: >-
      добытчики и станции гонят на четвёртый уровень ради звезды (1.65 ПО на
      игрока). Карта платит за обратное — за широкую дешёвую сеть.
    утиль: Мгновенно подними два своих добытчика или энергостанции до ЧЕТВЁРТОГО уровня.
    цена: Две звезды сразу — это очки и экономика; но именно они обнуляют накопитель.
    спор: прокачивает то, что должно остаться дешёвым

  - имя: Тень штаба
    накопитель: >-
      3 ПО, если твоё ЦУ ни разу за партию не было разрушено, плюс 1 ПО за
      каждого соперника, чьё ЦУ разрушали
    потолок: 6
    против: >-
      платит за то, чтобы война шла — но не у тебя. Требует стравливать соседей,
      а не отсиживаться: без чужих сносов карта даёт всего 3.
    утиль: >-
      УНИЧТОЖЬ СВОЙ СОБСТВЕННЫЙ жетон уничтожения ЦУ. Он уходит из игры
      навсегда: снеся твоё ЦУ, соперник не получит НИЧЕГО — ни трёх очков, ни
      шага к военной победе. Ячейка атаки, которую жетон закрывал, открывается.
    цена: >-
      Своим очком за уцелевший жетон — и тем, что перестаёшь быть интересной
      мишенью, а значит перестаёшь притягивать чужую войну. Чужой жетон забирать
      нельзя принципиально: он добывается ТОЛЬКО войной, и карта, которая его
      дарит, обесценила бы единственный путь к мгновенной победе.
    спор: покупает безопасность, отменяя награду за неё
