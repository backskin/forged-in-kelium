# ПРЕДЛОЖЕНИЕ: супер-задания 8.0.0 — двенадцать карт переписаны заново.
# Не для игры: проверяется командой
#   python tools/проверка-супер-заданий.py "design-docs/карты/ПРЕДЛОЖЕНИЕ — супер-задания 8.0.0 (2026-09-10).yaml"
meta: {id: 8.0.0-предложение, type: super_objectives}
super_objectives:

# ---------- ОСТАВЛЕНЫ КАК ЕСТЬ (проверку проходят) ----------
- id: s5_02
  name: Дальний рубеж
  requirement: Поставь своё войско на гекс, соседний с ЧУЖИМ ЦУ.
  reward: Перенеси любые свои войска на один гекс поля и сними с них весь урон.
  multiplier: 1 ПО за каждое своё войско на гексе, соседнем с чужим зданием. Потолок 5.
- id: s5_03
  name: Раскинутая сеть
  requirement: Имей свои здания на пяти РАЗНЫХ гексах.
  reward: Построй три здания бесплатно, игнорируя энергию и зону стройки.
  multiplier: 1 ПО за каждый РАЗНЫЙ гекс, где стоит твоё здание. Потолок 6.
- id: s5_04
  name: Гарнизонная служба
  requirement: Имей три гекса, где стоят одновременно твоё здание и твоё войско.
  reward: Сыграй подряд ДВА полных приказа со своей руки, оба целиком.
  multiplier: 2 ПО за каждый гекс, где стоят одновременно твоё здание и твоё войско. Потолок 6.
- id: s5_05
  name: Архив штаба
  requirement: Выполни четыре задания за партию.
  reward: Возьми ВСЕ карты с витрины арсенала в руку и добери две карты задания.
  multiplier: 2 ПО за каждое выполненное задание сверх трёх. Потолок 6.
- id: s5_09
  name: Трофейный обоз
  requirement: Уничтожь четыре чужих жетона, ни разу не потеряв своё ЦУ.
  reward: Уничтожь любое чужое здание на поле без боя (кроме ЦУ) и забери его на место уничтоженных жетонов.
  multiplier: 1 ПО за каждый уничтоженный тобой чужой жетон, пока твоё ЦУ ни разу не разрушено. Потолок 6.

# ---------- ПЕРЕПИСАНЫ ----------

# Потолок 8 равнялся максимуму (родов войск ровно 4) и ничего не ограничивал.
- id: s5_01
  name: Смотр войск
  requirement: Держи три РАЗНЫХ рода войск одновременно на ОДНОМ гексе.
  reward: Найми бесплатно по одному жетону КАЖДОГО рода войск на свои гексы, без энергии и зданий.
  multiplier: 2 ПО за каждый РАЗНЫЙ род войск у тебя на поле. Потолок 6.

# Было «сверх двух, потолок 6»: ячеек арсенала три, сверх двух помещается одна,
# то есть настоящий максимум был 2 ПО при обещанных шести. Награда сжигала
# установленные карты ради их верхов — установленная карта лежит низом вверх,
# верха у неё на столе нет.
- id: s5_06
  name: Оружейная палата
  requirement: Держи три установленные карты арсенала одновременно.
  reward: Возьми с витрины арсенала две карты и установи обе бесплатно.
  multiplier: 3 ПО за каждую установленную карту арсенала в конце партии. Потолок 6.

# Награда меняла келемий на действия «вне очереди» — очередь ходов в игре не
# прерывается ничем, кроме реакций с карт заданий.
- id: s5_07
  name: Золотая жила
  requirement: Имей пять келемия в хранилище одновременно.
  reward: Разыграй Добычу дважды подряд, оба раза не тратя энергию.
  multiplier: 1 ПО за каждый келемий в твоём хранилище в конце партии. Потолок 4.

# Потолок 6 равнялся максимуму: треков ровно три, по 2 ПО за трек.
- id: s5_08
  name: Первая линия
  requirement: Стой выше всех соперников сразу на ДВУХ треках науки.
  reward: Сделай четыре шага науки бесплатно, в любом порядке и по любым трекам.
  multiplier: 3 ПО за каждый трек науки, где твоя фишка выше всех. Потолок 6.

# Множитель считал раунды, в которых ты был первым игроком, — этого на столе
# не видно и запомнить нечем. Считаем то, что лежит перед глазами: фишку.
- id: s5_10
  name: Штабная игра
  requirement: Будучи первым игроком, вскрой приказ, который в этом круге не вскрыл больше никто.
  reward: Забери фишку первого игрока себе; в ближайшее Обновление она не передаётся.
  multiplier: 4 ПО, если фишка первого игрока у тебя в конце партии.

# Три ошибки разом. Требование просило четыре здания первого уровня, а их
# всего два (добытчик №1 и энергостанция №1). Потолок 6 при максимуме 4.
# Награда поднимала здания до четвёртого уровня — повышения уровня в игре нет,
# здание только ставят из запаса и сносят.
- id: s5_11
  name: Неприкосновенный запас
  requirement: Имей на поле одновременно казарму, завод и авиабазу.
  reward: Собери бесплатно по одному войску в каждом своём военном здании, не тратя энергию.
  multiplier: 2 ПО за каждое своё здание БЕЗ УРОВНЯ на поле — казарму, завод, авиабазу и ЦУ. Потолок 6.

# Награда уничтожала собственный жетон уничтожения ЦУ — жетон достаётся тому,
# кто снёс чужое ЦУ, и «свой» у игрока только один, тот, что даёт 3 ПО за целое
# ЦУ. Сделано проще и считаемо.
- id: s5_12
  name: Тень штаба
  requirement: Твоё ЦУ цело, а ЦУ хотя бы одного соперника уже разрушено.
  reward: Сними весь урон со всех своих зданий и войск на поле.
  multiplier: 4 ПО, если твоё ЦУ цело в конце партии, и 2 ПО за каждый чужой жетон уничтожения ЦУ у тебя. Потолок 8.

# Копия s5_04: требование и награда были те же самые.
- id: s5_13
  name: Казна
  requirement: Имей десять монет в запасе одновременно.
  reward: Построй бесплатно два любых здания из запаса, игнорируя зону стройки.
  multiplier: 1 ПО за каждые 2 монеты в твоём запасе в конце партии. Потолок 5.

# Копия s5_02.
- id: s5_14
  name: Склад лома
  requirement: Имей четыре трофея в хранилище одновременно.
  reward: Сделай три шага науки бесплатно, не тратя трофеи.
  multiplier: 1 ПО за каждый несданный трофей у тебя в конце партии. Потолок 4.

# Копия s5_01.
- id: s5_15
  name: Промышленный узел
  requirement: Имей три своих здания на трёх гексах, соседних между собой.
  reward: Сними все свои кубики энергии и разложи их заново по своим зданиям как хочешь.
  multiplier: 1 ПО за каждое своё здание на поле сверх двух. Потолок 8.

# Копия s5_07.
- id: s5_16
  name: Сводный полк
  requirement: Имей на поле шесть своих войск одновременно.
  reward: Перемести все свои войска на поле, каждое на его скорость, не тратя боеприпасов.
  multiplier: 1 ПО за каждые 2 своих войска на поле в конце партии. Потолок 6.

# Копия s5_09, и потолок 6 равнялся максимуму: зданий четвёртого уровня всего
# два. Расширено до третьего-четвёртого — таких четыре.
- id: s5_17
  name: Тяжёлая промышленность
  requirement: Имей на поле добытчика и энергостанцию третьего или четвёртого уровня.
  reward: Поставь бесплатно из запаса свои добытчик и энергостанцию любых уровней, игнорируя зону стройки.
  multiplier: 3 ПО за каждое своё здание третьего или четвёртого уровня на поле. Потолок 9.
