  имя: Опорный пункт
  верх: '2 max: Выполни движение двумя любыми жетонами войск'
  условие: Имей на поле 2 своих жетона вышки на разных гексах (обе не на гексе с ЦУ)
  дополнительно: одна из вышек стоит на гексе с жетонами врага.
