задания:
- id: o04
  имя: Жила
  верх: ПОСЛЕДНИЙ ВЫСТРЕЛ! Если твой жетон войска уничтожают, нанеси 1 урон атакующему жетону
  условие: Имей на поле два своих добытчика с полной энергией и примыкающих к разным зарождениям
  дополнительно: примыкающих к большим зарождениям.
  награда: Питание → Переложить энергию или Добыча → Добыть
  награда_коды: energy_swap|mining
  доп_награда:
    module: attack
    spec_actions: 1
  лицо: лица/objective/o04.png
  изменено: нет (иконки наград читаются как ветки, см. правила §6)
- id: o05
  имя: Выработка
  верх: ОТВЕТНЫЙ ЗАРЯД! Если твой жетон здания уничтожают, нанеси 1 урон атакующему жетону
  условие: В ЭТОТ ХОД забери последний келемий с любого зарождения
  дополнительно: ты исчерпал зарождение - оно ушло с поля.
  награда: Развитие → Рынок или Командование → Манёвр
  награда_коды: market|movement
  доп_награда:
    gild: 1
  лицо: лица/objective/o05.png
  изменено: нет (иконки наград читаются как ветки, см. правила §6)
- id: o40
  имя: Ва-банк
  верх: ЭВАКУАЦИЯ! Если атакуют твой жетон, ты можешь вернуть его в свой запас (не отдавая в трофеи)
  условие: Имей одновременно ноль келемия и ноль боеприпасов в хранилище
  дополнительно: не имей даже монет.
  награда: Снабжение → Выпустить или Добыча → Добыть
  награда_коды: assembly|mining
  доп_награда:
    trophy: 1
    spec_actions: 1
  лицо: лица/objective/o40.png
  изменено: нет (иконки наград читаются как ветки, см. правила §6)
- id: o08
  имя: Разведка недр
  верх: РИКОШЕТ! Если атакуют твой жетон, перенеси урон с него на любой другой жетон на том же гексе
  условие: В ЭТОТ ХОД забери 2 контейнера (добытчиками или войсками)
  дополнительно: null
  награда: 3 спец-действия
  доп_награда: null
  лицо: лица/objective/o08.png
  изменено: нет (иконки наград читаются как ветки, см. правила §6)
- id: o01
  имя: Полный залп
  верх: ЗАКРОМА. Получи 2 боеприпаса, если кто-либо атакует твой жетон
  условие: В ЭТОТ ХОД произведи военными зданиями только боеприпасы и ни одного войска
  дополнительно: эти здания - завод и авиабаза.
  награда: Командование → Манёвр или Командование → Бой
  награда_коды: movement|combat
  доп_награда:
    arsenal: 1
    spec_actions: 1
  лицо: лица/objective/o01.png
  изменено: нет (иконки наград читаются как ветки, см. правила §6)
- id: o29
  имя: Пустой двор
  верх: АТАКУЙ ДВАЖДЫ! Выполни атаку двумя своими войсками на поле
  условие: Имей свои войска на трех гексах, где нет твоих зданий
  дополнительно: на четырех гексах.
  награда: действие «Питание» (любая его ветка)
  награда_коды: power
  доп_награда:
    coin: 4
  лицо: лица/objective/o29.png
  изменено: награда «… или Стройка» стала «… или Питание → Построить энергостанцию»; перерисована вторая иконка награды
