ветки:
  mining: Добыча → Добыть
  build_miner: Добыча → Построить добытчик
  energy_swap: Питание → Переложить энергию
  build_plant: Питание → Построить энергостанцию
  assembly: Снабжение → Выпустить
  build_military: Снабжение → Построить военное здание
  movement: Командование → Манёвр
  combat: Командование → Бой
  market: Развитие → Рынок
  science: Развитие → Наука
составы_колод:
  приказы: 5 карт у каждого цвета (20), джокера нет
  задания: 40 обычных (o04, o05, o40, o08, o01, o29, o03, o07, o27, o63, o33, o36, o34, o64, o17, o11, o18, o78, o12, o79,
    o20, o66, o67, o10, o06, o68, o69, o42, o25, o70, o71, o72, o21, o43, o73, o74, o02, o75, o76, o77)
  задания_начальные: 12, без изменений
  арсенал: 33 обычных (a7_01…a7_33), 6 начальных (bs72_1…bs72_6; «Сдача тары» bs72_7 убрана 30.09.2026 — арсенал 7.4.0), 9 супер (без изменений)
  рынок: 10 карт market 4.0.0, в партию 8, без изменений в картинках
  не_задеты: супер-задания 9.0.0, контейнеры 6.0.0, планшеты, модули — без изменений
