# РАЗЪЯСНЕНИЯ КАРТ ЗАДАНИЙ — тексты справочника.
#
# Справочник не пересказывает карту: на карте всё уже напечатано. Здесь
# объясняется, ЧТО она на самом деле просит, КОГДА её выполнять и НА ЧЁМ об
# неё спотыкаются. Ключ — id карты из data/cards/objectives.*.yaml.
#
# Правило, общее для всех: состояние («Имей…») проверяется в ту секунду,
# когда вы тратите на карту спец-действие; происшествие («В ЭТОТ ХОД…») —
# по тому, что вы сделали за текущий свой ход, и выполнить карту надо тем
# же ходом, потому что память хода дальше не живёт.
разъяснения:
  o04: >
    Карта не про богатую жилу, а про развёрнутую добычу: два добытчика,
    у каждого заняты все ячейки энергии, и каждый стоит у своего
    зарождения. Два добытчика вокруг одного зарождения условия не
    закрывают. Дополнительное требование просит оба зарождения большие —
    это обычно середина поля, поэтому карту держат до выхода к центру.
    Энергию с добытчиков не снимайте, пока не выполнили карту.
  o05: >
    Платят не за объём добычи, а за то, что вы сняли с зарождения его
    ОСТАТОК — последний кубик. Добыть и выполнить надо одним ходом.
    Дополнительное требование засчитывается, когда зарождение после этого
    уходит с поля целиком. Помните, что пустеющие зарождения приближают
    конец партии: считайте, кому это выгоднее.
  o40: >
    Карта платит за банкротство: ноль монет и ноль боеприпасов
    одновременно. Состояние проверяется в момент выполнения, поэтому
    её играют сразу после большой траты — купили, отстрелялись и тут же
    обналичили пустоту, пока не пришёл доход. Дополнительное требование
    добавляет ноль по келемию: спускать надо всё, включая добытое.
  o08: >
    Три контейнера за один ход одним источником не набрать: это добыча
    добытчиками плюс подбор контейнеров войсками или снос нейтральной
    постройки. Вскрывать контейнеры не нужно — достаточно забрать.
    Взятое в прошлом круге не считается: карта смотрит только на этот ход.
  o01: >
    Карта запрещающая, а не требующая: за ход из ваших зданий должны
    выйти боеприпасы и ни одного войска. Один нанятый жетон — и до
    следующего хода карта мертва. Дополнительное требование просит, чтобы
    боеприпасы дали именно завод и авиабаза, то есть чтобы у вас работала
    пара производств, а не одно.
  o29: >
    Считаются войска, ушедшие от своих стен: жетон стоит на гексе, где
    нет ни одного вашего здания. Войско рядом с вашей энергостанцией на
    том же гексе не подходит. Дополнительное требование — четыре таких
    войска, и все на разных гексах: это выход в поле целым фронтом,
    а не один десант.
  o03: >
    Две вышки на разных гексах, и ни одна не стоит на гексе с вашим ЦУ, —
    карта про вынесенное вперёд наблюдение. Вторая вышка рядом с первой
    на том же гексе не считается. Дополнительное требование ставит одну
    из вышек прямо на гекс с жетонами врага: за такую наглость платят
    трофеями.
  o07: >
    Нужно военное здание с войском ВНУТРИ, а не просто с войском на том
    же гексе, и соседний гекс с жетонами врага. Дополнительное требование
    просит держать так два своих войска. Выполняйте до своего Боя: после
    размена сосед может исчезнуть, а с ним и условие.
  o27: >
    Гекс с одними чужими ЗДАНИЯМИ для ваших наземных войск открыт —
    проход закрывают чужие войска и стенки, а не сами постройки. Карта
    и оплачивает этот заход во двор. Дополнительное требование — два
    ваших войска на одном таком гексе; это уже заявка на снос.
  o63: >
    Формулировка обманчива. Ноль в запасе означает, что род выведен
    ЦЕЛИКОМ: все четыре жетона пехоты, или техники, или авиации, или
    вышек стоят на поле. Заменить убитого станет некем — об этом и верх
    карты с ответным огнём. Дополнительное требование просит двух
    полностью выведенных родов.
  o33: >
    Предложения должны быть РАЗНЫЕ, но считаются они широко: печатные
    курсы планшета рынка и предложения открытой карты рынка идут по
    отдельности. Дважды снятое одно и то же предложение не годится.
    Усиления у карты нет — награда одна.
  o36: >
    Карта про глубину, а не про ширину: нужен второй шаг на одном треке,
    а не по первому шагу на двух. Состояние держится само, пока вы стоите
    на треке, так что карту можно спокойно придержать в руке.
    Дополнительное требование — второй шаг сразу на двух треках.
  o34: >
    Отдельным предложением считается и шаг по треку, и каждый обмен
    Научного отдела. Обменов на планшете три — значит, три разных
    предложения за ход это ровно все они. Практически ход приходится
    отдавать Науке целиком: одно действие плюс чужой приказ или карта.
    Усиления у карты нет.
  o64: >
    Карта запрещает копить в одном месте: сдача трофеев должна пройти на
    двух РАЗНЫХ треках за один ваш ход, дополнительное требование — на
    трёх. Наградой идут карты заданий, поэтому её удобно выполнять в тот
    ход, когда вы и так вкладываетесь в науку.
  o17: >
    Подойдёт любое ваше здание, хоть энергостанция: важно, что его гекс
    граничит с гексом чужого ЦУ. Это заявка на осаду, и её видят все.
    Дополнительное требование — два таких здания на РАЗНЫХ гексах вокруг
    чужого ЦУ; два здания на одном гексе засчитаны не будут.
  o11: >
    В отличие от «Штаба на передовой», здание нужно ПОСТРОИТЬ в этот ход,
    и по соседству должны стоять именно войска врага, а не его постройки.
    Дополнительное требование добавляет к ним ещё и чужое здание на том
    же гексе. Держите спец-действие свободным: строить и выполнять
    придётся одним ходом.
  o18: >
    Проверяется не количество построек, а отсутствие обесточенных: среди
    ваших зданий, которым нужна энергия, не должно быть ни одного
    погасшего, и таких зданий не меньше трёх. Одна перекинутая ячейка
    ломает условие, поэтому карту выполняют сразу после Смены энергии,
    а не в конце хода. Дополнительное требование — четыре запитанных.
  o65: >
    Карта оплачивает обновление, а не стройку: за ход вы обязаны снести
    СВОЁ здание и поставить другое. Одна стройка без сноса не годится,
    как и снос без стройки. Дополнительное требование просит поставить
    новое здание ровно на тот гекс, где стояло снесённое.
  o15: >
    Два здания за ход и обязательно на разных гексах — одной Стройки для
    этого мало, нужен второй заход: чужой приказ, спец-плашка или карта.
    Дополнительное требование поднимает до трёх зданий, и гексы не должны
    граничить между собой: это уже расползание по всему полю.
  o12: >
    Правила запрещают наземным войскам ВХОДИТЬ на гекс с чужими войсками,
    но не запрещают там строить. Карта платит именно за то, что вы влезли
    стройкой под нос врагу. Дополнительное требование считает чужие
    жетоны на этом гексе: их должно быть два и больше.
  o20: >
    Источники энергии — это ваши энергостанции и ЦУ. Нужны два источника,
    у каждого из которых ровно один кубик энергии не отдан зданиям. Не
    «хотя бы один»: два свободных кубика на источнике выбивают его из
    счёта. Зато лишние источники с двумя кубиками условие не ломают —
    они просто не считаются. Дополнительное требование — три источника.
  o66: >
    Жертвенная карта без дополнительного требования: цена — сброшенная
    карта арсенала, награда выдаётся целиком и сразу. Выгодна, когда
    в руке лежит арсенал, который вы всё равно не установите: мёртвая
    карта обменивается на монеты, боеприпас и модуль атаки.
  o67: >
    Перевод боеприпасов в карты: два боеприпаса в общий запас — и вы
    берёте монеты, задание и арсенал. Имеет смысл в ход, когда стрелять
    вы всё равно не собираетесь, а руки пустые. Дополнительного
    требования нет.
  o10: >
    Это не потеря, а отвод: жетоны уходят с поля в ваш запас и снова
    доступны к найму. Дополнительное требование просит убрать технику
    и (или) авиацию, и обязательно с ОДНОГО гекса — то есть увести
    оттуда целое звено, а не двух одиночек с разных краёв.
  o06: >
    Контейнеры сдаются НЕОТКРЫТЫМИ: вскрыли — карту уже не выполнить.
    Выбор прямой: рискнуть содержимым или взять монеты и два трофея
    наверняка. В партии, где вы идёте по трекам науки, трофеи обычно
    дороже неизвестного.
  o68: >
    Цель — именно техника или авиация врага: пехота и вышка не подходят.
    Уничтожение и выполнение — один ваш ход. Дополнительное требование
    просит в этот же ход добить ещё два любых чужих жетона, и владельцы
    у них могут быть разные.
  o69: >
    Гекс должен опустеть от жетонов врага полностью, и всё это — в один
    ваш ход. Помните, что здание закрывает войска от наземных атак:
    начинать почти всегда приходится со здания или бить авиацией.
    Дополнительное требование засчитывается, если жетонов было не
    меньше трёх.
  o42: >
    Удар по экономике: цель — добытчик противника. Дополнительное
    требование просит, чтобы этот добытчик был полностью запитан
    и примыкал к келемию, то есть чтобы вы сорвали работающую добычу,
    а не снесли пустышку на краю поля.
  o25: >
    Карта смотрит на вашу свалку: уничтоженный вами чужой жетон лежит там
    до Возвращения, а в Возвращении уходит владельцу. Значит, выполнять
    карту надо в том же раунде, пока трофей ещё на столе. Дополнительное
    требование — два чужих жетона, и один из них добытчик.
  o70: >
    Снова счёт по свалке: два чужих жетона на ней в момент выполнения.
    Дополнительное требование просит, чтобы один из них был
    энергостанцией — с её сносом у хозяина гаснут здания, которые она
    питала. Успевайте до Возвращения, иначе свалка опустеет.
  o71: >
    Карта награждает за то, за что обычно наказывают, — за драку сразу
    с двумя соседями: на свалке должны лежать жетоны ДВУХ разных игроков.
    Дополнительное требование просит, чтобы оба были зданиями. Вдвоём
    карта невыполнима — её сбрасывают или сжигают ради верха.
  o72: >
    Сравнение идёт по войскам на поле и в момент удара: у жертвы их
    должно быть больше, чем у вас. Карта прямо оплачивает выравнивание —
    бить лидера выгоднее, чем слабого. Дополнительное требование просит,
    чтобы убитый жетон был техникой или авиацией.
  o21: >
    Два чужих жетона за один ход — это либо Бой несколькими своими
    жетонами по одному гексу, либо добивание уже раненых. Дополнительное
    требование смотрит на прочность: хотя бы у одного из убитых она была
    2 или больше, то есть его пришлось бить не одной атакой.
  o43: >
    Как «Против сильнейшего», только счёт по ЗДАНИЯМ: у жертвы их на поле
    больше, чем у вас. Это карта отстающего в застройке. Дополнительное
    требование просит, чтобы убитый жетон был зданием, — тогда разрыв вы
    ещё и сокращаете.
  o73: >
    Энергостанция — самая болезненная цель: с её сносом у противника
    гаснут здания, которые она питала, и энергия возвращается ему
    в источники. Дополнительное требование засчитывается за станцию
    3 или 4 уровня, то есть за развитую, а не за только что купленную.
  o74: >
    Все четыре энергостанции стоят на поле одновременно — в запасе
    не остаётся ни одной. Запитывать их не требуется. Условие ломается
    в ту же секунду, как одну из них сносят, поэтому выполняйте карту
    сразу, как поставили четвёртую.
  o75: >
    То же, что «Энергосеть», но про четыре добытчика. Энергия и добыча
    здесь ни при чём: важно только, что все четыре стоят на поле.
    Обычно это значит, что вы раскинулись сразу по нескольким
    зарождениям — и это само по себе заявка на экономическую партию.
  o02: >
    Два войска РАЗНЫХ родов за один ход: двух пехотинцев не хватит.
    Практически нужны два производящих здания или второй наём от карты.
    Дополнительное требование просит, чтобы среди нанятых была авиация
    и не было ни одной вышки, то есть чтобы вы взяли ударные войска,
    а не дешёвые.
  o76: >
    Считаются гексы, а не жетоны: четыре разных гекса с вашими войсками,
    и среди этих войск хотя бы два разных рода. Пять жетонов на двух
    гексах условия не дают. Дополнительное требование — шесть гексов:
    это уже контроль половины поля.
  o77: >
    Чистая ширина: пять разных гексов с вашими войсками, род не важен.
    Дополнительное требование просит, чтобы на двух из этих гексов
    стояли здания противника, — растяжка должна идти по чужой земле,
    а не по своему тылу.
  n1: >
    Первая цель новичка. ЦУ считается зданием, поэтому достаточно
    построить ещё два — обычно добытчик и энергостанцию. Карта просто
    отмечает, что вы развернулись.
  n2: >
    Нанять в этот ход любое войско, кроме вышки: карта толкает к
    настоящим войскам, а не к дешёвой наблюдательной точке. Наём
    и выполнение — один ход.
  n3: >
    Держите три боеприпаса в момент выполнения. Проще всего сразу после
    хода, в котором вы производили боеприпасы и не стреляли: карта
    смотрит на запас, а не на то, откуда он взялся.
  n4: >
    Нужно именно ПРЕДЛОЖЕНИЕ открытой карты рынка, а не печатный обмен
    келемия на монеты по планшету. Помните, что за предложение келемий
    кладётся в его ячейку: если свободных ячеек нет, взять его нельзя.
  n5: >
    Запитанное здание за пределами гекса с ЦУ — значит, вы протянули
    энергию наружу, а не сидите одним хозяйством. Само ЦУ и всё, что
    стоит с ним на одном гексе, не годится.
  n6: >
    Войско на расстоянии двух гексов и дальше от своего ЦУ. Соседний
    гекс не подходит: карта отмечает именно выход из дома, а не шаг
    за порог.
  n7: >
    Три келемия на руках в момент выполнения. Карта учит не спускать
    добычу сразу: келемий — вход и на рынок, и в карты заданий.
  n8: >
    Два НЕОТКРЫТЫХ контейнера. Вскрытые не считаются, так что карту
    выполняют до того, как пустят содержимое в дело.
  n9: >
    Достаточно первого шага на любом из трёх треков: карта просто
    выводит вас на планшет науки. Дальше трек сам начнёт приносить очки.
  n10: >
    Хотя бы один уничтоженный вами жетон на вашей свалке. Выполняйте
    в том же раунде: в Возвращении свалка отдаёт жетоны владельцам
    и условие пропадает.
  n11: >
    Речь о чужом приказе — нижнем на вашей карте. Он открывается, когда
    этот же приказ до вас вскрыл кто-то другой, так что карта зависит от
    соседей: держите её, пока чужой приказ не откроется.
  n12: >
    Совпадение верхнего приказа с чужим обычно наказывает — одно действие
    вместо двух. Эта карта превращает неудачу в награду, и выполняется
    ровно в тот ход, когда совпадение случилось.
