# РАЗЪЯСНЕНИЯ КАРТ АРСЕНАЛА — тексты справочника.
#
# У карты арсенала две половины, и играется только одна: верх сжигают ради
# разового эффекта, низ ставят на планшет — он работает всю партию и в конце
# даёт победное очко. Поэтому объяснять надо не «что написано», а что эта
# половина реально меняет в партии и почему выбор между ними тяжёлый.
разъяснения:
  a5_01: >
    Низ — единственный в игре способ ПОЛОЖИТЬ на поле новое зарождение:
    выбранный гекс очищается от всех жетонов (они уходят владельцам), и на
    него встаёт стартовый тайл из запаса. Это и перенос добычи к себе,
    и выселение чужого гарнизона одним движением. Верх скромнее — разовое
    улучшение модуля за келемий, и берут его, когда келемия мало,
    а модуль нужен сейчас.
  a5_02: >
    Низ платит за войну по монете в фазу Возвращения — за каждый чужой
    жетон, который в этот момент уходит с вашей свалки. Доход идёт только
    в тот раунд, когда вы убивали, поэтому карта окупается у того, кто
    дерётся постоянно, а не изредка. Верх — Бой с лишним боеприпасом
    сейчас, на один сильный размен.
  a5_03: >
    Низ тот же, что у «Трофейной команды», — монеты за возвращаемые
    чужие жетоны. Разница в верхе: он бьёт по первому игроку, забирая
    у него жетон и монету. Сжигают такую карту тогда, когда важнее сбить
    темп лидеру, чем строить себе доход на всю партию.
  a5_04: >
    Низ делает авиацию щитом: пока ваш самолёт стоит на гексе, наземные
    атаки по остальным вашим жетонам на этом гексе не проходят. Ценность
    тем выше, чем плотнее вы держите войска в одном месте. Верх — десант
    из двух разных войск на пустой от врага гекс, то есть внезапная
    высадка целым отрядом.
  a5_05: >
    Низ выжигает гекс целиком: за четыре боеприпаса все жетоны с него
    уходят, за каждый вы берёте трофей, а на гекс встаёт недоступная
    местность — поле меняется навсегда. Сыграв низ, карту удаляют из
    игры, так что победного очка в конце она не даст. Верх — просто три
    боеприпаса, и это честная альтернатива, если стрелять надо сейчас.
  a5_06: >
    Низ — это банк темпа: спец-действием вы кладёте на карту келемий,
    а потом сжигаете его, чтобы разыграть любое действие любого приказа.
    Копить можно заранее, тратить — в решающий ход. Верх даёт
    неограниченные спец-действия на один ход: карты, задания и контейнеры
    разом уходят в дело.
  a5_07: >
    Низ решает главную беду добытчика: он стоит там, где келемий уже
    кончился. Спец-действием добытчик переезжает на любой гекс, где вам
    доступна стройка, — переносить добычу можно хоть каждый раунд.
    Верх — разовая Добыча, когда келемий нужен ровно сейчас.
  a5_08: >
    Низ — страховка: за каждое уничтоженное ваше здание вы берёте
    контейнер. Он не мешает сносу, но делает его для врага менее
    выгодным, а вам возвращает часть потерь. Верх ставит любое здание
    за одну монету, и в ранней партии это часто дороже страховки.
  a5_09: >
    Низ тот же страховой контейнер за снесённое здание. Верх другой:
    он забирает у противника закрытую карту арсенала, то есть лишает
    его будущего хода и даёт вам выбор из чужой руки. Карта для того,
    кого уже начали сносить, — или против того, кто копит арсенал.
  a5_10: >
    Низ меняет авиации профиль: лишняя прочность вместо скорости. Ваш
    самолёт перестаёт быть разведчиком и становится тараном, который
    не убить одной атакой. Верх — пять монет сразу: честная цена за
    отказ от такой перестройки.
  a5_11: >
    Низ даёт второе спец-действие каждый ход, но только если вы в этот
    ход не играли Безопасность. Это самый сильный постоянный разгон
    в колоде: два задания, две установки, два вскрытия. Верх —
    неограниченные спец-действия на один-единственный ход.
  a5_12: >
    Низ тот же — второе спец-действие в ход без Безопасности. Верх про
    другое: он меняет карту приказа в руке на карту из сброса, то есть
    чинит неудачный расклад круга. Одна карта на две беды: нехватка
    спец-действий и нехватка нужного приказа.
  a5_13: >
    Низ разгоняет технику ценой её прочности: она ходит дальше, но
    гибнет от одной лишней атаки. Годится тому, кто бьёт первым. Верх
    удаляет УСТАНОВЛЕННУЮ карту арсенала противника — то есть отнимает
    у него постоянную способность и победное очко.
  a5_14: >
    Низ тот же размен: техника быстрее, но хрупче. Верх — разовое
    Снаряжение, наём прямо сейчас. Выбор простой: одна карта — либо
    быстрый кулак на всю партию, либо войска в этот ход.
  a5_15: >
    Низ спец-действием перекидывает кубик энергии на любое своё здание —
    это обход обычного порядка Смены энергии, когда нужно запитать что-то
    срочно. Плюс карта добавляет ячейку под контейнер. Верх — разовое
    Снаряжение.
  a5_16: >
    Низ даёт сыграть ещё одно действие СВОЕГО нижнего приказа вместо
    действий верхнего: чужой приказ у вас работает, даже если его никто
    не открыл. Это спасение в ход, когда верх заблокирован совпадением.
    Верх карты меняет приказ в руке на карту из сброса.
  a5_17: >
    Низ тот же лишний заход в нижний приказ каждый ход. Верх — шаг по
    треку науки за МОНЕТЫ вместо трофеев, и это важно: обычно на трек
    пускают только трофеи, а монеты у вас, как правило, есть.
  a5_18: >
    Низ кладёт келемий на свободную ячейку энергии, и она считается
    занятой: здание работает, а настоящий кубик энергии остаётся
    свободным для другого. Фактически это перевод добычи в энергию.
    Верх — один обмен на рынке даром, без келемия.
  a5_19: >
    Низ разгоняет вышки ценой прочности: дешёвая вышка становится
    подвижным наблюдателем, которого проще потерять. Верх забирает
    жетон и монету у первого игрока — удар по тому, кто ходит раньше
    всех.
  a5_20: >
    Низ тот же: быстрые, но хрупкие вышки. Верх забирает у противника
    закрытую карту арсенала. Классический выбор между медленным
    усилением своего поля и разовым грабежом чужой руки.
  a5_21: >
    Низ увеличивает дальность Боя: если на вашем атакующем гексе есть
    авиация, целью можно выбрать гекс на расстоянии двух, а не
    соседний. Вы стреляете оттуда, откуда до вас не достают. Верх
    удаляет установленную карту арсенала противника.
  a5_22: >
    Низ снимает главное ограничение поля: в Манёвре ваши наземные войска
    перестают замечать здания как препятствие. Чужие дворы и стенки
    больше не запирают вас в своём углу. Верх — десант из двух разных
    войск.
  a5_23: >
    Низ разрешает платить в Науке КЕЛЕМИЕМ вместо трофеев. Это перевод
    мирной экономики в очки: треки становятся доступны, даже если вы
    никого не убили. Верх — разовый шаг по треку за монеты.
  a5_24: >
    Низ тот же обмен келемия на науку. Верх — разовая Добыча. Карта для
    того, кто строит партию вокруг зарождений и не собирается воевать
    за трофеи.
  a5_25: >
    Низ ворует жетон: если на гексе стоит ваша пехота, чужой жетон
    оттуда уходит к вам на место уничтоженных, а пехота возвращается
    в запас. Это трофей без боя и без боеприпасов. Верх забирает
    у противника до двух карт заданий.
  a5_26: >
    Низ добавляет ячейку хранилища и ячейку под контейнер: больше места
    под трофеи в Возвращении и меньше потерянных кубиков. Скучно, но
    работает всю партию. Верх ставит любое здание за монету.
  a5_27: >
    Низ тот же прирост хранилища. Верх интереснее: он позволяет взять
    сделку с ЛЮБОЙ уже сброшенной карты рынка — то есть вернуть
    предложение, которое вы упустили раундом раньше.
  a5_28: >
    Низ открывает обратный обмен: в Науке трофеи превращаются в деньги.
    Это выход для того, у кого трофеев много, а треки уже пройдены или
    не нужны. Верх — пять монет сразу.
  a5_29: >
    Низ тот же курс трофеев в монеты. Верх забирает у противника до двух
    карт заданий — и бьёт по тому, кто копит задания в руке.
  a5_30: >
    Низ делает пехоту двужильной, но с оговоркой: в конце боя вся ваша
    пехота с уроном уходит в запас. Она не умирает — но и на поле не
    остаётся, так что после драки гекс придётся занимать заново.
    Верх — десант из двух разных войск.
  a5_31: >
    Низ тот же: пехота с двумя прочности, но после боя раненые уходят
    в запас. Верх — Бой с лишним боеприпасом прямо сейчас.
  a5_32: >
    Низ разрешает в Разработке платить по монете за каждую открытую
    ячейку энергии, считая её занятой: деньги напрямую заменяют
    энергосеть. Это спасение, когда энергостанции снесли. Верх — один
    обмен на рынке даром.
  bs1: >
    Низ — карманный гекс: сама карта считается отдельным гексом с одним
    кубиком энергии. Но за неё надо платить монету в каждое Обновление,
    иначе карта уходит из игры, — это аренда, а не подарок. Верх просто
    даёт один обмен на рынке.
  bs2: >
    Низ работает в чужой ход: когда вас контратаковали и убили ваш
    жетон, вы получаете боеприпас. Потери превращаются в патроны, так
    что лезть в размен становится не так страшно. Верх — три
    боеприпаса сразу.
  bs3: >
    Низ — карманный грабёж: спец-действием вы снимаете с противника
    боеприпас или келемий, если ваши войска стоят на гексе с его
    зданием. Бой не нужен, достаточно присутствия. Верх — два келемия.
  bs4: >
    Низ каждый ход превращает монету в выбор: берёте две карты заданий,
    оставляете одну. Это не столько карты, сколько фильтр — вы
    перестаёте держать в руке бесполезные задания. Верх выдаёт сразу
    три карты заданий без выбора.
  bs5: >
    Низ платит монету за каждый бой, в котором вы хоть кого-то
    уничтожили, — по монете за бой, а не за жетон. Постоянный доход
    для агрессивной игры. Верх удешевляет всю Стройку на монету
    за здание.
  bs6: >
    Низ спасает экономику: добытчики и энергостанции с прочностью 1
    держат два урона, а получив урон, уходят вам в запас сразу после
    боя. Здание вы теряете, но не отдаёте врагу трофей. Верх меняет
    карту приказа на другую из руки.
  bs7: >
    Низ спец-действием за две монеты подменяет наземное войско на поле
    другим из запаса: пехота становится техникой прямо на месте, без
    марша и найма. Верх — Снаряжение, где одно здание выдаёт и войско,
    и боеприпас.
  bs8: >
    Низ снимает правило примыкания стенкой: на соседнем гексе можно
    строить, если там стоят ваши войска. Войска становятся разметкой
    для стройки — сначала занимаете гекс, потом ставите на него здание.
    Верх — одна разовая строительная операция.
