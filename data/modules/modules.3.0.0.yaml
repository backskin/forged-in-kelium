# CONTENT: modules  version 3.0.0
#
# ПОЛНЫЕ НАБОРЫ — ФИКСИРОВАННЫЙ ОБЪЁМ, НЕЗАВИСИМО ОТ ЧИСЛА ИГРОКОВ (решение
# дизайнера 20.08.2026).
#
# ЗАЧЕМ. Награда «модуль» — это тянуть случайный жетон из ОБЩЕГО мешка, а не
# раздать каждому игроку личный комплект. Прежние мешки (bag_R1 и bag_C) при
# этом всё равно масштабировались по числу игроков (buildBag клал N копий
# набора на N игроков — 2/3/4 игрока давали 8/12/16 жетонов). Это наследие
# старой модели M1-M4, где комплект был личным. Раз мешок общий — количество
# игроков ни на что не влияет, и масштабировать было незачем.
#
# КРАСНЫЕ — ВСЕ ШЕСТЬ ПАР, ПО ДВА. У целей боя четыре рода (пехота, техника,
# авиация, здания-вышки), сочетаний по два — ровно шесть. Прежние наборы (R0,
# R1) покрывали только по 4 из 6 — и пара «пехота/авиация» отсутствовала
# ВООБЩЕ, ни в одном наборе за всю историю правил. R30 закрывает её.
#
# Цена атаки и золотой режим — как у R1 (не выделяем зря): 1 БПР, gold_mode
# both (обычная установка — один выстрел за бой по выбранной цели из пары;
# золотая — два выстрела за бой, по каждой цели отдельно, каждый со своей
# платой — см. CombatResolver, usedRows по имени строки).
#
# СИНИЕ — ЧЕТЫРЕ ВИДА ПО ТРИ. У синих (выходы Сборки) уже было полное
# сочетание {2 БПР/1 войско, 1 БПР/2 войска} x {золото растит войска | золото
# растит боеприпас} — дыр нет, здесь просто снято масштабирование по игрокам,
# как и у красных.
#
# targets: infantry | vehicle | aircraft | buildings_towers
# mode: both — золотая бьёт обе цели пары (каждая атака платится отдельно).

meta:
  id: 3.0.0
  type: modules

red_sets:
  - id: R30
    name: "Полный набор (шесть пар, без пропусков)"
    fixed: true   # уже полный сам по себе — не множится на число игроков
    ammo: 1
    tokens:
      - {id: R30-1, plain: [infantry, vehicle],           gold_mode: both}
      - {id: R30-2, plain: [infantry, vehicle],           gold_mode: both}
      - {id: R30-3, plain: [infantry, aircraft],          gold_mode: both}
      - {id: R30-4, plain: [infantry, aircraft],          gold_mode: both}
      - {id: R30-5, plain: [infantry, buildings_towers],  gold_mode: both}
      - {id: R30-6, plain: [infantry, buildings_towers],  gold_mode: both}
      - {id: R30-7, plain: [vehicle, aircraft],           gold_mode: both}
      - {id: R30-8, plain: [vehicle, aircraft],           gold_mode: both}
      - {id: R30-9, plain: [vehicle, buildings_towers],   gold_mode: both}
      - {id: R30-10, plain: [vehicle, buildings_towers],  gold_mode: both}
      - {id: R30-11, plain: [aircraft, buildings_towers], gold_mode: both}
      - {id: R30-12, plain: [aircraft, buildings_towers], gold_mode: both}

  # Прежние наборы остаются версиями — никуда не делись, просто не в мешке.
  - id: R0
    name: "Старый набор (цели парами)"
    ammo: 2
    tokens:
      - {id: R0-1, plain: [infantry, vehicle],          gold_mode: both}
      - {id: R0-2, plain: [vehicle, aircraft],          gold_mode: both}
      - {id: R0-3, plain: [aircraft, buildings_towers], gold_mode: both}
      - {id: R0-4, plain: [buildings_towers, infantry], gold_mode: both}

  - id: R1
    name: "Размен целей"
    ammo: 1
    tokens:
      - {id: R1-1, plain: [infantry, vehicle],         gold_mode: both}
      - {id: R1-2, plain: [vehicle, aircraft],         gold_mode: both}
      - {id: R1-3, plain: [infantry, buildings_towers], gold_mode: both}
      - {id: R1-4, plain: [vehicle, buildings_towers],  gold_mode: both}

  - id: R2
    name: "Характеристики и универсальность"
    ammo: 1
    tokens:
      - {id: R2-1, stat: hp,    plus: 1, gold_stats: {hp: 1, speed: 1}}
      - {id: R2-2, stat: speed, plus: 1, gold_stats: {hp: 1, speed: 1}}
      - {id: R2-3, plain: [any_unit], gold: [any_unit, buildings_towers], gold_mode: choice}
      - {id: R2-4, plain: [buildings_towers], gold: [any_unit, buildings_towers],
         gold_mode: choice}

  - id: R3
    proposal: true
    name: "Досягаемость и напор (предложение)"
    ammo: 1
    tokens:
      - {id: R3-1, plain: [any_unit], range: 2, gold: [any_unit, buildings_towers],
         gold_range: 2}
      - {id: R3-2, effect: no_second_battle_surcharge,
         gold_effect: no_second_third_battle_surcharge}
      - {id: R3-3, plain: [any_unit], requires: moved_this_action,
         gold: [any_unit], gold_requires: none}
      - {id: R3-4, effect: plus1_damage_once_per_round,
         gold_effect: plus1_damage_always}

# Смеси: из каких наборов собирается мешок конкретной партии.
red_bags:
  - {id: bag_R30, sets: [R30]}
  - {id: bag_R1, sets: [R1]}
  - {id: bag_R2, sets: [R2]}
  - {id: bag_R1_R2, sets: [R1, R2]}
  - {id: bag_legacy, sets: [R0]}

blue_sets:
  - id: C30
    name: "Полный набор (без масштаба по игрокам)"
    fixed: true   # уже полный сам по себе — не множится на число игроков
    tokens:
      - {id: C30-1, ammo: 2, units: 1, gild: units}
      - {id: C30-2, ammo: 2, units: 1, gild: units}
      - {id: C30-3, ammo: 2, units: 1, gild: units}
      - {id: C30-4, ammo: 2, units: 1, gild: ammo}
      - {id: C30-5, ammo: 2, units: 1, gild: ammo}
      - {id: C30-6, ammo: 2, units: 1, gild: ammo}
      - {id: C30-7, ammo: 1, units: 2, gild: units}
      - {id: C30-8, ammo: 1, units: 2, gild: units}
      - {id: C30-9, ammo: 1, units: 2, gild: units}
      - {id: C30-10, ammo: 1, units: 2, gild: ammo}
      - {id: C30-11, ammo: 1, units: 2, gild: ammo}
      - {id: C30-12, ammo: 1, units: 2, gild: ammo}

  - id: C
    name: "Сборка (прежний набор)"
    tokens:
      - {id: C1, ammo: 2, units: 1, gild: units}
      - {id: C2, ammo: 2, units: 1, gild: ammo}
      - {id: C3, ammo: 1, units: 2, gild: units}
      - {id: C4, ammo: 1, units: 2, gild: ammo}

blue_bags:
  - {id: bag_C30, sets: [C30]}
  - {id: bag_C, sets: [C]}
