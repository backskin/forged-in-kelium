  # добытчику со своего/примыкающего гекса) — «дотянуться с соседнего» правил нет.
  - {id: a20, name: "Форсированный марш",
     top: {effect: free_action, params: {action: movement}, label: "free Movement"},
     bottom: {kind: POST, passive: first_extra_move_free, label: "POST: first over-speed hex each Movement is free"},
     описание: "Утиль даёт бесплатное действие перемещения без расхода приказа. Пока карта установлена, первый гекс сверх обычной скорости в каждом перемещении достаётся бесплатно. Разгоняет войска дальше обычного без лишних трат."}
  - {id: a21, name: "Диспетчер",
