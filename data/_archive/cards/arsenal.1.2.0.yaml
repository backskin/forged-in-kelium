# CONTENT: arsenal  version 1.2.0
# 1.2.0: СТАРТОВЫЙ АРСЕНАЛ РАСШИРЕН 4 -> 8 карт (решение дизайнера 2026-08-11 +
#   4 карты от Клода: as5-as8 закрывают архетипы энергия/контейнеры/задания/наука;
#   вместе с as1-as4 (атака/добыча/оборона/мобильность) — 8 разных стартов).
#   Новые пассивки objective_hand_plus1 и science_first_step_discount вшиты в движок.
# 1.2.0-правка 13.08.2026: container_slot остался только у ТРЁХ карт (as2, a06, a09).
# Правило дизайнера: ячейка под планшетом — ЛИБО карта арсенала, ЛИБО контейнеры,
# накладок нет; исключение — карта с одной НАРИСОВАННОЙ ячейкой под контейнер.
# 24 regular + 8 starting. Each card: top (one-shot burn) + bottom (permanent
# POST or SPEC action while installed). Playing a card is a SPEC action: BURN the
# top OR INSTALL for the bottom. 3 install slots/player. Deck scales 24->20->16.
# Encoded from "Карты/Арсенал 4.0 — колода 24+4.md".
#
# top: {effect, params, label}  — resource tops are live via the effect registry;
#   immediate-action / conditional tops use effect: noop (recorded, not yet
#   mechanized).
# bottom: {kind: POST|SPEC, passive: <id>, label}  — passive ids name a rule
#   modifier; those not yet integrated are tagged and currently inert. This keeps
#   every card as versioned DATA and bot-selectable now; deep passive wiring is
#   a follow-up (tracked with the modules work).
meta:
  id: 1.2.0
  type: arsenal

arsenal:
  # -------- 8 starting --------
  - {id: as1, name: "Ударное звено", kind: starting,
     top: {effect: free_action, params: {action: combat}, label: "free infantry attack"},
     bottom: {kind: SPEC, passive: unit_makes_one_attack, label: "SPEC: a unit makes one attack"},
     описание: "Утиль даёт одну бесплатную атаку пехоты без расхода приказа на бой. Пока карта установлена, спец-действием можно заставить один отряд провести одну атаку. Надёжная основа для игрока, ставящего на постоянный огневой контакт."}
  - {id: as2, container_slot: true, name: "Старатели", kind: starting,
     top: {effect: gain, params: {coin: 2, ammo: 1}, label: "2 coin + 1 ammo"},
     bottom: {kind: POST, passive: extraction_flip_bonus_trophy, label: "POST: +1 trophy on extraction flip"},
     описание: "Утиль сразу приносит 2 монеты и 1 боеприпас — быстрый разгон в начале партии. Пока карта установлена, каждый переворот добычи на трофейной стороне даёт дополнительное трофей. На открытой карте нарисована ячейка под контейнер, так что держать её на планшете выгодно вдвойне."}
  - {id: as3, name: "Окопы", kind: starting,
     top: {effect: heal_hex, params: {}, label: "heal all own in one hex"},
     bottom: {kind: POST, passive: buildings_plus1_hp, label: "POST: your buildings +1 HP"},
     описание: "Утиль лечит все свои жетоны на одном гексе за раз. Пока карта установлена, все ваши здания получают +1 к прочности и дольше держатся под обстрелом. Хорошая опора для игрока, ставящего на оборону."}
  - {id: as4, name: "Связной", kind: starting,
     top: {effect: move_unit, params: {hexes: 2}, label: "move a unit 2 hexes"},
     bottom: {kind: SPEC, passive: move_one_unit_1, label: "SPEC: move a unit 1 hex"},
     описание: "Утиль сразу перемещает один отряд на 2 гекса без приказа на перемещение. Пока карта установлена, спец-действием можно передвинуть отряд на 1 гекс. Удобно для быстрой перестановки войск между раундами."}
  # -- новые 4 (Клод, 2026-08-11): энергия / контейнеры / задания / наука --
  - {id: as5, name: "Энергоцех", kind: starting,
     top: {effect: free_action, params: {action: energy_swap}, label: "free Energy swap"},
     bottom: {kind: POST, passive: plants_plus1_energy, label: "POST: your power plants give +1 energy"},
     описание: "Утиль даёт бесплатный обмен энергией без расхода приказа. Пока карта установлена, каждая ваша энергостанция выдаёт на 1 энергию больше. Основа для тех, кто строит экономику вокруг энергоснабжения."}
  # as6 «Снабженцы» УБРАНА 13.08.2026: низ «запитанный добытчик берёт контейнер ИЗ
  # ЗАПАСА» противоречит КОНТЕЙНЕРАМ 2.0 — «брать из запаса просто так больше
  # нельзя», контейнер берётся только накрыванием печатной ячейки или штатной
  # веткой Добычи. Стартовых карт становится 7.
  - {id: as7, name: "Штаб связи", kind: starting,
     top: {effect: gain, params: {objective_cards: 1, coin: 1}, label: "1 objective + 1 coin"},
     bottom: {kind: POST, passive: objective_hand_plus1, label: "POST: objective hand refill limit +1"},
     описание: "Утиль сразу приносит 1 карту задания и 1 монету. Пока карта установлена, лимит пополнения руки заданий увеличен на 1 — на руках можно держать больше карт заданий. Пригодится тому, кто делает ставку на выполнение заданий."}
  - {id: as8, name: "Изыскатели", kind: starting,
     top: {effect: free_action, params: {action: science}, label: "free Science"},
     bottom: {kind: POST, passive: science_first_step_discount, label: "POST: first Science step each action -1 trophy (min 1)"},
     описание: "Утиль даёт бесплатное действие науки без расхода приказа. Пока карта установлена, первый шаг науки в каждом действии стоит на 1 трофей дешевле, но не может стать бесплатным. Опора для игрока, вкладывающегося в научные треки."}

  # -------- 24 regular --------
  - {id: a01, name: "Пристрелка",
     top: {effect: place_damage, params: {}, label: "1 damage to adjacent enemy"},
     bottom: {kind: POST, passive: first_attack_minus1_ammo, label: "POST: first attack each battle -1 ammo"},
     описание: "Утиль наносит 1 повреждение вражескому отряду на соседнем гексе, без боя. Пока карта установлена, первая атака в каждом бою стоит на 1 боеприпас меньше. Экономит боеприпасы тому, кто много воюет."}
  - {id: a02, name: "Мародёры",
     top: {effect: gain, params: {ammo: 3}, label: "3 ammo"},
     bottom: {kind: POST, passive: ammo_on_kill, label: "POST: +1 ammo when you destroy a token"},
     описание: "Утиль сразу приносит 3 боеприпаса. Пока карта установлена, за каждый уничтоженный вами жетон вы получаете 1 дополнительный боеприпас. Чем агрессивнее бой, тем быстрее пополняются запасы."}
  - {id: a03, name: "Штурмовая группа",
     top: {effect: free_action, params: {action: combat}, label: "free Combat"},
     bottom: {kind: SPEC, passive: unit_makes_one_attack, label: "SPEC: a unit makes one attack"},
     описание: "Утиль даёт бесплатное действие боя без расхода приказа. Пока карта установлена, спец-действием можно заставить один отряд провести одну атаку. Хороша для тех, кто хочет усилить эту способность второй такой картой."}
  - {id: a04, name: "Бронебойщики",
     top: {effect: place_damage, params: {finish_off: true}, label: "finish off adjacent enemy"},
     bottom: {kind: POST, passive: anti_armor_minus1_ammo, label: "POST: attacks vs vehicle/buildings/towers -1 ammo"},
     описание: "Утиль позволяет добить вражеский отряд на соседнем гексе одним ударом. Пока карта установлена, атаки по технике, зданиям и вышкам стоят на 1 боеприпас меньше. Незаменима против укреплённого противника."}
  - {id: a05, name: "Двойной залп", cull: "[4]",
     top: {effect: free_action, params: {action: combat}, label: "two battles, no 2nd surcharge"},
     bottom: {kind: POST, passive: no_second_battle_surcharge, label: "POST: no 2nd-battle surcharge"},
     описание: "Утиль даёт бесплатное действие боя, в котором можно провести два боя подряд без надбавки за второй. Пока карта установлена, второй бой в действии всегда обходится без обычной надбавки. Карта для тех, кто строит игру на сериях атак."}
  - {id: a06, container_slot: true, name: "Трофейная бригада", cull: "[3+]",
     top: {effect: gain, params: {trophy: 2}, label: "2 trophy"},
     bottom: {kind: POST, passive: bonus_trophy_on_kill, label: "POST: +1 trophy per token destroyed"},
     описание: "Утиль сразу приносит 2 трофея. Пока карта установлена, за каждый уничтоженный жетон вы получаете 1 дополнительное трофей. На открытой карте нарисована ячейка под контейнер, так что держать её на планшете выгодно вдвойне."}
  # a07 «Перекупщик» УБРАНА по решению дизайнера 13.08.2026: низ «второй келемий в
  # сделке рынка по полной ставке» — не карта, а надбавка к арифметике, играть в
  # неё нечем. Идентификатор не переиспользуем, чтобы старые записи партий читались.
  # a08 «Геологи» УБРАНА 13.08.2026: тот же низ «добытчик берёт контейнер из
  # запаса» — противоречит КОНТЕЙНЕРАМ 2.0.
  - {id: a09, container_slot: true, name: "Складчина",
     top: {effect: gain, params: {objective_cards: 2, coin: 2}, label: "2 objectives + 2 coin"},
     bottom: {kind: POST, passive: plus1_storage_cell, label: "POST: +1 storage cell"},
     описание: "Утиль сразу приносит 2 карты заданий и 2 монеты. Пока карта установлена, у вас на 1 ячейку хранения больше. На открытой карте нарисована ячейка под контейнер, так что она работает и на склад, и на запас одновременно."}
  # a10 «Лаборатория» УБРАНА 13.08.2026: низ «положить 1 трофей на любой трек»
  # требует механики, которой в правилах науки НЕТ — шаг оплачивается трофеями
  # целиком и сразу, отложенных трофеев на треке не бывает. Если такая механика
  # когда-нибудь появится (частичная оплата шага), карта вернётся.
  - {id: a11, name: "Глубокое бурение", cull: "[4]",
     top: {effect: free_action, params: {action: mining}, label: "free Mining x2"},
     bottom: {kind: POST, passive: miner_takes_kelium_and_container, label: "POST: each miner takes kelium AND container"},
     описание: "Утиль даёт бесплатное действие добычи, выполненное дважды подряд. Пока карта установлена, каждый добытчик берёт сразу и келемий, и контейнер за один заход. Мощная технология для игрока, ставящего на добычу."}
  - {id: a12, name: "Промышленник", cull: "[3+]",
     top: {effect: free_action, params: {action: build}, label: "free Build (no surcharge)"},
     bottom: {kind: SPEC, passive: build_minus2_coin, label: "SPEC: build one building -2 coin"},
     описание: "Утиль даёт бесплатное действие постройки без обычной надбавки. Пока карта установлена, спец-действием можно построить одно здание со скидкой 2 монеты. Снижает стоимость расширения базы."}
  - {id: a13, name: "Полевой госпиталь",
     top: {effect: heal_hex, params: {}, label: "heal all own in one hex"},
     bottom: {kind: SPEC, passive: heal_one_damage, label: "SPEC: remove 1 damage from a token"},
     описание: "Утиль лечит все свои жетоны на одном гексе за раз. Пока карта установлена, спец-действием можно снять 1 повреждение с одного жетона. Гибкая поддержка войск без привязки к конкретному гексу."}
  - {id: a14, name: "Заграждения",
     top: {effect: free_action, params: {action: build}, label: "free tower"},
     bottom: {kind: POST, passive: defenders_cost_more, label: "POST: attacks on your units in your building-hexes cost +1 ammo"},
     описание: "Утиль строит бесплатную вышку без расхода приказа на постройку. Пока карта установлена, атаки по вашим отрядам на гексах с вашими зданиями обходятся противнику на 1 боеприпас дороже. Делает оборону дороже для нападающего."}
  - {id: a15, name: "Резерв",
     top: {effect: deploy_units, params: {count: 2}, label: "deploy 2 units"},
     bottom: {kind: SPEC, passive: deploy_1_unit, label: "SPEC: deploy 1 matching unit from reserve"},
     описание: "Утиль сразу выводит на поле 2 отряда из резерва. Пока карта установлена, спец-действием можно вывести 1 подходящий отряд из резерва. Ускоряет пополнение войск на поле."}
  - {id: a16, name: "Автономный контур",
     top: {effect: free_action, params: {action: assembly}, label: "free full Assembly"},
     bottom: {kind: POST, passive: plants_plus1_energy, label: "POST: your power plants give +1 energy"},
     описание: "Утиль даёт полное бесплатное действие сборки без расхода приказа. Пока карта установлена, каждая ваша энергостанция выдаёт на 1 энергию больше. Та же прибавка к энергии, что и у Энергоцеха, но открывается через сборку."}
  - {id: a17, name: "Глубокая оборона", cull: "[4]", contested: attack_first_initiative,
     top: {effect: heal_all_own, params: {}, label: "heal all own tokens"},
     bottom: {kind: POST, passive: retaliation_strikes_first, label: "POST: in retaliation your units strike first"},
     описание: "Утиль лечит сразу все свои жетоны на поле. Пока карта установлена, в ответном ударе ваши отряды бьют первыми. Сильная опора для того, кто держит оборону и рассчитывает на контратаку."}
  - {id: a18, name: "Бастион", cull: "[3+]",
     top: {effect: free_action, params: {action: build}, label: "free building"},
     bottom: {kind: POST, passive: cu_plus2_hp, label: "POST: your CU +2 HP"},
