  - {id: a24, name: "Воздушный мост", cull: "[4]",
     top: {effect: move_unit, params: {hexes: 2}, label: "redeploy a unit"},
     bottom: {kind: POST, passive: aircraft_speed3_spawn, label: "POST: your aircraft speed 3, may enter spawn hexes"},
