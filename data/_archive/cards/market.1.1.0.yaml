# CONTENT: market  version 1.1.0
# 8 карт, по одной активной в раунд. У каждой два предложения (left/right).
# У предложения две ячейки; ВТОРАЯ открыта только при ЧЕТЫРЁХ игроках. Ячейка
# стоит 1 келемий. За одно действие Рынок игрок берёт НЕ БОЛЕЕ ОДНОГО предложения
# с карты — печатным обменом планшета можно пользоваться сколько угодно раз.
#
# Каталог собран по ревью дизайнера 17.08.2026: каждое предложение проверено на
# то, совпадает ли метка на карте с тем, что действительно происходит.
meta:
  id: 1.1.0
  type: market

market:
  - id: military_contract
    name: "Военный подряд"
    # МОБИЛИЗАЦИЯ — сборка, которой энергия не нужна вообще: все здания
    # считаются запитанными на время этой сборки. Ведомство поднимает
    # производство приказом, а не подключением.
    left:  {name: "Мобилизация", effect: free_action, params: {action: assembly, all_powered: true}, label: "Сборка без энергии: все здания запитаны"}
    right: {name: "Госзаказ", effect: gain, params: {coin: 6}, label: "6 монет"}
    описание: "Военное ведомство скупает всё, что приближает победу. Мобилизация проводит сборку без всякой энергии, Госзаказ приносит 6 монет из казны."
  - id: shadow_convoy
    name: "Теневой обоз"
    left:  {name: "Контрабанда", effect: gain, params: {ammo: 4}, label: "4 боеприпаса"}
    right: {name: "Подлог", effect: gain, params: {containers: 3}, label: "3 контейнера"}
    описание: "Тёмные извозчики возят то, что не проходит через таможню. Контрабанда подкидывает 4 боеприпаса, Подлог оставляет на складе 3 лишних контейнера."
  - id: engineering_office
    name: "Инженерная контора"
    # ПОДРЯД НА СТРОЙКУ — второе и третье здание по печатной цене, без надбавки.
    left:  {name: "Подряд на стройку", effect: free_action, params: {action: build, no_surcharge: [build_place]}, label: "Стройка без надбавки за 2-е и 3-е здание"}
    # ПЕРЕКОММУТАЦИЯ — энергия переставляется с любых своих гексов и целиком
    # бесплатно: надбавки за второй и последующие гексы-исходы нет.
    right: {name: "Перекоммутация", effect: free_action, params: {action: energy_swap, no_surcharge: [energy_swap], coin: 2}, label: "Смена энергии даром с любых гексов + 2 монеты"}
    описание: "Инженерная контора берётся за любую стройку без лишних вопросов. Подряд на стройку ставит здания без надбавки, Перекоммутация бесплатно переставляет энергию с любых гексов и приносит 2 монеты."
  - id: science_mission
    name: "Научная миссия"
    # ГРАНТ выдаёт ТРОФЕИ, а не трофеи: трофей — то, что сдают в Науку.
    left:  {name: "Грант", effect: gain, params: {trophy: 3}, label: "3 трофея"}
    right: {name: "Лицензия", effect: free_action, params: {action: science, trophy: 1}, label: "Наука даром + 1 трофей"}
    описание: "Учёный совет спонсирует тех, кто двигает науку вперёд. Грант выдаёт 3 трофея, Лицензия даёт бесплатное движение по треку науки и трофей сверху."
  - id: weapons_fair
    name: "Оружейная ярмарка"
    left:  {name: "Партия модулей", effect: gain, params: {module: choice}, label: "целый жетон модуля из мешка на выбор"}
    right: {name: "Модернизация", effect: gain, params: {gild_module: true}, label: "позолотить свой модуль"}
    описание: "Оружейники раскладывают товар прямо на телегах. Партия модулей даёт целый модуль из мешка на выбор, Модернизация позолотит уже стоящий у игрока модуль."
  - id: military_alarm
    name: "Военная тревога"
    # БОЕПРИПАС ВЫДАЁТСЯ ДО ДЕЙСТВИЯ — «в начале этого боя». Боеприпас, пришедший
    # после боя, боем уже не потратишь, и предложение было бы пустым.
    left:  {name: "Внезапный удар", effect: free_action, params: {action: combat, ammo: 1}, label: "Бой даром + 1 боеприпас в его начале"}
    right: {name: "Передислокация", effect: free_action, params: {action: movement, ammo: 1}, label: "Движение даром + 1 боеприпас"}
    описание: "Труба играет тревогу — штаб поднимает войска без разговоров. Внезапный удар даёт бесплатный бой и боеприпас к нему, Передислокация — бесплатное перемещение и боеприпас."
  - id: corps_hq
    name: "Штаб корпуса"
    # ПРИОРИТЕТ — игрок ЗАБИРАЕТ жетон себе сейчас же, и в ближайшее Обновление
    # жетон не передаётся по кругу: карта отменяет правило передачи на этот раз.
    left:  {name: "Приоритет", effect: grab_first_player, params: {now: true}, label: "забрать жетон первого игрока; в это Обновление он не передаётся"}
    right: {name: "Штабная работа", effect: gain, params: {objective_cards: 4, objective_cards_keep: 2}, label: "4 карты заданий, оставить 2"}
    описание: "Штаб корпуса решает, кто говорит первым и кому достаются лучшие бумаги. Приоритет забирает жетон первого игрока и не отдаёт его в Обновление, Штабная работа даёт выбрать 2 карты заданий из четырёх."
  - id: civil_contract
    name: "Гражданский подряд"
    # ВОССТАНОВЛЕНИЕ — стенка на ЛЮБОЕ свободное место поля: на любой гекс, где
    # есть один или два свободных сектора. Нейтрал нужен как заграждение там, где
    # сосед собирается пройти, то есть чаще всего на занятом гексе.
    left:  {name: "Восстановление", effect: build_neutral, params: {}, label: "нейтральное здание на 1–2 сектора в любое свободное место"}
    # ЭВАКУАЦИЯ — собрать растянутую группу в кулак и вылечить её. Прежнее
    # «лечение всех своих жетонов» цены не имело: оно ничего не меняло на поле.
    right: {name: "Эвакуация", effect: evacuate, params: {}, label: "снять весь урон на гексе и свести туда свои жетоны"}
    описание: "Гражданские подрядчики восстанавливают то, что война успела сломать. Восстановление ставит нейтральную стенку в любое свободное место, Эвакуация снимает весь урон на выбранном гексе своей стройки и сводит туда твои жетоны."
