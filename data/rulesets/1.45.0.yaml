# ============================================================================
#  RULESET: 1.14.0
# ============================================================================
#  A "ruleset" is a VERSIONED, SWAPPABLE set of RULE VALUES and RULE VARIANTS.
#  The game's immutable core (turn structure, boards, cards, field, tokens)
#  lives in code and never changes. Everything tunable or arguable lives here.
#
#  Source of truth: "СВОД — механика игры (для работы над картами).md"
#  Open questions come from "БЭКЛОГ — открытые вопросы.md" (item ids like E10).
#
#  CHANGELOG:
#    1.36.0 (от 1.35.0): КАТАЛОГ ЗАДАНИЙ 1.15.0 — награды вдвое жирнее, в каждой
#    базовой награде обязателен ТРОФЕЙ, и четыре карты переписаны под
#    действующие правила.
#
#    СЛИЯНИЕ ДВУХ ВЕТОК 08.09.2026. Свод собирался параллельно с правкой правил
#    в другой ветке и разошёлся с ней в шести местах; расхождение снято в
#    пользу рулбука и прямых решений дизайнера:
#      * приказы 2.0.0 (три спец-плашки, латинский квадрат) вместо 1.0.0;
#      * бой и манёвр обе играют «Близнец Движения» — ключи surcharge_model и
#        cost_model переведены в per_token, а не описаны комментарием мимо кода;
#      * ремонт зданий Стройкой выключен («не надо», 06.09.2026);
#      * своё ЦУ не сносится (рулбук §8.3);
#      * ЦУ Стройкой не отстраивается (рулбук §8.3) — это значение пришло из
#        второй ветки и оставлено, прежнее true было ошибкой.
#
#    Зачем. Замер 08.09.2026 (kelium.ЩедростьЗаданий, по 16 партий на точку,
#    боты-планировщики вчетвером): карту задания жгут чаще, чем выполняют, и
#    РАЗМЕР награды это почти не двигает — доля выполнений 31% при авторских
#    числах, 38% при трёхкратных и 43% при ДЕВЯТИКРАТНЫХ. Кривая ложится, порога
#    в 50% на этой оси нет вовсе. Причина в валюте: свод 1.35.0 обнулил очки за
#    монеты, келемий, войска и здания, а базовая награда задания — как раз
#    монеты и боеприпасы, то есть чистый темп. Верх карты (утиль) — тоже темп,
#    только даром и без условия, и обыграть его размером награды нельзя.
#    Поэтому в 1.15.0 не только множитель 2 (пик, после которого растут одни
#    очки: ×3 даёт +2.4 ПО на игрока и ничего не добавляет к доле), но и
#    обязательный трофей в базовой награде — единственная награда, которая
#    обменивается на очки напрямую, шагом трека науки.
#
#    ЧЕТЫРЕ КАРТЫ БЫЛИ НЕВЫПОЛНИМЫ — не трудны, а невозможны, потому что
#    правила ушли из-под них (стенд kelium.НевыполнимыеЗадания):
#      o16 «Переезд» просил перенести здания — переноса в Стройке нет с
#      06.09.2026 (0 выполнений на 25 попаданий в руку);
#      o41 «Ответный удар» просил уничтожить в ответном бою — ответный бой убран
#      сводом 1.34.0 (0 на 23);
#      o17 «Штаб на передовой» просил построить или перенести своё ЦУ — переноса
#      нет, а уничтоженное ЦУ ставится только СПЕЦ-действием (0 на 26);
#      o27 «На чужом дворе» просил встать на гекс с чужими войсками — правило
#      04.09.2026 запретило наземным входить на такой гекс (1 на 22).
#    Все четыре переписаны в своих классах под действующие правила; ни одна не
#    потеряла смысла. Щедрость привязана к ВЕРСИИ набора (Щедрость.java),
#    поэтому 1.14.0 продолжает считаться авторскими числами.
#
#    1.35.0 (от 1.34.0): БАЗОВЫХ ИСТОЧНИКОВ ОЧКОВ ОСТАЛОСЬ ШЕСТЬ (решение
#    дизайнера 04.09.2026). В базе очки дают только: ПО на установленных картах
#    арсенала, жетон уничтоженного ЦУ, места на треках Науки, супер-задания,
#    золотые модули и выработанные зарождения. Монеты, несданные уничтоженные жетоны, войска
#    и здания на поле обнулены и переехали множителями в супер-задания 7.0.0
#    (карты s5_13..s5_17); келемий стоял на нуле ещё с 15.08.2026 и платит за
#    него s5_07. Ставки на картах щедрее прежних базовых курсов: источник теперь
#    работает не у всех четверых, а только у того, кто взял карту, и она у него
#    одна на партию.
#    Ключи: coins_per_vp 0, trophy_storage_vp_per_unit 0, buildings_per_vp 0,
#    units_per_vp 0. Ноль означает «источник выключен»: в Scoring добавлены
#    защиты, иначе это было бы деление на ноль.
#    1.34.0 (от 1.33.0): ОТВЕТНЫЙ БОЙ УБРАН ИЗ ПРАВИЛ (решение дизайнера
#    04.09.2026). Повреждение чужих жетонов само по себе больше не даёт
#    пострадавшему ничего: бой целиком укладывается в ход того, кто его
#    объявил, и ничей чужой ход не прерывает. Ответный бой не отменён как
#    понятие - он остался определением того, что выдаёт ЭФФЕКТ КАРТЫ (верх
#    задания, арсенал, контейнер), и потому ключи retaliation_* сохранены:
#    выключен только автоматический триггер. Вся оборона переехала в карты.
#    Ключ: retaliation_enabled false.
#    1.33.0 (от 1.32.0): ЧЕТЫРЕ ПРАВКИ ПО ЗАКАЗУ 02.09.2026.
#    1) ТРЕКИ НАУКИ. Кубик не переставляется, а ВЫКЛАДЫВАЕТСЯ: занятая ячейка
#    держится за игроком до конца партии, стартовой ячейки «на нуле» нет, а в
#    запасе у игрока 8 кубиков на все три трека. Ключи cubes_are_permanent и
#    cube_supply.
#    2) ЯЧЕЙКИ ШАГОВ. На шагах 1, 2 и 3 последняя ячейка открыта только
#    вчетвером: 3/3/2/1 вчетвером против 2/2/1/1 вдвоём и втроём.
#    3) ПЛАНШЕТ НАУКИ - три обмена вместо четырёх: обмен трофеев на монеты снят
#    с планшета и напечатан на карте арсенала.
#    4) ПЛАНШЕТ РЫНКА - два обмена вместо четырёх: сняты боеприпасы и установка
#    келемия на ячейку энергии; установка переехала на карту рынка.
#    1.32.0 (от 1.31.0): ДВЕ ПРАВКИ ПО ЗАКАЗУ 31.08.2026.
#    1) ДЛИНА ПАРТИИ. Хорошая партия идёт 4-6 раундов, восемь - это предел на
#    случай долбоебизма игроков, а не норма. Порог «остался последний источник
#    келемия» поднят с 1 до 5: замер 150 партий вчетвером дал 5.4 раунда против
#    7.9, и главное - партии стали ДОИГРЫВАТЬСЯ, а не обрываться потолком карт
#    рынка (развязка 80% против 7%). Порог 6 даёт 4.7 раунда и 91% развязок -
#    оставлен как соседний вариант, если пять покажется долгим.
#    2) СУПЕР-ЗАДАНИЯ 6.0 вместо 5.0: верх карты - множитель победных очков в
#    финале (карта не сжигается вовсе), низ - жёсткое требование с очень хорошей
#    наградой. Прежние суперутили стали наградами низа: их больше нельзя взять
#    сразу же, сперва надо выстроить условие. Режим solo6, каталог 6.0.0.
#    1.31.0 (от 1.30.0): СУПЕР-ЗАДАНИЯ 5.0 «суперутиль или накопитель»
#    (черновик дизайнера 25.08.2026). Каждому по одной карте втайне; сжечь ради
#    разового суперутиля ИЛИ дожить нетронутой до конца ради очков накопителя.
#    Прежняя конструкция (ячейки, вскрытие, счётчик, жетон супероружия) в этом
#    режиме не действует: super_objectives.mode: solo5, каталог 5.0.0.
#    1.30.0 (от 1.29.0): АРСЕНАЛ 4.1.0 (колода 28: 20 лучших карт по толку,
#    восемь «ускоряющих» в двух копиях) и КАТАЛОГ ЗАДАНИЙ 1.14.0 — пересборка по заказу
#    дизайнера 28.08.2026 (design-docs/ЗАКАЗ — пересборка колод). Сорок обычных
#    карт; утили сведены к восьми видам с квотами (8 смен энергии/модулей,
#    6 боёв, 6 движений, 5 наук, 5 снаряжений, 4 стройки, 3 добычи, 3 рынка);
#    база — только ресурсы; сверхнаграда усиленного выполнения — ровно один из
#    трёх типов: жетон модуля (14) / трофеи (13) / карта арсенала (13);
#    начальные задания: утиль +1 БПР или +1 МОН пополам.
#    1.29.0 (от 1.26.0): КАТАЛОГ ЗАДАНИЙ 1.12.0 — верхний утиль «СМЕНА ЭНЕРГИИ
#    ИЛИ СМЕНА МОДУЛЕЙ» с четырёх карт до двенадцати из сорока восьми (заказ
#    дизайнера 28.08.2026). Больше в своде НЕ МЕНЯЕТСЯ НИЧЕГО — вариант нужен
#    ровно затем, чтобы измерить эту правку отдельно от прочих.
#    Зачем. Энергию в игре не раскладывают раз и навсегда, её перекатывают:
#    источники дают 10 кубиков на 13 ячеек потребителей, и выигрывает тот, кто
#    включает нужное здание в нужный ход. Замер 60 партий вчетвером показал, во
#    что это обходится ботам: авиабаза построена у половины игроков и запитана у
#    каждого второго из них, завод — у 87%, а неистраченных монет к концу партии
#    остаётся 4.4. Лишний бесплатный перекат — самый прямой рычаг на это место.
#    Восемь карт, у которых утиль поменялся: o04, o05, o10, o29, o46, o50, o56,
#    o62. Все восемь до этого повторяли уже многократно занятые «СВОБОДНОЕ
#    ДВИЖЕНИЕ», «СВОБОДНАЯ НАУКА», «СВОБОДНАЯ ДОБЫЧА» и «СНАРЯЖЕНИЕ ДВУМЯ
#    ЗДАНИЯМИ» — из 48 карт свободное действие стояло на 28.
#    1.26.0 (от 1.25.0): ЗАКАЗ ДИЗАЙНЕРА 25.08.2026, первая часть — числа.
#    Планшеты 2.2.0: ЦУ даёт ОДИН кубик энергии вместо двух, авиабаза 2 ячейки
#    и 3 монеты, завод 2 монеты. На старте 3 монеты вместо пяти, и кубик ЦУ
#    сразу стоит в его ячейке. Стройка против софтлока: снос своего здания даёт
#    монету, каждая следующая операция за действие дороже на монету, над одним
#    зданием за действие ровно ОДНА операция. ЦУ в запасе обязан вернуться на
#    поле спец-действием, и его же можно поставить обычной Стройкой.
#    Заодно сведены две ветки: трек науки [1,1,2,3] из 1.25.0 и починенный
#    каталог заданий 1.11.0 (o39 была невыполнима).
#    1.25.0 (от 1.24.0): ТРЕК НАУКИ ВОЗВРАЩЁН К [1,1,2,3] — полная лестница
#    снова 7 ПО, и ПЕРВЫЙ ШАГ СНОВА ДАЁТ ОЧКО. Правка 18.08.2026 записана как
#    «снизить трек науки», но снижала двумя способами сразу: лестницу с 7 до 4
#    и обнуление первого шага. Второе в формулировке не читалось, а убило
#    треки целиком: замер на 60 партиях вчетвером — доля треков в счёте упала
#    с 40% до 10%, и НИ ОДНА партия не закончилась занятием трёх вершин, то
#    есть условие конца стало мёртвым, а карты супер-арсенала на вершинах —
#    недостижимой декорацией (0.01 ПО на игрока).
#    1.24.0 (от 1.23.0): ДВЕ АТАКИ вместо пар ОСН/ВТР — планшеты 2.1.0.
#    Универсальная 2 БПР по любому типу, специальная 1 БПР по одному типу и
#    только она улучшается жетоном модуля атаки. Спец-цели стороны А: пехота ->
#    авиация, техника -> здания и вышки, авиация -> техника, вышка -> пехота.
#    Спец-атака вышки больше не бесплатна.
#    1.1.0 (от 1.0.0): соревновательный агрессивный ИИ; objectives 1.1.0.
#    1.2.0 (от 1.1.0): каталог заданий 5.0 (K-баланс, тиры, стенки); objectives 1.2.0.
#    1.3.0 (от 1.2.0): ПО за ОБОРОТ тайла зарождения (стартовый 1 / обычный 2).
#    1.10.0 (от 1.8.0): ЖЁЛТАЯ ЯЧЕЙКА энергостанции; вторичная атака за 1 БПР.
#    1.11.0 (от 1.10.0): РЫНОК по ревью дизайнера — вторая ячейка предложения
#    только на четверых; каталог рынка 1.1.0.
#    1.12.0 (от 1.11.0): второй проход по рынку — каталог 1.2.0.
#    1.13.0 (от 1.12.0): супер-задания 4.0.0 — цена вскрытия и награда за него.
#    1.14.0 (от 1.13.0): БАГ-ФИКС — трофей считался в ПО ДВАЖДЫ (trophy_per_vp
#    и trophy_storage_vp_per_unit складывались, а не заменяли друг друга: 1/3 +
#    1.0 = 1.333 ПО за трофей вместо одного курса). Теперь при заданном
#    trophy_storage_vp_per_unit он ПОЛНОСТЬЮ заменяет trophy_per_vp, и ставка
#    установлена в 0.5 (1 ПО за 2 трофея), а не в 1.0. Плюс трек науки снижен
#    с [1,1,2,3] до [0,1,1,2] (tech.step_vp_cumulative) — первый шаг очков не даёт.
#    Прочий контент наследуется от 1.0.0 (версии независимы).
# ============================================================================

meta:
  id: 1.45.0
  based_on: >
    1.44.0 + ЧЕТЫРЕ УТОЧНЕНИЯ ДИЗАЙНЕРА 16.09.2026, все — про слова и порядок,
    без новых чисел. ПЕРВОЕ: порядок шагов фазы Обновление — рынок, затем
    первый игрок, и ПОСЛЕДНИМ выбор карты под свалку (выбор свалки бумажный,
    движок его не моделирует, но два первых шага в нём идут тем же порядком).
    ВТОРОЕ: жетон на ячейке атаки называется ПУСТОЙ МОДУЛЬ БОЯ, а его оборот —
    ЖЕТОН УНИЧТОЖЕНИЯ ЦУ; прежнее «модуль блокировки боя» не употребляется.
    ТРЕТЬЕ: забранный жетон кладётся В ЗАПАС рядом с игроком, а не на планшет —
    он больше ничего не закрывает (движок так и считал: cuDestructionTokens —
    счётчик). ЧЕТВЁРТОЕ: возврат ЦУ на поле спец-действием БЕСПЛАТЕН, цены у ЦУ
    нет вовсе.
  based_on_1_44_0: >
    1.43.0 + УСИЛЕННАЯ НАГРАДА ЗАДАНИЯ — ВМЕСТО БАЗОВОЙ (решение дизайнера
    16.09.2026). Игрок, выполнивший усиленное требование, получает ОДНУ
    награду НА ВЫБОР: базовую или усиленную, а не обе. Прежде награды
    складывались, и усиление было чистой прибавкой — теперь это развилка:
    усиленная награда обычно очковая и дальняя, базовая — ресурсная и сейчас.
    Выбор делается ДО оплаты: у заданий-жертв усиление стоит доплаты жертвы, и
    платить её вслепую нельзя. Ключ objectives.enhanced_reward_replaces_base.
  based_on_1_43_0: >
    1.42.0 + ГЕКС, ЧУЖИЕ ВОЙСКА И НЕБО (решения дизайнера 16.09.2026), две
    правки разом. ПЕРВАЯ: чужие войска, стоящие на гексе, запирают его не
    только для наземного движения, но и для СТРОЙКИ — пока они там, на гексе
    нельзя ни построить новое, ни снести своё, ни вывести на грунт нанятый
    жетон (нанятый садится гарнизоном). Стоять на гексе с чужим зданием
    войскам при этом по-прежнему можно. ВТОРАЯ: небо гекса вмещает СКОЛЬКО
    УГОДНО жетонов авиации, но только ОДНОГО игрока; авиация свободно садится
    в небо над чужими наземными войсками, а чужая авиация запирает гекс для
    наземных наравне с наземными войсками. Ключи раздела field.
  based_on_1_42_0: >
    1.41.0 + КОЛОДА КОНТЕЙНЕРОВ 6.0.0 ПО ЭКСПОРТУ ДИЗАЙНЕРА (состав от
    10.09.2026): четырнадцать лиц, тридцать две карты, ни одного выбора «или»
    и никаких разрядов редкости — ровно то, что нарисовано на картах
    «контейнеры-new-1…15». Вскрытие — СПЕЦ-действием, после вскрытия карта в
    сброс (два значка внизу карты). Тёмный кубик с шестерёнкой — трофей.
    Жетоны техники и пехоты (лица M и N) нанимаются ИЗ ЗАПАСА игрока и
    встают на любой гекс без чужих войск. Ключ content_versions.containers.
  based_on_1_41_0: >
    1.40.0 + СВОЙ ЖЕТОН УНИЧТОЖЕНИЯ ЦУ ОЧКОВ НЕ ДАЁТ (решение дизайнера
    11.09.2026): «жетоны ЦУ, которые блокируют игроку планшет, не дают ПО
    вообще, пока лежат так; только оборот за уничтожение даёт 3 ПО». Жетон,
    лежащий на своём планшете войск, — это закрытая ячейка атаки, то есть
    помеха, а не источник очков. Ключ own_token_vp_if_cu_never_destroyed: 0.
    (решение дизайнера 09.09.2026: «супер-задание может быть особой формой
    награды; на каждом треке 3-й шаг дополнительно даёт супер-задание»). Карт
    супер-заданий в наборе куда больше, чем игроков за столом, и лишние лежали
    без дела. Награда шага при этом остаётся своя: третий шаг по-прежнему
    выдаёт то, что выдавал, а супер-задание идёт СВЕРХ неё.
    Ключ tech.super_objective_on_step: 3.
  based_on_1_39_0: >
    1.38.0 + ДВЕ ПРАВКИ 09.09.2026. ПЕРВАЯ: НАУКА берёт за одно действие
    СКОЛЬКО УГОДНО РАЗНЫХ ТРЕКОВ, по одному шагу на каждом — уточнение
    дизайнера: «я разрешал на каждом треке один раз поставиться за действие, но
    можно несколько треков». Прежнее «один трек за действие» было временной
    балансовой пробой; из-за неё задание o64 «Разнос трофеев» было невыполнимо.
    Ключ tech.tracks_per_action: 3.
    ВТОРАЯ: СНОС СВОЕГО ЗДАНИЯ ДАЁТ МОНЕТУ (решение дизайнера).
    Прежде снос стоил монету. Теперь он приносит: разобрать своё здание —
    способ найти денег, когда их нет, и способ освободить сектор под другое
    здание. Ключи actions.build.demolish_cost_coins 0 и demolish_refund_coins 1.
  based_on_1_38_0: >
    1.37.0 + СТОРОН «Б» БОЛЬШЕ НЕТ (09.09.2026, решение дизайнера): планшет
    войск и планшет хранилища у всех игроков одинаковые, набор планшетов
    3.0.0. Асимметрию несут раскладка поля, место за столом, супер-задание,
    порядок приказов и модули из мешка — этого достаточно, а ячейками
    планшета её делать не нужно. Ключи asymmetry.mode и asymmetry.board_sides
    убраны, content_versions.boards = 3.0.0.
  based_on_1_37_0: >
    1.36.0 + КОЛОДА ЗАДАНИЙ 1.16.0 (09.09.2026): сорок карт по таблице
    дизайнера — семь семейств, верхи «в моменте» (предсмертный хрип, отход,
    рикошет, эвакуация трофеев, бой перед чужим боем) и выверенные между собой
    награды. Пятнадцать карт написаны заново, тринадцать карт «непрерывного
    соседства» в эту колоду не входят. Ключ content_versions.objectives.
  based_on_1_36_0: >
    1.22.0 + УСТАНОВЛЕННАЯ КАРТА АРСЕНАЛА САМА СТОИТ ОЧКОВ (21.08.2026, решение
    дизайнера): обычная — 1 победное очко, карта СУПЕР-арсенала — 2. Замер
    показал, что карту чаще сжигают, чем ставят (0.74 против 0.72 за партию):
    утиль даёт понятную выгоду сейчас, а установка — способность, которая может
    и не пригодиться. Теперь установка платит сама. Ключи
    economy.vp_per_installed_arsenal и vp_per_installed_super_arsenal.
  based_on_1_22_0: >
    1.21.0 + ТРИ РЕШЕНИЯ ДИЗАЙНЕРА 21.08.2026, все из замеров этого дня:
    (1) КАРТА АРСЕНАЛА В НАГРАДУ ШЕСТНАДЦАТИ ЗАДАНИЯМ вместо двух — путь
    получения арсенала был ровно один (обмен науки 3.51 случая за партию против
    0.26 у наград), и игрок брал 1.5 карты за партию на колоду из сорока пяти;
    задания 1.9.0 -> 1.10.0;
    (2) ЗОЛОЧЕНИЕ ЖЕТОНА МОДУЛЯ ДЕШЕВЛЕ: 3 трофея -> 2. Обмен не брали НИ РАЗУ
    за 120 партий: он дороже шага трека, а шаг ещё и даёт очки;
    (3) НАУКА ПЛАТИТ ТРОФЕЯМИ, А НЕ ЦЕЛЫМИ ЖЕТОНАМИ. Правило и было таким —
    снесённый жетон уезжает на место уничтоженных жетонов, а в Возврат все уничтоженные жетоны
    конвертируются в трофеи 1:1, — но движок позволял сдать в науку сам жетон,
    минуя конвертацию, то есть тратить трофей в тот же ход, когда он взят.
    Ключ tech.pay_with_trophy_only.
  based_on_1_21_0: >
    1.20.0 + АРСЕНАЛ 3.0.0: утиль пересобран целиком (21.08.2026). Низ карт не
    изменён ни у одной — переделан только верх. Причина в замере: утиль
    «выполни действие» стоял на 15 картах из 45, и ровно эти карты боты не
    устанавливали никогда, потому что целое действие дороже любой способности.
    Теперь бесплатное действие всегда с пределом или с надбавкой вместо
    широты, появились плата за положение на поле, кражи, десант и шесть щитов
    на все шесть пар родов. Больше в своде не изменено ничего.
  based_on_1_20_0: >
    1.19.0 + ОДНО ДЕЙСТВИЕ НАУКИ — ОДИН ТРЕК (21.08.2026, решение дизайнера
    ради баланса). Прежде за одно действие можно было шагнуть по одному разу
    НА КАЖДОМ треке, и накопленные трофеи разом ложились во все три ветки:
    действие Науки окупалось тем сильнее, чем дольше игрок копил, а выбор
    ветки не был выбором. Ключ tech.tracks_per_action: 1. Больше в своде не
    изменено ничего.
  based_on_1_19_0: >
    1.18.0 + ПОЛНЫЕ НАБОРЫ МОДУЛЕЙ (20.08.2026, решение дизайнера): раз
    награда «модуль» тянется из ОБЩЕГО мешка, а не раздаётся личным
    комплектом на игрока, масштабировать мешок по числу игроков незачем.
    Красные — все шесть пар целей по два жетона (закрыта дыра «пехота/
    авиация», которой не было НИ В ОДНОМ прежнем наборе); синие — четыре
    вида по три (у них дыр не было, здесь только снят масштаб по игрокам).
    modules 2.0.0 -> 3.0.0, красный мешок bag_R1 -> bag_R30, синий
    bag_C -> bag_C30. Больше в своде не изменено ничего.
  description: >
    Variant ruleset: kelium storage no longer scores VP; trophy storage does,
    at a configurable fractional rate. Everything else inherited from 1.7.1.

# ----------------------------------------------------------------------------
#  Setup (решение дизайнера 2026-08-11: старт по СВОДу)
#  «На старте у игрока ЦУ, две энергии и одна пехота», 5 МОН всем.
#  Стартового добытчика №1 НЕТ (в версиях <=1.4.0 он был — поведение
#  по умолчанию сохранено, старые версии не меняются).
# ----------------------------------------------------------------------------
setup:
  start_miner: false
  # ЗАКАЗ 25.08.2026: три монеты вместо пяти. Вместе с подешевевшими зданиями
  # (завод 2, авиабаза 3) это размен: денег меньше, но и цены ниже.
  # 13.09.2026: СТАРТ ПО МЕСТУ ЗА СТОЛОМ. Первый игрок ходит первым и берёт
  # только монеты; остальным очередь компенсируется кубиком келемия.
  # Боеприпасов на старте нет ни у кого, стартовой карты контейнера тоже.
  start_coins: [4, 2, 3, 4]
  start_kelium: [0, 1, 1, 1]
  start_ammo: 0
  start_containers: 0
  # ПРО КУБИК ЦУ В ЯЧЕЙКЕ отдельного ключа НЕ НУЖНО: подготовка и так ставит
  # свои кубики ЦУ в его ячейку (cuSelf = min(выработка, ячейки) в Setup). При
  # выработке 1 и одной ячейке это ровно то, что просил дизайнер: кубик стоит
  # на месте с самого начала, разводить его Сменой энергии не надо.

# ----------------------------------------------------------------------------
#  Global economy / VP conversion
# ----------------------------------------------------------------------------
economy:
  # УСТАНОВЛЕННАЯ КАРТА АРСЕНАЛА = ПОБЕДНОЕ ОЧКО (21.08.2026). Считается по
  # картам, ЛЕЖАЩИМ на планшете к концу партии, включая карту под Мандатом
  # совета: она тоже установлена и работает.
  # 14.09.2026: ОЧКО ЗА САМ ФАКТ УСТАНОВКИ УПРАЗДНЕНО. Очки дают только
  # звёзды, напечатанные на карте (арсенал — bottom.scoring, супер-арсенал —
  # vp_on_card). Дизайнер: старые начисления вынесены в супер-задания.
  vp_per_installed_arsenal: 0
  vp_per_installed_super_arsenal: 0
  # ЗВЕЗДА ЗДАНИЯ 4 УРОВНЯ — НОЛЬ (решение дизайнера, зафиксировано 06.09.2026).
  # Источник в список шести базовых не входил с самого начала, но пережил правку
  # 04.09.2026, потому что был ЗАШИТ в Scoring без ключа. Замер «откуда очки»
  # поймал его на 12% всего счёта — больше, чем даёт единственный встречный
  # источник, жетон уничтоженного ЦУ (8%).
  vp_per_level4_building: 0
  coins_per_vp: 0             # 1.35.0: переехало в супер-задание «Казна» (s5_13)
  trophy_per_vp: 3              # запасной курс — читается, только если ключа ниже нет вовсе
  kelium_per_vp: 0             # ВАРИАНТ 2026-08-15: келемий в хранилище очков не даёт
  # ЕДИНСТВЕННЫЙ ДЕЙСТВУЮЩИЙ КУРС ЗА ТРОФЕЙ (баг-фикс 18.08.2026, см. changelog
  # 1.14.0): при наличии этого ключа он ПОЛНОСТЬЮ ЗАМЕНЯЕТ trophy_per_vp, а не
  # складывается с ним. 0.5 = 1 ПО за 2 трофея.
  trophy_storage_vp_per_unit: 0   # 1.35.0: переехало в «Склад лома» (s5_14)
  # НАГРАДЫ ЗА ИСЧЕРПАНИЕ ТАЙЛА ЗАРОЖДЕНИЯ (правило дизайнера 12.08.2026).
  # «Большое зарождение» = обычный тайл, «малое» = стартовый.
  spawn_face_trophy_big: 2     # лицо большого  = 2 трофея (победных нет)
  spawn_face_trophy_small: 1   # лицо малого    = 1 трофей (победных нет)
  # ОБОРОТ БОЛЬШОГО ТАЙЛА — ДАРОВОЕ ИССЛЕДОВАНИЕ, А НЕ ТРОФЕИ (решение
  # дизайнера 13.09.2026): «вместо звезды ПО — сразу, без оплаты трофеями,
  # ступень на самом отстающем треке». Так это и написано в книге (главы 8
  # и 10): самый отстающий трек — тот, где у игрока меньше всего кубиков;
  # при равенстве трек выбирает игрок; ступень занята целиком — кубик встаёт
  # на место любого чужого на выбор, и снятый возвращается владельцу; кубиков
  # технологий не осталось — награда пропадает.
  #
  # РАСХОЖДЕНИЕ, ЕЩЁ НЕ ЗАКРЫТОЕ В ДВИЖКЕ (найдено ревизором главы 8,
  # 16.09.2026): Actions.mineFlatFromTile читает ключ ниже и выдаёт трофеи.
  # Значит замеры баланса по симулятору для этой награды недействительны,
  # пока ветка «даровое исследование» не написана рядом с mineFlatFromTile.
  # Ключ оставлен со своим прежним значением, чтобы движок не менял поведение
  # молча; выключать его надо вместе с новой веткой.
  spawn_back_big_free_tech_step: true
  spawn_back_trophy_big: 2     # оборот большого = 2 трофея (ДВИЖОК; см. выше)
  spawn_back_trophy_small: 2   # оборот малого   = 2 трофея
  # ВЫРАБОТАННОЕ ЗАРОЖДЕНИЕ ОЧКОВ НЕ ДАЁТ (дизайнер, 11.09.2026). Победные
  # очки печатаются в шести местах: треки науки, карты арсенала и супер-арсенала,
  # золотые модули, супер-задания и забранный жетон уничтожения ЦУ.
  spawn_back_vp_big: 0
  spawn_back_vp_small: 0       # оборот малого   = победных очков нет
  buildings_per_vp: 0         # 1.35.0: переехало в «Промышленный узел» (s5_15)
  units_per_vp: 0             # 1.35.0: переехало в «Сводный полк» (s5_16)
  kelium_value_coins: 5        # VP-economy lens
  kelium_value_ue: 3           # card-calibration lens (backlog E15)
  trophy_value_coins_via_kelium: 3
  # КЕЛЕМИЙ-ДЖОКЕР (правило-вариант дизайнера 19.09.2026): «келемий это
  # одновременно и боеприпас, и трофей, и энергия». Один кубик келемия платит
  # за атаку вместо боеприпаса, за шаг науки вместо трофея и ложится на
  # свободную ячейку энергии в Смене энергии.
  #
  # Зачем пробуем. Замер 19.09: 34% действий Бой холостые, и 77% из них —
  # «цель была, но нечем платить»; боеприпас связывает всю войну. Келемий при
  # этом выходит ровно в одну дверь, на Рынок, и лежит без дела (0.7-1.1 на
  # руках в конце). Джокер соединяет избыток с дефицитом и не добавляет в
  # коробку ни одного компонента.
  #
  # Все три пути оплаты в движке УЖЕ БЫЛИ — как способности карт («Военный
  # подряд» в бою, «Научный подряд» в науке, установка на ячейку энергии с
  # карты рынка). Ключ только снимает с них ограничение «по карте», поэтому
  # правило дешёвое и легко откатывается.
  kelium_is_joker: false

# ----------------------------------------------------------------------------
#  УСЛОВИЯ КОНЦА ПАРТИИ
# ----------------------------------------------------------------------------
end_conditions:
  # СКОЛЬКО ИСТОЧНИКОВ КЕЛЕМИЯ ОСТАЛОСЬ, когда партия кончается. ПРАВИЛО - ОДИН
  # (свод; это же значение по умолчанию в движке).
  #
  # ВОЗВРАЩЕНО К ЕДИНИЦЕ 06.09.2026 по указанию дизайнера. С 31.08 здесь стояло
  # 5 - подкрутка под требование «хорошая партия идёт 4-6 раундов». Требование
  # было про ДЛИНУ, а порог трогает ЭКОНОМИКУ: партия обрывалась, пока келемий
  # ещё на поле. И на малых составах это ломало игру насмерть - грядок вдвоём
  # 3.5, втроём 6.0, вчетвером 7.0, то есть ВДВОЁМ условие было истинно уже на
  # подготовке и партия кончалась в первом раунде (замер kelium.ДлинаПартии).
  # Длину теперь ограничивает размер колоды рынка - это и есть штатный потолок.
  last_spawn_tile_threshold: 1
  # ВЕРШИНЫ ТРЕКОВ СЧИТАЮТСЯ ПО ОДНОМУ ИГРОКУ (правило дизайнера 17.09.2026).
  # Партия кончается, когда верхние ступени ВСЕХ ТРЁХ треков заняты ОДНИМ
  # игроком. Прежде хватало трёх занятых вершин вразнобой — и условие
  # складывалось само, без чьего-либо замысла: трое дошли каждый до своей
  # вершины, и партия обрывалась ни для кого. Теперь это достижение одного,
  # и путь к нему виден всем за столом: у вершины трека стоит чужой кубик.
  peaks_by_one_player: true

rounds:
  # ЖЕТОН ПЕРВОГО ИГРОКА ИДЁТ ПРОТИВ ЧАСОВОЙ СТРЕЛКИ (решение дизайнера
  # 19.09.2026), а карты приказов вскрываются ПО часовой, как и раньше.
  # Пока жетон шёл по часовой, сосед слева от первого игрока ходил вторым в
  # этом раунде и первым в следующем — два хода подряд. Встречное вращение
  # это разрывает: первым становится тот, кто в прошлом раунде вскрывался
  # последним. Движок: GameEngine, шаг «первый игрок» в Обновлении.
  first_player_counterclockwise: true
  # min/max — ИСТОРИЯ: жёсткого предела в 7 раундов в игре больше нет,
  # партия кончается условиями (треки, последний тайл, супер-задание,
  # военная победа). Эти два числа движок не читает.
  min: 6
  max: 7
  # ПРЕДЕЛ РАУНДОВ ЗДЕСЬ НЕ ЗАДАЁТСЯ (уточнение дизайнера 13.08.2026). Он равен
  # числу карт рынка: каждый раунд выкладывается одна, колода не пересобирается,
  # кончились карты — партия не может идти дальше. Это ПОСЛЕДНЕЕ из условий
  # конца, страховка: обычно раньше срабатывает вершина треков, последний тайл
  # зарождения или мгновенная победа. Сейчас карт восемь, значит предел — восьмой
  # раунд. Ключ reserve_cap оставлен как ЯВНОЕ переопределение для балансовых
  # опытов («а если предел 11 раундов») и по умолчанию не задан.
  circles_per_round: 4
  order_hand_size: 5
  # ПРЕДЕЛ ДОБОРА ЗАДАНИЙ, А НЕ ПОТОЛОК РУКИ (решение дизайнера 23.09.2026).
  # В Возвращении карты добираются, пока их меньше этого числа. Верхнего
  # предела руки НЕТ: задания, полученные как награды, не сбрасываются —
  # рука заданий устроена как резерв арсенала. Обрезания в движке и не было;
  # убрана лишь строка книги, которая ложно предписывала «оставить до 2».
  objective_hand_limit: 2
  # Слепой сброс приказа (правило дизайнера 2026-08-11): true = игрок ВЫБИРАЕТ,
  # какой приказ отложить под уничтоженные жетоны на раунд; false = случайный сброс.
  blind_discard_choice: true

# ----------------------------------------------------------------------------
#  ASYMMETRY MODULE  (designer will tune this)
#  Планшеты у всех одинаковые; здесь остались только общие для всех поправки к
#  напечатанным характеристикам жетонов — ими и крутят баланс.
# ----------------------------------------------------------------------------
asymmetry:
  # ФРАКЦИИ (планшеты войск, нарисованные дизайнером 22.09.2026). У каждого
  # цвета свой планшет войск и свои жетоны: скорости, печатные цели, цены
  # зданий, производство, прочность войск и зданий, ячейки энергии. Планшет
  # хранилища, добытчики, энергостанции и карты приказов у всех одинаковые.
  # Место за столом → цвет, по кругу. Запись «A» — прежний общий планшет.
  board_sides: [blue, red, green, yellow]   # как краски мест в игре: 1 синие, 2 красные, 3 зелёные, 4 жёлтые

  # "+1 HP for everyone" style experiments. Applied uniformly to every token
  # (tokens stay identical across players — the iron rule of asymmetry).
  token_hp_bonus_all: 0

  # Placeholder for future explicit overrides of printed token stats
  # (per-building HP/energy, per-unit HP). null = use the boards content file.
  # When we start tuning these, fill e.g.:
  #   token_overrides: {buildings: {factory: {hp: 3}}, units: {aircraft: {hp: 2}}}
  token_overrides: null

# ----------------------------------------------------------------------------
#  Action rule variants
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
#  ПОЛЕ: ЧУЖИЕ ВОЙСКА НА ГЕКСЕ И НЕБО ГЕКСА (решения дизайнера 16.09.2026)
# ----------------------------------------------------------------------------
#  ЧУЖИЕ ВОЙСКА. Войско имеет полное право встать на гекс, где стоит чужое
#  здание, — в этом нет ничего страшного, и здание работает как работало. Но
#  пока войско там стоит, на гексе НЕ МЕНЯЕТСЯ НИЧЕГО: владелец гекса не может
#  ни построить новое здание, ни снести своё, ни вывести на грунт нанятый
#  жетон. Нанятый жетон при этом не пропадает — он садится гарнизоном внутрь
#  здания, которое его сделало; вышке внутрь нельзя, и она не нанимается.
#  Наземному войску на такой гекс по-прежнему нельзя ни встать, ни пройти
#  насквозь; уйти с него можно.
#
#  НЕБО. Прежде в небе гекса помещался ровно один жетон авиации, чей угодно.
#  Теперь небо вмещает сколько угодно жетонов — но ОДНОГО ИГРОКА: встать туда,
#  где уже стоит чужая авиация, нельзя, а рядом со своей — можно без счёта.
#  Асимметрия между небом и грунтом намеренная: авиация садится в небо над
#  чужими наземными войсками свободно, а чужая авиация запирает гекс для
#  наземных наравне с наземными войсками и не даёт на нём строить.
#
#  Движок: Placement.skyOpen и Placement.enemyUnitsLockHex — по одной копии
#  каждого правила на всю игру.
# ----------------------------------------------------------------------------
#  ЗАДАНИЯ: УСИЛЕННАЯ НАГРАДА (решение дизайнера 16.09.2026)
# ----------------------------------------------------------------------------
#  У карты задания два требования и две награды: базовое с базовой наградой и
#  усиленное с усиленной.
#
#  УСИЛЕНИЕ БЕРЁТСЯ ВМЕСТЕ С БАЗОЙ (решение дизайнера 18.09.2026 по итогам
#  онлайн-теста): «усиления заданий именно — вместе с базой, чтобы эти награды
#  получались проще, быстрее». Выполнил усиленное требование — получаешь ОБЕ
#  награды, базовую и усиленную.
#
#  Почему отменено правило 16.09.2026 («одна награда на выбор»). Оно делало из
#  карты развилку, но платой была скорость: усиленное требование и так дороже
#  базового, а награда за него выходила не больше. Ради развилки терялся весь
#  темп наград — а темпа в партии не хватало прежде всего. Модули, позолота и
#  карты арсенала сидят как раз в усиленных наградах, и пока за них платили
#  отказом от базовой, до них не доходили.
#
#  У начальных заданий блока усиления нет вовсе — у них развилки не возникает.
#
#  Движок: Objectives.playObjective(..., усиленно) и два разных предложения в
#  меню СПЕЦ-действия — spec_objective и spec_objective_enh.
objectives:
  enhanced_reward_replaces_base: false  # усиленная награда СВЕРХ базовой (18.09.2026)
  # ВЫПОЛНЕНИЕ ЗАДАНИЯ — СВОБОДНОЕ ДЕЙСТВИЕ (правило-вариант дизайнера
  # 19.09.2026). Карта разыгрывается в любой момент своего хода и спец-действия
  # не тратит. Сжигание ради утиля спец-действием остаётся.
  #
  # ЗАКРЫТЫЙ ВОПРОС (решение дизайнера 23.09.2026): свободное выполнение —
  # БЕЗДНА. Оно запутывает игроков (много вопросов, как это разыграется) и
  # создаёт дисбаланс: с удачными картами заданий игрок бесконечно долго тянет
  # ход, разыгрывая действие за действием. Выполнение задания ОСТАЁТСЯ
  # спец-действием. Ключ оставлен только для воспроизводимости старого замера;
  # включать не следует.
  #   -Dkelium.rules=objectives.play_is_free_action=true
  play_is_free_action: false
  # УРЕЗАННЫЙ УТИЛЬ (правило-вариант 19.09.2026): полные действия в верхней
  # половине карты сжимаются до ОДНОГО жетона — бой одним войском, движение
  # одним войском. Развёртывание и прочее не меняются.
  #
  # Зачем проверять. Замер: карты заданий сжигают в 2.4 раза чаще, чем
  # выполняют (43.6 против 17.9 за партию). Причина видна из правил: утиль даёт
  # ПОЛНОЕ действие и награда даёт ПОЛНОЕ действие, но утиль не требует условия.
  # Выполнять становится строго хуже — кроме случая, когда нужен ресурс
  # усиления. Урезанный утиль возвращает смысл нижней половине карты и остаётся
  # провокацией боя, чего дизайнер и добивался.
  util_limited: false

field:
  sky_single_owner: true          # в небе гекса сколько угодно авиации, но одного игрока
  enemy_units_block_build: true   # чужие войска запирают гекс для стройки, сноса и найма на грунт

# ----------------------------------------------------------------------------
#  КАРТЫ ПРИКАЗОВ (набор orders 3.0.0, симметричный)
# ----------------------------------------------------------------------------
orders:
  # Плашка «+2 монеты» — по одной у каждого цвета (так и напечатано на картах).
  # Вместе с нулевой ступенью рынка это гарантированные 2–4 монеты за раунд
  # даже у игрока, у которого нет ничего.
  spec_coin: 2

actions:
  spec_per_turn: 1
  coincidence_rule_enabled: true

  build:
    # ПОТОЛКА ОПЕРАЦИЙ НЕТ ВОВСЕ (решение дизайнера 06.09.2026). Ни надбавки за
    # объём, ни нарядов от военных зданий: строй столько, на сколько хватит
    # монет. Ограничивают ДЕНЬГИ и ГЕОМЕТРИЯ — строить можно только в своих
    # гексах и в гексе, на который здание смотрит стенкой, и в гексе не больше
    # одного здания каждого типа. Это то же по природе ограничение, что ячейки
    # предложений рынка: нехватка РАЗНЫХ возможностей, а не потолок количества.
    # Она видна на столе и не требует счёта.
    #
    # Что было не так с нарядами. Они связывали (54-58% Строек упирались в них,
    # замер kelium.НарядыИлиДеньги), но платой были три вещи: ритуальный первый
    # ход (три монеты и один наряд — единственный неглупый розыгрыш это самое
    # дешёвое военное здание ради второго наряда), спираль против отстающего
    # (снесли здания — меньше нарядов — хуже отстраиваешься) и лишний счёт за
    # столом.
    #
    # Оба ключа ниже больше не читаются движком как ограничители; оставлены,
    # чтобы СТАРЫЕ своды считались по-старому.
    surcharge_coins: [0, 1]
    ops_per_military_building: 1
    # ДВЕ ОПЕРАЦИИ: размещение и снос.
    #   размещение   — напечатанная цена здания
    #   снос своего  — ДАЁТ 1 монету
    #
    # ПЕРЕНОС ИЗ БАЗЫ УБРАН. Со зданием на поле теперь делают одно из двух:
    # ставят или убирают. Перенос был третьим способом разместить то же самое
    # здание, и его приходилось объяснять отдельной строкой; теперь переезд
    # собирается из двух имеющихся - снёс и построил заново. Карты, двигающие
    # здания, работают по-прежнему: им можно то, чего нельзя базе.
    move_enabled: false
    #
    # СНОС СВОЕГО ЗДАНИЯ ДАЁТ МОНЕТУ (решение дизайнера 09.09.2026). Разобрать
    # своё — это и выход из безденежья, и способ освободить сектор под другое
    # здание. Доить этим нельзя: одна операция на здание уже стоит выше, а
    # поставить то же здание заново дороже, чем монета со сноса.
    demolish_cost_coins: 0
    demolish_refund_coins: 1
    # РЕМОНТ — первый крупный сток монеты в игре. Осевое правило «урон сам не
    # проходит» не отменяется, а уточняется: даром он не снимается. К концу
    # партии у игроков оставалось 7-13 непотраченных монет (замер
    # kelium.СтройкаБезПотолка), то есть монета перестала быть дефицитом; ремонт
    # под осадой прямо конкурирует с расширением и возвращает ей цену.
    # РЕМОНТ СНЯТ (решение дизайнера 06.09.2026: «я бы убрал ремонт как базовую
    # часть действия. не надо»). В базовой Стройке ровно две операции: поставить
    # здание за печатную цену и снести своё за монету.
    repair_enabled: false
    move_cost_coins: 1
    # РУЛБУК §8.3: «Своё ЦУ не сносится и не переносится».
    demolish_cu_allowed: false
    # ОДНА ОПЕРАЦИЯ НА ЗДАНИЕ — ОСТАЁТСЯ, и это не потолок количества.
    #
    # Пробовали снять вместе с потолком (06.09.2026) — вышло вырождение: замер
    # дал до 43 операций за одну Стройку, потому что одно здание можно гонять
    # туда-сюда по монете за перенос. Прибыли в этом нет (переноса в базе больше
    # нет вовсе), но время за столом это съедает подчистую.
    #
    # А главное — это правило той же грамматики, что вся Разработка: «каждое
    # запитанное здание даёт одно», «каждый запитанный добытчик делает ОДНО».
    # Тронул здание — оно в этом действии отработало. Считать нечего, иконок не
    # нужно, и порция растёт вместе с базой сама.
    one_op_per_building: true
    # СКОЛЬКО ВОЕННЫХ ЗДАНИЙ ОДНОГО ТИПА (правило-вариант дизайнера 19.09.2026:
    # «сделать два экземпляра казарм, завода и авиабазы, посмотреть, что будет»).
    # 1 — как было, по одному; 2 — по два.
    #
    # Зачем пробуем: замер 19.09 показал перекос производства. Вышки — 36% всего
    # выпуска (их делает ЦУ, которому больше нечем заняться, и в потерях они
    # 1.3%), а авиация — 2.6%, то есть её в игре практически нет. Вторая казарма
    # и второй завод дают чем занять Снаряжение, вторая авиабаза — шанс, что
    # авиацию построят хоть когда-нибудь.
    military_copies: 1
    move_building_repays_full_price: false
    # ЦУ переносят не чаще раза за ход — и теперь тоже за монету, а не даром.
    cu_moves_per_turn: 1

  combat:
    # БОЙ ИГРАЕТСЯ КАК ДВИЖЕНИЕ (решение дизайнера 04.09.2026, уточнение
    # 07.09.2026; в движке с 07.09.2026). Выбери один свой гекс: его войска
    # атакуют по обычной цене. Любой другой свой жетон тоже атакует, но КАЖДАЯ
    # его атака дороже на extra_token_ammo боеприпасов (3 вместо 2, 2 вместо 1).
    # Не больше раза за действие играется КАЖДАЯ СТРОКА атаки жетона (рулбук
    # §8.6): жетон с двумя строками может сыграть обе, доплатив за право один
    # раз — доплата берётся ЗА ЖЕТОН, а не за атаку.
    # Каждый жетон выбирает свою цель: соседний гекс или свой же. Единицы
    # «второй бой» и платы за право следующего боя больше нет.
    # ЧТО ЧИТАЕТ ДВИЖОК: surcharge_model переключает грамматику, а
    # token_surcharge_ammo — размер доплаты. per_token и есть «Близнец
    # Движения», описанный выше.
    surcharge_model: per_token
    token_surcharge_ammo: 1
    # То же число под прежним именем — на него ссылается справочник правил в
    # проигрывателе. Движок его не читает; держать вровень с token_surcharge_ammo.
    extra_token_ammo: 1
    # Ключ прежней модели «несколько боёв за действие с платой за право»
    # движком больше не читается; оставлен ради истории сводов.
    open_battle_surcharge_ammo: [0, 1]    # устарело
    # ДВЕ АТАКИ, ТРЕТЬЕЙ НЕТ (диктовка дизайнера 24.08.2026). Основной и
    # второстепенной атак не существует: у каждого рода войск УНИВЕРСАЛЬНАЯ
    # атака за 2 боеприпаса по любому типу и СПЕЦИАЛЬНАЯ за 1 боеприпас по
    # одному напечатанному типу. Специальная — единственная, которую можно
    # улучшить: на неё кладётся жетон модуля атаки.
    universal_ammo_cost: 2
    specialized_ammo_cost: 1
    # Поблажки вышке нет: её специальная атака стоит те же 1 БПР. Ключ оставлен
    # ради воспроизводимости черновика «Бой 2.0» от 18.08.2026, где она была
    # бесплатной.
    tower_specialized_free: false
    # Ключи старой системы пар ОСН/ВТР. Нужны сторонам 1.0.x, которые всё ещё
    # можно поставить в content_versions.boards.
    primary_row_ammo_cost: 1
    # ПРАВИЛО 16.08.2026: вторая строка планшета стоит СТОЛЬКО ЖЕ, сколько
    # первая. Двухбоеприпасных атак на планшетах войск больше нет.
    secondary_row_ammo_cost: 1
    # 1.34.0: автоматического ответного боя нет. Ключ оставлен включаемым:
    # эффекты карт выдают ответный бой поимённо, и движок разыгрывает его
    # по той же процедуре.
    retaliation_enabled: false
    retaliation_is_free: true
    retaliation_to_retaliation: false

  assembly:
    # БАЗОВАЯ ВЫДАЧА БОЕПРИПАСОВ (правило-вариант 19.09.2026). Печатное число на
    # планшете — единица; ключ поднимает её, не трогая ни войска, ни жетоны
    # модулей.
    #
    # Зачем проверять: боеприпасов делается 4.5-5.7 за партию на игрока, а
    # тратится 7-8; 77-83% холостых боёв — «цель была, но нечем платить». И
    # характер, поставивший на армию, выигрывает 7.5% партий против 38.8% у
    # снабженца. Похоже, война просто не окупается.
    #   -Dkelium.rules=actions.assembly.ammo_base=2
    # ДВА БОЕПРИПАСА С ЛЮБОГО ЗДАНИЯ, КРОМЕ ЦУ (решение дизайнера 20.09.2026).
    # Замер вилки на 60 общих раздачах: сносов 2,84 -> 3,39, холостых боёв
    # 47% -> 41%, и состав производства при этом не поехал — боеприпас на выбор
    # рода войск не влияет.
    ammo_base: 2
    # ВОЗВРАТ ВОЙСК В ЗАПАС (решение дизайнера 18.09.2026). В Снаряжении игрок
    # может вернуть с поля в запас ЛЮБОЕ ЧИСЛО своих войск — даром, без
    # перемещения и без всяких условий, до того как здания начнут производить.
    #
    # Зачем. Запас каждого рода — ровно 4 жетона, и кончившийся запас означает,
    # что здание выбрало войска и не выдало ничего. Замер темпа 18.09.2026 на
    # 200 партиях: к восьмому раунду на игрока 3.7 войска на поле при сносах
    # ~0.25 жетона за раунд, то есть поле забивается жетонами, которые некуда
    # девать и нечем разменять. Возврат в запас делает из этого решение:
    # убрал вышку с дальнего края — освободил производство под пехоту.
    #
    # Почему именно в Снаряжении, а не в Движении. В Движении возврат в запас
    # уже есть, но там он ПЕРЕМЕЩЕНИЕ и стоит доплаты за жетон вне выбранного
    # гекса; жетоны с разных концов поля так не убрать. Здесь это часть того же
    # действия, что и производство, — «переснарядился».
    return_units_to_reserve: true

  movement:
    # ДВИЖЕНИЕ ПО РУЛБУКУ §8.5 (в движке с 07.09.2026): выбери ОДИН свой гекс —
    # его войска двигаются бесплатно, каждое на свою скорость. Любой другой
    # жетон двигается за flat_ammo_per_extra_move боеприпасов за перемещение.
    # Перемещение = ход ОДНОГО жетона на его скорость (или меньше); каждый жетон
    # перемещается не больше одного раза за действие. Вход в гарнизон и возврат
    # в запас — тоже перемещения. Прежняя модель «одно бесплатное перемещение
    # любому жетону, дальше по боеприпасу за шаг» была расхождением с правилами.
    surcharge_model: per_token            # per_token | per_move (прежняя модель)
    token_surcharge_ammo: 1               # доплата за жетон вне выбранного гекса
    cost_model: flat                      # устарело: только для per_move
    first_hex_free: true
    # Ключи старой грамматики: читаются, когда cost_model = flat/escalating.
    flat_ammo_per_extra_move: 1
    escalating_surcharge_ammo: [0, 1, 2, 3]

  # Компенсация энергии монетами — ТОЛЬКО в приказе Разработка (Сборка/Добыча).
  # Одноразовая: действует на одно действие, кубик не кладётся, в следующий раз
  # платить заново. Решение дизайнера 2026-08-12.
  empty_energy_slot_coin_cost: 1

  energy_swap:
    # ПРАВИЛО 04.09.2026: выбора гекса больше нет. Кубик снимается с ИСТОЧНИКА
    # (энергостанция, ЦУ, жетон хранилища стороной энергии) бесплатно, а с
    # работающего ЗДАНИЯ — за монету. Класть можно куда угодно.
    # Прежний ключ surcharge_coins описывал надбавку за каждый следующий
    # гекс-исход и больше не читается; оставлен, чтобы старые своды считались
    # по-старому.
    surcharge_coins: [0, 1]
    # ПРАВИЛО 04.09.2026 (вторая редакция): выбора гекса и доплат нет вовсе.
    # Каждый ИСТОЧНИК активируется не больше раза за действие, и активация —
    # одно из двух: ОТДАТЬ (снять энергию и разложить по своим зданиям) либо
    # ЗАБРАТЬ (вернуть на него энергию откуда угодно, но до ПОЛНОГО заполнения).
    # Неидемпотентность держится на лимите активаций: второй розыгрыш действия
    # даёт по второй активации каждому источнику, то есть источник успевает и
    # отдать, и забрать. Первая редакция (плата за кубик со здания) отменена —
    # она делала повтор бессмысленным.
    activations_per_source: 1
    # ЗАБРАТЬ МОЖНО С ЛЮБЫХ ЯЧЕЕК, а не только «до полного заполнения»
    # (карточки-памятки дизайнера, 11.09.2026): «Вернуть на источник — с любых
    # ячеек энергии». Ключ теперь ЧИТАЕТСЯ движком (Actions.canTakeBack);
    # прежде правило было зашито в код, и свод на него не влиял.
    take_back_must_fill_source: false


# ----------------------------------------------------------------------------
#  Энергия: ЖЁЛТАЯ ЯЧЕЙКА (правило дизайнера 16.08.2026)
# ----------------------------------------------------------------------------
#  На каждом гексе картонного блока напечатана ОДНА наземная ячейка жёлтым
#  цветом; она никогда не совпадает с ячейкой печатного контейнера. Только
#  стоя на ней, энергостанция выдаёт свой номинал по уровню (1·2·2·3).
#  Построенная на любой другой ячейке, она даёт число ниже — независимо от
#  уровня. ЦУ правилу не подчиняется: оно сам себе источник и потребитель.
# ----------------------------------------------------------------------------
energy:
  # СТАНЦИЯ ВНЕ ЖЁЛТОЙ ЯЧЕЙКИ НЕ ДАЁТ НИЧЕГО (решение дизайнера 20.09.2026).
  # Было 1 кубик, стало 0: станция на чужом месте теперь не «слабый источник»,
  # а мёртвый жетон, и место под неё становится предметом спора на поле.
  plant_off_cell_gives: 0       # выработка станции ВНЕ жёлтой ячейки
  # ЦУ ЗАПИТАНО ЛЮБЫМ КУБИКОМ НА СВОЁМ ЖЕТОНЕ (правило дизайнера 17.09.2026).
  # ЦУ — один жетон, и источник, и потребитель. Зон на нём две, ячейка энергии
  # и свободная энергия, но кубик и там и там лежит НА ЖЕТОНЕ, и перекладывать
  # его с ЦУ на само ЦУ не нужно: за столом это движение из руки в ту же руку.
  # Кубиков больше, чем ячеек, — лишние лежат в зоне свободной энергии.
  #
  # Движок: BuildingToken.powered() считает для ЦУ и energyIdle, а Смена энергии
  # не предлагает класть кубик ЦУ обратно в ЦУ.
  cu_powered_by_any_cube: true

# ----------------------------------------------------------------------------
#  Combat / token model
# ----------------------------------------------------------------------------
combat_model:
  all_attacks_damage: 1
  # Закрывает ли стенка ВЫСТРЕЛ так же, как проход (правка 13.08.2026 по находке
  # дизайнера: техника стреляла сквозь нейтральное здание, стоявшее в её же
  # гексе). Авиация бьёт сверху и стенок не замечает всегда.
  walls_block_shots: true
  # Урон лежит на жетоне до уничтожения; снять его может только эффект карты.

# ----------------------------------------------------------------------------
#  TECH / SCIENCE MODULE  (designer will tune this)
# ----------------------------------------------------------------------------
tech:
  tracks: 3
  # ЧЕМ ПЛАТЯТ ЗА НАУКУ (21.08.2026): только ТРОФЕЯМИ. Уничтоженный жетон в науку
  # не сдаётся — он сперва конвертируется в трофеи в Возврат, как и написано в
  # правилах. Ключа нет — движок работает как раньше (жетоны, потом трофеи).
  # ЖЕТОНАМИ СО СВАЛКИ ПЛАТИТЬ МОЖНО (решение дизайнера 13.09.2026): жетон
  # целиком за своё число трофеев, сдачи нет, чем платить — выбирает игрок.
  pay_with_trophy_only: false
  # СКОЛЬКО РАЗНЫХ ТРЕКОВ БЕРЁТ ОДНО ДЕЙСТВИЕ НАУКИ. Все три: правило игры —
  # «не более одного шага на КАЖДОМ треке за действие», а сколько треков тронуть
  # за это действие, решает игрок (уточнение дизайнера 09.09.2026). Ограничение
  # «один трек за действие» было временной балансовой пробой и правилом не
  # является: два шага по ОДНОМУ треку запрещены и так, а раскладывать трофеи по
  # разным веткам одним действием законно.
  tracks_per_action: 3
  # ТРЕТИЙ ШАГ ДАЁТ ЕЩЁ И КАРТУ СУПЕР-ЗАДАНИЯ — на каждом треке (решение
  # дизайнера 09.09.2026). Это НАДБАВКА к награде шага, а не замена ей. Ноль
  # или отсутствие ключа — надбавки нет, своды прошлых редакций читаются как
  # раньше.
  super_objective_on_step: 3
  # ШАГИ БЕРУТСЯ ПОДРЯД, С ПЕРВОГО (карточки-памятки дизайнера, 11.09.2026):
  # «Занять место на треках тех-ий — последовательно с 1-го шага». Прыжок через
  # занятые ячейки больше не предлагается.
  # 13.09.2026: ступени по порядку, но ПОЛНОСТЬЮ занятую ступень можно
  # перепрыгнуть, заплатив и за неё; ступень со свободной ячейкой — нельзя.
  steps_in_order: true
  steps_per_track: 4
  step_cost_trophy: [1, 2, 3, 4]          # full track = 10 trophy
  # ПО ЗА ШАГ 1/2/3/4 — ЕДИНСТВЕННОЕ МЕСТО, ГДЕ ЭТА ЛЕСТНИЦА ЗАДАНА (заказ
  # дизайнера 18.08.2026: снизить трек науки, но оставить переключаемым отсюда
  # же). Снижено с [1, 1, 2, 3] (полная лестница 7 ПО) до [0, 1, 1, 2] (полная
  # лестница 4 ПО): первый шаг больше не приносит очков сам по себе — он
  # остаётся входом на трек ради приза и открытия дальнейших шагов, а не
  # источником ПО.
  # ВОЗВРАТ К [1,1,2,3] (решение дизайнера 24.08.2026). Первый шаг ОБЯЗАН
  # давать очко: он и есть вход на трек, а без входа треком не пользуются.
  # Замер, из-за которого это вернули: доля треков в счёте 10% против 40%,
  # ноль партий с занятием трёх вершин из шестидесяти.
  step_vp_cumulative: [1, 1, 2, 3]        # ПО за шаг 1/2/3/4; полная лестница = 7 VP

  # КУБИКИ ЗАНИМАЮТ ЯЧЕЙКИ НАВСЕГДА (заказ дизайнера 02.09.2026). Стартовой
  # ячейки «на нуле» нет: все кубики лежат в личном запасе игрока, и каждый шаг
  # покупается ВЫКЛАДЫВАНИЕМ НОВОГО кубика. Прежний кубик с пройденного шага не
  # снимается - ячейка остаётся за игроком до конца партии, и трек становится
  # гонкой за места.
  #
  # Запас в 8 кубиков - это предел всей науки за партию: полная лестница одного
  # трека стоит 4 кубика, трёх треков - 12, поэтому все три трека до вершины
  # физически не пройти. Вершины при этом достижимы прыжками (3 кубика, если
  # прыгать сразу на вершину), так что условие конца «заняты все вершины»
  # остаётся живым.
  cubes_are_permanent: true
  cube_supply: 8
  # Берут по составу (13.09.2026): вдвоём 8, втроём 7, вчетвером 6.
  cube_supply_by_players: {"2": 8, "3": 7, "4": 6}

  # ТРЕКИ 2.1 (уточнение дизайнера 12.08.2026): ячеек НА ШАГЕ ФИКСИРОВАННОЕ
  # число, но часть их открывается только на большом составе. step_cells —
  # МИНИМАЛЬНЫЙ состав для каждой ячейки шага:
  #   шаг 1: три ячейки, третья — только вчетвером (на планшете «4И»);
  #   шаг 2: три ячейки, вторая — втроём и вчетвером («3+И»), третья — вчетвером;
  #   шаг 3: две ячейки, вторая — втроём и вчетвером («3+И»);
  #   шаг 4 (вершина): одна ячейка.
  # Занятие всех трёх вершин = условие конца партии (all_peaks_occupied).
  # ЗАКАЗ 02.09.2026: на шагах 1, 2 и 3 последняя ячейка доступна ТОЛЬКО
  # вчетвером. Вчетвером выходит 3/3/2/1 ячейки по шагам, вдвоём и втроём -
  # 2/2/1/1.
  step_cells:
    - [2, 2, 4]
    - [2, 2, 4]
    - [2, 4]
    - [2]
  # step_capacity оставлен для старых версий правил и как страховка, если
  # step_cells нет: движок считает ёмкость по step_cells, когда они заданы.
  step_capacity: [3, 3, 2, 1]

  # Приз шага 1 (кубики у трека): чем позже пришёл на шаг, тем меньше приз.
  # Красный (left) — боеприпасы, зелёный (middle) — келемий, синий (right) —
  # монеты. Ключи first/second/third — по номеру занятой ячейки шага.
  # Правило дизайнера 16.08.2026: на треке красных модулей первая ячейка даёт
  # 3 БПР, вторая 1; на треке синих модулей — 4, 2 и 1 монету по трём ячейкам.
  # ПО ПЕЧАТИ ПЛАНШЕТА НАУКИ (14.09.2026): красный 2 и 1 боеприпас, зелёный
  # 1 келемий, синий 2 и 1 монета; ячейка «4И» без приза.
  step1_prize:
    left:   {first: {ammo: 2},   second: {ammo: 1}}
    middle: {first: {kelium: 1}}
    right:  {first: {coin: 2},   second: {coin: 1}}

  # ЖЕТОН УЖЕ НА ПЕРВОМ ШАГЕ (решение дизайнера 19.09.2026): «раздавать жетоны
  # модулей сразу на первом же шаге треков — итого у игроков будет сразу сходу
  # до трёх жетонов. Исключение зелёный трек: на нём каждая ступень выдаёт
  # карту арсенала».
  #
  # Зачем. Замер темпа 18.09: модуль сборки приходит в среднем на 6.25 раунде
  # из восьми, и 81% мест не получают его вовсе — он сидел на ВТОРОМ шаге
  # одного конкретного трека, то есть стоил 1+2 трофея именно туда. На модули
  # опирается половина колоды заданий: позолота как награда игралась в 17%
  # случаев просто потому, что золотить было нечего.
  #
  # Печатный приз-кубик первого шага остаётся: жетон идёт СВЕРХ него.
  token_on_step1: true
  # ЖЕТОН НА КАЖДОЙ ИЗ ПЕРВЫХ ТРЁХ СТУПЕНЕЙ (уточнение дизайнера 19.09.2026):
  # «все первые три ступени каждого трека дают жетон модуля — и сборки, и боя,
  # и хранилища, ступени 1, 2, 3, за 1, 2, 3 трофея соответственно».
  # Это отменяет вчерашнюю правку «зелёный трек выдаёт карту арсенала»:
  # зелёный снова выдаёт ЖЕТОН ХРАНИЛИЩА, и ячеек под него стало три.
  #
  # СУПЕР-ЗАДАНИЕ — ТОЛЬКО С ТРЕТЬЕЙ СТУПЕНИ (super_objective_on_step: 3).
  # ЧЕТВЁРТАЯ СТУПЕНЬ даёт только карту супер-арсенала и три печатных ПО.
  science_one_step_per_track_per_action: true

  # СКИДКА ЗА ПАРУ, как на рынке: 2 трофея разом -> 3 монеты, а не 2.
  pair_bonus_coin: 1

  # ЦЕНА ПОЗОЛОТЫ на вечном курсе науки (решение дизайнера 28.08.2026):
  # два трофея, а не три.
  gild_trophy_cost: 2

  # Exchanges available in the Science action ("Научный отдел"), ≤1×/action each.
  # ТРИ ОБМЕНА НА ПЛАНШЕТЕ (заказ дизайнера 02.09.2026): позолота модуля, карта
  # арсенала и смена модуля. Обмен трофеев на монеты с планшета УБРАН - он
  # напечатан на карте арсенала (две копии в колоде) с тем же курсом, включая
  # скидку за пару.
  science_exchanges:
    - {id: move_module,     give_trophy: 1, effect: move_module}
    # ПРОКРУТ АРСЕНАЛА — 1 ТРОФЕЙ (решение дизайнера 18.09.2026,
    # «точно 100%»). За два трофея его не брали: та же цена, что у
    # позолоты и у половины шага трека, а карта арсенала случайна.
    - {id: draw_arsenal,    give_trophy: 1, effect: draw2_keep1}
    - {id: gild_module,     give_trophy: 2, effect: gild_module}

# ----------------------------------------------------------------------------
#  MARKET MODULE  (designer will tune this)
#  Base exchange rates (printed board rates, doubled per the market rule). One
#  market card is active per round; card specifics live in the market content
#  file, these are the underlying rates a cell can offer. Cost: 1 kelium/cell.
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
#  МОДУЛИ 2.0 (решение дизайнера 12.08.2026)
#  Жетоны модулей ТЯНУТСЯ ИЗ МЕШКА, а не выбираются с планшета: игрок решает не
#  «какой жетон взять», а «куда его вставить». В мешок при подготовке кладутся
#  полные наборы по числу игроков — 8/12/16 жетонов на 2/3/4 игроков. Вытянутый
#  жетон из мешка извлекается навсегда; опустевший мешок = наград-модулей больше
#  нет. Наборы описаны данными (data/modules/modules.2.0.0.yaml).
# ----------------------------------------------------------------------------
modules:
  from_bag: true
  # bag_R30/bag_C30 — полные фиксированные наборы (20.08.2026), НЕ
  # масштабируются по числу игроков. Прежние bag_R1 (размен целей),
  # bag_R2 (характеристики), bag_R1_R2 (смесь), bag_legacy (R0) и bag_C
  # (старый синий) остаются доступны версией — можно вернуть, поставив id
  # сюда.
  red_bag: bag_R30
  blue_bag: bag_C30

market:
  # СКОЛЬКО КАРТ РЫНКА КЛАДУТ НА ПЛАНШЕТ из колоды (решение дизайнера
  # 15.09.2026). В наборе 3.0.0 карт десять, в партии участвуют восемь —
  # каждая партия собирается из другого набора. Это же число и предел длины
  # партии: кончились карты рынка — партия кончилась. Хотите короче — кладите
  # меньше карт. 0 — берётся вся колода.
  deck_size: 8
  # НУЛЕВАЯ СТУПЕНЬ ОБМЕНА (решение дизайнера 23.09.2026). Иконографика
  # планшета рынка: −0 / −1 / −2 келемия дают +1 / +3 / +7 монет. Рынок без
  # сданного келемия приносит 1 монету — вход в цикл «монеты → добытчики →
  # келемий → монеты» для игрока, у которого нет ничего.
  zero_kelium_coin: 1
  cell_cost_kelium: 1
  # СКИДКА ЗА ПАРУ (правило дизайнера 13.08.2026): келемий, сданный СРАЗУ ПАРОЙ,
  # идёт по лучшему курсу — за каждую полную пару +1 монета. С курсом 2 это
  # 1 кел -> 2 мон, 2 кел разом -> 5 мон. Ключ читают и движок, и проигрыватель.
  pair_bonus_coin: 1
  # ДВА ОБМЕНА НА ПЛАНШЕТЕ (заказ дизайнера 02.09.2026): келемий на деньги и
  # келемий на карты заданий. Боеприпасы и установка келемия на ячейку энергии
  # с планшета УБРАНЫ; установка переехала левым предложением на карту рынка.
  # КУРС ВЕРНУЛИ (решение дизайнера 18.09.2026): «давать снова +3/+7 монет за
  # келемий». Снижение до 2/5, сделанное накануне, отменено. Причина — та же,
  # по которой курс вообще трогали, только с другой стороны: келемий выходит
  # ровно в одну дверь, на Рынок, и если ещё и дверь узкая, копить его незачем.
  #
  # ЗАДАНИЯ БЕРУТСЯ С ВЫБОРОМ (там же): за келемий игрок тянет ДВЕ карты, одну
  # оставляет, вторую сбрасывает. Прежде обе уходили в руку — обмен давал
  # и выбор, и запас разом; теперь только выбор.
  base_exchanges:
    - {id: kelium_to_coin,      per_kelium_coin: 3}     # 1 кел -> 3 мон, пара -> 7
    - {id: kelium_to_objective, per_kelium_cards: 2, keep_cards: 1}

# ----------------------------------------------------------------------------
#  End-of-round Return step
# ----------------------------------------------------------------------------
return_step:
  # DESIGNER CHANGE: end-of-round trophy->upgrade exchange REMOVED.
  trophy_to_upgrade_exchange_enabled: false
  return_destroyed_tokens: true
  refill_objectives_to_limit: true
  # ИКОНКА ТРОФЕЯ ОТМЕНЕНА (дизайнер, 13.09.2026): «иконки трофея на рубашке
  # свалки нет, и правила „1 кубик каждый раунд“ нет». Трофеи в Возвращении
  # даёт только сам жетон, оставшийся на свалке, — по одному кубику за жетон.
  # Прежняя единица (решение 05.09.2026) приносила кубик САМА ПО СЕБЕ, каждый
  # раунд и без всякого жетона; глава 5 книги её не знает.
  trophy_icon_income: 0

# ----------------------------------------------------------------------------
#  Contested cards (backlog E12/E13/E14) — legal only if toggled on.
# ----------------------------------------------------------------------------
contested_cards:
  # E12/E13 РЕШЕНЫ 18.08.2026 — см. meta.based_on выше. E14 (инициатива в
  # бою) остаётся открытым, его никто не разбирал в этом заходе.
  energy_without_source_enabled: true
  effect_survives_round_enabled: true
  attack_first_initiative_enabled: false

# ----------------------------------------------------------------------------
#  Command center
# ----------------------------------------------------------------------------
command_center:
  # DESIGNER-CONFIRMED 2026-08-11: CU has 3 HP (boards) and gives NO trophy
  # points — it never enters trophy space. Destroying a CU: the attacker takes
  # the OWNER's CU-destruction token (permanent 3 VP); the owner immediately
  # takes the CU back to reserve and gains 2 containers (printed on the token's
  # back). One token per player; a player's OWN token also scores 3 VP at game
  # end if their CU was never destroyed. WIN CHECK on every CU kill: if the
  # attacker ALREADY holds any FOREIGN destruction token — instant military win
  # (kill count is irrelevant; holding the token is what matters).
  # ЗАКАЗ 25.08.2026: ЦУ В ЗАПАСЕ ОБЯЗАН ВЕРНУТЬСЯ НА ПОЛЕ. Держишь ЦУ в
  # запасе — в свой ход тратишь СПЕЦ-действие и ставишь его куда угодно на
  # свободные секторы, игнорируя правила стройки. Поставить его можно и обычной
  # Стройкой — тогда спец-действие не сгорает.
  must_replace_cu_with_spec: true
  # ЦУ ОТСТРАИВАЕТСЯ И СТРОЙКОЙ (дизайнер, 14.09.2026): вернувшееся в запас
  # ЦУ владелец ставит на поле спец-действием — бесплатно, на свободные
  # сектора любого гекса — ИЛИ обычной Стройкой за build_price_coins.
  # Прежнее false осталось от рулбука §8.3 (07.09.2026) и расходилось
  # и с решением, и с движком: Actions предлагает ЦУ из запаса за монеты,
  # а этот ключ читал только справочник проигрывателя — и врал в нём.
  cu_buildable_by_build_action: true
  # ЗАГЛУШКА НА СТАРТЕ (правило дизайнера 25.08.2026). Жетон двусторонний, и у
  # каждой стороны своё имя (решение 16.09.2026):
  #   лицо — ПУСТОЙ МОДУЛЬ БОЯ: тёмный жетон размером с красный модуль атаки,
  #     лежит на ячейке атаки и закрывает её — род с ним бьёт только оставшейся
  #     атакой;
  #   оборот — ЖЕТОН УНИЧТОЖЕНИЯ ЦУ: 3 победных очка тому, кто снёс чужое ЦУ.
  # Забранный жетон кладут В ЗАПАС рядом с собой, а не на свой планшет: он
  # больше ничего не закрывает. Прежнее имя «модуль блокировки боя» не
  # употребляется нигде.
  # В подготовку жетоны мешают лицом вниз, каждый берёт один наугад.
  #
  # БЕЗ ЭТОГО КЛЮЧА ЗАМЕР МЕРИТ НЕСУЩЕСТВУЮЩУЮ ИГРУ: у каждого игрока с первого
  # раунда одна ячейка атаки закрыта, и вопрос «куда класть модуль» без этого
  # решается не про ту раскладку.
  destruction_token_seals_cell: true
  destruction_token_vp: 3
  # ЖЕТОН УНИЧТОЖЕНИЯ ЦУ ДВУСТОРОННИЙ, НО ОЧКИ ДАЁТ ТОЛЬКО ОБОРОТ:
  #   лицом на своём планшете войск — 0 ПО: он там закрывает ячейку атаки,
  #     то есть мешает, и платить за помеху не за что;
  #   перевёрнутый у того, кто снёс чужое ЦУ, — 3 ПО.
  # СВОЙ ЖЕТОН ОЧКОВ НЕ ДАЁТ (дизайнер, 11.09.2026). Очки печатаются только на
  # ОБОРОТЕ: 3 ПО тому, кто забрал жетон, снеся чужое ЦУ, и перевернул его.
  own_token_vp_if_cu_never_destroyed: 0
  respawns: true
  returns_to_reserve: true                # владелец немедленно забирает ЦУ в запас (не авто-отстройка);
                                          # отстраивается обычной Стройкой, как любое военное здание
  military_win_on_second_cu_kill: true    # реализация: победа = уничтожил ЦУ, уже держа чужой жетон
  owner_compensation_containers: 2        # 2 containers to the CU's owner (printed on token back)
  # ОТСТРОЙКА ЦУ ИЗ ЗАПАСА — БЕСПЛАТНО (решение дизайнера 16.08.2026; вопрос
  # закрыт). Уничтоженное ЦУ возвращается в игру даром и ставится на ЛЮБОЙ гекс
  # поля, даже туда, где игрок строить не может: иначе тот, чья зона стройки
  # держалась на самом ЦУ, после сноса не смог бы поставить его вообще.
  # Перенос уже стоящего ЦУ — обычная монета, как у любого здания.
  build_price_coins: 0

# Компенсация контейнерами владельцу за уничтоженные здания
# (решение дизайнера 2026-08-11; ЦУ — см. command_center выше)
building_compensation_containers:
  barracks: 1
  factory: 1
  airbase: 1
  miner_by_level: [1, 0, 1, 0]            # №1..№4
  power_station_by_level: [1, 0, 1, 0]    # №1..№4

# ----------------------------------------------------------------------------
#  Content versions this ruleset expects (separate versioned files).
# ----------------------------------------------------------------------------

# ============================================================================
#  СВОД 1.18.0 (от 1.17.0) — СЕМЬ НОВЫХ ЗАДАНИЙ НА НЕПРЕРЫВНОЕ СОСЕДСТВО
# ============================================================================
#  Заказ дизайнера 19.08.2026 и пункт 6 заказа от 13.08.2026.
#
#  Меняется ровно одно: objectives 1.8.0 -> 1.9.0. Замер на 300 партиях показал,
#  что карт на непрерывное соседство в колоде было ЧЕТЫРЕ, и две из них (o50
#  «Линия фронта», o54 «Заслон») не выполнились НИ РАЗУ — подвид существовал
#  формально. В 1.9.0 их семь новых плюс o55, которой наконец дали класс с
#  близостью.
#
#  ГЛАВНОЕ ОТЛИЧИЕ НОВЫХ ОТ ПРОВАЛИВШИХСЯ: базовое требование КОРОТКОЕ (два
#  соседних гекса нужного вида уже закрывают карту), трудность вынесена в
#  усиление. У o50 и o54 длинную цепь просило само базовое требование, поэтому
#  они были невыполнимы с начала партии.
# ============================================================================

content_versions:
  # ЭТАЛОННЫЙ НАБОР БЛОКОВ, семейство 5.* (07.09.2026): пустых гексов
  # нет ни одного, расположение энергии и контейнеров у любой пары сторон
  # одного размера совпадает не больше чем на одном гексе, И РАСПРЕДЕЛЕНИЕ
  # РАВНОМЕРНОЕ: секторы, места гексов и «что на гексе» разошлись с размахом
  # не больше единицы. Своды без этого ключа читают авторский 1.4.0.
  blocks: 5.0.0
  boards: 3.0.0                  # один планшет на всех, сторон «Б» нет
  scenarios: 1.0.0              # версия раскладок поля (независимо от досок)
  # 1.11.0 (25.08.2026): o39 «Сдача» починена — до этого была невыполнима.
  # 1.10.0 (21.08.2026): карта арсенала в награду 16 заданиям.
  # 1.18.0 (18.09.2026): занесена таблица дизайнера после онлайн-теста —
  # условия, усиления, утиль и обе награды. Утиль «движение 2 войсками»
  # заменён ПОЛНЫМ МАНЁВРОМ, «атака одним войском» — ПОЛНОЦЕННЫМ БОЕМ
  # (решение того же дня: половинчатые действия в утиле не работали).
  objectives: 1.18.0
  arsenal: 6.0.0                # АРСЕНАЛ 6.0 (14-15.09.2026): 40 карт; одно имя на один низ; шесть новых низов и утиль «три СПЕЦ-действия»
  containers: 6.0.0            # КОНТЕЙНЕРЫ 6.0 (10.09.2026): 14 лиц по экспорту дизайнера, 32 карты, без выбора и без разрядов; M/N - жетон из запаса на любой гекс без чужих войск
  market: 3.0.0                 # РЫНОК 3.0 (15.09.2026): 10 карт, на каждой ресурсное предложение и действенное; пометка «без ячейки» отменена
  orders: 4.0.0                 # 4.0 (24.09.2026): приказы Разместить / Приобрести / Контролировать / Исследовать, симметричные колоды
  super_objectives: 8.0.0       # 8.0 (14.09.2026): пара категорий счёта на карте, только победные очки
  super_arsenal: 2.0.0          # 2.0 (17.08.2026): у каждого супер-войска своя способность
  modules: 3.0.0                # полные наборы без масштаба по игрокам (20.08.2026)
  # symbols: НАБОРА БОЛЬШЕ НЕТ - символы с карт сняты (03.09.2026). Разметка
  # symbols.2.0.0.yaml оставлена в data/cards ради чтения записей старых партий.

# --- Супер-задания 2.0 (правило дизайнера 12.08.2026) ---
# ============================================================================
#  ДОПОЛНЕНИЯ — ТРИ НЕЗАВИСИМЫХ ТУМБЛЕРА (решение дизайнера 17.08.2026)
# ============================================================================
#  Прежде это был ОДИН режим на три значения (super | starters | none), то есть
#  супер задания и начальные задания исключали друг друга. Дизайнер это отменил:
#  включать можно и то и другое разом, каждое своим выключателем.
#
#  В проигрывателе им соответствует раздел «Дополнения» на ленте подготовки.
expansions:
  # СУПЕР ЗАДАНИЯ И СУПЕРОРУЖИЕ. Игроку раздаются карты проектов; вскрытая карта
  # даёт 3 ПО и жетон супероружия, а снятый до конца счётчик — победу.
  super_objectives: true
  # НАЧАЛЬНЫЕ ЗАДАНИЯ. Простые карты первого раунда для тех, кто садится впервые.
  starting_objectives: true
  # СУПЕР-АРСЕНАЛ. Карты на вершинах треков технологий. Выключен — вершина трека
  # даёт ещё один свой жетон: красный трек красный модуль, синий синий, зелёный
  # позолоту одного своего модуля (см. Actions.topPrizeWithoutSuperArsenal).
  super_arsenal: true

super_objectives:
  # СУПЕР-ЗАДАНИЯ 8.0 (правило дизайнера 14.09.2026): на карте ПАРА КАТЕГОРИЙ
  # счёта, и только они. Карту нельзя выполнить, сжечь или сбросить — она лежит
  # в руке до конца партии и платит очки за обе свои категории. Прежние
  # редакции (множитель верха и жёсткое требование низа с разовой наградой,
  # режимы solo5/solo6, раздача «две на выбор») отменены и вычищены из движка.
  enabled: true

# --- Контейнеры: хранение и открытие (правило 2026-08-10) ---
storage:
  # ТРИ ЯЧЕЙКИ ПОД ЖЕТОН МОДУЛЯ ХРАНИЛИЩА (решение дизайнера 19.09.2026).
  # Их стало три, потому что зелёный трек выдаёт жетон на каждой из первых
  # трёх ступеней; при двух ячейках третий жетон пропадал бы впустую.
  module_slots: 3

containers_storage:
  # Открытие контейнера = СПЕЦ-действие (было свободным).
  open_is_spec: true
  # ПРАВИЛО «открой всех одним СПЕЦ» ОТМЕНЕНО дизайнером 12.08.2026: на рубашке
  # контейнера и арсенала нарисована иконка спец-действия, и каждое вскрытие
  # стоит своего СПЕЦ. Ранее одно СПЕЦ открывало сколько угодно карт.
  mass_open: false
  # Ячейки под планшетом общие с арсеналом: каждая ячейка арсенала = 2 места
  # под контейнеры. Закрытая карта арсенала занимает ячейку целиком; открытая
  # (установленная) с container_slot даёт 1 место, без него — 0.
  arsenal_cells: 3
  slots_per_free_cell: 2
  slots_on_open_card_with_slot: 1

# ----------------------------------------------------------------------------
#  ПЕЧАТНЫЕ КОНТЕЙНЕРЫ — ДОРАБОТКА ПРАВИЛ ПОЛУЧЕНИЯ (диктовка 13.08.2026).
#
#  Причина: замер показал, что печатные ячейки дают в 5 раз больше контейнеров,
#  чем прежние жетоны (79.6 против 16.4 за партию) и +2.7 ПО на игрока — то есть
#  печатный контейнер работает как бесконечный кран.
#
#  Доработка:
#    · контейнер достаётся, ТОЛЬКО ЕСЛИ на гексе нет вообще никаких жетонов
#      игроков (ни своих, ни чужих) — как при выкладывании карт, но без фиддлинга;
#    · забирать можно И стройкой, И движением на ячейку (как было);
#    · для войска добавочное условие: до начала своего движения оно не стояло на
#      ячейке с печатным контейнером (правило маятника, как было).
# ----------------------------------------------------------------------------
containers:
  # НАКРЫТИЕ ЗА ДЕЙСТВИЕ (решение дизайнера 23.09.2026). Контейнер получает
  # игрок, если ячейка с контейнером была ОТКРЫТА до начала его действия и
  # ЗАКРЫТА его жетоном (войском или зданием) в конце действия. Дёргания
  # жетонов внутри действия не считаются. Прежние исключения (вышел из здания,
  # стоял на другом контейнере) отменены: сошёл с контейнера и накрыл другой —
  # получил. Войска во время Стройки не двигают — только в Движении.
  cover_by_action: true
  # ДОБЫЧА ПО ВЫРАБОТКЕ (там же): добытчик берёт открытый контейнер только
  # со своего гекса — столько, сколько он добывает келемия (1 или 2).
  miner_by_yield: true
  mode: printed
  printed_requires_empty_hex: true
  # ДОБЫЧА КОНТЕЙНЕРА — правило дизайнера 12.08.2026, ВОЗВРАЩЁННОЕ 18.09.2026:
  # добытчик берёт ОТКРЫТЫЙ контейнер со своего гекса, а если своего нет —
  # с любого гекса, к которому стоит стенкой. Сектор контейнера не смотрят.
  # 16.09.2026 правило было сужено («контейнер на секторе, СОСЕДНЕМ с сектором
  # добытчика, и не воздушном»), и онлайн-тест 18.09.2026 это отменил: дизайнер
  # словами — «отмена была зря, старая версия правила будет лучше». Узкое
  # правило гоняло добытчик по секторам ради карты, а не ради позиции.
  # Сторож: engine ДобычаКонтейнераTest.
  mining_needs_adjacent_sector: false
  # Воздушная ячейка Добычей берётся наравне с наземными: отдельного запрета
  # больше нет, «видно и не накрыто» — единственное условие.
  mining_air_cell: true
