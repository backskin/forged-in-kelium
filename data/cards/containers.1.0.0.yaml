# CONTENT: containers  version 1.0.0
# 32 cards, each offers a CHOICE of 2 variants (a/b). Encoded from
# "Карты/Контейнеры — 32 карты с выбором.md". Each variant = {effect, params, label}.
# Effect ids resolve in forge/engine/effects.py. Variants whose effect isn't
# mechanized yet use effect: noop (recorded, no state change) so the card is
# still legal and the bot can still pick the other variant.
# Calibration: coin 1u, ammo 1.5u, objective card 2u, trophy 1u, kelium 3u.
meta:
  id: 1.0.0
  type: containers

