  - {id: yellow_acq,   deck: yellow, top: acquisitions,    bottom: infrastructure, maneuver: true, описание: "Приказ ПРИОБРЕТЕНИЯ: торгуйте на рынке и двигайтесь по трекам науки. Следующим кругом жёлтый цикл замкнётся ИНФРАСТРУКТУРОЙ — закупленное пойдёт в стройку. На карте есть плашка манёвра."}
  - {id: yellow_oper,  deck: yellow, top: operation,       bottom: operation,     maneuver: false, описание: "Штаб командует: ОПЕРАЦИЯ — двигайте войска выбранным гексом и атакуйте соседний гекс. Этот приказ — зеркало для себя самого: следующим кругом он снова станет ОПЕРАЦИЕЙ, фронт не даёт передышки. Плашки манёвра на карте нет."}
