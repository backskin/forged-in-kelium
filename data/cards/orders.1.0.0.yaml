  - {id: green_dev,   deck: green, top: development,     bottom: acquisitions,   maneuver: false, описание: "Штаб отдаёт РАЗРАБОТКУ: собирайте войска, боеприпасы, качайте келемий и берите контейнеры. Следующим кругом карта обернётся ПРИОБРЕТЕНИЯМИ — добытое сразу несите на рынок и в науку. Плашки манёвра здесь нет."}
  - {id: green_acq,   deck: green, top: acquisitions,    bottom: development,    maneuver: true, описание: "Приказ ПРИОБРЕТЕНИЯ: торгуйте на рынке, продвигайтесь по трекам науки. Зелёный цикл замкнётся и вернёт карту в РАЗРАБОТКУ — купленное топливо сразу пойдёт в производство. На карте есть плашка манёвра: одно спец-действие между сделками."}
  # Yellow deck (И→Р · Р→П · П→И, О→О) — triple cycle + operation mirror
