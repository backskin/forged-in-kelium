# CONTENT: orders  version 1.0.0
# Order cards: 16 (4 decks x 4) + 4 SECURITY jokers.
# top/bottom in {development, infrastructure, operation, acquisitions}.
# maneuver: has the SPEC maneuver plate (true on the 8 cards whose top is
# infrastructure or acquisitions).
# Source: "Карты/Карты приказов — полная таблица.md".
meta:
  id: 1.0.0
  type: orders
orders:
  # Blue deck (И→Р · Р→О · О→П · П→И) — cycle forward
  - {id: blue_infra,  deck: blue, top: infrastructure, bottom: development,   maneuver: true, описание: "Штаб приказывает: сейчас ИНФРАСТРУКТУРА — стройте, переносите и сносите здания, разводите энергию по гексам. Как только кто-то из соперников вскроет тот же приказ, карта развернётся в РАЗРАБОТКУ — готовьте сборочные линии заранее. На карте отмечена плашка манёвра: спец-действие держите наготове, пока держите оборону."}
  - {id: blue_dev,    deck: blue, top: development,     bottom: operation,    maneuver: false, описание: "Приказ штаба: РАЗРАБОТКА — собирайте войска и боеприпасы, качайте келемий с грядки. Следующим кругом карта обернётся ОПЕРАЦИЕЙ: готовые расчёты сразу пойдут в движение и бой. Плашки манёвра на этой карте нет — только чистая работа заводов."}
  - {id: blue_oper,   deck: blue, top: operation,       bottom: acquisitions, maneuver: false, описание: "Штаб отдаёт ОПЕРАЦИЮ: двигайте роты выбранным гексом и бейте по соседнему. Следующим шагом карта обернётся ПРИОБРЕТЕНИЯМИ — трофеи войны сразу конвертируются в рынок и науку. Манёвра карта не несёт: только марш и удар."}
  - {id: blue_acq,    deck: blue, top: acquisitions,    bottom: infrastructure, maneuver: true, описание: "Приказ ПРИОБРЕТЕНИЯ: торгуйте на рынке и двигайтесь по трекам науки. Следом карта замкнёт голубой цикл и обернётся ИНФРАСТРУКТУРОЙ — закупленное сразу пойдёт в стройку. На карте есть плашка манёвра: спец-действие доступно между сделками."}
  # Scarlet deck (И→П · П→О · О→Р · Р→И) — same cycle reversed
  - {id: red_infra,   deck: scarlet, top: infrastructure, bottom: acquisitions, maneuver: true, описание: "Алая колода приказывает: ИНФРАСТРУКТУРА — стройте, сносите, переносите здания, перераспределяйте энергию. Дальше этот приказ обернётся ПРИОБРЕТЕНИЯМИ: отстроенное подкрепляйте рынком и наукой. На карте есть плашка манёвра — спец-действие в резерве."}
  - {id: red_acq,     deck: scarlet, top: acquisitions,    bottom: operation,    maneuver: true, описание: "Приказ ПРИОБРЕТЕНИЯ: торгуйте на рынке, продвигайте фишки по трекам науки. Следующим кругом карта развернётся ОПЕРАЦИЕЙ — купленное и добытое сразу идёт в дело, в марш и в бой. Плашка манёвра на карте есть: держите спец-действие под рукой."}
  - {id: red_oper,    deck: scarlet, top: operation,       bottom: development,  maneuver: false, описание: "Штаб командует: ОПЕРАЦИЯ — двигайте войска выбранным гексом и атакуйте соседний. Дальше приказ обернётся РАЗРАБОТКОЙ: после боя заводы и добытчики восполнят потери. Манёвра на этой карте нет."}
  - {id: red_dev,     deck: scarlet, top: development,     bottom: infrastructure, maneuver: false, описание: "Приказ РАЗРАБОТКА: собирайте войска и боеприпасы, качайте келемий с грядки или контейнер с гекса. Следующим кругом карта замкнёт алый цикл и станет ИНФРАСТРУКТУРОЙ — произведённое пойдёт в стройку. Плашки манёвра здесь нет: только конвейер."}
  # Green deck (И↔О · Р↔П) — double swap
  - {id: green_infra, deck: green, top: infrastructure, bottom: operation,      maneuver: true, описание: "Зелёная колода приказывает: ИНФРАСТРУКТУРА — стройте и сносите здания, разводите энергию. Следующий круг перевернёт приказ в ОПЕРАЦИЮ — отстроенные казармы и заводы сразу шлют войска в бой. На карте есть плашка манёвра."}
