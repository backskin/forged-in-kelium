# CONTENT: orders  version 2.0.0
# ============================================================================
#  ТРИ СПЕЦ-ПЛАШКИ ВМЕСТО ОДНОЙ (решение дизайнера 07.09.2026,
#  итоговая раскладка — 08.09.2026)
# ============================================================================
#  Было: плашка манёвра на восьми картах из шестнадцати, и всегда одна и та же
#  — перемещение одним жетоном. Стало: плашка на ДВЕНАДЦАТИ картах, но трёх
#  разных видов, и у каждой фракции свой набор — как у нижних приказов.
#
#    movement   ДВИЖЕНИЕ — перемести один свой жетон на его скорость
#    coin       МОНЕТА   — возьми 1 монету
#    objective  ЗАДАНИЕ  — возьми 1 карту задания
#
#  Перемещений при этом стало ВЧЕТВЕРО меньше: четыре на игру вместо восьми.
#  Спец перестал быть «почти всегда лишний шаг войском» и стал признаком
#  фракции.
#
#  СЛОВА ПОМЕНЯЛИСЬ МЕСТАМИ. Действие приказа НАСТУПЛЕНИЕ теперь называется
#  МАНЁВР (было Движение), а спец-плашка — ДВИЖЕНИЕ (была «манёвр с карты
#  приказа»). Переименуй только действие — и плашка столкнулась бы с ним ровно
#  так же, как приказ НАСТУПЛЕНИЕ столкнулся с операциями Стройки днём раньше.
#
#  РАСКЛАДКА — ЛАТИНСКИЙ КВАДРАТ 4×4. Итоговый лист дизайнера читается сразу в
#  двух направлениях:
#
#            │ ИНФРАСТР.  РАЗРАБ.    ПРИОБРЕТ.  НАСТУПЛЕНИЕ
#    ────────┼──────────────────────────────────────────
#    Голубая │ ЗАДАНИЕ    —          МОНЕТА     ДВИЖЕНИЕ
#    Алая    │ ДВИЖЕНИЕ   МОНЕТА     —          ЗАДАНИЕ
#    Зелёная │ МОНЕТА     ЗАДАНИЕ    ДВИЖЕНИЕ   —
#    Жёлтая  │ —          ДВИЖЕНИЕ   ЗАДАНИЕ    МОНЕТА
#
#  По СТРОКЕ: у каждой фракции ровно один спец каждого вида и ровно одна карта
#  без плашки. По СТОЛБЦУ: на каждом верхнем приказе все четыре варианта
#  встречаются по разу — какой бы приказ ни вскрыли, спец за ним у каждого
#  игрока свой. Это и есть весь закон раскладки: ни одного исключения, ни
#  одного «кроме».
#
#  Прежний черновик держался другого правила — «спец не кормит собственный
#  верхний приказ» (движение не к НАСТУПЛЕНИЮ, монета не к ИНФРАСТРУКТУРЕ и
#  РАЗРАБОТКЕ, задание не к ПРИОБРЕТЕНИЯМ). Квадрат такого запрета не
#  выдерживает: он требует все четыре варианта в каждом столбце, включая
#  «неудобный». Четыре клетки квадрата запрет нарушают сознательно — голубая
#  НАСТУПЛЕНИЕ + ДВИЖЕНИЕ, алая РАЗРАБОТКА + МОНЕТА, зелёная ИНФРАСТРУКТУРА +
#  МОНЕТА, жёлтые ПРИОБРЕТЕНИЯ + ЗАДАНИЕ. Симметрия квадрата дороже: запрет
#  экономил игроку полшага, а квадрат делает раскладку запоминаемой без
#  подглядывания в приложение.
#
#  У ГОЛУБОЙ КОЛОДЫ ПОМЕНЯЛСЯ И ЦИКЛ НИЗОВ: было И→Р→О→П→И, стало И→Р→П→О→И.
#  Остальные три колоды свои циклы сохранили.
#
#  Ключ maneuver в этом наборе не используется: его читают своды со старым
#  набором orders 1.0.0, и там всё играется как играло.
