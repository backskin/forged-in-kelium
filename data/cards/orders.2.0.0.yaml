# CONTENT: orders  version 2.0.0
# ============================================================================
#  ТРИ СПЕЦ-ПЛАШКИ ВМЕСТО ОДНОЙ (решение дизайнера 07.09.2026)
# ============================================================================
#  Было: плашка манёвра на восьми картах из шестнадцати, и всегда одна и та же
#  — перемещение одним жетоном. Стало: плашка на ДВЕНАДЦАТИ картах, но трёх
#  разных видов, и у каждой фракции свой набор — как у нижних приказов.
#
#    movement   ДВИЖЕНИЕ — перемести один свой жетон на его скорость
#    coin       МОНЕТА   — возьми 1 монету
#    objective  ЗАДАНИЕ  — возьми 1 карту задания
#
#  Перемещений при этом стало ВЧЕТВЕРО меньше: четыре на игру вместо восьми.
#  Спец перестал быть «почти всегда лишний шаг войском» и стал признаком
#  фракции.
#
#  СЛОВА ПОМЕНЯЛИСЬ МЕСТАМИ. Действие приказа ОПЕРАЦИЯ теперь называется
#  МАНЁВР (было Движение), а спец-плашка — ДВИЖЕНИЕ (была «манёвр с карты
#  приказа»). Переименуй только действие — и плашка столкнулась бы с ним ровно
#  так же, как приказ ОПЕРАЦИЯ столкнулся с операциями Стройки днём раньше.
#
#  ПРАВИЛО РАСКЛАДКИ, ОДНО НА ВСЕ ШЕСТНАДЦАТЬ КАРТ:
#    спец на карте НЕ КОРМИТ ЕЁ СОБСТВЕННЫЙ ВЕРХНИЙ ПРИКАЗ.
#  Отсюда: движение не идёт на карту с верхом operation (там и так Манёвр и
#  Бой), монета — на infrastructure и development (там её тратят; семьи
#  ресурсов те же, что в наградах заданий), задание — на acquisitions (Рынок
#  задания и выдаёт).
#
#  Раскладка не подобрана на глаз, а найдена перебором по трём условиям сразу:
#  правило выше соблюдено везде; карта БЕЗ спеца у каждой фракции стоит на
#  своём приказе (голубая — infrastructure, алая — acquisitions, зелёная —
#  operation, жёлтая — development); каждый спец разбросан по разным приказам
#  настолько, насколько запреты позволяют (движение на трёх, задание на трёх,
#  монета на двух — шире ей не дают запреты).
#
#  Ключ maneuver в этом наборе не используется: его читают своды со старым
#  набором orders 1.0.0, и там всё играется как играло.
