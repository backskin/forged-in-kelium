# CONTENT: symbols  version 1.0.0
#
# СИМВОЛЫ СУПЕР ЗАДАНИЙ (правило «Супер задания 2.0», 12.08.2026).
# Четыре формы печатаются мелко в углу карты: круг, квадрат, треугольник,
# песочные часы. Символ нужен, чтобы ВЫПОЛНИТЬ вторую часть супер задания:
# игрок подсовывает карты под планшет войск и вскрывает их СПЕЦ-действиями.
#
# Почему отдельный файл, а не поле в arsenal/containers: символ — это разметка
# ПОД МОДУЛЬ супер заданий, и она должна настраиваться (и выключаться) не задевая
# сами карты. Играя без супер заданий, этот файл просто не читают.
#
# РАСКЛАД (числа приняты дизайнером 12.08.2026):
#   арсенал  — все 24 ОБЫЧНЫЕ карты, ровно по 6 на форму. Стартовые (as1-as8) и
#              супер-арсенал символов НЕ несут: иначе старт неравный.
#   контейнеры — 12 карт из 32, ровно по 3 на форму. Остальные 20 без символа,
#              чтобы выбор «взять бонус ИЛИ оставить символ» был событием, а не
#              налогом на каждый контейнер.
meta:
  id: 1.0.0
  type: symbols

forms:
  - {id: circle,    name: "круг",           glyph: "●"}
  - {id: square,    name: "квадрат",        glyph: "■"}
  - {id: triangle,  name: "треугольник",    glyph: "▲"}
  - {id: hourglass, name: "песочные часы",  glyph: "⧗"}

# 24 обычные карты арсенала: по 6 на форму, вразбивку по номерам, чтобы в колоде
# формы шли неравномерно и подбор символа не сводился к «тяни соседние номера».
arsenal:
  circle:    [a01, a05, a09, a13, a17, a21]
  square:    [a02, a06, a10, a14, a18, a22]
  triangle:  [a03, a07, a11, a15, a19, a23]
  hourglass: [a04, a08, a12, a16, a20, a24]

# 12 контейнеров из 32: по 3 на форму. Выбраны из РАЗНЫХ ярусов (common/редкие),
# чтобы символ не липнул к слабым или к сильным бонусам — иначе выбор «бонус или
# символ» был бы предрешён ценой бонуса.
containers:
  circle:    [c01, c13, c25]
  square:    [c04, c16, c28]
  triangle:  [c07, c19, c30]
  hourglass: [c10, c22, c32]
