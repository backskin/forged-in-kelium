# CONTENT: arsenal  version 1.3.0
# ============================================================================
#  НОВЫЙ АРСЕНАЛ по списку дизайнера (12–13.08.2026).
# ============================================================================
#  Что изменилось против 1.2.0:
#   * низы (пассивки и СПЕЦ) взяты из списка дизайнера и переведены на РЕЕСТР
#     СПОСОБНОСТЕЙ (engine/ability): у каждой объявлена точка правил, поэтому
#     мёртвая пассивка невозможна по построению — тест валится, если точку никто
#     не спрашивает;
#   * верхи (утиль) — из списка утиль-эффектов дизайнера: они одноразовые и
#     работают через реестр эффектов (Effects), то есть живые уже сейчас;
#   * ПРАВИЛО ДИЗАЙНЕРА: нельзя держать ОТКРЫТЫМИ две одинаковые технологии.
#     Поэтому карты-двойники различаются утилем, а не низом.
#
#  ВАЖНО про отбор: карта с нереализованным низом ИЗЫМАЕТСЯ из колоды на
#  подготовке (громко, в stderr). Поэтому здесь только те низы, чьи способности
#  зарегистрированы и чьи точки правил движок спрашивает. Остальные карты из
#  списка дизайнера ждут своих точек — они перечислены в конце файла
#  комментарием, чтобы список не потерялся.
#
#  Формат карты:
#   top:    {effect, params, label}     — утиль (сжечь карту)
#   bottom: {kind: POST|SPEC, passive: <id способности>, label}
# ============================================================================
meta:
  id: 1.3.0
  type: arsenal

