# ============================================================================
#  ЖДУТ СВОИХ ТОЧЕК ПРАВИЛ (список дизайнера, ещё не подключено в движке)
# ============================================================================
#  Эти карты НЕ включены в колоду, потому что их низы движок пока не спрашивает,
#  и карта была бы изъята на подготовке — то есть игрок платил бы за пустышку:
#
#   * «два СПЕЦ вместо одного, если не играл Безопасность»  (ORDER_SPEC_COUNT)
#   * «нижний приказ даёт два действия при совпадении»       (ORDER_BOTTOM_ACTIONS)
#   * «игнорировать блокировку приказа, сжигая келемий»      (ORDER_BLOCK_BYPASS)
#   * «войско сразу на построенное здание за монету»         (BUILD_UNIT_WITH_BUILDING)
#   * «бесплатный перенос здания на гекс со своим войском»   (BUILD_FREE_MOVE_BUILDING)
#   * «монетой закрывать недостающую энергию в Сборке»       (ASSEMBLY_PAY_ENERGY_WITH_COIN)
#   * «держать трофейные кубики на складе»                   (STORAGE_HOLDS_TROPHY)
#   * «добавить тайл малого зарождения на поле»              (FIELD_ADD_SPAWN_TILE)
#   * «ядерный удар: гекс становится запретным»              (FIELD_FORBID_HEX)
#   * «пехота +1 прочность до конца раунда»                  (TOKEN_HP)
#   * «забрать чужой жетон с гекса своей пехоты»             (TOKEN_RETURN_TO_RESERVE)
#   * «вернуть свои жетоны из чужих трофеев за ресурс»       (TOKEN_RETURN_TO_RESERVE)
#   * «новые источники и правки победных очков»              (SCORING_VP_SOURCE / MODIFIER)
#
#  Порядок подключения выбирается по замеру: сперва то, что чинит измеренную
#  дыру (энергия, досягаемость до ЦУ), потом остальное.
