# CONTENT: containers  version 6.0.0
# ============================================================================
#  КОНТЕЙНЕРЫ 6.0 - КОЛОДА ПО ЭКСПОРТУ ДИЗАЙНЕРА (состав от 10.09.2026)
# ============================================================================
#  Арт: «Общие компоненты/экспорт-контейнеры», файлы контейнеры-new-1…15
#  (402×402), пятнадцатый - рубашка. Чтение карт и ответы дизайнера на все
#  спорные места - docs/ЧТЕНИЕ - контейнеры по экспорту (09.09.2026).md.
#
#  На печатной карте нет ни названия, ни текста: в левом верхнем углу БУКВА
#  лица, в правом верхнем - сколько таких карт в колоде, внизу два значка.
#  Здесь ровно то же: одна запись на лицо, поле face - буква, поле copies -
#  число карт. Колода собирается из copies копий каждого лица (Deck.
#  cullForPlayers), итого 14 лиц и 32 карты.
#
#  ЗНАЧКИ ВНИЗУ КАРТЫ (ответ дизайнера 10.09.2026):
#    кружок с ▶      - значок СПЕЦ-действия, он такой везде в игре: контейнер
#                      вскрывается СПЕЦ-действием (containers_storage.open_is_spec);
#    зачёркнутый ящик - после вскрытия контейнер уходит в сброс.
#  Тёмный кубик с шестерёнкой на лице E - ТРОФЕЙ. Карта арсенала на лице L -
#  ОБЫЧНЫЙ арсенал, не супер.
#
#  НИ НА ОДНОМ ЛИЦЕ НЕТ ВЫБОРА «ИЛИ» - это принципиально: дизайнер требовал
#  заменить контейнеры с выбором безвыборными. Стороны b нет ни у одной карты.
#  Разрядов common/good/rare тоже больше нет: на картах они не напечатаны.
#
#  ЖЕТОНЫ ТЕХНИКИ И ПЕХОТЫ (лица M и N) - найм ИЗ ЗАПАСА игрока, не сверх
#  него: «мы откуда возьмём ещё жетонов в настольной игре? тут картон и
#  дерево, тут всё конечно». Жетон ставится НА ЛЮБОЙ ГЕКС с оглядкой на
#  базовые правила: там не должно быть вражеских войск (effect landing,
#  where: any_free_hex). Пуст запас рода - карта ничего не даёт.
#
#  Номер 6.0.0, а не 5.0.0: набор 5.0.0 уже существовал (тупиковая ветка
#  августа 2026, снесена вместе с прочими прежними наборами), и замеры на нём
#  сыграны; версии наборов не переиспользуются.
#
#  СОСТАВ ЦЕЛИКОМ (лицо - что даёт - шт):
#    A монета 3 · B боеприпас 3 · D карта задания 3 · C келемий 3 · E трофей 3
#    F монета и боеприпас 3 · H карта задания и боеприпас 3
#    G карта задания и келемий 2 · I две карты задания 2 · J две монеты 2
#    K два боеприпаса 2 · L карта арсенала 1 · M жетон техники 1 · N жетон пехоты 1
#    7·3 + 4·2 + 3·1 = 32.
