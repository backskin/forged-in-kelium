# CONTENT: containers  version 7.0.0
# ============================================================================
#  КОНТЕЙНЕРЫ 7.0 — 36 КАРТ ПО РЕНДЕРУ ДИЗАЙНЕРА 13.10.2026 И УГОЛОК БОЯ
# ============================================================================
#  Арт: «Общие компоненты/рендер-контейнеры-36 (13.10.2026)», лист «контейнеры
#  36 — лист.png». Состав взят с рендера, а не из набора 6.0.0: тот собран по
#  экспорту 10.09 и с картинками расходится (буква A там была «1 монета», на
#  карте — «спрятанная наличность», две монеты).
#
#  УГОЛОК БОЯ — БРОСОК КУБИКА БЕЗ КУБИКА (решение дизайнера 23.10.2026).
#  Свои карты контейнеров тут ни при чём. Перед любой своей атакой игрок может
#  перевернуть ВЕРХНЮЮ карту колоды контейнеров и прочитать уголок:
#    +1     — атака стоит на 1 боеприпас меньше;
#    пусто  — ничего;
#    −1     — атака стоит на 1 боеприпас больше; заплатить нечем — ОСЕЧКА,
#             атаки нет. Минус можно закрыть келемием (свод 1.52.0), но
#             келемий — дорогой ресурс, и в этом цена риска.
#  Одна карта на атаку. Перевёрнутая карта уходит ПОД НИЗ колоды: кубик не
#  расходуется, и колода от бросков не прокручивается.
#
#  ТРЕТЬ НА ТРЕТЬ (дизайнер 23.10.2026): +1 на A, C, D, E; −1 на B, F, G, K —
#  все лица, где внутри боеприпасы («заряды сдетонировали»); пусто на H, I,
#  J, L, M, N. По 12 карт, в среднем бросок даёт ноль: это ставка на один
#  решающий выстрел, а не бесплатная добавка.
#
#  Поле `уголок_боя` — число с уголка: 1, 0 или −1.
#
#  ПЕЧАТНАЯ КАРТА: буква лица слева вверху, число копий справа вверху, внизу
#  значок СПЕЦ-действия (вскрывается спец-действием) и зачёркнутый ящик (после
#  вскрытия — в сброс). Выбора «или» нет ни на одном лице.
#
#  СОСТАВ (лицо — название — что даёт — шт — уголок):
#    A спрятанная наличность  2 монеты                    3  +1
#    B кассета зарядов        2 боеприпаса                3  −1
#    C проба кристаллов       1 келемий                   3  +1
#    D служебные донесения    1 монета и 1 карта задания  3  +1
#    E оплавленная обшивка    1 трофей                    3  +1
#    F оружейный подвес       1 монета и 1 боеприпас      3  −1
#    G штурмовой протокол     1 карта задания и 1 боеприпас 3 −1
#    H зонд-разведчик         1 карта задания и 1 келемий 2   0
#    I терминал связи         2 карты задания             2   0
#    J кредитный чип          3 монеты                    2   0
#    K батарея зарядов        3 боеприпаса                3  −1
#    L опытный образец        1 карта арсенала            2   0
#    M прототип БТР           жетон техники на любой гекс 2   0
#    N военная криокапсула    жетон пехоты на любой гекс  2   0
#    8·3 + 6·2 = 36.
