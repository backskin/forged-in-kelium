# CONTENT: containers  version 5.0.0
# ============================================================================
#  ТУПИКОВАЯ ВЕТКА - В ИГРЕ НЕ ИСПОЛЬЗУЕТСЯ (решение дизайнера 02.09.2026)
# ============================================================================
#  Набор вырос из 4.0.0 и в игру не попал: 01.09.2026 дизайнер продиктовал
#  ПОЛНУЮ замену состава, и она вышла набором 4.1.0 - его и берут своды.
#  Больший номер здесь ни о чём не говорит: действующий набор контейнеров -
#  4.1.0. Файл оставлен ради сыгранных на нём замеров, править его не нужно.
# ============================================================================
#  КОНТЕЙНЕРЫ 4.0 — ВОЗВРАТ К ОДНОМУ РЕСУРСУ БЕЗ ВЫБОРА (заказ дизайнера 18.08.2026)
# ============================================================================
#  Эталон — старая (докодовая) вёрстка контейнеров, приложенная дизайнером:
#  12 разных "форм" карты (какой ресурс или пара ресурсов напечатаны), БЕЗ
#  стороны выбора вообще — что напечатано, то и выдаётся сразу.
#
#  БАЛАНС (рассуждение дизайнера, см. чат 18.08.2026):
#  - Три "быстрых" ресурса (боеприпас/монета/обломок) поровну и чаще всего —
#    они взаимозаменяемы по значимости в основной экономике.
#  - Келемий реже: он и товар, и очки, раздавать его так же часто, как монету,
#    нельзя — иначе контейнер станет вторым источником очков в обход правил.
#  - Карты (задание/арсенал) реже сырья: это не ресурс, а card advantage,
#    и должно стоить дороже. Арсенал реже задания — арсенал напечатанно сильнее.
#  - ПУСТЫШЕК БОЛЬШЕ НЕТ (решение дизайнера 25.08.2026). Три карты «ничего» из
#    тридцати двух были налогом на вскрытие: контейнер и так открывают не каждый
#    ход, а девять процентов тяг уходили в никуда. Их место заняли ДВА обломочных
#    контейнера в «хороших» и ЕЩЁ ОДНА карта задания — то есть обломочных карт в
#    колоде стало шесть вместо четырёх, а карт задания в «хороших» пять вместо
#    четырёх. Число карт не изменилось: тридцать две.
#  - Джекпоты (2 задания, 2 монеты) — по одной карте на 32: подлинная редкость,
#    а не второй по частоте исход.
#  Курс для сверки (тот же, что в 1.2.0): монета 1, боеприпас 1, обломок 1.5,
#  карта задания 2, карта арсенала 2.5, келемий 1.5 (двойного назначения).
#  Средняя ценность колоды по этому курсу — около 1.5 на карту.
#
#  АРСЕНАЛЬНАЯ КАРТА — БЛИНД-ТЯГА ИЗ КОЛОДЫ (упрощение). Дизайнер описал
#  форму "как выбор с открытых, пустая ячейка заполняется новым" — то есть
#  взять карту с витрины арсенала, а не тянуть слепо из колоды. Этого эффекта
#  для контейнеров в движке ещё нет (Actions.java знает выбор с витрины
#  только для одного конкретного действия) — заведён отдельным пунктом
#  backlog, здесь временно effect: gain, params: {arsenal: 1} — то же самое,
#  что уже умеет карта задания (слепая тяга из колоды семейства).
#
#  БЕЗ ВЫБОРА ВООБЩЕ: только "a", "b" не заводится ни у одной карты — это
#  явное решение этой версии, не пропуск.
# ============================================================================
