# CONTENT: containers  version 5.0.0
# ==========================================================================
#  КОНТЕЙНЕРЫ 5.0 — НАБОР ДИЗАЙНЕРА ПО ЭКСПОРТУ «экспорт-контейнеры»
# ==========================================================================
#  Четырнадцать ЛИЦ, тридцать две карты. Лицо обозначено буквой в левом
#  верхнем углу печати, число в правом верхнем — сколько таких карт в
#  колоде. Здесь каждая карта записана отдельной строкой, а поле
#  `face` говорит, какую картинку показывать: карт с одним лицом
#  несколько, а печать у них одна.
#
#  НИ ОДНОГО ВЫБОРА. На всех лицах ровно одна награда: вскрыл —
#  получил. Прежние контейнеры с «или» отменены целиком.
#
#  СОСТАВ:
#    A  спрятанная наличность  3 шт — 1 монета
#    B  кассета зарядов        3 шт — 1 боеприпас
#    D  служебные донесения    3 шт — 1 карта задания
#    C  проба кристаллов       3 шт — 1 келемий
#    E  оплавленная обшивка    3 шт — 1 трофей
#    F  оружейный подвес       3 шт — 1 монета и 1 боеприпас
#    H  штурмовой протокол     3 шт — 1 карта задания и 1 боеприпас
#    G  зонд-разведчик         2 шт — 1 карта задания и 1 келемий
#    I  терминал связи         2 шт — 2 карты задания
#    J  кредитный чип          2 шт — 2 монеты
#    K  батарея зарядов        2 шт — 2 боеприпаса
#    L  опытный образец        1 шт — 1 карта арсенала
#    M  прототип БТР           1 шт — поставь жетон техники из запаса на любой гекс
#    N  военная криокапсула    1 шт — поставь жетон пехоты из запаса на любой гекс
