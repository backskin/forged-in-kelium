# CONTENT: super_objectives  version 5.0.0
# ============================================================================
#  СУПЕР-ЗАДАНИЯ 5.0 — «СУПЕРУТИЛЬ ИЛИ НАКОПИТЕЛЬ»
# ============================================================================
#  По черновику дизайнера 25.08.2026 (design-docs/ЧЕРНОВИК — супер-задания 5.0).
#  Каждому игроку в подготовку втайне раздаётся ОДНА карта. Сыграть можно
#  только одну половину:
#    СУПЕРУТИЛЬ — разовый эффект чудовищной силы, сжигается СПЕЦ-действием;
#    НАКОПИТЕЛЬ — очки в конце партии, если карта дожила нетронутой.
#  Прежняя конструкция (четыре ячейки, вскрытие, счётчик, жетон супероружия)
#  в этом режиме не действует. Механика и все эффекты — в движке (Super5).
#  Включение: super_objectives.mode: solo5 + content.super_objectives: 5.0.0.
meta:
  id: 5.0.0
super_objectives:
- id: s5_01
  name: Смотр войск
  stockpile: 2 ПО за каждый РАЗНЫЙ род войск у тебя на поле. Потолок 8.
  burn: Найми бесплатно по одному жетону КАЖДОГО рода войск на свои гексы, без энергии и зданий.
- id: s5_02
  name: Дальний рубеж
  stockpile: 1 ПО за каждое своё войско на гексе, соседнем с чужим зданием. Потолок 5.
  burn: Перенеси любые свои войска на один гекс поля и сними с них весь урон.
- id: s5_03
  name: Раскинутая сеть
  stockpile: 1 ПО за каждый РАЗНЫЙ гекс, где стоит твоё здание. Потолок 6.
  burn: Построй три здания бесплатно, игнорируя энергию и зону стройки.
- id: s5_04
  name: Гарнизонная служба
  stockpile: 2 ПО за каждый гекс, где стоят одновременно твоё здание и твоё войско. Потолок 6.
  burn: Сыграй подряд ДВА полных приказа со своей руки, оба целиком.
- id: s5_05
  name: Архив штаба
  stockpile: 2 ПО за каждое выполненное задание сверх трёх. Потолок 6.
  burn: Возьми ВСЕ карты с витрины арсенала в руку и добери две карты задания.
- id: s5_06
  name: Оружейная палата
  stockpile: 2 ПО за каждую установленную карту арсенала сверх двух. Потолок 6.
  burn: Сожги любое число установленных у себя карт арсенала и получи все их утиль-эффекты разом.
- id: s5_07
  name: Золотая жила
  stockpile: 1 ПО за каждый келемий в твоём хранилище в конце партии. Потолок 5.
  burn: Обменяй весь свой келемий по курсу «за каждый — любое действие бесплатно, вне очереди».
- id: s5_08
  name: Первая линия
  stockpile: 2 ПО за каждый трек науки, где твоя фишка выше всех. Потолок 6.
  burn: Сделай четыре шага науки бесплатно, в любом порядке и по любым трекам.
- id: s5_09
  name: Трофейный обоз
  stockpile: 1 ПО за каждый уничтоженный тобой чужой жетон, пока твоё ЦУ ни разу не разрушено. Потолок 6.
  burn: Уничтожь любое чужое здание на поле без боя (кроме ЦУ) и забери его в трофеи.
- id: s5_10
  name: Штабная игра
  stockpile: 2 ПО за каждый раунд, в котором ты был первым игроком. Потолок 6.
  burn: Забери жетон первого игрока и немедленно сыграй один полный приказ, пока остальные ждут.
- id: s5_11
  name: Неприкосновенный запас
  stockpile: 2 ПО за каждое своё здание ПЕРВОГО уровня на поле в конце партии. Потолок 6.
  burn: Мгновенно подними два своих добытчика или энергостанции до четвёртого уровня.
- id: s5_12
  name: Тень штаба
  stockpile: 3 ПО, если твоё ЦУ ни разу не разрушено, плюс 1 ПО за каждого соперника, чьё ЦУ разрушали. Потолок 6.
  burn: Уничтожь СВОЙ жетон уничтожения ЦУ — он уходит из игры навсегда, и снос твоего ЦУ не даёт сопернику ничего.
