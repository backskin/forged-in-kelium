# CONTENT: arsenal  version 2.0.0
#
# МОДУЛЬ КОЛОДЫ АРСЕНАЛА 2.0 — первая партия карт из диктовки дизайнера
# (12–13.08.2026). Колода подключается версией правил
# (content_versions.arsenal), поэтому 1.2.0 и 2.0.0 сосуществуют: можно играть
# и сравнивать наборы, не ломая прежние замеры.
#
# ОБЪЁМ. Замер 150 партий вчетвером: игроки получают 7.7 карт арсенала за партию
# на стол (1.93 на игрока). Правило дизайнера «карт вдвое больше среднего» даёт
# ориентир 16 карт в модуле. Диктовка содержит заметно больше идей — они
# разложены по НЕСКОЛЬКИМ модулям (2.0.0, 2.1.0, …), а не в одну гигантскую
# колоду: так каждая карта реально встречается в партии.
#
# ПРАВИЛО МОДУЛЯ: нельзя держать в открытую (установленными) ДВЕ ОДИНАКОВЫЕ
# технологии. Поэтому копии одной пассивки различаются утиль-эффектом (верхом).
#
# ПОЛЯ КАРТЫ:
#   id · name — идентификатор и название
#   kind: regular | starting
#   top:    {effect, params, label} — УТИЛЬ: карта сжигается ради одноразового эффекта
#   bottom: {kind: POST|SPEC, passive, label} — пассивка, пока карта установлена
#   inert: true — эффект/пассивка ЗАПИСАНЫ, но движком ещё не исполняются;
#          такие карты Setup ИЗЫМАЕТ из колоды и громко сообщает об этом,
#          чтобы игрок не платил за карту-пустышку.
#   container_slot: true — на открытой карте нарисована ячейка под 1 контейнер
meta:
  id: 2.0.0
  type: arsenal

arsenal:
  # ==================== скорость и здоровье ====================
  - {id: b01, name: "Ускоренный марш", kind: regular,
     top: {effect: gain, params: {coin: 5}, label: "5 монет"},
     bottom: {kind: POST, passive: speed_plus1_ground,
              label: "+1 к скорости пехоте и технике"}, inert: true,
     описание: "Утиль сразу приносит 5 монет. Пока карта установлена, ваша пехота и техника получают +1 к скорости. Хороша для игрока, который делает ставку на быстрое передвижение войск по полю."}
  - {id: b02, name: "Форсаж", kind: regular,
     top: {effect: gain, params: {ammo: 3}, label: "3 боеприпаса"},
     bottom: {kind: POST, passive: speed_plus1_air_tower,
              label: "+1 к скорости авиации и вышкам"}, inert: true,
     описание: "Утиль сразу приносит 3 боеприпаса. Пока карта установлена, ваша авиация и вышки получают +1 к скорости. Подходит тому, кто строит игру на быстрых воздушных ударах."}
  - {id: b03, name: "Облегчённая броня", kind: regular,
     top: {effect: free_action, params: {action: movement}, label: "выполни Движение"},
     bottom: {kind: POST, passive: vehicle_fast_fragile,
