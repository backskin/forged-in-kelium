     описание: "Утиль сразу приносит 3 боеприпаса. Пока карта установлена, у вас на 1 ячейку боеприпаса больше, а спец-действием за 1 монету можно собрать боеприпасы с любого своего запитанного военного здания. На открытой карте нарисована ячейка под контейнер, так что она работает и на запас."}
