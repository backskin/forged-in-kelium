     описание: "Утиль даёт 3 монеты и боеприпас. Пока карта установлена, в этап Возврата один уничтоженный жетон на выбор остаётся на карте вместо возврата владельцу; лежавший там прежде уходит владельцу. Личный запас у каждого — по четыре жетона рода, поэтому задержанный жетон противник не сможет выставить заново. Плата за это — задержанный уничтоженный жетон не превращается в трофей."}
