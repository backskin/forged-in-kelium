     описание: "Утиль позволяет выполнить Стройку без расхода приказа. Пока карта установлена, вы можете строить на гексах, которые просто соседствуют с вашими зданиями, без обязательного примыкания стенкой. Освобождает застройку от тесной привязки к форме здания."}
