     описание: "Утиль позволяет выполнить Добычу без расхода приказа. Пока карта установлена, у вас на 1 ячейку келемия больше, а спец-действием за 1 монету можно провести добычу одним своим запитанным добытчиком. На открытой карте нарисована ячейка под контейнер — карта служит и хранилищем."}
  - {id: b06, name: "Ремонтная летучка", kind: regular,
