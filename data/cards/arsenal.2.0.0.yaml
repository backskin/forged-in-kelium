     bottom: {kind: SPEC, passive: kelium_cell_and_spec_mining,
              label: "+1 ячейка келемия; СПЕЦ: за 1 монету — добыча одним своим запитанным добытчиком"},
     описание: "Утиль позволяет выполнить Добычу без расхода приказа. Пока карта установлена, у вас на 1 ячейку келемия больше, а спец-действием за 1 монету можно провести добычу одним своим запитанным добытчиком. На открытой карте нарисована ячейка под контейнер — карта служит и хранилищем."}
  - {id: b06, name: "Ремонтная летучка", kind: regular,
     top: {effect: gain, params: {coin: 5}, label: "5 монет"},
     bottom: {kind: SPEC, passive: spec_heal_one_damage,
              label: "СПЕЦ: 1 боеприпас — снять кубик урона с любого своего жетона"},
    
     описание: "Утиль сразу приносит 5 монет. Пока карта установлена, спец-действием за 1 боеприпас можно снять кубик урона с любого своего жетона. Дешёвая и гибкая поддержка войск в затяжном бою."}
  - {id: b07, name: "Диспетчер энергии", kind: regular,
     top: {effect: free_action, params: {action: energy_swap},
           label: "выполни Смену энергии"},
     bottom: {kind: SPEC, passive: spec_move_energy_cube,
              label: "СПЕЦ: перемести 1 свой кубик энергии на любое своё здание"},
    
     описание: "Утиль позволяет выполнить Смену энергии без расхода приказа. Пока карта установлена, спец-действием можно переместить 1 свой кубик энергии на любое своё здание. Удобно перебрасывать питание туда, где оно нужнее."}

  # ==================== приказы и блокировка ====================
  - {id: b08, name: "Резервный штаб", kind: regular,
     top: {effect: gain, params: {objective_cards: 3}, label: "3 карты задания"},
     bottom: {kind: SPEC, passive: kelium_ignores_block,
              label: "СПЕЦ: перенеси на карту 1 келемий из запаса ЛИБО сожги его, чтобы игнорировать блокировку одного действия своего приказа"},
    
     описание: "Утиль сразу приносит 3 карты задания. Пока карта установлена, спец-действием можно перенести на неё келемий из общего запаса, а затем сжечь его, чтобы одно действие вашего приказа проигнорировало блокировку. Запасной ход для того, кому важно провести приказ несмотря на препоны."}
  - {id: b09, name: "Двойной протокол", kind: regular,
     top: {effect: free_action, params: {action: science}, label: "выполни Науку"},
     bottom: {kind: POST, passive: bottom_order_two_actions,
              label: "если твой нижний приказ совпал с чужим верхним — играешь ДВА разных его действия вместо одного"},
     описание: "Утиль позволяет выполнить Науку без расхода приказа. Пока карта установлена: если ваш нижний приказ совпадает с верхним приказом другого игрока, вы играете два разных действия этого приказа вместо одного. Удваивает пользу от совпадения приказов на общем поле."}
  - {id: b10, name: "Параллельный контур", kind: regular,
     top: {effect: gain, params: {coin: 5}, label: "5 монет"},
     bottom: {kind: POST, passive: bottom_order_two_actions,
              label: "если твой нижний приказ совпал с чужим верхним — играешь ДВА разных его действия вместо одного"},
     описание: "Утиль сразу приносит 5 монет. Пока карта установлена: если ваш нижний приказ совпадает с верхним приказом другого игрока, вы играете два разных действия этого приказа вместо одного. Та же ценная технология, что и в парной карте, но с другой наградой за утиль — держать открытыми сразу обе копии всё равно не выйдет."}

  # ==================== экономика ====================
  - {id: b11, name: "Энергосбыт", kind: regular,
     top: {effect: free_action, params: {action: market}, label: "выполни Рынок"},
     bottom: {kind: POST, passive: coin_per_energy_cube_on_refresh,
              label: "в Обновление получаешь монету за каждый кубик энергии на своих энергостанциях"},
     описание: "Утиль позволяет выполнить Рынок без расхода приказа. Пока карта установлена, в фазу Обновления вы получаете по 1 монете за каждый кубик энергии на своих энергостанциях. Чем больше энергии в резерве, тем стабильнее доход."}
  - {id: b12, name: "Научный подлог", kind: regular,
     top: {effect: gain, params: {trophy: 4}, label: "4 трофея"},
     bottom: {kind: POST, passive: kelium_instead_of_trophy,
              label: "можешь тратить келемий вместо трофеев в действии Наука"},
    
     описание: "Утиль сразу приносит 4 трофея. Пока карта установлена, в действии науки вы можете платить келемием вместо трофеев. Развязывает науку от постоянной охоты за трофеями."}

