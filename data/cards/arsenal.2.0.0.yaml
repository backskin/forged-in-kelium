  - {id: b13, name: "Трофейный склад", kind: regular, container_slot: true,
     top: {effect: gain, params: {coin: 3, ammo: 1}, label: "3 монеты + 1 боеприпас"},
     bottom: {kind: POST, passive: storage_holds_trophy_cubes,
