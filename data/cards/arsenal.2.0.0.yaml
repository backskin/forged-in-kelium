     описание: "Утиль сразу приносит 3 боеприпаса. Пока карта установлена, ваша авиация закрывает собой все ваши жетоны на своём гексе — атаки по ним достаются ей первой. Надёжное укрытие для пехоты и техники под воздушным прикрытием."}
