     описание: "Утиль сразу приносит 5 монет. Пока карта установлена, спец-действием за 1 боеприпас можно снять кубик урона с любого своего жетона. Дешёвая и гибкая поддержка войск в затяжном бою."}
  - {id: b07, name: "Диспетчер энергии", kind: regular,
