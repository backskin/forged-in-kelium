# CONTENT: super_objectives  version 6.0.0
# ============================================================================
#  СУПЕР-ЗАДАНИЯ 6.0 — МНОЖИТЕЛЬ В ФИНАЛЕ ПЛЮС ЖЁСТКОЕ ТРЕБОВАНИЕ
# ============================================================================
#  Правило дизайнера 31.08.2026. Конструкция 5.0 («суперутиль или накопитель»)
#  отменена: разовый суперутиль жгли сразу же и дружно, карта уходила из партии
#  в первые ходы, и про неё забывали (замер: 95-100% карт сожжено).
#
#  ЧТО НА КАРТЕ ТЕПЕРЬ:
#    ВЕРХ — МНОЖИТЕЛЬ ПОБЕДНЫХ ОЧКОВ, считается В ФИНАЛЕ партии. На карте стоит
#      значок финала игры, а не «всегда». Карта НЕ сжигается и НЕ удаляется:
#      значок удаления с верха снят.
#    НИЗ — ЖЁСТКОЕ ТРЕБОВАНИЕ и очень хорошая награда за него, не такая, как на
#      обычных заданиях. Награда берётся один раз за партию и НЕ отменяет
#      множитель верха.
#
#  Множители и награды — из черновика дизайнера (прежние накопители и
#  суперутили). ТРЕБОВАНИЯ низа — черновик, ждут ревью: они нарочно не совпадают
#  с тем, за что платит множитель, иначе карта платила бы дважды за одно и то же.
#  Механика и проверки требований — в движке (Super5.требованиеВыполнено).
#  Включение: super_objectives.mode: solo6 + content.super_objectives: 6.0.0.
meta:
  id: 6.0.0
super_objectives:
- id: s5_01
  name: Смотр войск
  multiplier: 2 ПО за каждый РАЗНЫЙ род войск у тебя на поле. Потолок 8.
  requirement: Держи три РАЗНЫХ рода войск одновременно на ОДНОМ гексе.
  reward: Найми бесплатно по одному жетону КАЖДОГО рода войск на свои гексы, без энергии и зданий.
  описание: 'Парад — это заявление: смотри, у меня есть всё. Множитель платит за разнообразие войск в
    финале, поэтому одного танкового кулака мало. Требование сгоняет три разных рода на один гекс, а награда
    разом достраивает армию до полного набора, минуя энергию и здания.'
- id: s5_02
  name: Дальний рубеж
  multiplier: 1 ПО за каждое своё войско на гексе, соседнем с чужим зданием. Потолок 5.
  requirement: Поставь своё войско на гекс, соседний с ЧУЖИМ ЦУ.
  reward: Перенеси любые свои войска на один гекс поля и сними с них весь урон.
  описание: Стоять у чужого порога дорого и выгодно одновременно. Множитель считает войска у чужих зданий,
    требование зовёт к самому чужому ЦУ, а награда собирает уцелевших в один кулак и лечит их — чтобы
    после дерзости было чем воевать.
- id: s5_03
  name: Раскинутая сеть
  multiplier: 1 ПО за каждый РАЗНЫЙ гекс, где стоит твоё здание. Потолок 6.
  requirement: Имей свои здания на пяти РАЗНЫХ гексах.
  reward: Построй три здания бесплатно, игнорируя энергию и зону стройки.
  описание: 'Не крепость, а сеть: множитель платит за КОЛИЧЕСТВО занятых гексов, а не за уровень зданий.
    Требование просит пять разных гексов, награда достраивает сеть тремя бесплатными зданиями без энергии
    и без зоны стройки.'
- id: s5_04
  name: Гарнизонная служба
  multiplier: 2 ПО за каждый гекс, где стоят одновременно твоё здание и твоё войско. Потолок 6.
  requirement: Имей три гекса, где стоят одновременно твоё здание и твоё войско.
  reward: Сыграй подряд ДВА полных приказа со своей руки, оба целиком.
  описание: Гарнизон — это здание с охраной. Множитель платит за гексы, где стоят и здание, и войско;
    требование просит три таких гекса. Награда даёт то, чего в игре не купить, — два полных приказа подряд.
- id: s5_05
  name: Архив штаба
  multiplier: 2 ПО за каждое выполненное задание сверх трёх. Потолок 6.
  requirement: Выполни четыре задания за партию.
  reward: Возьми ВСЕ карты с витрины арсенала в руку и добери две карты задания.
  описание: Штабной архив живёт закрытыми делами. Множитель платит за задания сверх трёх, то есть у карты
    есть порог, ниже которого она молчит. Награда забирает витрину арсенала целиком и добавляет два новых
    задания.
- id: s5_06
  name: Оружейная палата
  multiplier: 2 ПО за каждую установленную карту арсенала сверх двух. Потолок 6.
  requirement: Держи три установленные карты арсенала одновременно.
  reward: Сожги любое число установленных у себя карт арсенала и получи все их утиль-эффекты разом.
  описание: 'Палата ценит не выстрел, а арсенал на стене. Множитель платит за установленные карты сверх
    двух, требование просит держать три разом. Награда переворачивает смысл: сожги их все и получи все
    утиль-эффекты в один ход.'
- id: s5_07
  name: Золотая жила
  multiplier: 1 ПО за каждый келемий в твоём хранилище в конце партии. Потолок 5.
  requirement: Имей пять келемия в хранилище одновременно.
  reward: Обменяй весь свой келемий по курсу «за каждый — любое действие бесплатно, вне очереди».
  описание: 'Жила платит за то, что обычно тратят: множитель считает келемий, ОСТАВШИЙСЯ в хранилище к
    финалу. Требование просит собрать пять разом, а награда обменивает запас на бесплатные действия вне
    очереди — то есть даёт истратить его с двойной пользой.'
- id: s5_08
  name: Первая линия
  multiplier: 2 ПО за каждый трек науки, где твоя фишка выше всех. Потолок 6.
  requirement: Стой выше всех соперников сразу на ДВУХ треках науки.
  reward: Сделай четыре шага науки бесплатно, в любом порядке и по любым трекам.
  описание: 'Первая линия — про первенство, а не про высоту: множитель платит за треки, где ты выше ВСЕХ.
    Требование просит быть первым на двух треках сразу, награда добавляет четыре бесплатных шага науки
    в любом порядке.'
- id: s5_09
  name: Трофейный обоз
  multiplier: 1 ПО за каждый уничтоженный тобой чужой жетон, пока твоё ЦУ ни разу не разрушено. Потолок
    6.
  requirement: Уничтожь четыре чужих жетона, ни разу не потеряв своё ЦУ.
  reward: Уничтожь любое чужое здание на поле без боя (кроме ЦУ) и забери его в трофеи.
  описание: 'Обоз считает чужие потери, но только пока цело своё ЦУ: один разрушенный штаб — и множитель
    гаснет весь. Требование просит четыре чужих жетона, награда снимает с поля чужое здание вообще без
    боя.'
- id: s5_10
  name: Штабная игра
  multiplier: 2 ПО за каждый раунд, в котором ты был первым игроком. Потолок 6.
  requirement: Будь первым игроком в двух раундах партии.
  reward: Забери жетон первого игрока и немедленно сыграй один полный приказ, пока остальные ждут.
  описание: 'Штабная игра платит за инициативу: множитель считает раунды, в которых ты был первым игроком.
    Требование просит два таких раунда, а награда забирает жетон первого игрока и тут же разыгрывает полный
    приказ, пока остальные ждут.'
- id: s5_11
  name: Неприкосновенный запас
  multiplier: 2 ПО за каждое своё здание ПЕРВОГО уровня на поле в конце партии. Потолок 6.
  requirement: Имей четыре своих здания первого уровня на поле одновременно.
  reward: Мгновенно подними два своих добытчика или энергостанции до четвёртого уровня.
  описание: 'Запас — это то, что не пущено в дело: множитель платит за здания ПЕРВОГО уровня, стоящие
    на поле в финале. Требование просит четыре таких здания, а награда, наоборот, поднимает два из них
    сразу до четвёртого уровня — карта заставляет выбрать, что тебе дороже.'
- id: s5_12
  name: Тень штаба
  multiplier: 3 ПО, если твоё ЦУ ни разу не разрушено, плюс 1 ПО за каждого соперника, чьё ЦУ разрушали.
    Потолок 6.
  requirement: Твоё ЦУ цело, а ЦУ хотя бы одного соперника уже разрушено.
  reward: Уничтожь СВОЙ жетон уничтожения ЦУ — он уходит из игры навсегда, и снос твоего ЦУ не даёт сопернику
    ничего.
  описание: 'Тень штаба живёт чужой бедой: три очка за своё целое ЦУ и по одному за каждого соперника,
    чьё ЦУ разрушали. Требование выполняется само, как только чужой штаб пал первым. Награда убирает из
    игры твой жетон уничтожения ЦУ — снос твоего штаба перестаёт что-либо давать сопернику.'
