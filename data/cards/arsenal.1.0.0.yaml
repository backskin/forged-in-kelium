# CONTENT: arsenal  version 1.0.0
# 24 regular + 4 starting. Each card: top (one-shot burn) + bottom (permanent
# POST or SPEC action while installed). Playing a card is a SPEC action: BURN the
# top OR INSTALL for the bottom. 3 install slots/player. Deck scales 24->20->16.
# Encoded from "Карты/Арсенал 4.0 — колода 24+4.md".
#
# top: {effect, params, label}  — resource tops are live via the effect registry;
#   immediate-action / conditional tops use effect: noop (recorded, not yet
#   mechanized).
# bottom: {kind: POST|SPEC, passive: <id>, label}  — passive ids name a rule
#   modifier; those not yet integrated are tagged and currently inert. This keeps
#   every card as versioned DATA and bot-selectable now; deep passive wiring is
#   a follow-up (tracked with the modules work).
meta:
  id: 1.0.0
  type: arsenal

arsenal:
