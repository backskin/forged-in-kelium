- id: n1
  name: Подъём
  kind: starting
  type: state
  checked_by: card
  requirement:
    условие: Имей на поле не меньше трёх своих зданий, считая ЦУ
  base_reward:
    trophy: 1
    objective_card: 1
  top:
    label: +1 боеприпас
    effect: gain
    params:
      ammo: 1
  описание: Имей на поле не меньше трёх своих зданий, считая ЦУ, — награда трофей и карта задания. Считается и ЦУ, поэтому
    от подготовки до выполнения ровно две стройки.
- id: n2
