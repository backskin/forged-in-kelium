# 4.0.0 (06.10.2026): задания — обходные пути мимо конвейера действий.
# Требование стоит игроку чего-то (жертва или невыгодное конвейеру положение),
# награда — готовый результат (эффект движка), а не то же действие.
# Черновик для стенда kelium.СтендЗаданий; см. design-docs/ЗАДАНИЯ 4.0.
# Начальные — как в 3.0.0.
# CONTENT: objectives  version 4.0.0
meta:
  id: 4.0.0
  type: objectives
