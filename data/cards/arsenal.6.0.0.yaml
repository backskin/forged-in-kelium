      к которым это здание примыкает'
  описание: Снаряжение набивает здание войсками, а выйти они могут только Манёвром по жетону за шаг. Карта высыпает
    гарнизон разом и сразу за стенку - военное здание становится пусковой площадкой.
- id: a6_37
  name: Кристальный боезапас
  kind: regular
  top:
    effect: three_spec_actions
    params:
      spec_actions: 3
    label: три СПЕЦ-действия в этот ход
  bottom:
    kind: POST
    passive: kelium_instead_of_ammo_in_operation
    label: можешь тратить келемий вместо боеприпасов, если разыграл приказ Наступление
  описание: 'Келемий идёт в дело вместо боеприпасов, когда сыграно Наступление: рыночный товар превращается в топливо
    войны. Верх даёт три спец-действия - единственный в колоде.'
- id: a6_38
  name: Разрядник
  kind: regular
  top:
    effect: free_action
    params:
      fixed_price: 1
      ops: 1
      action: build
    label: построй любое здание за 1 монету
  bottom:
    kind: SPEC
    passive: spec_energy_on_card_free_attack
    label: 'СПЕЦ: перенеси 1 энергию на эту карту (2 ячейки) либо верни 2 энергии на любой источник, чтобы выполнить
      1 любую атаку войском на поле, не тратя боеприпасы'
  описание: 'Энергию не тратят, её перекладывают, - карта это правило и не нарушает: кубики уходят на карту и возвращаются
    на источник. Платой служит время: два спец-действия на зарядку, третье на выстрел, и всё это время два кубика
    не питают здания.'
- id: a6_39
  name: Абордаж
  kind: regular
  top:
    effect: gain
    params:
      coin: 5
    label: 5 монет
  bottom:
    kind: SPEC
    passive: spec_boarding
    label: 'СПЕЦ: забери на место уничтоженных жетонов чужой жетон с гекса, где стоит твоя пехота, и верни эту пехоту
      в свой запас'
  описание: 'Второй абордаж в колоде: тот же захват чужого жетона пехотой, но верх не грабит бумаги, а даёт деньги.'
- id: a6_40
  name: Ремонтная база
  kind: regular
  top:
    effect: free_action
    params:
      action: assembly
    label: выполни действие Снаряжение
  bottom:
    kind: POST
    passive: repair_all_in_refresh
    label: в фазу Обновления сними весь урон со своих жетонов
  описание: 'Тот же ремонт в Обновление, но верх ставит войска: чинить или снаряжать - выбор между целым войском
    и новым.'
- id: bs1
  name: Полевой генератор
  kind: starting
  top:
    effect: free_action
    params:
      action: market
    label: выполни Рынок
  bottom:
    kind: POST
    passive: card_is_energy_source_upkeep
    label: считай эту карту отдельным гексом с одним кубиком энергии; в Обновление заплати 1 монету, иначе удали
      карту из игры
  описание: 'Утиль позволяет выполнить Рынок без расхода приказа. Пока карта установлена, считайте её отдельным
    гексом с одним кубиком энергии: этот кубик участвует в Смене энергии наравне с кубиками на поле. В фазу Обновления
    за карту нужно платить 1 монету — иначе она уходит из игры навсегда.'
- id: bs2
  name: Ответный залп
  kind: starting
  top:
    effect: gain
    params:
      ammo: 3
    label: 3 боеприпаса
  bottom:
    kind: POST
    passive: ammo_on_retaliation_kill
    label: если тебя контратаковали и уничтожили твой жетон — получи 1 боеприпас
  описание: Утиль сразу приносит 3 боеприпаса. Пока карта установлена, если в ответном бою противник уничтожил ваш
    жетон, вы получаете 1 боеприпас. Карта платит не за сам факт контратаки, а за понесённую потерю.
- id: bs3
  name: Мародёрка
  kind: starting
  top:
    effect: gain
    params:
      kelium: 2
    label: 2 келемия
  bottom:
    kind: SPEC
    passive: spec_loot_enemy_building_hex
    label: 'СПЕЦ: если твои войска на гексе со зданием противника — забери у него 1 боеприпас или 1 келемий'
  описание: Утиль сразу приносит 2 келемия. Пока карта установлена, спец-действием можно забрать у противника 1
    боеприпас или 1 келемий, если ваши войска стоят на гексе с его зданием. Хорошая награда за то, что вы стоите
    там, где вам стоять не должны.
- id: bs4
  name: Штабная почта
  kind: starting
  top:
    effect: gain
    params:
      objective_cards: 3
    label: 3 карты задания
  bottom:
    kind: SPEC
    passive: spec_draw_two_objectives_keep_one
    label: 'СПЕЦ: 1 монета — возьми две карты задания, оставь одну'
  описание: Утиль сразу приносит 3 карты задания. Пока карта установлена, спец-действием за 1 монету можно взять
    две карты задания и оставить себе одну — по своему выбору. Помогает подобрать задание точнее под текущую партию.
- id: bs5
  name: Премия за голову
  kind: starting
  top:
    effect: free_action
    params:
      action: build
    label: выполни Стройку
  bottom:
    kind: POST
    passive: coin_on_kill
    label: в конце Боя, если уничтожил хотя бы один жетон — 1 монета
  описание: Утиль позволяет выполнить Стройку без расхода приказа. Пока карта установлена, если в конце Боя вы уничтожили
    хотя бы один жетон противника, вы получаете 1 монету — один раз за действие, а не за каждое убийство.
- id: bs6
  name: Аварийные щиты
  kind: starting
  top:
    effect: swap_order_card
    params: *id001
    label: замени 1 карту приказа в руке на карту из своего сброса
  bottom:
    kind: POST
    passive: economy_plus1_hp_returns_on_damage
    label: твои добытчики и энергостанции с прочностью 1 имеют прочность 2; получив урон, такое здание сразу после
      боя возвращается тебе в запас
  описание: 'Утиль меняет карту приказа в руке на карту из вашего сброса. Пока карта установлена, ваши добытчики
    и энергостанции с прочностью 1 держат два попадания — но, получив урон, такое здание сразу после боя возвращается
    вам в запас. Карта не спасает здание, а меняет форму его потери: противник тратит боеприпас и не получает ни
    трофея, ни очков.'
- id: bs7
  name: Переформирование
  kind: starting
  top:
    effect: free_action
    params:
      action: mining
    label: выполни Добычу
  bottom:
    kind: SPEC
    passive: spec_swap_ground_unit
    label: 'СПЕЦ: 2 монеты — замени на поле один свой жетон наземного войска на другой наземный жетон из запаса'
  описание: 'Утиль позволяет выполнить Добычу без расхода приказа. Пока карта установлена, спец-действием за 2 монеты
    один ваш наземный жетон на поле меняется на другой наземный жетон из запаса — пехота на технику или наоборот.
    Ничего не добавляет, а пересобирает уже стоящее: полезно ровно тогда, когда рода войск оказались не там, где
    нужны.'
- id: bs8
  name: Вольная застройка
  kind: starting
  top:
    effect: free_action
    params:
      action: build
    label: выполни Стройку
  bottom:
    kind: POST
    passive: build_on_adjacent_with_own_units
    label: можешь строить на гексах, соседних с твоими зданиями, без примыкания стенкой, если на таком гексе стоят
      твои войска
  описание: Утиль позволяет выполнить Стройку без расхода приказа. Пока карта установлена, вы можете строить на
    гексах, соседних с вашими зданиями, без обязательного примыкания стенкой — но только там, где уже стоят ваши
    войска. База идёт следом за армией, а не растёт сама.
