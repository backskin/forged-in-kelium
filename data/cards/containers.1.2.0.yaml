# CONTENT: containers  version 1.2.0
# ============================================================================
#  КОНТЕЙНЕРЫ 3.0 — РЕВЬЮ ДИЗАЙНЕРА 17.08.2026
# ============================================================================
#  ТРИ ЗАКАЗА, КОТОРЫЕ ЗДЕСЬ ВЫПОЛНЕНЫ.
#
#  1. ПОЛОВИНОК ЖЕТОНОВ МОДУЛЯ БОЛЬШЕ НЕТ НИГДЕ. Механики «две половинки
#     складываются в модуль» в игре не осталось, и контейнеры её тянули за собой
#     последними (c29, c30, c31 в 1.1.0). Убрана целиком.
#
#  2. КОНТЕЙНЕРЫ ВООБЩЕ НЕ ВЫДАЮТ ЖЕТОНОВ МОДУЛЕЙ. Ни половинок, ни целых, ни
#     позолоты. Модуль — самая ценная вещь в игре (база сборки равна единице,
#     значит модуль лицом это +100%, золотой +200%), и раздавать его из случайной
#     карты, которая приходит по три штуки за раунд, нельзя. Модули остаются там,
#     где за них платят решением: треки технологий и усиленные требования
#     заданий.
#
#  3. ВЫБОР ЕСТЬ ТОЛЬКО У ПОЛОВИНЫ КОЛОДЫ. Было 32 карты с двумя сторонами —
#     то есть 64 предложения на 32 карты, и открытие контейнера всегда давало
#     лучший из двух вариантов. Стало: 16 карт с выбором (стороны a и b) и
#     16 карт с ОДНИМ напечатанным эффектом. Карта без выбора применяется сразу.
#
#  ПЛЮС ОБЩЕЕ ОСЛАБЛЕНИЕ. Контейнер приходит слишком часто, чтобы платить как
#  выполненное задание. Прежние ставки (3–5 монет на обычной карте, 5 монет и
#  2 обломка на хорошей) урезаны примерно вдвое. Новая калибровка:
#    обычные (20) — 1 ресурс или одно мелкое действие;
#    хорошие (8)  — 2 ресурса или действие с последствием;
#    редкие (4)   — 3 ресурса или разовое правило.
#  Курс для сверки: монета 1, боеприпас 1, обломок 1.5, карта задания 2.
#  Обычная карта укладывается в 2 единицы, хорошая в 3, редкая в 4.
#
#  ГДЕ ВЫБОР, А ГДЕ НЕТ. Выбор оставлен там, где стороны тянут в РАЗНЫЕ стороны
#  игры (ресурс против действия, деньги против карт). Убран там, где обе стороны
#  были про одно и то же и разница сводилась к курсу.
# ============================================================================
