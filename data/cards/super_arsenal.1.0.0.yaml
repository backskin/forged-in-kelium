# CONTENT: super_arsenal  version 1.0.0
# 9 карт СУПЕР-АРСЕНАЛА (конструктор: «Карты/Арсенал — конструктор», §5;
# спецификация вершины трека — диктовка дизайнера 2026-08-11).
# При подготовке 3 карты (по одной на трек) выкладываются В ОТКРЫТУЮ; вершина
# трека (шаг 4, ёмкость 1) даёт 3 ПО (step_vp_cumulative) + эту карту.
#
# kind: troop — супер-войско: новый жетон войска в запас игрока: +1 HP к базе
#   рода, СВОИ атаки: универсальная по любому ЖЕТОНУ ВОЙСК (1 БП) и по
#   ЗДАНИЯМ-ВЫШКАМ (2 БП); каждая — не более раза за бой. vp_on_card: 1 —
#   ещё +1 ПО, пока карта у игрока до конца партии.
# kind: power — одна немедленно ощутимая способность (passive/эффект).
#   Пометка inert: true = способность записана, но в движке пока не действует.
meta:
  id: 1.0.0
  type: super_arsenal

super_arsenal:
  # -------- 4 супер-войска (по одному на род) --------
  - {id: sa1, name: "Гвардия «Кель»", kind: troop, unit: infantry, hp_bonus: 1,
     vp_on_card: 1, label: "супер-пехота: 2 универсальные атаки, +1 HP, +1 ПО",
     описание: "Элитная гвардия, закалённая в Жёлтой Зоне. Новый жетон пехоты получает лишнюю прочность и две универсальные атаки — по любому войску и по вышкам, — а пока карта у игрока, приносит ещё и очко победы."}
  - {id: sa2, name: "Тяжёлый танк «Раздор»", kind: troop, unit: vehicle, hp_bonus: 1,
     vp_on_card: 1, label: "супер-техника: 2 универсальные атаки, +1 HP, +1 ПО",
     описание: "Бронированный тяжеловес, который не боится ни жетонов, ни стен. Он приходит с лишней прочностью и двумя универсальными атаками — по войскам противника и по вышкам, — и даёт очко победы, пока остаётся у игрока."}
  - {id: sa3, name: "Штурмовик «Гроза»", kind: troop, unit: aircraft, hp_bonus: 1,
     vp_on_card: 1, label: "супер-авиация: 2 универсальные атаки, +1 HP, +1 ПО",
     описание: "Штурмовая машина, что бьёт с воздуха там, где не ждут. Она получает лишнюю прочность и две универсальные атаки — по любому войску и по вражеским вышкам, — а также одно очко победы на всё время у игрока."}
  - {id: sa4, name: "Цитадель", kind: troop, unit: tower, hp_bonus: 1,
     vp_on_card: 1, label: "супер-вышка: 2 универсальные атаки, +1 HP, +1 ПО",
     описание: "Неприступная вышка, поднятая над полем боя. Она крепче обычных построек и умеет бить сама — двумя универсальными атаками по войскам и по вражеским вышкам, — принося дополнительное очко победы, пока стоит у игрока."}

  # -------- 5 супер-способностей --------
  - {id: sa5, name: "Штабная директива", kind: power, passive: ignore_coincidence,
     inert: true, label: "правило совпадения приказов тебя не касается",
     описание: "Секретная директива освобождает штаб от лишней бюрократии. Пока карта у игрока, правило совпадения приказов на него просто не действует."}
  - {id: sa6, name: "Келемиевый рудник", kind: power, passive: kelium_income,
     label: "+1 келемий каждое Обновление",
     описание: "Собственная келемиевая жила под личным контролем игрока. Каждое Обновление она приносит дополнительный келемий сверх обычной добычи."}
  - {id: sa7, name: "Военная машина", kind: power, passive: all_attacks_minus1_ammo,
     label: "все твои атаки стоят на 1 БП меньше (минимум 1)",
     описание: "Отлаженная военная машина бьёт дешевле, чем у соперников. Все атаки игрока стоят на 1 боеприпас меньше, но не меньше одного."}
  - {id: sa8, name: "Мандат совета", kind: power, vp_flat: 2,
     label: "+2 ПО, пока карта у тебя",
     описание: "Мандат совета — политический вес, что считается прямо в очках. Пока карта остаётся у игрока, она приносит 2 очка победы."}
  - {id: sa9, name: "Параллельные штабы", kind: power, passive: two_spec_actions,
     label: "у тебя два СПЕЦ-действия за ход",
     описание: "Два параллельных штаба отдают приказы одновременно. Пока карта у игрока, за ход доступно два спец-действия вместо одного."}
