# CONTENT: arsenal  version 2.3.0
# ============================================================================
#  АРСЕНАЛ 2.3 — РЕВЬЮ ДИЗАЙНЕРА 17.08.2026 (два документа сразу)
# ============================================================================
#  Ревью прошло по подключённой колоде и по заметкам, до колоды не дошедшим.
#  Приговор повторялся почти дословно — «имба» — и всегда по одной причине:
#  карта давала БЕЗУСЛОВНОЕ улучшение. «Вся техника быстрее», «строй где
#  хочешь», «все здания прочнее», «+1 трофей за каждый переворот тайла» — такую
#  карту не выбирают, её просто берут, и выбор из двух открытых карт витрины
#  превращается в подсчёт, какая крупнее.
#
#  ПРАВИЛО, К КОТОРОМУ ПРИВЕДЕНА ВСЯ КОЛОДА: у сильной способности есть
#  УСЛОВИЕ, за которое игрок платит расстановкой, либо ЦЕНА, которую он платит
#  жетоном.
#   * скорость даётся не роду, а жетону, который идёт НЕ ОДИН;
#   * зона стройки растёт только туда, где уже стоят твои войска;
#   * прочность даётся только экономике и стоит возврата здания в запас;
#   * захват чужого жетона стоит своей пехоты;
#   * два спец-действия — только в ход без карты БЕЗОПАСНОСТЬ.
#
#  ЧТО ЭТО ЗАТРОНУЛО В ОБЩИХ ПРАВИЛАХ (не только в картах):
#   1. ДОПЛАТЫ МОНЕТАМИ ЗА НЕДОСТАЮЩУЮ ЭНЕРГИЮ БОЛЬШЕ НЕТ. Это было общее
#      правило, и оно обесценивало и Смену энергии, и планировку базы: дефицит
#      можно было выкупить. Право на доплату теперь даёт РОВНО ОДНА карта —
#      «Аварийное питание».
#   2. НАЙМ ИДЁТ НА ГЕКС СО ЗДАНИЕМ, А НЕ ВНУТРЬ ЗДАНИЯ. Гарнизон остаётся, но
#      входят в здание только Движением. Исключение — вышка: она встаёт на гекс
#      с ЛЮБЫМ своим зданием.
#
#  КАРТЫ-ЦЕЛИ ПЕРЕПИСАНЫ ЦЕЛИКОМ. Прежние платили за НАКОПЛЕНИЕ («2 ПО за
#  каждую авиацию на поле») — то есть за то, что игрок и так делает, и платили
#  щедро. Новые платят за ПОЛОЖЕНИЕ жетона: за то, что он стоит там, где стоять
#  неудобно и рискованно. Считается это так же легко глазами по столу.
#
#  СОСТАВ: 16 обычных + 8 стартовых + 6 карт-целей + 15 новых (11 из заметок,
#  плюс «Ядерный удар», три копии «Параллельных штабов» с разными утилями и
#  вторая копия «Лёгкого взлёта») = 42 карты.
#
#  ВЫПАВШИЕ КАРТЫ ПРЕЖНЕЙ КОЛОДЫ (a01–a24, as1, as3, as7, as8) НЕ ВОЗВРАЩАЮТСЯ:
#  дизайнер прошёл по всем двадцати четырём и по каждой написал «мусор».
#
#  УТИЛЬ ПЕРЕСОБРАН по частоте и по соотношению с низом: полные бесплатные
#  Добыча, Стройка и Рынок живут здесь (у заданий те же действия идут с
#  пределом); бесплатных Боёв во всей колоде два; крупная денежная выдача одна.
# ============================================================================
