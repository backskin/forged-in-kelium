# ============================================================================
#  CONTENT: orders  version 4.0.0 — СИММЕТРИЧНЫЕ КАРТЫ ПРИКАЗОВ, новые приказы
#
#  По рисунку дизайнера «карты-приказов-симметрия-1..25» (экспорт 24.09.2026).
#  Приказы и их действия:
#    РАЗМЕСТИТЬ     — манёвр, стройка
