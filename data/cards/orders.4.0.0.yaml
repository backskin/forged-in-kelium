#    ИССЛЕДОВАТЬ    — добыча, наука
#  У всех четырёх цветов один набор: верх → низ
#    Разместить → Приобрести, Приобрести → Контролировать,
#    Контролировать → Исследовать, Исследовать → Разместить.
#  Различается только плашка спец-действия — латинский квадрат: у каждого
#  цвета одна «+2 монеты» (бесплатно), три стоят 1 монету: → 1 боеприпас,
#  → 1 карта задания, → манёвр одним жетоном.
#  ЗАТАИТЬСЯ (4 шт.) — любые два разных действия из восьми и спец-действие.
# ============================================================================

