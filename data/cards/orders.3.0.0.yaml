# ============================================================================
#  CONTENT: orders  version 3.0.0 — СИММЕТРИЧНЫЕ КАРТЫ ПРИКАЗОВ
#
#  По рисунку дизайнера «карты-приказов-симметрия-1..25» (экспорт 22.09.2026).
#  У всех четырёх цветов ОДИН И ТОТ ЖЕ набор: верх → низ
#    Инфраструктура → Разработка, Разработка → Наступление,
#    Приобретения → Инфраструктура, Наступление → Приобретения.
#  Различается только плашка спец-действия — латинский квадрат: у каждого
#  цвета ровно одна плашка «+монета» (бесплатно), остальные три стоят
#  1 монету: → 1 боеприпас, → 1 карта задания, → манёвр одним жетоном.
#  spec_cost_coin — цена плашки в монетах. Сколько монет даёт плашка «coin» —
#  ключ свода orders.spec_coin.
#  Безопасность (4 шт.) — любые два разных действия + спец-действие.
# ============================================================================

