# CONTENT: objectives  version 1.10.0
# ============================================================================
#  ВЫГРУЖЕНО ИЗ КОДА — файл является ЗЕРКАЛОМ классов карт.
#  карта арсенала в награду шестнадцати заданиям (21.08.2026): восемь трудных получают карту С ВИТРИНЫ, восемь часто выполняемых — обычную
