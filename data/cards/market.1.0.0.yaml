# CONTENT: market  version 1.0.0
# 8 cards, one active per round. Each has 2 offers (left/right). Each offer has
# 2 cells; the 2nd cell ("3+") is only usable at 3-4 players. A cell costs 1
# kelium (shared pool for the round). Per Market action: use at most ONE offer.
# Encoded from "Карты/Рынок — 8 карт предложений.md". Immediate-action offers
# that aren't sub-action-mechanized yet use effect: noop (the resource offers
# are fully live). left/right each: {name, effect, params, label}.
meta:
  id: 1.0.0
  type: market

market:
  - id: military_contract
    name: "Военный подряд"
    left:  {name: "Мобилизация", effect: free_action, params: {action: assembly}, label: "free Assembly"}
    right: {name: "Госзаказ", effect: gain, params: {coin: 5}, label: "5 coin"}
    описание: "Военное ведомство скупает всё, что приближает победу. Мобилизация даёт бесплатную сборку, Госзаказ приносит 5 монет из казны."
  - id: shadow_convoy
    name: "Теневой обоз"
    left:  {name: "Контрабанда", effect: gain, params: {ammo: 4}, label: "4 ammo"}
    right: {name: "Подлог", effect: gain, params: {containers: 3}, label: "3 containers"}
    описание: "Тёмные извозчики возят то, что не проходит через таможню. Контрабанда подкидывает 4 боеприпаса, Подлог оставляет на складе 3 лишних контейнера."
  - id: engineering_office
    name: "Инженерная контора"
    left:  {name: "Подряд на стройку", effect: free_action, params: {action: build}, label: "free Build (no surcharge)"}
    right: {name: "Перекоммутация", effect: gain, params: {coin: 2}, label: "free Energy-swap + 2 coin"}
    описание: "Инженерная контора берётся за любую стройку без лишних вопросов. Подряд на стройку даёт бесплатную сборку без надбавки, Перекоммутация — бесплатную смену энергостанции и 2 монеты сверху."
  - id: science_mission
    name: "Научная миссия"
    left:  {name: "Грант", effect: gain, params: {trophy: 4}, label: "4 trophy"}
    right: {name: "Лицензия", effect: free_action, params: {action: science}, label: "free Science (2 steps)"}
    описание: "Учёный совет спонсирует тех, кто двигает науку вперёд. Грант выдаёт 4 трофея, Лицензия — бесплатное движение по треку науки на 2 шага."
  - id: weapons_fair
    name: "Оружейная ярмарка"
    # ПОЛОВИНОК БОЛЬШЕ НЕТ (13.08.2026): за 1 келемий в ячейку карты игрок тянет
    # ЦЕЛЫЙ жетон модуля из соответствующего мешка (красный или синий — на выбор).
    left:  {name: "Партия модулей", effect: gain, params: {module: choice}, label: "whole module from bag (choice)"}
    right: {name: "Модернизация", effect: gain, params: {gild_module: true}, label: "gild a module"}
    описание: "Оружейники раскладывают товар прямо на телегах. Партия модулей даёт целый модуль из мешка на выбор, Модернизация позолотит уже стоящий у игрока модуль."
  - id: military_alarm
    name: "Военная тревога"
    left:  {name: "Внезапный удар", effect: free_action, params: {action: combat}, label: "free Combat"}
    right: {name: "Передислокация", effect: free_action, params: {action: movement}, label: "free Movement (no ammo)"}
    описание: "Труба играет тревогу — штаб поднимает войска без разговоров. Внезапный удар даёт бесплатный бой, Передислокация — бесплатное перемещение без затрат боеприпасов."
  - id: corps_hq
    name: "Штаб корпуса"
    left:  {name: "Приоритет", effect: grab_first_player, params: {}, label: "жетон первого игрока на следующий раунд"}
    right: {name: "Штабная работа", effect: gain, params: {objective_cards: 3}, label: "3 objectives"}
    описание: "Штаб корпуса решает, кто говорит первым и кому достаются лучшие бумаги. Приоритет отдаёт жетон первого игрока на следующий раунд, Штабная работа выдаёт 3 карты заданий."
  - id: civil_contract
    name: "Гражданский подряд"
    left:  {name: "Восстановление", effect: build_neutral, params: {}, label: "поставить нейтральное здание"}
    right: {name: "Эвакуация", effect: heal_all_own, params: {coin: 2}, label: "heal all own + 2 coin"}
    описание: "Гражданские подрядчики восстанавливают то, что война успела сломать. Восстановление отстраивает нейтральное здание, Эвакуация лечит все свои жетоны и приносит 2 монеты."
