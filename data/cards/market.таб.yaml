# CONTENT: market  version таб
# ============================================================================
#  ВЫГРУЖЕНО ИЗ КОДА — файл является ЗЕРКАЛОМ классов карт.
#  снимок для таблиц
#
#  Править этот файл руками бессмысленно: у карт, живущих в коде, движок
#  накрывает запись каталога выгрузкой класса. Менять надо класс, а затем
#  выгружать заново (kelium.ВыгрузкаКаталога).
# ============================================================================
meta:
  id: таб
  type: market
  выгружено: снимок для таблиц
market:
- id: military_contract
  name: Военный подряд
  left:
    params:
      action: assembly
      all_powered: true
    label: 'Снаряжение без энергии: все здания запитаны'
    name: Мобилизация
    effect: free_action
  right:
    params:
      coin: 6
    label: 6 монет
    name: Госзаказ
    effect: gain
  описание: Военное ведомство скупает всё, что приближает победу. Мобилизация проводит снаряжение без
    всякой энергии, Госзаказ приносит 6 монет из казны.
- id: shadow_convoy
  name: Теневой обоз
  left:
    params:
      ammo: 4
    label: 4 боеприпаса
    name: Контрабанда
    effect: gain
  right:
    params:
      containers: 3
    label: 3 контейнера
    name: Подлог
    effect: gain
  описание: Тёмные извозчики возят то, что не проходит через таможню. Контрабанда подкидывает 4 боеприпаса,
    Подлог оставляет на складе 3 лишних контейнера.
- id: engineering_office
  name: Инженерная контора
  left:
    params:
      action: build
      no_surcharge:
      - build_place
    label: Стройка без надбавки за 2-е и 3-е здание
    name: Подряд на стройку
    effect: free_action
  right:
    params:
      action: energy_swap
      no_surcharge:
      - energy_swap
    label: Смена энергии даром с любых гексов
    name: Перекоммутация
    effect: free_action
  описание: Инженерная контора берётся за любую стройку без лишних вопросов. Подряд на стройку ставит
    здания без надбавки, Перекоммутация бесплатно переставляет энергию с любых гексов.
- id: science_mission
  name: Научная миссия
  left:
    params:
      debris: 4
    label: 4 обломка
    name: Грант
    effect: gain
  right:
    params:
      action: science
      debris: 1
    label: Наука даром + 1 обломок
    name: Лицензия
    effect: free_action
  описание: Учёный совет спонсирует тех, кто двигает науку вперёд. Грант выдаёт 4 обломка, Лицензия даёт
    бесплатное движение по треку науки и обломок сверху.
- id: weapons_fair
  name: Оружейная ярмарка
  left:
    params:
      module: choice
    label: целый жетон модуля из мешка на выбор
    name: Партия модулей
    effect: gain
  right:
    params:
      gild_module: true
    label: позолотить свой модуль
    name: Модернизация
    effect: gain
  описание: Оружейники раскладывают товар прямо на телегах. Партия модулей даёт целый модуль из мешка
    на выбор, Модернизация позолотит уже стоящий у игрока модуль.
- id: military_alarm
  name: Военная тревога
  left:
    params:
      action: combat
      ammo: 1
    label: Бой даром + 1 боеприпас в его начале
    name: Внезапный удар
    effect: free_action
  right:
    params:
      action: movement
      ammo: 1
    label: Движение даром + 1 боеприпас
    name: Передислокация
    effect: free_action
  описание: Труба играет тревогу — штаб поднимает войска без разговоров. Внезапный удар даёт бесплатный
    бой и боеприпас к нему, Передислокация — бесплатное перемещение и боеприпас.
- id: corps_hq
  name: Штаб корпуса
  left:
    params:
      now: true
      take_objectives: true
    label: забрать жетон первого игрока И ВСЮ его руку заданий; в это Обновление жетон не передаётся
    name: Приоритет
    effect: grab_first_player
  right:
    params:
      objective_cards: 4
      objective_cards_keep: 2
    label: 4 карты заданий, оставить 2
    name: Штабная работа
    effect: gain
  описание: Штаб корпуса решает, кто говорит первым и кому достаются лучшие бумаги. Приоритет забирает
    у первого игрока жетон вместе со всей его рукой заданий и не отдаёт жетон в Обновление, Штабная работа
    даёт выбрать 2 карты заданий из четырёх.
- id: civil_contract
  name: Гражданский подряд
  left:
    params: &id001 {}
    label: нейтральное здание на 1–2 сектора куда угодно; чужие здания на этих секторах уходят владельцам
      в запас
    name: Восстановление
    effect: build_neutral
  right:
    params: *id001
    label: снять весь урон со своих жетонов на гексе и увести их все на другой гекс
    name: Эвакуация
    effect: evacuate
  описание: Гражданские подрядчики восстанавливают то, что война успела сломать. Восстановление ставит
    нейтральную стенку куда угодно, выселяя чужие здания в запас владельцам, Эвакуация лечит твои жетоны
    на выбранном гексе и уводит их все на другой гекс.
