      Вскрытие (СПЕЦ): выложи на карту сразу всё — три любых чужих жетона из
      своих трофеев и 4 трофея. На одной из твоих открытых карт арсенала
      должен быть символ ■ квадрат.
      Получи 3 победных очка и жетон супероружия в запас.
      Запуск (СПЕЦ, не чаще раза за круг): сними содержимое одной ячейки, если
