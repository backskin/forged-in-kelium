# CONTENT: super_objectives  version 3.0.0
# ============================================================================
#  СУПЕР ЗАДАНИЯ 3.0 — СУПЕРОРУЖИЕ И СЧЁТЧИК ЗАПУСКА (решение дизайнера 17.08.2026)
# ============================================================================
#  ЧТО ЭТО ЗА ВЕРСИЯ. Двусторонней карты с рисунком на рубашке больше нет.
#  Рисунок отменён целиком: восемь разных фигур сводились движком к одному
#  требованию «поставь перечисленное связкой», а тексты обещали линии, кольца и
#  треугольники — за столом это спор о правилах, а не механика.
#
#  НОВОЕ УСТРОЙСТВО. Карта односторонняя, рубашка обычная, лежит в руке как
#  любое задание. На карте ЧЕТЫРЕ ЯЧЕЙКИ.
#
#   1. ВСКРЫТИЕ. СПЕЦ-действием игрок выкладывает на карту СРАЗУ ВСЁ, что
#      требуют четыре ячейки. Частями вносить нельзя: либо всё, либо ничего.
#      Дополнительное условие вскрытия — на одной из ОТКРЫТЫХ карт арсенала у
#      игрока должен быть напечатан символ, который требует эта карта.
#      За вскрытие игрок получает 3 победных очка — одинаково у всех восьми.
#   2. ЖЕТОН СУПЕРОРУЖИЯ. Вместе со вскрытием игрок получает В ЗАПАС отложенный
#      жетон супероружия и кладёт его на карту. Это ПЯТЫЙ жетон своего цвета
#      того рода войск, что назван на карте; в личный запас рода он не входит.
#      Жетон нанимается обычным порядком — на гексе со зданием того типа, что
#      производит этот род.
#   3. ЖЕТОН НЕ АТАКУЕТ. Он ходит как войско и подчиняется всем эффектам своего
#      рода, но АТАКОВАТЬ не умеет — ни в действии Бой, ни в ответном бою, ни
#      каким-либо эффектом карты. АТАКА — это когда игрок выбирает войско на
#      гексе, смотрит таблицу атак своего планшета и тратит боеприпасы по её
#      строкам; супероружию эта таблица недоступна.
#   4. СЧЁТЧИК ЗАПУСКА. Игрок снимает с карты содержимое ОДНОЙ ячейки
#      СПЕЦ-действием. Условий пять, и все они про одно: ОРУЖИЕ ДОЛЖНО ЕЗДИТЬ,
#      а не стоять на месте четыре круга.
#        * жетон супероружия стоит НА ПОЛЕ (в запасе он ничего не снимает);
#        * НЕ на гексе того здания, где его наняли;
#        * НЕ на гексе со своим зданием вообще — он выехал из базы и стоит
#          открыто, где его можно снести;
#        * С ЭТОГО ГЕКСА ЕЩЁ НЕ ЗАПУСКАЛИ — каждое снятие требует нового места,
#          значит между снятиями жетон обязан переехать;
#        * не чаще одного раза за круг.
#      Итого четыре снятия — это четыре РАЗНЫХ гекса вне своей базы и четыре
#      переезда между ними. Всю дорогу оружие под ударом, и у соперников есть и
#      время, и повод его снести.
#   5. ПОБЕДА. Снял с ПОСЛЕДНЕЙ занятой ячейки — немедленно выиграл партию. Ход
#      снятия свой, поэтому и победа наступает в свой ход: посчитать её может
#      каждый за столом заранее.
#   6. ЖЕТОН МОЖНО СНЕСТИ. Уничтоженный жетон супероружия возвращается на свою
#      вскрытую карту, и счётчик встаёт: пока нового жетона на поле нет, снимать
#      ячейки нечем. На обороте жетона напечатано 1 трофей и компенсация
#      контейнером владельцу — как у прочих жетонов.
#
#  СУПЕР ЗАДАНИЯ — ДОПОЛНЕНИЕ. Партия играется и без них; включается тумблером
#  в настройках подготовки (super_objectives.enabled).
#
# ============================================================================
#  ЦЕНА ВСКРЫТИЯ — РАЗБОР И ВЫРАВНИВАНИЕ
# ============================================================================
#  Дизайнер расписал пять карт из восьми и попросил посчитать ценность, покритиковать
#  и уравнять. Курс взят тот же, что у контейнеров и заданий, плюс жетоны:
#
#    монета 1 · боеприпас 1 · трофей 1.5 · КЕЛЕМИЙ 5 (он равен победному очку)
#    чужой жетон войск из трофеев 3 · чужое здание из трофеев 3.5
#    своё здание с поля в запас 3 · своё войско с поля в запас 2
#
#  ЧТО ПОКАЗАЛ ПОДСЧЁТ ПО ЗАПИСКЕ ДИЗАЙНЕРА:
#    Призма   4 келемия + 2 чужих войска ...... 26   ← вдвое дороже остальных
#    Завеса   4 БПР + 2 келемия + чужое здание  17.5
#    Крот     добытчик + станция + здание + 3 МОН 12.5
#    Литейня  3 чужих жетона + 2 трофея ...... 12
#    Колосс   2 своих здания + 2 чужих войска .. 12
#
#  Разброс больше чем вдвое, и виноват в нём келемий: он равен победному очку, и
#  четыре келемия — это четыре очка, отданных за карту, которая и так даёт три.
#  Такую карту не берут. Все восемь сведены к 14.5–15 единицам: это дорого (три
#  раунда экономики), но окупается вскрытием на 3 ПО и мгновенной победой.
#
#  РАЗНООБРАЗИЕ СОХРАНЕНО: у каждой карты своя смесь из четырёх ячеек, и ни одна
#  не повторяет другую. Келемий стоит максимум в двух ячейках одной карты.
# ============================================================================
#  ФОРМАТ ЯЧЕЙКИ. {kind: <что>, amount: <сколько>}
#    coin | ammo | kelium | trophy     — из хранилища игрока
#    enemy_unit_token                  — чужой жетон ВОЙСК со своего места уничтоженных жетонов
#    enemy_building_token              — чужое ЗДАНИЕ со своего места уничтоженных жетонов
#    enemy_token                       — любой чужой жетон со своего места уничтоженных жетонов
#    own_building                      — своё здание с поля (уходит в запас)
#    own_miner | own_power_plant       — то же, но здание названного типа
#    own_unit                          — своё войско с поля (уходит в запас)
#  Жетоны, положенные в ячейку, уходят ИЗ ИГРЫ насовсем: чужие — не возвращаются
#  владельцу, свои — не возвращаются в запас. В этом и цена.
# ============================================================================
meta:
  id: 3.0.0
  type: super_objectives

super_objectives:
  - id: prizma
    name: "Призма"
    subtitle: "келемиевый излучатель"
    weapon_unit: vehicle
    requires_symbol: circle
    vp_on_reveal: 3
    # 5 + 5 + 3 + 2 = 15
    cells:
      - {kind: kelium, amount: 1}
      - {kind: kelium, amount: 1}
      - {kind: enemy_unit_token, amount: 1}
      - {kind: ammo, amount: 2}
    текст_карты: >-
      СУПЕРОРУЖИЕ: ТЕХНИКА.
      Вскрытие (СПЕЦ): выложи на карту сразу всё — 1 келемий, 1 келемий,
      чужой жетон войск из своих трофеев и 2 боеприпаса. На одной из твоих
      открытых карт арсенала должен быть символ ● круг.
      Получи 3 победных очка и жетон супероружия в запас.
      Запуск (СПЕЦ, не чаще раза за круг): сними содержимое одной ячейки, если
      жетон супероружия стоит на поле, не на гексе со своим зданием, и с этого
      гекса ты ещё не запускал. Между снятиями жетон обязан переехать.
      Снял с последней занятой ячейки — ты выиграл партию.
      Жетон супероружия не атакует.
    описание: "Призма собирает добытый келемий в один слепящий луч. Дороже всего в ней сам келемий: два кубика — это два победных очка, отданных вперёд, за карту, которая вернёт три и может закончить партию."

