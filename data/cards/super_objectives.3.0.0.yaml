      Снял с последней занятой ячейки — ты выиграл партию.
      Жетон супероружия не атакует.
    описание: "Литейня переплавляет снятое с поля в собственную сталь. Единственная карта, которую нельзя вскрыть, не воюя: три чужих жетона берутся только в бою, и в игру они уже не вернутся."

