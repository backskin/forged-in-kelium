# CONTENT: super_objectives  version 8.0.0
# ============================================================================
#  СУПЕР-ЗАДАНИЯ 8.0 — ТОЛЬКО ПОБЕДНЫЕ ОЧКИ (правило дизайнера 14.09.2026)
# ============================================================================
#  ЧТО ОТМЕНЕНО. Редакция 7.0 («множитель верха плюс жёсткое требование низа с
#  разовой наградой») снята целиком: карту нельзя ни выполнить, ни сжечь, низа
#  у неё нет, отдельного СПЕЦ-действия под неё нет. Из движка убраны награда
#  низа, проверка требования и вкладка супер-заданий в проигрывателе.
#
#  ЧТО ВМЕСТО. Базовые источники очков (монеты, келемий, трофеи, здания и
#  войска на поле и прочее) из общих правил вынесены СЮДА: теперь они не у
#  всех сразу, а только у того, кому пришла карта. Дизайнер: «так больше
#  асимметрии и реиграбельности».
#
#  УСТРОЙСТВО КАРТЫ. На карте ПАРА из двух РАЗНЫХ категорий счёта; игрок
#  получает очки за обе. Каждая категория даёт 1 ПО за свою единицу счёта.
#  Категорий двенадцать, карт двенадцать, каждая категория встречается на
#  ДВУХ разных картах (пара собрана шагом через пять, чтобы на карте не
#  сходились соседние по смыслу категории).
#
#  ЧТО ЕЩЁ НЕ РЕШЕНО. Дизайнер сказал: «потом подумаю и добавлю туда
#  непосредственно ЗАДАНИЕ, может даже такое, чтобы можно было досрочно
#  победить. Но пока НЕ ТРОГАЕМ». Поэтому низа у карты нет вовсе.
#
#  ИМЕНА КАРТ ТЕХНИЧЕСКИЕ: пара категорий словами. Настоящие названия и арт
#  даст дизайнер; механика от имён не зависит.
#
#  Категории считает kelium.engine.СуперЗадания; их имена — ключи ниже.
# ============================================================================
meta:
  id: 8.0.0
  type: super_objectives
  выгружено: 'супер-задания 8.0.0: пара категорий на карте, только победные очки'

# Двенадцать категорий счёта. label — то, что напечатано на карте.
categories:
  buildings_3:        1 ПО за каждые 3 своих здания на поле (ЦУ — тоже здание)
  units_4:            1 ПО за каждые 4 своих войска на поле
  kelium_4:           1 ПО за каждый келемий в хранилище, не больше 4
  trophy_tokens_4:    1 ПО за каждый жетон на своей свалке, не больше 4
  tech_steps_4:       1 ПО за каждую разную ступень треков технологий, занятую своим кубиком, не больше 4
  red_modules:        1 ПО за каждый свой жетон модуля боя
  blue_modules:       1 ПО за каждый свой жетон модуля сборки
  units_at_enemy:     1 ПО за каждое своё войско на гексе с чужим зданием
  coins_4:            1 ПО за каждые 4 монеты в запасе
  ammo_kelium_pairs:  1 ПО за каждую пару боеприпас + келемий в хранилище
  plants_off_cell:    1 ПО за каждую свою энергостанцию не на круге энергии
  miners_on_container: 1 ПО за каждый свой добытчик на ячейке контейнера

super_objectives:
- id: so01
  name: Стройка и огонь
  categories: [buildings_3, red_modules]
  описание: Очки за плотную застройку и за красные жетоны на планшете войск.
- id: so02
  name: Армия и сборка
  categories: [units_4, blue_modules]
  описание: Очки за многочисленную армию и за синие жетоны на военных зданиях.
- id: so03
  name: Запас и вылазка
  categories: [kelium_4, units_at_enemy]
  описание: Очки за келемий в хранилище и за войска, стоящие у чужих зданий.
- id: so04
  name: Свалка и казна
  categories: [trophy_tokens_4, coins_4]
  описание: Очки за жетоны, оставшиеся на свалке, и за монеты в запасе.
- id: so05
  name: Наука и снабжение
  categories: [tech_steps_4, ammo_kelium_pairs]
  описание: Очки за разные ступени треков и за пары боеприпас плюс келемий.
- id: so06
  name: Огонь и энергия
  categories: [red_modules, plants_off_cell]
  описание: Очки за красные жетоны и за энергостанции вне кругов энергии.
- id: so07
  name: Сборка и добыча
  categories: [blue_modules, miners_on_container]
  описание: Очки за синие жетоны и за добытчиков на ячейках контейнеров.
- id: so08
  name: Вылазка и стройка
  categories: [units_at_enemy, buildings_3]
  описание: Очки за войска у чужих зданий и за плотную застройку.
- id: so09
  name: Казна и армия
  categories: [coins_4, units_4]
  описание: Очки за монеты в запасе и за многочисленную армию.
- id: so10
  name: Снабжение и запас
  categories: [ammo_kelium_pairs, kelium_4]
  описание: Очки за пары боеприпас плюс келемий и за келемий в хранилище.
- id: so11
  name: Энергия и свалка
  categories: [plants_off_cell, trophy_tokens_4]
  описание: Очки за энергостанции вне кругов энергии и за жетоны на свалке.
- id: so12
  name: Добыча и наука
  categories: [miners_on_container, tech_steps_4]
  описание: Очки за добытчиков на ячейках контейнеров и за ступени треков.
