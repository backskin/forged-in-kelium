# CONTENT: super_objectives  version 9.0.0
# ============================================================================
#  СУПЕР-ЗАДАНИЯ 9.0 — ЛЁГКОЕ «ПО ★» И ТРУДНОЕ «ПО ★★» (шаблоны 25.09.2026)
# ============================================================================
#  ОТКУДА. Дизайнер положил в «Общие компоненты\экспорт-задания-супер» три
#  пустых лица: два раздела с флажком финала, у верхнего плашка «Награда: по ★»,
#  у нижнего «Награда: по ★★», под плашкой — место для условия. Его слова:
#  «один даёт по одному победному очку за условия, а другой — по два…
#  чуть-чуть полегче собирать победные очки — и прям сложное, но даёт за
#  каждое что-то два».
#
#  УСТРОЙСТВО КАРТЫ. Два раздела, игрок получает очки за оба:
#    - верхний (vp 1) — ЛЁГКОЕ: частая величина, за каждую единицу 1 ПО;
#    - нижний  (vp 2) — ТРУДНОЕ: редкое или дорогое, за каждое 2 ПО.
#  Всё считается в конце партии по столу: поле, планшеты, хранилище, свалка.
#  Карту по-прежнему не выполняют, не сжигают и не сбрасывают.
#
#  КАК ПОДОБРАНЫ ПАРЫ. У каждой карты оба раздела — одна линия игры: лёгкое
#  платит за ширину (много зданий, много кубиков, много модулей), трудное —
#  за вершину той же линии (здание в чужом гексе, кубик на вершине, золотой
#  модуль). Двенадцать лёгких и двенадцать трудных условий, ни одно не
#  повторяется. Цифры прогона — design-docs «СУПЕР-ЗАДАНИЯ 9.0 — что
#  придумано и почему».
#
#  ИМЕНА КАРТ НЕ ПЕЧАТАЮТСЯ: на шаблоне места под название нет (как у карт
#  рынка). name — рабочий ярлык для программы.
#
#  Категории считает kelium.engine.СуперЗадания; label — ровно то, что
#  напечатано под плашкой раздела.
# ============================================================================
meta:
  id: 9.0.0
  type: super_objectives
  выгружено: 'супер-задания 9.0.0: лёгкое «по ★» и трудное «по ★★» на шаблонах дизайнера 25.09.2026'

# label — текст под плашкой «Награда: по ★» / «Награда: по ★★».
categories:
  # лёгкие, «по ★»
  buildings_3:        за каждые 3 своих здания на поле
  units_2:            за каждые 2 своих войска на поле
  unit_kinds:         за каждый род своих войск на поле
  modules_on_board:   за каждый свой модуль боя и сборки на планшете войск
  tech_cubes:         за каждый свой кубик на треках технологий
  storage_cubes_2:    за каждые 2 кубика в своём хранилище
  arsenal_installed:  за каждую свою установленную карту арсенала
  coins_2:            за каждые 2 монеты в своём запасе
  powered_buildings:  за каждое своё запитанное здание
  miners_at_spawn:    за каждый свой добытчик, стенкой обращённый к тайлу зарождения
  hexes_2:            за каждые 2 гекса со своими жетонами
  military_3:         за каждую свою казарму, завод и авиабазу на поле
  # трудные, «по ★★»
  buildings_at_enemy:  за каждое своё здание на гексе с чужим зданием
  units_at_enemy:      за каждое своё войско на гексе с чужим зданием
  full_unit_sets:      'за каждую четвёрку своих войск на поле: пехота, техника, авиация и вышка'
  gold_modules:        за каждый свой модуль золотой стороной вверх
  top_steps:           за каждый свой кубик на третьей ступени и на вершине трека
  resource_sets:       'за каждую тройку в своём хранилище: келемий, боеприпас и трофей'
  super_arsenal_cards: за каждую свою карту супер-арсенала
  powered_two_cell:    за каждое своё запитанное здание с двумя ячейками энергии
  kelium:              за каждый келемий в своём хранилище
  spawn_double:        за каждый тайл зарождения, к которому стенкой обращены хотя бы два твоих добытчика
  track_leader:        за каждый трек, где твой кубик стоит выше всех чужих
  dump_tokens:         за каждый жетон на своей свалке

