# CONTENT: market  version 2.0.0
# ============================================================================
#  ВЫГРУЖЕНО ИЗ КОДА — файл является ЗЕРКАЛОМ классов карт.
#  выгружено из кода
#
#  Править этот файл руками бессмысленно: у карт, живущих в коде, движок
#  накрывает запись каталога выгрузкой класса. Менять надо класс, а затем
#  выгружать заново (kelium.ВыгрузкаКаталога).
# ============================================================================
meta:
  id: 2.0.0
  type: market
  выгружено: выгружено из кода
market:
- id: m2_contract
  name: Военный подряд
  left:
    effect: free_action
    params:
      all_powered: true
      action: assembly
    label: 'Действие Сборка без энергии: все здания запитаны'
    name: Мобилизация
  right:
    effect: gain
    params:
      coin: 6
    label: 6 монет
    name: Госзаказ
  описание: Военное ведомство скупает всё, что приближает победу. Мобилизация проводит Сборку без всякой
    энергии, Госзаказ приносит 6 монет из казны.
- id: m2_convoy
  name: Теневой обоз
  left:
    effect: gain
    params:
      ammo: 4
    label: 4 боеприпаса
    name: Контрабанда
  right:
    effect: gain
    params:
      containers: 3
    label: 3 контейнера
    name: Подлог
  описание: Тёмные извозчики возят то, что не проходит через таможню. Контрабанда подкидывает 4 боеприпаса,
    Подлог оставляет на складе 3 лишних контейнера.
- id: m2_energy_office
  name: Энергетическая контора
  left:
    label: Установка келемия вместо энергии (без ячейки)
    params: &id001 {}
    name: Подключение
    effect: place_on_energy_cell
    no_cell: true
  right:
    effect: gain
    params:
      trophy: 2
    label: 2 трофея
    name: Разбор
  описание: 'Конторе всё равно, чем ты платишь за свет: кристалл встаёт в ячейку вместо кубика энергии
    и остаётся там навсегда. А кому энергия не нужна — тому отсыпят два трофея со двора.'
- id: m2_arms_fair
  name: Оружейная ярмарка
  left:
    effect: swap_module_from_bag
    params: *id001
    label: Обмен одного модуля на новый из мешка
    name: Мена
  right:
    effect: combo
    params:
      steps:
      - params: *id001
        effect: module_swap
      - params:
          action: energy_swap
        effect: free_action
    label: Смена модулей + Смена энергии
    name: Переналадка
  описание: 'На ярмарке меняют не только оружие: сдай жетон модуля и тяни из мешка другой, не глядя. А
    кто менять не хочет — переналадит своё: и модули, и энергию разом.'
- id: m2_alarm
  name: Военная тревога
  left:
    effect: free_action
    params:
      ammo: 2
      action: combat
    label: 'Внезапный удар: Бой даром + 2 боеприпаса'
    name: Внезапный удар
  right:
    effect: free_action
    params:
      ammo: 2
      action: movement
    label: 'Передислокация: Движение даром + 2 боеприпаса'
    name: Передислокация
  описание: Труба играет тревогу — штаб поднимает войска без разговоров. Внезапный удар даёт бесплатный
    бой и боеприпасы к нему, Передислокация — бесплатное движение и те же боеприпасы.
- id: m2_corps_hq
  name: Штаб корпуса
  left:
    effect: grab_first_player
    params:
      take_objectives: true
      now: true
    label: забрать жетон первого игрока И ВСЮ его руку заданий; в это Обновление жетон не передаётся
    name: Перехват инициативы
  right:
    effect: gain
    params:
      objective_cards_keep: 2
      objective_cards: 4
    label: 4 карты заданий, оставить 2
    name: Разнарядка
  описание: Корпусной штаб решает, кто пойдёт первым. Перехват инициативы забирает жетон первого игрока
    вместе со всей его рукой заданий, Разнарядка выдаёт четыре приказа на выбор — оставишь два.
- id: m2_civil
  name: Гражданский подряд
  left:
    effect: replace_building_with_neutral
    params: *id001
    label: замени чужое здание на поле любым нейтральным, чужое отдай в запас владельцу
    name: Реновация
  right:
    effect: evacuate
    params: *id001
    label: сними весь урон со всех своих жетонов на одном гексе и перемести их на другой гекс
    name: Эвакуация
  описание: 'Гражданские строители приходят с ордером: чужое здание сносят, владельцу возвращают жетон,
    а участок занимает нейтральная постройка. Эвакуация же вывозит своих: урон снят, отряд на новом гексе.'
- id: m2_science
  name: Научная миссия
  left:
    effect: free_action
    params:
      virtual_trophy: 1
      action: science
    label: Выполни действие Наука как будто у тебя на 1 трофей больше
    name: Грант
  right:
    label: купить келемий за 1 монету (без ячейки)
    params:
      coin: 1
    name: Закупка
    effect: buy_kelium
    no_cell: true
  описание: Миссия приехала с грантом и кошельком. Грант оплачивает один лишний трофей в науке, а на кошелёк
    всегда можно купить кристалл — недорого и без очереди.
