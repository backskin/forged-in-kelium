# 6.0.0 (12.10.2026, решение Влада): СПЕЦ-ПЛАШКИ РАЗЛОЖЕНЫ ЗАНОВО ПО НАЦИЯМ.
# Было: на НАСТУПАТЬ плашки нет ни у кого. Стало: у каждой нации своя карта без
# плашки, и каждая плашка лежит там, где она этой нации выгоднее всего.
#   приказ:      ОСВОИТЬ   МОБИЛИЗОВАТЬ  НАСТУПАТЬ  КОНТРОЛИРОВАТЬ  ИССЛЕДОВАТЬ
#   красные      +2 мон.   манёвр        боеприп.   задание         —
#   синие        —         +2 мон.       манёвр     боеприп.        задание
#   зелёные      задание   боеприп.      —          +2 мон.         манёвр
#   жёлтые       манёвр    задание       +2 мон.    —               боеприп.
# В колоде цвета каждая плашка по разу; у одного приказа четыре цвета не
# повторяют плашку; МОБИЛИЗОВАТЬ — единственный приказ с плашкой у всех.
#   КРАСНЫЕ (штурм зданий, слабая энергия наверху): боеприпас на НАСТУПАТЬ —
#     выпустил и сразу бьёшь; манёвр на МОБИЛИЗОВАТЬ — быстрая пехота (скорость 3)
#     подтягивается к цели, пока строится армия; монеты на ОСВОИТЬ — экономика
#     дорогая; задание на КОНТРОЛИРОВАТЬ — после боя; Наука без плашки.
#   СИНИЕ (сильнейшие добытчики и станции, тесное хранилище, мало боеприпасов):
#     ОСВОИТЬ без плашки — экономика у них и так лучшая; монеты на МОБИЛИЗОВАТЬ —
#     авиабаза стоит 3; манёвр на НАСТУПАТЬ — прочная авиация бьёт издалека;
#     боеприпас на КОНТРОЛИРОВАТЬ — бой без своего выпуска; задание на ИССЛЕДОВАТЬ.
#   ЗЕЛЁНЫЕ (слабая добыча, казарма даёт 2 боеприпаса, пехота бьёт пехоту):
#     НАСТУПАТЬ без плашки — нация обороны; задание на ОСВОИТЬ — путь к очкам не
#     через келемий; боеприпас на МОБИЛИЗОВАТЬ — склад к обороне; монеты на
#     КОНТРОЛИРОВАТЬ — к Рынку и Науке; манёвр на ИССЛЕДОВАТЬ — без Командования.
#   ЖЁЛТЫЕ (быстрая техника, все жетоны хрупкие, дешёвая казарма):
#     КОНТРОЛИРОВАТЬ без плашки; манёвр на ОСВОИТЬ — растут вширь; задание на
#     МОБИЛИЗОВАТЬ; монеты на НАСТУПАТЬ — построил и сразу в бой; боеприпас на
#     ИССЛЕДОВАТЬ — хрупким выгодно бить первыми и в ход без Снабжения.
#
# ============================================================================
#  CONTENT: orders  version 6.0.0 — ПЯТЬ ПРИКАЗОВ ПО ПЯТИ ДЕЙСТВИЯМ-РАЗВИЛКАМ
#
#  Решение дизайнера 27.09.2026. Действий пять, каждое — «одно из двух»:
#    Добыча       (extract) — добыть | построить добытчик
#    Питание      (power)   — переложить энергию | построить энергостанцию
#    Снабжение    (supply)  — выпустить | построить военное здание (и ЦУ)
#    Командование (command) — манёвр | бой
#    Развитие     (develop) — рынок | наука
#  Приказы (верх — два соседних действия по кругу; низ — приказ, который
#  должен быть вскрыт сверху раньше тебя в этом круге, и тогда одно действие
#  из двух его действий):
#    ОСВОИТЬ        (settle)   — Добыча + Питание;        низ НАСТУПАТЬ
#    МОБИЛИЗОВАТЬ   (mobilize) — Питание + Снабжение;     низ КОНТРОЛИРОВАТЬ
#    НАСТУПАТЬ      (advance)  — Снабжение + Командование; низ ИССЛЕДОВАТЬ
#    КОНТРОЛИРОВАТЬ (secure)   — Командование + Развитие; низ ОСВОИТЬ
#    ИССЛЕДОВАТЬ    (research) — Развитие + Добыча;       низ МОБИЛИЗОВАТЬ
#  Какие действия у приказа — kelium.engine.Order.ORDER_ACTIONS.
#
#  У каждого цвета пять карт, ДЖОКЕРА (Затаиться) НЕТ. Колоды у всех цветов
#  одинаковые по действиям, различаются спец-плашки. ПЕРЕНОС ПЛАШЕК из 4.0.0:
#    РАЗМЕСТИТЬ (манёвр+стройка)      -> ОСВОИТЬ (обе ветки «построить»)
#    ПРИОБРЕСТИ (снабжение+рынок)     -> МОБИЛИЗОВАТЬ (снабжение)
#    КОНТРОЛИРОВАТЬ (питание+бой)     -> КОНТРОЛИРОВАТЬ (то же слово)
#    ИССЛЕДОВАТЬ (добыча+наука)       -> ИССЛЕДОВАТЬ (те же действия)
#  НАСТУПАТЬ — новая карта; спец-плашки на ней нет ни у одного цвета
#  (решение 27.09, комплект «пять развилок», раздел 2.4).
# ============================================================================

