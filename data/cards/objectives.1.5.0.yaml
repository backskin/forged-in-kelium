# CONTENT: objectives  version 1.5.0
# 1.5.0 — КАТАЛОГ 8.0 «с ценой» (полный рерайт, замена 1.4.0).
# Источник: "Карты/Задания 8.0 — каталог с ценой (2026-08-11).md" + замены §9
# (o07 -> Засада, o22 -> Зачистка). Решения дизайнера 2026-08-11:
#   - старт по СВОДу (без добытчика, 5 МОН всем) -> ruleset 1.5.0 setup;
#   - o35 платит трофейными ОЧКАМИ-кубиками (resources.trophy);
#   - оборонительная «Под огнём» НЕ входит; состав 14С/20Э/6Ж как в 8.0;
#   - n1 = 2 здания (порог «3» в 8.0 был под симовский старт с добытчиком).
# Тест цены: у каждого низа названа цена (см. каталог). ТРФ в базах НЕТ нигде.
# 12.08.2026 (дизайнер): КАЖДОЕ задание дополнительно даёт +1 МОН за выполнение.
#   Карты, уже дававшие монеты, дают на одну больше. Начальные (n1-n8) получили
#   base_reward: {coin: 1} — раньше base у них не было вовсе.
# Верхи: канонические имена А/Б; реактивные Б-III (щиты/ремонт) в симе
# аппроксимированы heal_one, «страховка» и ресурсные Б — gain (помечено «аппрокс.»).
meta:
  id: 1.5.0
  type: objectives

objectives:
  # ===== A. РАЗРАБОТКА — конвейер и рудник (o01-o10) =====
  - id: o01
    name: "Полный залп"
    kind: regular
    type: incident
    # цена: отказ — ни одного войска в ход
    requirement: {predicate: assembly_all_chose_ammo, params: {count: 2}}
    enhanced:    {predicate: assembly_all_chose_ammo, params: {count: 2, include_types: [factory, airbase]}}
    base_reward: {coin: 1, ammo: 2, container: 2}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: build}, label: "ДЕСАНТ (аппрокс.: стройка)"}
    описание: "Снарядите минимум 2 войска боеприпасами вместо орудий прямо на сборочной линии — получите монету, 2 боеприпаса и 2 контейнера. Сделайте то же самое на заводе или авиабазе, и награда вырастет до 2 трофейных очков и новой карты задания. Разыграйте карту — и высадите десант, бесплатную стройку сверху. Патроны в Жёлтой Зоне экономят, а залп бьёт разом по всем стволам."
  - id: o02
    name: "Конвейер"
    kind: regular
    type: incident
    requirement: {predicate: produced_units_ex_tower, params: {count: 2, distinct_buildings: 2}}
    enhanced:    {predicate: produced_units_ex_tower, params: {count: 2, distinct_buildings: 2, building_types_any: [airbase]}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: build}, label: "ЛЬГОТНАЯ СТРОЙКА"}
    описание: "Произведите 2 войска в двух разных зданиях, не считая вышку — награда: монета, 3 боеприпаса и контейнер. Если одно из зданий — авиабаза, условие усилено и приносит 2 трофейных очка и карту задания. Разыграйте карту и стройте бесплатно на льготных условиях — конвейер простаивать не должен."
  - id: o03
    name: "Опорный пункт"
    kind: regular
    type: incident
    # вышка (скорость 0, дот) поставлена вне гекса ЦУ — снять её нельзя
    requirement: {predicate: tower_placed_off_cu, params: {}}
    enhanced:    {predicate: tower_placed_off_cu, params: {borders_enemy: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {module: attack, debris: 1, objective_card: 1}
    top: {effect: gain, params: {coin: 1}, label: "МАРОДЁРЫ (аппрокс.: +1 монета)"}
    описание: "Поставьте вышку отдельно от центра управления — снять её будет уже нельзя — и заберите монету, 3 боеприпаса и контейнер. Если вышка при этом граничит с врагом, условие усилено: модуль атаки, трофейное очко и карта задания. Разыграйте карту — мародёры на передовой приносят лишнюю монету."
  - id: o04
    name: "Жила"
    kind: regular
    type: state
    requirement: {predicate: powered_miners_distinct_spawns, params: {count: 2}}
    enhanced:    {predicate: powered_miners_distinct_spawns, params: {count: 2, nonstart: 1}}
    base_reward: {coin: 1, ammo: 2, container: 2}
    special_reward: {kelium: 1, objective_card: 1}
    top: {effect: move_unit, params: {hexes: 1}, label: "ФОРСАЖ: войско на 1 гекс дальше"}
    описание: "Запитайте энергией минимум 2 добытчика на разных тайлах зарождения — награда: монета, 2 боеприпаса и 2 контейнера. Если хотя бы один добытчик стоит не на стартовом тайле, условие усилено и приносит келемий и карту задания. Разыграйте карту ради форсажа — одно войско пройдёт на гекс дальше."
  - id: o05
    name: "Выработка"
    kind: regular
    type: incident
    requirement: {predicate: last_kelium_nonstart, params: {}}
    enhanced:    {predicate: last_kelium_nonstart, params: {claimed: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {arsenal: 1, objective_card: 1}
    top: {effect: free_action, params: {action: science}, label: "МАЛАЯ НАУКА"}
    описание: "Забрав последний келемий с тайла зарождения, который не был стартовым, получите монету, 3 боеприпаса и контейнер. Если тайл к тому же остаётся за вами, условие усилено и приносит арсенальную карту и карту задания. Разыграйте карту ради малой науки — бесплатного шага по треку."
  - id: o06
    name: "Отзыв"
    kind: regular
    type: sacrifice
    # жертва позицией: войска (не вышки) ВНЕ своих гексов, с разных гексов
    sacrifice: {resource: units_off_base, amount: 2}
    requirement: {predicate: sacrifice_paid, params: {}}
    enhanced:    {predicate: sacrifice_enhanced, params: {resource: units_off_base, amount: 3}}
    base_reward: {coin: 1, ammo: 4}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: market}, label: "РАЗОВАЯ СДЕЛКА"}
    описание: "Отзовите с фронта 2 своих войска (не вышки), стоящих вне ваших гексов и на разных клетках — заплатите ими и получите монету и 4 боеприпаса. Отзовите 3, и цена усиления окупится 2 трофейными очками и картой задания. Разыграйте карту ради разовой льготной сделки на рынке — иногда выгоднее отступить и обменять."
  - id: o07
    name: "Засада"
    kind: regular
    type: state
    # из 7.1 (§9 каталога 8.0): войско укрыто в своём военном здании у фронта
    requirement: {predicate: hidden_unit_near_enemy, params: {count: 1}}
    enhanced:    {predicate: hidden_unit_near_enemy, params: {count: 2}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {arsenal: 1, objective_card: 1}
    top: {effect: free_action, params: {action: combat}, label: "ОДИНОЧНЫЙ ВЫСТРЕЛ"}
    описание: "Укройте войско в своём военном здании у самой границы с врагом — награда: монета, 3 боеприпаса и контейнер. Спрячьте так два войска сразу, и условие усилится до арсенала и карты задания. Разыграйте карту и сделайте одиночный выстрел бесплатно — засада бьёт первой."
  - id: o08
    name: "Разведка недр"
    kind: regular
    type: incident
    requirement: {predicate: miner_took_container, params: {}}
    enhanced:    {predicate: miner_took_container, params: {levels: [3, 4]}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {module: assembly, objective_card: 1}
    top: {effect: gain, params: {coin: 1}, label: "ЭКОНОМИЯ КАБЕЛЯ: +1 монета"}
    описание: "Пусть добытчик заберёт контейнер — получите монету, 3 боеприпаса и ещё один контейнер. Если контейнер окажется третьего или четвёртого уровня, условие усилено: модуль сборки и карта задания. Разыграйте карту — экономия на кабеле даёт лишнюю монету."
  - id: o09
    name: "Всеобщая мобилизация"
    kind: regular
    type: incident
    requirement: {predicate: produced_units_ex_tower, params: {count: 2, no_ammo: true}}
    enhanced:    {predicate: produced_units_ex_tower, params: {count: 3, no_ammo: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {module: assembly, objective_card: 1}
    top: {effect: gain, params: {coin: 2}, label: "СТРАХОВКА (аппрокс.: +2 монеты)"}
    описание: "Произведите 2 войска без боеприпасов, не считая вышки — награда: монета, 3 боеприпаса и контейнер. Доведите счёт до 3 войск, и условие усилится: модуль сборки и карта задания. Разыграйте карту — страховка приносит сразу 2 монеты."
  - id: o10
    name: "Форсаж производства"
    kind: regular
    type: sacrifice
    sacrifice: {resource: kelium, amount: 1}
    requirement: {predicate: sacrifice_paid, params: {}}
    enhanced:    {predicate: sacrifice_enhanced, params: {resource: kelium, amount: 2}}
    base_reward: {coin: 1, ammo: 4}
    special_reward: {module: assembly, objective_card: 1}
    top: {effect: free_action, params: {action: energy_swap}, label: "ПЕРЕКОММУТАЦИЯ"}
    описание: "Отдайте 1 келемий — и получите монету и 4 боеприпаса. Отдайте 2 келемия, и цена окупится модулем сборки и картой задания. Разыграйте карту ради перекоммутации — бесплатно переставьте энергию между зданиями."

  # ===== B. ИНФРАСТРУКТУРА — база, повёрнутая к фронту (o11-o20) =====
  - id: o11
    name: "Передовая база"
    kind: regular
    type: incident
    requirement: {predicate: built_bordering_enemy, params: {enemy: units}}
    enhanced:    {predicate: built_bordering_enemy, params: {enemy: building}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: move_unit, params: {hexes: 1}, label: "ОДИНОЧНЫЙ МАРШ"}
    описание: "Постройте здание там, где оно граничит с войсками врага — награда: монета, 3 боеприпаса, контейнер. Постройте его впритык к зданию врага, и условие усилится до 2 трофейных очков и карты задания. Разыграйте карту — одиночный марш перемещает войско на гекс без затрат."
  - id: o12
    name: "Наглая стройка"
    kind: regular
    type: state
    requirement: {predicate: building_on_hex_with_enemy_units, params: {units: 1}}
    enhanced:    {predicate: building_on_hex_with_enemy_units, params: {units: 2}}
    base_reward: {coin: 1, ammo: 4, container: 1}
    special_reward: {module: attack, debris: 1, objective_card: 1}
    top: {effect: heal_one, params: {}, label: "ЩИТ — ПЕХОТА (аппрокс.: снять 1 урон)"}
    описание: "Стройте прямо на гексе, где стоит войско врага — награда: монета, 4 боеприпаса, контейнер. Сделайте это там, где врагов сразу два, и условие усилится: модуль атаки, трофейное очко и карта задания. Разыграйте карту — щит снимает 1 урон с пехоты."
  - id: o13
    name: "Расчистка"
    kind: regular
    type: incident
    requirement: {predicate: demolished_this_turn, params: {}}
    enhanced:    {predicate: demolished_this_turn, params: {and_built: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {storage_token: 1, objective_card: 1}
    top: {effect: free_action, params: {action: mining}, label: "ОДИНОЧНАЯ ДОБЫЧА"}
    описание: "Снесите здание в свой ход — награда: монета, 3 боеприпаса и контейнер. Успейте в тот же ход и построить новое, и условие усилится: жетон хранилища и карта задания. Разыграйте карту ради одиночной бесплатной добычи."
  - id: o14
    name: "Осадный лагерь"
    kind: regular
    type: state
    cull: "[4]"
    requirement: {predicate: buildings_ring_around_hex, params: {count: 2, enemy_building_on_center: true}}
    enhanced:    {predicate: buildings_ring_around_hex, params: {count: 3, enemy_building_on_center: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {module: attack, debris: 2, objective_card: 1}
    top: {effect: heal_one, params: {}, label: "ЩИТ — ТЕХНИКА (аппрокс.: снять 1 урон)"}
    описание: "Обложите вражеское здание своими постройками с двух сторон — награда: монета, 3 боеприпаса и контейнер. Обложите его с трёх сторон, и условие усилится: модуль атаки, 2 трофейных очка и карта задания. Разыграйте карту — щит снимает 1 урон с техники: осада держит крепость в кольце."
  - id: o15
    name: "Стройбум"
    kind: regular
    type: incident
    # buildOps в журнале уже НЕ считает бесплатный перенос ЦУ
    requirement: {predicate: build_ops_this_turn, params: {count: 2}}
    enhanced:    {predicate: build_ops_this_turn, params: {count: 3}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: combat}, label: "ОДИНОЧНЫЙ ВЫСТРЕЛ"}
    описание: "Совершите 2 строительные операции за один ход — награда: монета, 3 боеприпаса и контейнер. Успейте сделать три, и условие усилится до 2 трофейных очков и карты задания. Разыграйте карту — бесплатный одиночный выстрел довершает бум стройки."
  - id: o16
    name: "Переезд"
    kind: regular
    type: incident
    requirement: {predicate: moved_noncu_building, params: {count: 1}}
    enhanced:    {predicate: moved_noncu_building, params: {count: 2}}
    base_reward: {coin: 1, ammo: 2, container: 2}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: gain, params: {kelium: 1}, label: "БОГАТАЯ ЖИЛА: +1 келемий"}
    описание: "Перенесите здание, не считая центра управления — награда: монета, 2 боеприпаса и 2 контейнера. Перенесите два здания за ход, и условие усилится до 2 трофейных очков и карты задания. Разыграйте карту — богатая жила приносит лишний келемий."
  - id: o17
    name: "Штаб на передовой"
    kind: regular
    type: incident
    requirement: {predicate: moved_cu_to_virgin_hex, params: {}}
    enhanced:    {predicate: moved_cu_to_virgin_hex, params: {borders_enemy: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: heal_one, params: {}, label: "ПОЛЕВОЙ РЕМОНТ: снять 1 урон"}
    описание: "Перенесите центр управления на гекс, где ещё никто не строил — награда: монета, 3 боеприпаса и контейнер. Перенесите его так, чтобы он граничил с врагом, и условие усилится до 2 трофейных очков и карты задания. Разыграйте карту — полевой ремонт снимает 1 урон."
  - id: o18
    name: "Полная нагрузка"
    kind: regular
    type: state
    requirement: {predicate: no_unpowered_buildings, params: {min_buildings: 1}}
    enhanced:    {predicate: no_unpowered_buildings, params: {min_buildings: 4}}
    base_reward: {coin: 1, ammo: 2, container: 1}
    special_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {ammo: 1}, label: "ТРОФЕЙНАЯ КОМАНДА (аппрокс.: +1 БПР)"}
    описание: "Держите все свои здания под энергией — хотя бы одно у вас должно стоять — награда: монета, 2 боеприпаса и контейнер. Доведите число запитанных зданий до 4, и условие усилится до трофейного очка и карты задания. Разыграйте карту — трофейная команда приносит лишний боеприпас."
  - id: o19
    name: "Военпром"
    kind: regular
    type: state
    # предикат считает ТОЛЬКО казарму/завод/авиабазу (ЦУ не военное здесь)
    requirement: {predicate: military_buildings_of_distinct_types, params: {count: 2, all_powered: true}}
    enhanced:    {predicate: military_buildings_of_distinct_types, params: {count: 3, all_powered: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {kelium: 1, objective_card: 1}
    top: {effect: place_damage, params: {}, label: "КОНВЕРСИЯ (аппрокс.: 1 урон соседу)"}
    описание: "Постройте и запитайте энергией 2 разных вида военных зданий — казарму, завод или авиабазу — награда: монета, 3 боеприпаса и контейнер. Соберите все три вида под энергией, и условие усилится до келемия и карты задания. Разыграйте карту — конверсия наносит 1 урон соседнему врагу."
  - id: o20
    name: "Коммутация"
    kind: regular
    type: incident
    requirement: {predicate: energy_swap_cross_hex, params: {sources: 2}}
    enhanced:    {predicate: energy_swap_cross_hex, params: {sources: 2, and_built: true}}
    base_reward: {coin: 1, ammo: 2, container: 1}
    special_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {ammo: 1}, label: "ЛИШНЯЯ ОБОЙМА: +1 боеприпас"}
    описание: "Перекиньте энергию между зданиями на разных гексах, используя минимум 2 источника — награда: монета, 2 боеприпаса и контейнер. Сделайте это и заодно постройте здание в тот же ход — условие усилится до трофейного очка и карты задания. Разыграйте карту — лишняя обойма добавляет боеприпас."

  # ===== C. ОПЕРАЦИЯ — война платит (o21-o32) =====
  - id: o21
    name: "Первая кровь"
    kind: regular
    type: incident
    requirement: {predicate: destroyed_enemy_this_turn, params: {count: 1}}
    enhanced:    {predicate: destroyed_two_in_one_battle_this_turn, params: {}}
    base_reward: {coin: 5, container: 1}
    special_reward: {module: attack, objective_card: 1}
    top: {effect: free_action, params: {action: assembly}, label: "МАЛАЯ СБОРКА"}
    описание: "Уничтожьте войско врага за один ход — награда: 5 монет и контейнер. Уничтожьте сразу двоих в одном бою, и условие усилится: модуль атаки и карта задания. Разыграйте карту ради малой сборки — первая кровь окупает себя с запасом."
  - id: o22
    name: "Зачистка"
    kind: regular
    type: incident
    # из 7.1 (§9): нейтральные постройки — вход в войну, работает и вдвоём
    requirement: {predicate: destroyed_neutral_this_turn, params: {count: 1}}
    enhanced:    {predicate: destroyed_neutral_this_turn, params: {count: 1, and_damaged_enemy: true}}
    base_reward: {coin: 4, container: 1}
    special_reward: {arsenal: 1, objective_card: 1}
    top: {effect: free_action, params: {action: science}, label: "МАЛАЯ НАУКА"}
