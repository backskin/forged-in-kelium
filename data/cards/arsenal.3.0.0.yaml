# CONTENT: arsenal  version 3.0.0
# ============================================================================
#  АРСЕНАЛ 3.0 — УТИЛЬ ПЕРЕСОБРАН ЦЕЛИКОМ (заказ дизайнера 21.08.2026)
# ============================================================================
#  НИЗ КАРТ НЕ ИЗМЕНЁН НИ У ОДНОЙ. Способности живут в коде, они проверены, и
#  трогать их этой правкой незачем: переделан только ВЕРХ — утиль.
#
#  ЧТО БЫЛО НЕ ТАК, ЗАМЕРОМ. Из 45 карт утиль «выполни действие» стоял на 15, и
#  ровно эти карты боты не устанавливали НИКОГДА: за 300 партий 26 карт не
#  установлены ни разу, и у одиннадцати из двенадцати оставшихся после первой
#  починки утиль — целое бесплатное действие. Это не ошибка ботов: действие в
#  этой игре самый дорогой ресурс (их около двадцати четырёх на партию), и
#  выбор «карта или действие» решался в пользу действия всегда.
#
#  ПРАВИЛО НОВОГО УТИЛЯ: утиль должен быть СОПОСТАВИМ со своим низом, а не
#  сильнее его. Поэтому:
#   * целое бесплатное действие без оговорок в колоде НЕ ОСТАЛОСЬ ни на одной
#     карте — там, где действие уместно, у него есть предел («одна операция»,
#     «два жетона», «двумя добытчиками») либо оно идёт с надбавкой вместо
#     широты («Стройка со скидкой», «Рынок обеими половинами»);
#   * появилась плата за ПОЛОЖЕНИЕ НА ПОЛЕ («по 2 монеты за каждое войско») —
#     утиль, который у развернувшегося игрока стоит дорого, а у отставшего
#     дёшево, и потому не одинаков для всех;
#   * появились взаимодействия: кража ресурса, кража карты арсенала, обновление
#     витрины, десант на свободный гекс;
#   * шесть карт закрывают ВСЕ ШЕСТЬ ПАР щита из четырёх родов войск.
#
#  ЧЕГО В ЭТОЙ РЕДАКЦИИ НЕТ. Два утиля из списка дизайнера требуют РЕАКЦИИ на
#  чужое действие («в чужой Бой забери инициативу», «после чужой Добычи забери
#  келемий»). Реакций на чужой ход движок пока не умеет — это отдельный
#  механизм, а не эффект; заводить карту, которая не работает, нельзя.
#
#  СОСТАВ НЕ ИЗМЕНЁН: те же 44 карты с теми же номерами, что в 2.3.0.
# ============================================================================
