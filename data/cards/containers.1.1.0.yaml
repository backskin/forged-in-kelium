# CONTENT: containers  version 1.1.0
# ============================================================================
#  БАЛАНС КОНТЕЙНЕРОВ (заказ дизайнера 15.08.2026)
# ============================================================================
#  ЧТО БЫЛО НЕ ТАК. Замер выбора стороны показал: у 31 карты из 32 одну сторону
#  не берут никогда. Часть этого — на совести бота (он выбирает по фиксированным
#  весам и не смотрит на положение), но четыре беды видны и без ботов, прямо в
#  данных:
#
#   1. КЕЛЕМИЙ КАК НАГРАДА СТАЛ ФАНТИКОМ. В действующем своде келемий в хранилище
#      победных очков не даёт вовсе. Особенно нелепа была c31 — РЕДКАЯ карта, где
#      выбор стоял между половиной модуля и одной единицей сырья без очков.
#      Везде заменён на трофеи.
#   2. ПОЛНЫЕ ДУБЛИ. c07 и c17 были одной и той же картой, c11 и c18 — тоже.
#      Четыре карты из 32 оказывались двумя, съедая 12% разнообразия колоды.
#      Разведены: c17 стала про урон, c18 — про движение.
#   3. СТРОГО ХУДШАЯ СТОРОНА. c02 предлагала «3 монеты» против «1 боеприпас +
#      1 монета», c15 — «карта задания» против того же. По курсу остальной колоды
#      боеприпас примерно равен монете, значит вторая сторона была просто хуже, и
#      выбора карта не давала. Выровнено.
#   4. ТИРЫ НЕ РАЗЛИЧАЛИСЬ ПО СИЛЕ. Обычная c08 давала до 5 монет выгоды, а
#      хорошая c21 — ровно 5 монет и «1 келемий» в довесок. Тир перестаёт что-то
#      значить, если хорошая карта равна обычной.
#
#  ПРАВИЛО ТИРОВ, к которому приведена колода:
#   обычные (20) — один ресурс или одно мелкое действие;
#   хорошие (8)  — два ресурса разом либо действие с последствием;
#   редкие (4)   — модули и позолота, и альтернатива им сопоставима по силе.
#
#  Калибровка: монета 1, боеприпас 1, трофей 1.5, карта задания 2, контейнер 1.5.
#  (Прежняя калибровка ставила келемий в 3 — он из наград убран, строка снята.)
# ============================================================================
