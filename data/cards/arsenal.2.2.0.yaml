  # ==================== КАРТЫ-ЦЕЛИ: НАГРАДА ЗА ЗАБРОШЕННОЕ ====================
  # Правило дизайнера 15.08.2026: карты-цели награждают за то, чего никто не
  # делает. Что именно заброшено — не догадка, а перепись 200 партий
  # (kelium.Unpopular), и цифры оказались резче ожидаемого:
  #
  #   ВОЙСКА на поле к концу: вышки 50%, пехота 32%, техника 13%, АВИАЦИЯ 5%.
  #     Авиация — 0.14 жетона на игрока. Её просто нет в игре.
  #   ЗДАНИЯ: энергостанции 36%, добытчики 35%, казармы 7%, завод 6%, АВИАБАЗА 3%.
  #     Военных зданий втрое меньше, чем экономических, вместе взятых.
  #   ДЕЙСТВИЯ: добыча 8.9 за партию, рынок 7.7, стройка 6.7 — против БОЯ 3.3 и
  #     СМЕНЫ ЭНЕРГИИ 2.6. Бой — предпоследнее действие по частоте.
  #   ДОБЫТЧИКИ/ЭНЕРГОСТАНЦИИ 2-го уровня — самые редкие (7-8%), их пропускают.
  #
  # Поэтому шесть целей бьют ровно туда: авиация, авиабаза, техника, второй
  # уровень, смена энергии и бой. Ни одна не награждает добычу и науку — им и
  # так достаётся 39% всех очков игры.
