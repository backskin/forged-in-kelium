# CONTENT: arsenal  version 2.2.0
# ============================================================================
#  АРСЕНАЛ 2.1 — 30 КАРТ (заказ дизайнера 15.08.2026)
# ============================================================================
#  ЧТО ДОБАВЛЕНО против 2.0.0: шесть карт, дающих ПОБЕДНЫЕ ОЧКИ за то, что у
#  игрока накопилось к концу партии. Такого канала в игре не было вовсе — замер
#  показал, что поле objective_card_vp считается движком и даёт РОВНО НОЛЬ,
#  потому что очков не напечатано ни на одной карте.
#
#  Две формы, обе просят у игрока СОБРАТЬ КОМБИНАЦИЮ, а не накопить один ресурс:
#   * «1 ПО за каждые N чего-то» — линейная плата за специализацию;
#   * «Y ПО, если к концу партии у тебя есть такой-то набор» — порог за сочетание
#     разного, то есть за евро-комбинацию, а не за одну гору.
#
#  ПОЧЕМУ ЭТО ВАЖНО. Разбор источников очков (15.08.2026) показал, что игра
#  выигрывается наукой (39% всех очков) и что ни один источник не даёт СВОЕГО
#  пути к победе — все идут одним маршрутом с разной скоростью. Карты-цели дают
#  игроку личную цель, известную ему с середины партии, и это самый дешёвый по
#  правилам способ развести партии между собой.
#
#  ВИТРИНА. С 15.08.2026 карты арсенала не берут вслепую: рядом с планшетом
#  науки лежат ДВЕ ОТКРЫТЫЕ карты, игрок выбирает одну, место пополняется с
#  верха колоды. Награда «карта арсенала» с задания берётся вслепую с колоды.
#  Поэтому карты-цели работают: их видно заранее, и под них можно играть.
# ============================================================================
# ============================================================================
#  РЕВЬЮ ОДНОРАЗОВЫХ ЭФФЕКТОВ (утиля) — 17.08.2026
# ============================================================================
#  Правки по замечаниям дизайнера к таблице 2 «одноразовые эффекты арсенала»:
#
#  1. СЛИШКОМ МНОГО ДЕНЕГ. «5 монет» стояло на пяти картах из тридцати, «4
#     монеты» и «2 монеты + 1 боеприпас» — ещё на двух. Самые мелкие денежные
#     утили убраны совсем, крупный оставлен ровно один (b01).
#  2. СЛИШКОМ МНОГО БЕСПЛАТНЫХ БОЁВ. Их было четыре (b14, bs5, v05, v06);
#     осталось два. Бой — самый сильный утиль в игре, и на каждой седьмой карте
#     ему не место.
#  3. ПОЛНЫЕ БЕСПЛАТНЫЕ ДЕЙСТВИЯ ЖИВУТ ЗДЕСЬ. Добыча, Стройка и Маркет без
#     ограничений остаются на арсенале; у карт заданий те же действия идут с
#     пределом («одна операция», «одним зданием») — иначе задание выгоднее
#     сжечь, чем выполнить.
#  4. b12 «Научный подлог» давал 4 обломка ниоткуда — дизайнер: нечестно.
#     Заменён на помеху сопернику.
#  5. ЧЕТЫРЕ НОВЫХ ЭФФЕКТА, которых не хватало: сбросить чужую карту арсенала;
#     забрать жетон первого игрока вместе с монетой у его владельца; снять
#     лимит СПЕЦ-действий до конца хода; вернуть на маркет сброшенную карту
#     сделок; заменить карту приказа в руке на карту из своего сброса.
#
#  ДЕЙСТВИЕ НАЗЫВАЕТСЯ МАРКЕТ, не «Рынок» (СВОД §11) — метки исправлены.
# ============================================================================
