# CONTENT: containers  version 4.1.0
# ============================================================================
#  КОНТЕЙНЕРЫ 4.1 — НАБОР ДИЗАЙНЕРА 01.09.2026 (32 карты, без пустышек)
# ============================================================================
#  Заказ дизайнера: полностью заменить состав 4.0.0 на 13 названных форм,
#  сбалансированных по частоте вручную (не по курсу ценности из 4.0.0).
#  «Трофей» из заказа — это ТРОФЕЙ (Resource.TROPHY), дизайнер уточнил,
#  что имел в виду именно его, а не жетон destroyedTokens из боя.
#
#  1 ПЕХОТА / 1 ТЕХНИКА — новые для контейнеров формы. Выдаются через
#  существующий эффект "landing" (ДЕСАНТ, см. Effects.landing) с добавленным
#  01.09.2026 параметром {@code types}: сужает высадку до одного названного
#  рода войск вместо выбора из всех. Высаживается в свою зону стройки, как
#  любой другой десант — новой пространственной логики нет, только вызов уже
#  проверенного эффекта с другим параметром.
#
#  БЕЗ ВЫБОРА: только сторона "a", как и в 4.0.0.
# ============================================================================
