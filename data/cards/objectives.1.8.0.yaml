# CONTENT: objectives  version 1.8.0
# ============================================================================
#  КАТАЛОГ ЗАДАНИЙ 10.0 — РЕВЬЮ ДИЗАЙНЕРА 17.08.2026
# ============================================================================
#  ЧТО ЭТО ЗА ВЕРСИЯ. Дизайнер прошёл по всем 51 карте каталога 1.7.0 и оставил
#  построчные замечания. Здесь они выполнены. Ниже — правила, которые из этих
#  замечаний следуют и обязательны для ЛЮБОЙ будущей карты задания.
#
#  ПРАВИЛО 1. ТОЛЬКО ТЕРМИНЫ ИГРЫ. На карте не может стоять слово, которого нет
#    в §11 СВОДа. Запрещено: «у границы с врагом», «держите в гексе», «войска
#    собраны как боеприпасы», «гекс, где ещё никто не строил», «уровень
#    контейнера», «под энергией», «claimed». Разрешено ровно то, что перечислено
#    в §9.3 (словарь гексов) и §11 (термины).
#
#  ПРАВИЛО 2. ГЛАГОЛ СООТВЕТСТВУЕТ ВИДУ ТРЕБОВАНИЯ. Требование СОСТОЯНИЯ пишется
#    через «имей / у тебя / твои жетоны стоят»; требование ПРОИСШЕСТВИЯ — через
#    «В ЭТОТ ХОД сделай». Императив «построй», «запитай», «выведи» в карте
#    состояния запрещён: карта тогда обещает событие, а проверяет расстановку.
#
#  ПРАВИЛО 3. ПРИПИСКА «В ЭТОТ ХОД» ОБЯЗАТЕЛЬНА У КАЖДОГО ПРОИСШЕСТВИЯ. Без неё
#    карта читается как «когда-нибудь построил», а доказать это за столом
#    нечем: записи матча у игроков нет.
#
#  ПРАВИЛО 4. ЗАДАНИЕ НЕ ВЫПОЛНЯЕТСЯ ОДНИМ ДЕЙСТВИЕМ С ПУСТОГО МЕСТА. Если до
#    взятия карты у игрока не было ни одной предпосылки, а карта закрывается
#    одним действием в любой момент партии, это не задание. Требование обязано
#    опираться либо на уже сложившуюся расстановку, либо на два разных события
#    в одном ходу, либо на позиционное условие, которое надо готовить заранее.
#
#  ПРАВИЛО 5. ПРОВЕРЯЕМОСТЬ ЗА СТОЛОМ. Условие, которое нельзя проверить
#    глазами по столу, на карте не печатается. Поэтому убрана «Охота на лидера»
#    в прежней редакции: суммарные победные очки в середине партии никто не
#    считает, это было условие для симуляции, а не для людей.
#
#  ПРАВИЛО 6. НАГРАДЫ. Не больше ДВУХ типов в базовой награде, не больше ДВУХ в
#    усиленной и не больше ТРЁХ РАЗНЫХ типов на карте суммарно. Базовая награда
#    набирается из монет, боеприпасов и карт задания; награда одним типом —
#    нормальная и частая форма. КОНТЕЙНЕРОВ В НАГРАДАХ ЗАДАНИЙ БОЛЬШЕ НЕТ ВОВСЕ:
#    прежде контейнер стоял на каждой карте и обесценивал и себя, и карту.
#
#  ПРАВИЛО 7. НАЧАЛЬНЫЕ ЗАДАНИЯ. Усиления у них нет ни у одного. Награда у всех
#    одна и та же: 1 обломок и 1 карта задания. Утиль есть у всех: у половины
#    +1 монета, у половины +1 боеприпас.
#
#  ПРАВИЛО 8. УТИЛЬ (одноразовый эффект вместо выполнения) — по ревью
#    одноразовых эффектов 17.08.2026. Слова «марш» в игре нет: перемещение
#    называется Движением, и на картах стоит СВОБОДНОЕ ДВИЖЕНИЕ. «Одиночного
#    выстрела» тоже нет — есть СВОБОДНЫЙ БОЙ. Бесплатная Сборка и Стройка всегда
#    с пределом: «одним зданием», «двумя зданиями», «одна строительная
#    операция» — без предела утиль был сильнее выполненного задания, и карту
#    выгоднее было сжечь, чем выполнить. Утиль вида «+1 монета», «+1 боеприпас»,
#    «+1 обломок», «+1 контейнер», «+1 келемий», «+1 карта арсенала» с обычных
#    карт убран целиком: это либо пустышка, либо имба, третьего не выходит.
#    Взамен заведены пять эффектов: ЩИТ (снимает первое попадание по жетонам
#    выбранного рода), ДЕСАНТ (размести до двух войск разных родов), +1 К
#    СКОРОСТИ рода до конца хода, СМЕНА ЭНЕРГИИ ИЛИ СМЕНА МОДУЛЕЙ на выбор,
#    КОНВЕРСИЯ (келемий в боеприпас или в обломок).
#
#  СОСТАВ: 40 обычных карт (ровно 20 про войну и давление, 20 про экономику,
#  науку, жертвы и рисунки) + 12 начальных.
#
#  ЧТО ВЫРЕЗАНО ПО ПРЯМОМУ УКАЗАНИЮ ДИЗАЙНЕРА:
#   o13 «Расчистка», o24 «Чистая работа», o44 «Блокада» — «мусор».
#   o43 в прежней редакции («уничтожь жетон лидера по ПО») — непроверяемо за
#     столом; id переиспользован под проверяемую редакцию «Охота на сильного».
#
#  СКАМЕЙКА (готовые карты, не влезшие в сорок; порядок — по готовности):
#   o37 «Три трека»      — дублирует o36 по треку науки;
#   o38 «Промышленник»   — дублирует o04 по запитанным добытчикам;
#   o30 «Мародёр»        — слишком просто, оставлен как запас на слабые слоты;
#   o32 «Вклад»          — жертва келемием, самая дорогая из жертв;
#   o47 «Демонтаж»       — жертва зданием без компенсации;
#   o48 «Арсенальный набор», o49 «Схрон» — наборы карт на руке;
#   o55 «Периметр»       — рисунок до края поля.
#  Их данные лежат в конце файла в блоке bench: и в раздачу не попадают.
# ============================================================================
meta:
  id: 1.8.0
  type: objectives

objectives:
  # ==================== ВОЙНА И ДАВЛЕНИЕ (20 карт) ====================

  - id: o03
    name: "Опорный пункт"
    kind: regular
    type: state
    # БЫЛО: «в этот ход поставь вышку вне гекса ЦУ» — один найм, ПРАВИЛО 4.
    # СТАЛО: состояние из двух вышек. Вышка неподвижна (скорость 0), поэтому
    # две вышки на разных гексах — это две заранее продуманные Сборки ЦУ.
    requirement: {predicate: towers_off_cu_hexes, params: {count: 2}}
    enhanced:    {predicate: towers_off_cu_hexes, params: {count: 2, on_enemy_hex: true}}
    base_reward: {ammo: 3}
    special_reward: {module: attack, objective_card: 1}
    top: {effect: free_action, params: {action: movement}, label: "СВОБОДНОЕ ДВИЖЕНИЕ"}
    описание: "Имей на поле две свои вышки на разных гексах, и ни одна из них не стоит на гексе с твоим ЦУ, — награда 3 боеприпаса. Если хотя бы одна из этих вышек стоит на гексе, где есть жетоны противника, условие усилено: жетон модуля атаки и карта задания. Вышка не двигается вовсе, поэтому опорный пункт выбирают один раз и навсегда."

  - id: o07
    name: "Засада"
    kind: regular
    type: state
    # ФОРМУЛИРОВКА ПЕРЕПИСАНА: «у самой границы с врагом» — не термин игры.
    # По §9.3 законно говорить «гекс, где есть жетоны противника», и «соседний
    # гекс». Механика прежняя: войско ВНУТРИ своего военного здания того же
    # рода (§5.3), гекс этого здания соседний с гексом противника.
    requirement: {predicate: hidden_unit_near_enemy, params: {count: 1}}
    enhanced:    {predicate: hidden_unit_near_enemy, params: {count: 2}}
    base_reward: {ammo: 3}
    special_reward: {arsenal: 1, objective_card: 1}
    top: {effect: free_action, params: {action: combat}, label: "СВОБОДНЫЙ БОЙ"}
    описание: "Имей своё войско внутри своего военного здания того же рода, стоящего на гексе, соседнем с гексом, где есть жетоны противника, — награда 3 боеприпаса. Держи так сразу два войска, и условие усилено: карта арсенала и карта задания. Гарнизон в здании не виден до первого выстрела."

  - id: o11
    name: "Передовая база"
    kind: regular
    type: incident
    # «В ЭТОТ ХОД» было пропущено в тексте, хотя код всегда читал журнал хода
    # (builtOnHexes). ПРАВИЛО 3: приписка обязана стоять на карте.
    requirement: {predicate: built_bordering_enemy, params: {enemy: units}}
    enhanced:    {predicate: built_bordering_enemy, params: {enemy: building}}
    base_reward: {ammo: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: movement}, label: "СВОБОДНОЕ ДВИЖЕНИЕ"}
    описание: "В ЭТОТ ХОД построй своё здание на гексе, соседнем с гексом, где есть войска противника, — награда 3 боеприпаса. Построй его на гексе, соседнем с гексом, где есть здание противника, и условие усилено: 2 обломка и карта задания. Передовая база строится под огнём — потому и платит."

  - id: o12
    name: "Наглая стройка"
    kind: regular
    type: incident
    # БЫЛО помечено как состояние, а текст требовал события («строй»). Стройка —
    # событие, и доказать её задним числом нечем: ПРАВИЛА 2 и 3.
    requirement: {predicate: built_on_hex_with_enemy_units, params: {units: 1}}
    enhanced:    {predicate: built_on_hex_with_enemy_units, params: {units: 2}}
    base_reward: {coin: 4}
    special_reward: {module: attack, objective_card: 1}
    top: {effect: shield, params: {types: [infantry, vehicle]}, label: "ЩИТ: пехота или техника"}
    описание: "В ЭТОТ ХОД построй своё здание на гексе, где стоит войско противника, — награда 4 монеты. Сделай это на гексе, где стоят два войска противника, и условие усилено: жетон модуля атаки и карта задания. Стройка под чужим стволом — заявка, а не расчёт."

  - id: o14
    name: "Осадный лагерь"
    kind: regular
    type: state
    cull: "[4]"
    requirement: {predicate: buildings_ring_around_hex, params: {count: 2, enemy_building_on_center: true}}
    enhanced:    {predicate: buildings_ring_around_hex, params: {count: 3, enemy_building_on_center: true}}
    base_reward: {ammo: 3}
    special_reward: {module: attack, debris: 2}
    top: {effect: shield, params: {types: [vehicle, aircraft]}, label: "ЩИТ: техника или авиация"}
    описание: "Имей свои здания на двух гексах, соседних с одним и тем же гексом, где стоит здание противника, — награда 3 боеприпаса. Замкни кольцо с трёх сторон, и условие усилено: жетон модуля атаки и 2 обломка. Осада стоит дорого, поэтому и платит крупно."

  - id: o17
    name: "Штаб на передовой"
    kind: regular
    type: incident
    # БЫЛО «перенеси ЦУ на гекс, где ещё никто не строил». Такого состояния в
    # игре нет: снятое здание не оставляет следа, и проверить историю гекса за
    # столом нечем. СТАЛО — измеримое расстояние до чужого ЦУ.
    requirement: {predicate: cu_placed_near_enemy_cu, params: {distance: 2}}
    enhanced:    {predicate: cu_placed_near_enemy_cu, params: {distance: 2, adjacent_enemy_building: true}}
    base_reward: {coin: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: assembly, buildings: 1}, label: "СБОРКА ОДНИМ ЗДАНИЕМ"}
    описание: "В ЭТОТ ХОД построй или перенеси своё ЦУ так, чтобы от него до гекса с ЦУ противника осталось не больше 2 гексов, — награда 3 монеты. Поставь его так, чтобы оно примыкало к зданию противника, и условие усилено: 2 обломка и карта задания. Штаб, придвинутый к чужому, экономит каждое перемещение."

  - id: o21
    name: "Первая кровь"
    kind: regular
    type: incident
    # БЫЛО: один уничтоженный жетон — за ход это делается спокойно (ПРАВИЛО 4).
    requirement: {predicate: destroyed_enemy_this_turn, params: {count: 2}}
    enhanced:    {predicate: destroyed_enemy_this_turn, params: {count: 2, min_hp: 2}}
    base_reward: {coin: 4}
    special_reward: {module: attack, objective_card: 1}
    top: {effect: free_action, params: {action: assembly, buildings: 2}, label: "СБОРКА ДВУМЯ ЗДАНИЯМИ"}
    описание: "В ЭТОТ ХОД уничтожь два жетона противника — награда 4 монеты. Если у одного из них прочность была 2 или больше, условие усилено: жетон модуля атаки и карта задания. Первая кровь считается по двум, а не по одному."

  - id: o22
    name: "Зачистка"
    kind: regular
    type: state
    # ЖЕРТВА ТРОФЕЯМИ. Базовое требование — состояние (в трофеях лежит чужое
    # здание), плата — вернуть его владельцу; усиление — вернуть ещё один
    # трофейный жетон. Возврат идёт мимо Науки: трофей уходит, очков не дав.
    requirement: {predicate: trophy_contains, params: {building: 1}}
    sacrifice: {resource: trophies, amount: 1}
    enhanced:  {predicate: sacrifice_enhanced, params: {resource: trophies, amount: 2}}
    base_reward: {coin: 3, ammo: 2}
    special_reward: {objective_card: 1}
    top: {effect: free_action, params: {action: science}, label: "СВОБОДНАЯ НАУКА"}
    описание: "Имей в трофеях здание противника и верни его владельцу — награда 3 монеты и 2 боеприпаса. Верни владельцу ещё один трофейный жетон, и условие усилено: карта задания. Отданный трофей очков не приносит: за это и платят."

  - id: o23
    name: "Подранки"
    kind: regular
    type: incident
    requirement: {predicate: damaged_distinct_no_kills, params: {count: 2}}
    enhanced:    {predicate: damaged_distinct_no_kills, params: {count: 3}}
    base_reward: {ammo: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: speed_boost, params: {}, label: "+1 К СКОРОСТИ ОДНОГО РОДА ДО КОНЦА ХОДА"}
    описание: "В ЭТОТ ХОД нанеси урон двум разным жетонам противника — войскам, зданиям, как выйдет — и не уничтожь ни одного. Награда: 3 боеприпаса. Рань так три жетона, и условие усилено: 2 обломка и карта задания. Подранков добивают позже и дешевле."

  - id: o45
    name: "Пристрелка"
    kind: regular
    type: incident
    # Вторая карта той же семьи, что o23: дизайнер разрешил держать в колоде
    # больше одной карты «рань, но не добей». Здесь ось другая — здания.
    requirement: {predicate: damaged_distinct_enemy_buildings, params: {count: 2}}
    enhanced:    {predicate: damaged_distinct_enemy_buildings, params: {count: 3}}
    base_reward: {coin: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: shield, params: {types: [infantry, aircraft]}, label: "ЩИТ: пехота или авиация"}
    описание: "В ЭТОТ ХОД нанеси урон двум разным зданиям противника — награда 3 монеты. Достань три разных здания, и условие усилено: 2 обломка и карта задания. Пристрелка не сносит стену, но показывает, где она тонкая."

  - id: o25
    name: "Осада"
    kind: regular
    type: state
    # БЫЛО «нанеси удар за один ход» — «удар за два хода» не бывает, приписка
    # была пустой. СТАЛО: проверяемое состояние трофейного пространства.
    requirement: {predicate: trophy_contains, params: {building: 1}}
    enhanced:    {predicate: trophy_contains, params: {building_types: [miner]}}
    base_reward: {objective_card: 2}
    special_reward: {module: attack}
    top: {effect: free_action, params: {action: assembly, buildings: 1}, label: "СБОРКА ОДНИМ ЗДАНИЕМ"}
    описание: "Имей в трофеях здание противника — награда 2 карты задания. Если среди твоих трофеев есть добытчик противника, условие усилено: жетон модуля атаки. Снесённая экономика соседа стоит дороже снесённой казармы."

  - id: o26
    name: "Блицкриг"
    kind: regular
    type: incident
    # БЫЛО «переместись и убей тем же войском» — дизайнер: мусор. СТАЛО: два
    # уничтожения ОДНИМ жетоном войска за ход, усиление — этот жетон пехота.
    requirement: {predicate: kills_by_one_unit, params: {count: 2}}
    enhanced:    {predicate: kills_by_one_unit, params: {count: 2, unit_type: infantry}}
    base_reward: {coin: 5}
    special_reward: {module: attack, objective_card: 1}
    top: {effect: free_action, params: {action: combat}, label: "СВОБОДНЫЙ БОЙ"}
    описание: "В ЭТОТ ХОД уничтожь два жетона противника одним своим жетоном войска — награда 5 монет. Если это войско — пехота, условие усилено: жетон модуля атаки и карта задания. Пехота, снявшая двоих за ход, стоит целого завода."

  - id: o27
    name: "На чужом дворе"
    kind: regular
    type: state
    # «Держите там» — так о гексе не говорят. Правильно: «имей на одном гексе».
    requirement: {predicate: unit_on_hex_with_enemy_units, params: {count: 1}}
    enhanced:    {predicate: unit_on_hex_with_enemy_units, params: {count: 2}}
    base_reward: {ammo: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: assembly, buildings: 2}, label: "СБОРКА ДВУМЯ ЗДАНИЯМИ"}
    описание: "Имей своё войско на гексе, где есть войска противника, — награда 3 боеприпаса. Имей на одном таком гексе два своих войска, и условие усилено: 2 обломка и карта задания. Гекс никому не принадлежит — но стоять на нём вдвоём неудобно обоим."

  - id: o28
    name: "Клещи"
    kind: regular
    type: state
    cull: "[4]"
    requirement: {predicate: units_bordering_enemy_units_hex, params: {hexes: 2}}
    enhanced:    {predicate: units_bordering_enemy_units_hex, params: {hexes: 3}}
    base_reward: {ammo: 3}
    special_reward: {module: attack, objective_card: 1}
    top: {effect: free_action, params: {action: movement}, label: "СВОБОДНОЕ ДВИЖЕНИЕ"}
    описание: "Имей свои войска на двух гексах, соседних с одним и тем же гексом, где есть войска противника, — награда 3 боеприпаса. Замкни клещи с трёх сторон, и условие усилено: жетон модуля атаки и карта задания. Клещи не бьют — они отнимают выход."

  - id: o29
    name: "Пустой двор"
    kind: regular
    type: state
    requirement: {predicate: units_off_own_hexes, params: {count: 3}}
    enhanced:    {predicate: units_off_own_hexes, params: {count: 3, distinct_hexes: true}}
    base_reward: {coin: 4}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: assembly, buildings: 2}, label: "СБОРКА ДВУМЯ ЗДАНИЯМИ"}
    описание: "Имей три своих войска вне гексов, где стоят твои здания, — награда 4 монеты. Если все три стоят на разных гексах, условие усилено: 2 обломка и карта задания. Двор пустеет ровно тогда, когда фронт наконец поехал."

  - id: o31
    name: "Господство в небе"
    kind: regular
    type: state
    requirement: {predicate: aircraft_on_enemy_hex, params: {}}
    enhanced:    {predicate: aircraft_on_enemy_hex, params: {cu_on_hex: true}}
    base_reward: {coin: 4}
    special_reward: {module: attack, objective_card: 1}
    top: {effect: speed_boost, params: {}, label: "+1 К СКОРОСТИ ОДНОГО РОДА ДО КОНЦА ХОДА"}
    описание: "Имей свою авиацию на гексе, где есть жетоны противника, — награда 4 монеты. Если на этом гексе стоит ЦУ противника, условие усилено: жетон модуля атаки и карта задания. В воздушную ячейку чужого гекса влезает ровно одна авиация — чья первая, того и небо."

  - id: o41
    name: "Ответный удар"
    kind: regular
    checked_by: card
    type: incident
    requirement: {predicate: destroyed_in_retaliation, params: {count: 1}}
    enhanced:    {predicate: destroyed_in_retaliation, params: {count: 1, no_losses: true}}
    base_reward: {ammo: 3}
    special_reward: {module: attack, objective_card: 1}
    top: {effect: gain, params: {ammo: 2}, label: "2 боеприпаса"}
    описание: "В ЭТОТ ХОД уничтожь жетон противника в ответном бою — когда бьют тебя, а падает нападавший. Награда: 3 боеприпаса. Если в этом ответном бою ты не потерял ни одного своего жетона, условие усилено: жетон модуля атаки и карта задания. Оборона окупается только зубастая."

  - id: o42
    name: "Разорение"
    kind: regular
    checked_by: card
    type: incident
    # ЭНЕРГОСТАНЦИЯ УБРАНА ИЗ УСЛОВИЯ: «запитанная энергостанция» — не термин,
    # станция энергию производит, а не потребляет. Осталась одна цель — добытчик.
    requirement: {predicate: destroyed_enemy_economy, params: {count: 1}}
    enhanced:    {predicate: destroyed_enemy_economy, params: {count: 1, powered: true}}
    base_reward: {coin: 3}
    special_reward: {debris: 3, objective_card: 1}
    top: {effect: gain, params: {coin: 2}, label: "2 монеты"}
    описание: "В ЭТОТ ХОД уничтожь добытчик противника — награда 3 монеты. Если этот добытчик был запитан, условие усилено: 3 обломка и карта задания. Отнятый добытчик стоит сопернику всех оставшихся раундов добычи."

  - id: o43
    name: "Охота на сильного"
    kind: regular
    checked_by: card
    type: incident
    # ПЕРЕПИСАНА ЦЕЛИКОМ. Прежняя редакция требовала бить того, кто ведёт по
    # победным очкам: за столом это не считается, очки в середине партии никто
    # не знает. Новое условие видно глазами — здания на поле пересчитываются.
    requirement: {predicate: destroyed_stronger_player_token, params: {count: 1}}
    enhanced:    {predicate: destroyed_stronger_player_token, params: {count: 1, building: true}}
    base_reward: {ammo: 3}
    special_reward: {module: attack, objective_card: 1}
    top: {effect: free_action, params: {action: combat}, label: "СВОБОДНЫЙ БОЙ"}
    описание: "В ЭТОТ ХОД уничтожь жетон игрока, у которого на поле больше зданий, чем у тебя, — награда 3 боеприпаса. Если уничтоженный жетон был зданием, условие усилено: жетон модуля атаки и карта задания. Догоняющему выгодно бить того, кто оторвался, — и это видно по столу без подсчёта очков."

  - id: o46
    name: "Трофейный обоз"
    kind: regular
    type: state
    requirement: {predicate: trophy_distinct_kinds, params: {count: 3}}
    enhanced:    {predicate: trophy_distinct_kinds, params: {count: 4}}
    base_reward: {coin: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: science}, label: "СВОБОДНАЯ НАУКА"}
    описание: "Имей в трофеях жетоны трёх разных видов — пехота, техника, авиация, вышка и каждый тип здания считаются отдельно. Награда: 3 монеты. Собери четыре разных вида, и условие усилено: 2 обломка и карта задания. Обоз показывает не силу удара, а широту фронта."

  # ============ ЭКОНОМИКА, НАУКА, ЖЕРТВЫ И РИСУНКИ (20 карт) ============

  - id: o01
    name: "Полный залп"
    kind: regular
    type: incident
    # ФОРМУЛИРОВКА ПЕРЕПИСАНА. «Войска, собранные как боеприпасы» и «орудия» —
    # выдумка, таких слов в игре нет. Механика Сборки (§2.1): каждое запитанное
    # военное здание производит ЛИБО войско, ЛИБО боеприпас. Условие про то,
    # что все здания выбрали боеприпас.
    requirement: {predicate: assembly_all_chose_ammo, params: {count: 2}}
    enhanced:    {predicate: assembly_all_chose_ammo, params: {count: 2, include_types: [factory, airbase]}}
    base_reward: {coin: 2, ammo: 2}
    special_reward: {objective_card: 1}
    top: {effect: landing, params: {count: 2}, label: "ДЕСАНТ: размести до 2 войск разных родов"}
    описание: "В ЭТОТ ХОД действием Сборка произведи боеприпасы не меньше чем двумя своими зданиями и не произведи ни одного войска. Награда: 2 монеты и 2 боеприпаса. Если среди этих зданий есть завод или авиабаза, условие усилено: карта задания. Ход без единого нового войска — цена полного залпа."

  - id: o02
    name: "Конвейер"
    kind: regular
    type: incident
    requirement: {predicate: hired_distinct_kinds, params: {count: 2}}
    enhanced:    {predicate: hired_distinct_kinds, params: {count: 2, require_kinds: [aircraft], forbid_kinds: [tower]}}
    base_reward: {ammo: 2}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: energy_or_modules, params: {}, label: "СМЕНА ЭНЕРГИИ ИЛИ СМЕНА МОДУЛЕЙ"}
    описание: "В ЭТОТ ХОД найми два войска разных родов — награда 2 боеприпаса. Если среди нанятых есть авиация и нет ни одной вышки, условие усилено: 2 обломка и карта задания. Авиабаза требует трёх кубиков энергии — конвейер до неё ещё надо дотянуть."

  - id: o04
    name: "Жила"
    kind: regular
    type: state
    # НА ТАЙЛЕ ЗАРОЖДЕНИЯ ЖЕТОНОВ НЕ БЫВАЕТ. Добытчик к тайлу ПРИМЫКАЕТ — так
    # и написано. Императив «запитайте» заменён на «имей запитанными».
    requirement: {predicate: powered_miners_distinct_spawns, params: {count: 2}}
    enhanced:    {predicate: powered_miners_distinct_spawns, params: {count: 2, nonstart_all: true}}
    base_reward: {coin: 3}
    special_reward: {debris: 1, objective_card: 1}
    top: {effect: free_action, params: {action: movement}, label: "СВОБОДНОЕ ДВИЖЕНИЕ"}
    описание: "Имей запитанными два своих добытчика, примыкающих к разным тайлам зарождения, — награда 3 монеты. Если оба примыкают к нестартовым тайлам зарождения, условие усилено: обломок и карта задания. Своё зарождение вырабатывают все, чужое — только те, кто дотянулся."

  - id: o05
    name: "Выработка"
    kind: regular
    type: incident
    requirement: {predicate: last_kelium_nonstart, params: {}}
    enhanced:    {predicate: last_kelium_nonstart, params: {claimed: true}}
    base_reward: {coin: 3}
    special_reward: {arsenal: 1, objective_card: 1}
    top: {effect: free_action, params: {action: science}, label: "СВОБОДНАЯ НАУКА"}
    описание: "В ЭТОТ ХОД забери последний келемий с нестартового тайла зарождения — награда 3 монеты. Если ты этим полностью исчерпал зарождение и тайл ушёл с поля, условие усилено: карта арсенала и карта задания. Исчерпанное зарождение приближает конец партии — считай, кому это выгодно."

  - id: o08
    name: "Разведка недр"
    kind: regular
    type: incident
    # «Уровень контейнера» — такого нет. Уровни бывают у добытчиков. Усиление
    # переписано на отказ от келемия: у Добычи ровно два выхода, и это выбор.
    requirement: {predicate: miner_took_container, params: {}}
    enhanced:    {predicate: miner_took_container, params: {no_kelium: true}}
    base_reward: {coin: 2, ammo: 2}
    special_reward: {module: assembly}
    top: {effect: convert, params: {from: kelium, to: debris, amount: 1}, label: "КОНВЕРСИЯ: 1 келемий -> 1 обломок"}
    описание: "В ЭТОТ ХОД забери печатный контейнер добытчиком — награда 2 монеты и 2 боеприпаса. Если при этом за весь ход ты не добыл ни одного келемия, условие усилено: жетон модуля сборки. Каждый добытчик в Добыче выбирает одно: келемий или контейнер."

  - id: o15
    name: "Стройбум"
    kind: regular
    type: incident
    # БЫЛО «две операции за ход» — считалось само собой. СТАЛО: операции на
    # гексах, не соседних между собой, то есть застройка вширь, а не вглубь.
    requirement: {predicate: build_ops_on_nonadjacent_hexes, params: {count: 2}}
    enhanced:    {predicate: build_ops_on_nonadjacent_hexes, params: {count: 3}}
    base_reward: {ammo: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: combat}, label: "СВОБОДНЫЙ БОЙ"}
    описание: "В ЭТОТ ХОД выполни две строительные операции на двух гексах, не соседних между собой, — награда 3 боеприпаса. Выполни три операции на трёх попарно несоседних гексах, и условие усилено: 2 обломка и карта задания. Зона стройки растёт от твоих стенок, поэтому разъехаться дороже, чем прирасти."

  - id: o16
    name: "Переезд"
    kind: regular
    type: incident
    # Оговорка «не считая ЦУ» снята: перенос любого здания стоит одну монету,
    # значит ЦУ ничем не выделено. Наоборот — ЦУ стало усилением.
    requirement: {predicate: moved_buildings_this_turn, params: {count: 2}}
    enhanced:    {predicate: moved_buildings_this_turn, params: {count: 2, include_cu: true}}
    base_reward: {coin: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: energy_or_modules, params: {}, label: "СМЕНА ЭНЕРГИИ ИЛИ СМЕНА МОДУЛЕЙ"}
    описание: "В ЭТОТ ХОД перенеси два своих здания на другие гексы — награда 3 монеты. Если одно из перенесённых — твоё ЦУ, условие усилено: 2 обломка и карта задания. ЦУ переносится не чаще раза за ход, так что второе здание придётся подгадать."

  - id: o18
    name: "Полная нагрузка"
    kind: regular
    type: state
    requirement: {predicate: no_unpowered_buildings, params: {min_buildings: 3}}
    enhanced:    {predicate: no_unpowered_buildings, params: {min_buildings: 4}}
    base_reward: {coin: 2, ammo: 2}
    special_reward: {objective_card: 1}
    top: {effect: speed_boost, params: {}, label: "+1 К СКОРОСТИ ОДНОГО РОДА ДО КОНЦА ХОДА"}
    описание: "Не имей на поле ни одного незапитанного здания, при этом зданий у тебя не меньше трёх, — награда 2 монеты и 2 боеприпаса. Доведи число зданий до четырёх, сохранив запитанность всех, и условие усилено: карта задания. Пустая ячейка ЭНР закрывается монетой только на одно действие — на состояние это не работает."

  - id: o19
    name: "Военпром"
    kind: regular
    type: state
    # БЫЛО «два вида военных зданий под энергией» — набор без геометрии.
    # СТАЛО: примыкание, то есть настоящая планировка базы.
    requirement: {predicate: buildings_wall_chain, params: {count: 2, military_only: true}}
    enhanced:    {predicate: buildings_wall_chain, params: {count: 3}}
    base_reward: {coin: 3}
    special_reward: {module: assembly, objective_card: 1}
    top: {effect: convert, params: {from: kelium, to: ammo, amount: 1}, label: "КОНВЕРСИЯ: 1 келемий -> 1 боеприпас"}
    описание: "Имей два своих военных здания на разных гексах, примыкающих друг к другу общей стенкой, — награда 3 монеты. Вытяни такую цепочку из трёх своих зданий, и условие усилено: жетон модуля сборки и карта задания. Здание, повёрнутое стенкой к соседнему гексу, и растит зону стройки, и держит эту цепочку."

  - id: o20
    name: "Коммутация"
    kind: regular
    type: state
    # БЫЛО переусложнённое требование к Смене энергии. СТАЛО — неудобное, но
    # понятное состояние: простой размазан ровно по одному кубику на источник.
    requirement: {predicate: idle_cube_on_each_source, params: {sources: 2}}
    enhanced:    {predicate: idle_cube_on_each_source, params: {sources: 3}}
    base_reward: {coin: 4}
    special_reward: {module: assembly, objective_card: 1}
    top: {effect: energy_or_modules, params: {}, label: "СМЕНА ЭНЕРГИИ ИЛИ СМЕНА МОДУЛЕЙ"}
    описание: "Имей на каждом своём источнике энергии ровно один свободный кубик, и источников у тебя не меньше двух, — награда 4 монеты. Держи так три источника, и условие усилено: жетон модуля сборки и карта задания. Простой кубик лежит на своём источнике, а собрать его обратно стоит гекса в Смене энергии — держать по одному на каждом неудобно намеренно."

  - id: o33
    needs_expansion: market_cards   # без карт рынка условие невыполнимо
    name: "Биржа"
    kind: regular
    type: incident
    cull: "[3+]"
    requirement: {predicate: market_offers_used, params: {count: 3}}
    enhanced:    {predicate: market_offers_used, params: {count: 4}}
    base_reward: {coin: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: movement}, label: "СВОБОДНОЕ ДВИЖЕНИЕ"}
    описание: "В ЭТОТ ХОД оплати три разных предложения на планшете маркета — напечатанные курсы и предложения карт сделок считаются по отдельности. Награда: 3 монеты. Оплати четыре разных предложения, и условие усилено: 2 обломка и карта задания. Биржа берёт объёмом, а не одной удачной сделкой."

  - id: o34
    name: "Научный отдел"
    kind: regular
    type: incident
    # Парная к «Бирже»: у планшета технологий предложений столько же — три
    # трека и вечные курсы, — а карты под них не было ни одной.
    requirement: {predicate: science_offers_used, params: {count: 3}}
    enhanced:    {predicate: science_offers_used, params: {count: 4}}
    base_reward: {ammo: 2, objective_card: 1}
    special_reward: {coin: 4, objective_card: 1}
    top: {effect: free_action, params: {action: market}, label: "СВОБОДНЫЙ МАРКЕТ"}
    описание: "В ЭТОТ ХОД воспользуйся тремя разными предложениями планшета технологий — каждый трек и каждый вечный курс считаются отдельным предложением. Награда: 2 боеприпаса и карта задания. Возьми четыре разных предложения, и условие усилено: 4 монеты и ещё карта задания. Больше одного шага на трек за действие не сделать — значит придётся идти вширь."

  - id: o36
    name: "Научный рывок"
    kind: regular
    type: state
    requirement: {predicate: tech_step_reached, params: {step: 2, tracks: 1}}
    enhanced:    {predicate: tech_step_reached, params: {step: 2, tracks: 2}}
    base_reward: {coin: 4}
    special_reward: {module: assembly, objective_card: 1}
    top: {effect: shield, params: {types: [aircraft, tower]}, label: "ЩИТ: авиация или вышка"}
    описание: "Дойди до второго шага хотя бы на одном треке технологий — награда 4 монеты. Стой на втором шаге сразу на двух треках, и условие усилено: жетон модуля сборки и карта задания. Второй шаг — первое место, где трек начинает платить очками."

  - id: o39
    name: "Сдача"
    kind: regular
    type: incident
    requirement: {predicate: science_trophies_spent, params: {count: 2}}
    enhanced:    {predicate: science_trophies_spent, params: {count: 2, same_track: true}}
    base_reward: {coin: 3}
    special_reward: {objective_card: 3}
    top: {effect: convert, params: {from: kelium, to: debris, amount: 1}, label: "КОНВЕРСИЯ: 1 келемий -> 1 обломок"}
    описание: "В ЭТОТ ХОД действием Наука сдай не меньше двух трофейных жетонов — награда 3 монеты. Если оба ушли на один и тот же трек, условие усилено: 3 карты задания. Один шаг на трек за действие — вот почему «оба на один трек» стоит дороже, чем кажется."

  - id: o40
    name: "Ва-банк"
    kind: regular
    type: state
    requirement: {predicate: resources_at_most, params: {coin: 0, ammo: 0}}
    enhanced:    {predicate: resources_at_most, params: {coin: 0, ammo: 0, kelium: 0}}
    base_reward: {coin: 3, ammo: 2}
    special_reward: {objective_card: 2}
    top: {effect: free_action, params: {action: science}, label: "СВОБОДНАЯ НАУКА"}
    описание: "Имей одновременно ноль монет и ноль боеприпасов — награда 3 монеты и 2 боеприпаса. Обнули заодно и келемий, и условие усилено: 2 карты задания. Ва-банк играют только на голом столе."

  - id: o06
    name: "Отгрузка"
    kind: regular
    type: sacrifice
    requirement: {predicate: sacrifice_paid, params: {}}
    sacrifice: {resource: container, amount: 2}
    enhanced:  {predicate: sacrifice_enhanced, params: {resource: container, amount: 3}}
    base_reward: {coin: 4}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: market}, label: "СВОБОДНЫЙ МАРКЕТ"}
    описание: "Сдай два своих неоткрытых контейнера — награда 4 монеты. Сдай третий, и условие усилено: 2 обломка и карта задания. Контейнер стоит ровно столько, сколько в нём лежит, а лежит в нём неизвестно что."

  - id: o10
    name: "Разоружение"
    kind: regular
    type: sacrifice
    requirement: {predicate: sacrifice_paid, params: {}}
    sacrifice: {resource: units_off_base, amount: 2}
    enhanced:  {predicate: sacrifice_enhanced, params: {resource: units_off_base, amount: 3}}
    base_reward: {coin: 3, ammo: 2}
    special_reward: {objective_card: 1}
    top: {effect: free_action, params: {action: movement}, label: "СВОБОДНОЕ ДВИЖЕНИЕ"}
    описание: "Верни в свой запас два своих войска с разных гексов, не считая вышек и не считая гексов со своими зданиями, — награда 3 монеты и 2 боеприпаса. Верни третье с третьего гекса, и условие усилено: карта задания. Сданные войска не считаются уничтоженными и трофеями противнику не идут."

  - id: o50
    name: "Линия фронта"
    kind: regular
    type: state
    # РИСУНОК. Дизайнер: считать надо не жетоны, а СВЯЗЬ. Фигура задаётся тем,
    # что она соединяет, — тогда карту нельзя закрыть кучей на одном гексе.
    requirement: {predicate: chain_connects, params: {what: "unit:any", anchors: own_miner_hexes, anchor_count: 2}}
    enhanced:    {predicate: chain_connects, params: {what: "unit:any", anchors: own_miner_hexes, anchor_count: 2, forbid_kinds: [tower]}}
    base_reward: {ammo: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: movement}, label: "СВОБОДНОЕ ДВИЖЕНИЕ"}
    описание: "Твои войска образуют непрерывное соседство, связывающее два разных гекса, где стоят твои добытчики, — награда 3 боеприпаса. Если в этом соседстве не участвует ни одна вышка, условие усилено: 2 обломка и карта задания. Вышка стоит даром и не двигается — линия без вышек означает, что ты держишь её живыми войсками."

  - id: o53
    name: "Промышленный узел"
    kind: regular
    type: state
    requirement: {predicate: chain_connects, params: {what: "building:any", anchors: straight_line, anchor_count: 3}}
    enhanced:    {predicate: chain_connects, params: {what: "building:any", anchors: straight_line, anchor_count: 3, require_types: [airbase], require_count: 2}}
    base_reward: {coin: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: build, ops: 1}, label: "ОДНА СТРОИТЕЛЬНАЯ ОПЕРАЦИЯ"}
    описание: "Твои здания образуют непрерывное соседство, связывающее три гекса, лежащих по прямой, — награда 3 монеты. Если в этом соседстве участвуют две твои авиабазы, условие усилено: 2 обломка и карта задания. Авиабаза просит три кубика энергии, и две подряд — это уже вся сеть."

  - id: o54
    name: "Заслон"
    kind: regular
    type: state
    requirement: {predicate: chain_connects, params: {what: "any", anchors: opposite_around_spawn, anchor_count: 2}}
    enhanced:    {predicate: chain_connects, params: {what: "any", anchors: opposite_around_spawn, anchor_count: 2, require_unit_kinds: [infantry, vehicle, aircraft, tower]}}
    base_reward: {coin: 2, ammo: 2}
    special_reward: {objective_card: 1}
    top: {effect: heal_hex, params: {}, label: "РЕМОНТ ГЕКСА"}
    описание: "Твои жетоны образуют непрерывное соседство, связывающее два противоположных гекса вокруг одного тайла зарождения, — награда 2 монеты и 2 боеприпаса. Если в этом соседстве есть войска всех четырёх родов, условие усилено: карта задания. Заслон вокруг зарождения отрезает соседа от келемия, не тратя ни одного боеприпаса."

  # ==================== НАЧАЛЬНЫЕ (12 карт) ====================
  # У начальных заданий НЕТ усиления ни у одного. Награда у всех одна:
  # 1 обломок и 1 карта задания. Утиль есть у всех: у шести +1 монета,
  # у шести +1 боеприпас.

  - id: n1
    name: "Подъём"
    kind: starting
    type: state
    requirement: {predicate: buildings_on_field_count, params: {count: 3}}
    base_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {coin: 1}, label: "+1 монета"}
    описание: "Имей на поле не меньше трёх своих зданий, считая ЦУ, — награда обломок и карта задания."

  - id: n2
    name: "Первый боец"
    kind: starting
    type: incident
    requirement: {predicate: hired_distinct_kinds, params: {count: 1, forbid_kinds: [tower]}}
    base_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {ammo: 1}, label: "+1 боеприпас"}
    описание: "В ЭТОТ ХОД найми войско любого рода, кроме вышки, — награда обломок и карта задания."

  - id: n3
    name: "Патроны"
    kind: starting
    type: state
    requirement: {predicate: resource_at_least, params: {resource: ammo, amount: 3}}
    base_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {coin: 1}, label: "+1 монета"}
    описание: "Имей не меньше трёх боеприпасов — награда обломок и карта задания."

  - id: n4
    needs_expansion: market_cards   # без карт рынка условие невыполнимо
    name: "Первая сделка"
    kind: starting
    type: incident
    requirement: {predicate: used_market_card_offer, params: {}}
    base_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {ammo: 1}, label: "+1 боеприпас"}
    описание: "В ЭТОТ ХОД воспользуйся предложением карты сделок на рынке — награда обломок и карта задания."

  - id: n5
    name: "Коммутация"
    kind: starting
    type: state
    requirement: {predicate: powered_building_off_cu_hex, params: {}}
    base_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {coin: 1}, label: "+1 монета"}
    описание: "Имей на поле запитанное здание, стоящее не на гексе с твоим ЦУ, — награда обломок и карта задания."

  - id: n6
    name: "Выход"
    kind: starting
    type: state
    requirement: {predicate: unit_at_distance_from_cu, params: {distance: 2}}
    base_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {ammo: 1}, label: "+1 боеприпас"}
    описание: "Имей на поле своё войско на расстоянии двух и больше гексов от гекса с твоим ЦУ — награда обломок и карта задания."

  - id: n7
    name: "Жила"
    kind: starting
    type: state
    requirement: {predicate: resource_at_least, params: {resource: kelium, amount: 3}}
    base_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {coin: 1}, label: "+1 монета"}
    описание: "Имей не меньше трёх келемия — награда обломок и карта задания."

  - id: n8
    name: "Находка"
    kind: starting
    type: state
    requirement: {predicate: has_unopened_container, params: {count: 2}}
    base_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {ammo: 1}, label: "+1 боеприпас"}
    описание: "Имей у себя не меньше двух неоткрытых контейнеров — награда обломок и карта задания."

  - id: n9
    name: "Первый шаг"
    kind: starting
    type: state
    requirement: {predicate: tech_step_reached, params: {step: 1, tracks: 1}}
    base_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {coin: 1}, label: "+1 монета"}
    описание: "Продвинься хотя бы на один шаг на любом треке технологий — награда обломок и карта задания."

  - id: n10
    name: "Первый трофей"
    kind: starting
    type: state
    requirement: {predicate: trophy_contains, params: {any: 1}}
    base_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {ammo: 1}, label: "+1 боеприпас"}
    описание: "Имей в трофеях хотя бы один жетон — награда обломок и карта задания."

  - id: n11
    name: "Второй заход"
    kind: starting
    type: incident
    requirement: {predicate: lower_order_open_this_turn, params: {}}
    base_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {coin: 1}, label: "+1 монета"}
    описание: "В ЭТОТ ХОД получи действие с нижнего приказа своей карты приказа — награда обломок и карта задания."

  - id: n12
    name: "В унисон"
    kind: starting
    type: incident
    requirement: {predicate: order_coincided_this_turn, params: {}}
    base_reward: {debris: 1, objective_card: 1}
    top: {effect: gain, params: {ammo: 1}, label: "+1 боеприпас"}
    описание: "В ЭТОТ ХОД сыграй верхом тот же приказ, что и другой игрок, — награда обломок и карта задания."

# ============================================================================
#  СКАМЕЙКА — готовые карты сверх сорока. В раздачу не попадают (движок читает
#  только ключ objectives), лежат здесь, чтобы не пересобирать их заново, когда
#  какая-то из основных сорока не выдержит замера.
# ============================================================================
bench:
  - id: o37
    name: "Три трека"
    kind: regular
    type: state
    requirement: {predicate: tracks_occupied, params: {tracks: 3, min_step: 1}}
    enhanced:    {predicate: tracks_occupied, params: {tracks: 3, min_step: 2}}
    base_reward: {coin: 3, ammo: 2}
    special_reward: {objective_card: 1}
    top: {effect: free_action, params: {action: build, ops: 1}, label: "ОДНА СТРОИТЕЛЬНАЯ ОПЕРАЦИЯ"}
    описание: "Стой хотя бы на первом шаге сразу на всех трёх треках технологий — награда 3 монеты и 2 боеприпаса. Стой на каждом не ниже второго шага, и условие усилено: карта задания."

  - id: o38
    name: "Промышленник"
    kind: regular
    type: state
    requirement: {predicate: powered_miners_count, params: {count: 2}}
    enhanced:    {predicate: powered_miners_count, params: {count: 4}}
    base_reward: {coin: 3, ammo: 2}
    special_reward: {debris: 3}
    top: {effect: free_action, params: {action: combat}, label: "СВОБОДНЫЙ БОЙ"}
    описание: "Имей запитанными два своих добытчика — награда 3 монеты и 2 боеприпаса. Доведи число запитанных добытчиков до четырёх, и условие усилено: 3 обломка."

  - id: o30
    name: "Мародёр"
    kind: regular
    type: incident
    requirement: {predicate: picked_container_by_unit, params: {count: 1}}
    enhanced:    {predicate: picked_container_by_unit, params: {count: 2}}
    base_reward: {coin: 2}
    special_reward: {objective_card: 1}
    top: {effect: speed_boost, params: {}, label: "+1 К СКОРОСТИ ОДНОГО РОДА ДО КОНЦА ХОДА"}
    описание: "В ЭТОТ ХОД возьми печатный контейнер, накрыв его ячейку своим войском, — награда 2 монеты. Возьми так два контейнера, и условие усилено: карта задания."

  - id: o32
    name: "Вклад"
    kind: regular
    type: sacrifice
    requirement: {predicate: sacrifice_paid, params: {}}
    sacrifice: {resource: kelium, amount: 1}
    enhanced:  {predicate: sacrifice_enhanced, params: {resource: kelium, amount: 2}}
    base_reward: {coin: 4, ammo: 3}
    special_reward: {objective_card: 1}
    top: {effect: free_action, params: {action: mining}, label: "СВОБОДНАЯ ДОБЫЧА"}
    описание: "Сдай один келемий — награда 4 монеты и 3 боеприпаса. Сдай второй, и условие усилено: карта задания. Келемий равен победному очку, поэтому цена здесь настоящая."

  - id: o47
    name: "Демонтаж"
    kind: regular
    type: sacrifice
    requirement: {predicate: sacrifice_paid, params: {}}
    sacrifice: {resource: buildings_off_cu, amount: 1}
    enhanced:  {predicate: sacrifice_enhanced, params: {resource: buildings_off_cu, amount: 2}}
    base_reward: {coin: 4, ammo: 2}
    special_reward: {objective_card: 1}
    top: {effect: free_action, params: {action: build, ops: 1}, label: "ОДНА СТРОИТЕЛЬНАЯ ОПЕРАЦИЯ"}
    описание: "Верни в свой запас одно своё здание, кроме ЦУ, и не бери за него компенсацию, — награда 4 монеты и 2 боеприпаса. Верни второе, и условие усилено: карта задания."

  - id: o48
    name: "Арсенальный набор"
    kind: regular
    type: state
    requirement: {predicate: arsenal_cards_held, params: {count: 3}}
    enhanced:    {predicate: arsenal_cards_held, params: {count: 3, all_face_down: true}}
    base_reward: {coin: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: convert, params: {from: kelium, to: ammo, amount: 1}, label: "КОНВЕРСИЯ: 1 келемий -> 1 боеприпас"}
    описание: "Имей у себя три карты арсенала — награда 3 монеты. Если все три лежат рубашкой вверх и ни одна не установлена, условие усилено: 2 обломка и карта задания."

  - id: o49
    name: "Схрон"
    kind: regular
    type: state
    requirement: {predicate: has_unopened_container, params: {count: 4}}
    enhanced:    {predicate: has_unopened_container, params: {count: 5}}
    base_reward: {coin: 3, ammo: 2}
    special_reward: {objective_card: 1}
    top: {effect: free_action, params: {action: market}, label: "СВОБОДНЫЙ МАРКЕТ"}
    описание: "Имей у себя четыре контейнера — награда 3 монеты и 2 боеприпаса. Держи пять, и условие усилено: карта задания. Вскрытый контейнер сразу уходит, поэтому уточнять «неоткрытых» не нужно."

  - id: o55
    name: "Периметр"
    kind: regular
    type: state
    requirement: {predicate: chain_connects, params: {what: "any", anchors: field_edge_cells, anchor_count: 2}}
    enhanced:    {predicate: chain_connects, params: {what: "any", anchors: field_edge_cells, anchor_count: 2, require_types: [airbase], require_count: 1}}
    base_reward: {coin: 3}
    special_reward: {debris: 2, objective_card: 1}
    top: {effect: free_action, params: {action: build, ops: 1}, label: "ОДНА СТРОИТЕЛЬНАЯ ОПЕРАЦИЯ"}
    описание: "Твои жетоны образуют непрерывное соседство, связывающее два гекса у края поля — гекса, у которого хотя бы одно ребро не имеет соседнего гекса. Награда: 3 монеты. Если в этом соседстве участвует твоя авиабаза, условие усилено: 2 обломка и карта задания."
