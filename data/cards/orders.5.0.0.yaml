# ============================================================================
#  CONTENT: orders  version 5.0.0 — ПЯТЬ ПРИКАЗОВ ПО ПЯТИ ДЕЙСТВИЯМ-РАЗВИЛКАМ
#
#  Решение дизайнера 27.09.2026. Действий пять, каждое — «одно из двух»:
#    Добыча       (extract) — добыть | построить добытчик
#    Питание      (power)   — переложить энергию | построить энергостанцию
#    Снабжение    (supply)  — выпустить | построить военное здание (и ЦУ)
#    Командование (command) — манёвр | бой
#    Развитие     (develop) — рынок | наука
#  Приказы (верх — два соседних действия по кругу; низ — приказ, который
#  должен быть вскрыт сверху раньше тебя в этом круге, и тогда одно действие
#  из двух его действий):
#    ОСВОИТЬ        (settle)   — Добыча + Питание;        низ НАСТУПАТЬ
#    МОБИЛИЗОВАТЬ   (mobilize) — Питание + Снабжение;     низ КОНТРОЛИРОВАТЬ
#    НАСТУПАТЬ      (advance)  — Снабжение + Командование; низ ИССЛЕДОВАТЬ
#    КОНТРОЛИРОВАТЬ (secure)   — Командование + Развитие; низ ОСВОИТЬ
#    ИССЛЕДОВАТЬ    (research) — Развитие + Добыча;       низ МОБИЛИЗОВАТЬ
#  Какие действия у приказа — kelium.engine.Order.ORDER_ACTIONS.
#
#  У каждого цвета пять карт, ДЖОКЕРА (Затаиться) НЕТ. Колоды у всех цветов
#  одинаковые по действиям, различаются спец-плашки. ПЕРЕНОС ПЛАШЕК из 4.0.0:
#    РАЗМЕСТИТЬ (манёвр+стройка)      -> ОСВОИТЬ (обе ветки «построить»)
#    ПРИОБРЕСТИ (снабжение+рынок)     -> МОБИЛИЗОВАТЬ (снабжение)
#    КОНТРОЛИРОВАТЬ (питание+бой)     -> КОНТРОЛИРОВАТЬ (то же слово)
#    ИССЛЕДОВАТЬ (добыча+наука)       -> ИССЛЕДОВАТЬ (те же действия)
#  НАСТУПАТЬ — новая карта; спец-плашки на ней нет ни у одного цвета
#  (решение 27.09, комплект «пять развилок», раздел 2.4).
# ============================================================================

