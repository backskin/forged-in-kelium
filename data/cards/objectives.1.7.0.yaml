# CONTENT: objectives  version 1.7.0
# ============================================================================
#  КАТАЛОГ ЗАДАНИЙ 9.0 — «ПОЛОВИНА КОЛОДЫ ПРО ВОЙНУ» (заказ дизайнера 15.08.2026)
# ============================================================================
#  ЗАЧЕМ ПЕРЕСОБРАН. Разбор каталога 1.6.0 показал перекос, объясняющий, почему
#  боты не воюют: из 54 карт война оплачивалась ШЕСТЬЮ (11%), а 25 карт (46%)
#  были мирным чек-листом застройки — их можно выполнить, ни разу не посмотрев в
#  сторону соседа. Каталог платил за то, чтобы НЕ воевать.
#
#  ЧТО ИЗМЕНИЛОСЬ.
#   * колода сведена к 40 обычным картам (было 46) — вырезаны слабые и дубли;
#   * РОВНО 20 из 40 — про конфликт: бой, помеха сопернику, экспансия к чужой
#     границе, давление на чужие гексы;
#   * четыре новые военные карты: «Ответный удар», «Разорение», «Охота на
#     лидера», «Блокада»;
#   * усиленные награды приведены к правилу дизайнера: только трофеи, жетоны
#     модулей, карты арсенала (келемий как награда убран — в действующем своде
#     он больше не даёт победных очков, и четыре карты платили фантиками);
#   * начальные задания получили полноценную базовую награду вместо одной
#     монеты: они требуют действия, а платили меньше одного предложения рынка.
#
#  ЧТО ВЫРЕЗАНО И ПОЧЕМУ:
#   o06, o10, o32, o34, o35, o39 — ШЕСТЬ карт-жертв «заплати и получи». Они
#     ничего не двигают в партии: это торговый автомат, а не задание.
#   o09 «Ударное соединение» — дубль o02 «Конвейер» с другим порогом.
#   o51, o52, o55 — три задания-рисунка из шести; шесть однотипных фигур в
#     колоде из сорока встречались бы чаще, чем любая другая механика.
# ============================================================================
meta:
  id: 1.7.0
  type: objectives

objectives:
  # ==================== ВОЙНА И ДАВЛЕНИЕ (20 карт) ====================
  - id: o03
    name: "Опорный пункт"
    kind: regular
    type: incident
    описание: "Поставьте вышку отдельно от центра управления — снять её будет уже нельзя — и заберите монету, 3 боеприпаса и контейнер. Если вышка при этом граничит с врагом, условие усилено: модуль атаки, трофей и карта задания. Разыграйте карту — мародёры на передовой приносят лишнюю монету."
    # вышка (скорость 0, дот) поставлена вне гекса ЦУ — снять её нельзя
    requirement: {predicate: tower_placed_off_cu, params: {}}
    enhanced:    {predicate: tower_placed_off_cu, params: {borders_enemy: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {module: attack, trophy: 1, objective_card: 1}
    top: {effect: gain, params: {coin: 1}, label: "МАРОДЁРЫ (аппрокс.: +1 монета)"}
  - id: o07
    name: "Засада"
    kind: regular
    type: state
    описание: "Укройте войско в своём военном здании у самой границы с врагом — награда: монета, 3 боеприпаса и контейнер. Спрячьте так два войска сразу, и условие усилится до арсенала и карты задания. Разыграйте карту и сделайте одиночный выстрел бесплатно — засада бьёт первой."
    # из 7.1 (§9 каталога 8.0): войско укрыто в своём военном здании у фронта
    requirement: {predicate: hidden_unit_near_enemy, params: {count: 1}}
    enhanced:    {predicate: hidden_unit_near_enemy, params: {count: 2}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {arsenal: 1, objective_card: 1}
    top: {effect: free_action, params: {action: combat}, label: "ОДИНОЧНЫЙ ВЫСТРЕЛ"}
  - id: o11
    name: "Передовая база"
    kind: regular
    type: incident
    requirement: {predicate: built_bordering_enemy, params: {enemy: units}}
    enhanced:    {predicate: built_bordering_enemy, params: {enemy: building}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {trophy: 2, objective_card: 1}
    top: {effect: move_unit, params: {hexes: 1}, label: "ОДИНОЧНЫЙ МАРШ"}
    описание: "Постройте здание там, где оно граничит с войсками врага — награда: монета, 3 боеприпаса, контейнер. Постройте его впритык к зданию врага, и условие усилится до 2 трофеев и карты задания. Разыграйте карту — одиночный марш перемещает войско на гекс без затрат."
  - id: o12
    name: "Наглая стройка"
    kind: regular
    type: state
    requirement: {predicate: building_on_hex_with_enemy_units, params: {units: 1}}
    enhanced:    {predicate: building_on_hex_with_enemy_units, params: {units: 2}}
    base_reward: {coin: 1, ammo: 4, container: 1}
    special_reward: {module: attack, trophy: 1, objective_card: 1}
    top: {effect: heal_one, params: {}, label: "ЩИТ — ПЕХОТА (аппрокс.: снять 1 урон)"}
    описание: "Стройте прямо на гексе, где стоит войско врага — награда: монета, 4 боеприпаса, контейнер. Сделайте это там, где врагов сразу два, и условие усилится: модуль атаки, трофей и карта задания. Разыграйте карту — щит снимает 1 урон с пехоты."
  - id: o14
    name: "Осадный лагерь"
    kind: regular
    type: state
    cull: "[4]"
    requirement: {predicate: buildings_ring_around_hex, params: {count: 2, enemy_building_on_center: true}}
    enhanced:    {predicate: buildings_ring_around_hex, params: {count: 3, enemy_building_on_center: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {module: attack, trophy: 2, objective_card: 1}
    top: {effect: heal_one, params: {}, label: "ЩИТ — ТЕХНИКА (аппрокс.: снять 1 урон)"}
    описание: "Обложите вражеское здание своими постройками с двух сторон — награда: монета, 3 боеприпаса и контейнер. Обложите его с трёх сторон, и условие усилится: модуль атаки, 2 трофея и карта задания. Разыграйте карту — щит снимает 1 урон с техники: осада держит крепость в кольце."
  - id: o17
    name: "Штаб на передовой"
    kind: regular
    type: incident
    requirement: {predicate: moved_cu_to_virgin_hex, params: {}}
    enhanced:    {predicate: moved_cu_to_virgin_hex, params: {borders_enemy: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {trophy: 2, objective_card: 1}
    top: {effect: heal_one, params: {}, label: "ПОЛЕВОЙ РЕМОНТ: снять 1 урон"}
    описание: "Перенесите центр управления на гекс, где ещё никто не строил — награда: монета, 3 боеприпаса и контейнер. Перенесите его так, чтобы он граничил с врагом, и условие усилится до 2 трофеев и карты задания. Разыграйте карту — полевой ремонт снимает 1 урон."
  - id: o21
    name: "Первая кровь"
    kind: regular
    type: incident
    requirement: {predicate: destroyed_enemy_this_turn, params: {count: 1}}
    enhanced:    {predicate: destroyed_two_in_one_battle_this_turn, params: {}}
    base_reward: {coin: 5, container: 1}
    special_reward: {module: attack, objective_card: 1}
    top: {effect: free_action, params: {action: assembly}, label: "МАЛАЯ СБОРКА"}
    описание: "Уничтожьте войско врага за один ход — награда: 5 монет и контейнер. Уничтожьте сразу двоих в одном бою, и условие усилится: модуль атаки и карта задания. Разыграйте карту ради малой сборки — первая кровь окупает себя с запасом."
  - id: o22
    name: "Зачистка"
    kind: regular
    type: incident
    описание: "Снесите нейтральную постройку за один ход — награда: 4 монеты и контейнер. Заодно нанесите урон вражескому войску, и условие усилится до арсенала и карты задания. Разыграйте карту ради малой науки — зачистка тыла освобождает руки для фронта."
    # из 7.1 (§9): нейтральные постройки — вход в войну, работает и вдвоём
    requirement: {predicate: destroyed_neutral_this_turn, params: {count: 1}}
    enhanced:    {predicate: destroyed_neutral_this_turn, params: {count: 1, and_damaged_enemy: true}}
    base_reward: {coin: 4, container: 1}
    special_reward: {arsenal: 1, objective_card: 1}
    top: {effect: free_action, params: {action: science}, label: "МАЛАЯ НАУКА"}
  - id: o23
    name: "Подранки"
    kind: regular
    type: incident
    requirement: {predicate: damaged_distinct_no_kills, params: {count: 2}}
    enhanced:    {predicate: damaged_distinct_no_kills, params: {count: 3}}
    base_reward: {coin: 4, container: 1}
    special_reward: {trophy: 2, objective_card: 1}
    top: {effect: gain, params: {containers: 1}, label: "ПОДРЯД (аппрокс.: +1 контейнер)"}
    описание: "Раньте 2 разных войска врага за ход, не убив ни одного — награда: 4 монеты и контейнер. Раньте так же 3 войска, и условие усилится до 2 трофеев и карты задания. Разыграйте карту — подряд приносит лишний контейнер: добить подранков успеете позже."
  - id: o24
    name: "Чистая работа"
    kind: regular
    type: incident
    requirement: {predicate: destroyed_with_ammo_at_most, params: {ammo: 2}}
    enhanced:    {predicate: destroyed_with_ammo_at_most, params: {ammo: 1}}
    base_reward: {coin: 4, container: 1}
    special_reward: {module: attack, objective_card: 1}
    top: {effect: gain, params: {ammo: 1}, label: "ПЕРЕГРУЗ (аппрокс.: +1 БПР)"}
    описание: "Уничтожьте вражеское войско, потратив не больше 2 боеприпасов — награда: 4 монеты и контейнер. Сделайте это одним-единственным боеприпасом, и условие усилится: модуль атаки и карта задания. Разыграйте карту — перегруз добавляет боеприпас."
  - id: o25
    name: "Осада"
    kind: regular
    type: incident
    requirement: {predicate: enemy_building_hit_this_turn, params: {count: 1}}
    enhanced:    {predicate: enemy_building_hit_this_turn, params: {count: 2}}
    base_reward: {coin: 4, container: 1}
    special_reward: {trophy: 2, objective_card: 1}
    top: {effect: free_action, params: {action: assembly}, label: "МАЛАЯ СБОРКА"}
    описание: "Нанесите удар по вражескому зданию за один ход — награда: 4 монеты и контейнер. Ударьте по двум зданиям сразу, и условие усилится до 2 трофеев и карты задания. Разыграйте карту ради малой сборки — осада измеряется терпением."
  - id: o26
    name: "Блицкриг"
    kind: regular
    type: incident
    requirement: {predicate: moved_and_destroyed_same_unit, params: {kills: 1}}
    enhanced:    {predicate: moved_and_destroyed_same_unit, params: {kills: 2}}
    base_reward: {coin: 5, container: 1}
    special_reward: {module: attack, trophy: 2, objective_card: 1}
    top: {effect: gain, params: {arsenal: 1}, label: "ДВОЙНАЯ ПОСТАВКА (аппрокс.: 1 арсенал)"}
    описание: "Одним и тем же войском переместитесь и уничтожьте врага в один ход — награда: 5 монет и контейнер. Сделайте так дважды подряд, и условие усилится: модуль атаки, 2 трофея и карта задания. Разыграйте карту — двойная поставка приносит арсенальную карту."
  - id: o27
    name: "На чужом дворе"
    kind: regular
    type: state
    requirement: {predicate: unit_on_hex_with_enemy_units, params: {count: 1}}
    enhanced:    {predicate: unit_on_hex_with_enemy_units, params: {count: 2}}
    base_reward: {coin: 4, container: 1}
    special_reward: {trophy: 2, objective_card: 1}
    top: {effect: free_action, params: {action: assembly}, label: "АВТОНОМНЫЙ ЗАПУСК (аппрокс.)"}
    описание: "Заведите своё войско на гекс, где уже стоят войска врага — награда: 4 монеты и контейнер. Держите там сразу 2 своих войска, и условие усилится до 2 трофеев и карты задания. Разыграйте карту ради автономного запуска — бесплатной сборки."
  - id: o28
    name: "Клещи"
    kind: regular
    type: state
    cull: "[4]"
    requirement: {predicate: units_bordering_enemy_units_hex, params: {hexes: 2}}
    enhanced:    {predicate: units_bordering_enemy_units_hex, params: {hexes: 3}}
    base_reward: {coin: 4, container: 1}
    special_reward: {trophy: 2, objective_card: 1}
    top: {effect: gain, params: {coin: 1}, label: "ТЕНЕВОЙ КУРЬЕР (аппрокс.: +1 монета)"}
    описание: "Окружите гекс с вражескими войсками своими войсками с двух соседних клеток — награда: 4 монеты и контейнер. Замкните клещи с трёх сторон, и условие усилится до 2 трофеев и карты задания. Разыграйте карту — теневой курьер приносит монету."
  - id: o29
    name: "Пустой двор"
    kind: regular
    type: state
    requirement: {predicate: units_off_own_hexes, params: {count: 2}}
    enhanced:    {predicate: units_off_own_hexes, params: {count: 3}}
    base_reward: {coin: 4, container: 1}
    special_reward: {trophy: 2, objective_card: 1}
    top: {effect: free_action, params: {action: assembly}, label: "СВЕРХУРОЧНЫЕ (аппрокс.: сборка)"}
    описание: "Выведите 2 своих войска за пределы собственных гексов — награда: 4 монеты и контейнер. Выведите 3, и условие усилится до 2 трофеев и карты задания. Разыграйте карту — сверхурочные дают бесплатную сборку, пока двор дома пуст."
  - id: o31
    name: "Господство в небе"
    kind: regular
    type: state
    requirement: {predicate: aircraft_on_enemy_hex, params: {}}
    enhanced:    {predicate: aircraft_on_enemy_hex, params: {cu_on_hex: true}}
    base_reward: {coin: 5, container: 1}
    special_reward: {module: attack, trophy: 2, objective_card: 1}
    top: {effect: gain, params: {trophy: 1}, label: "ОТКАТ (аппрокс.: +1 ТРФ)"}
    описание: "Поставьте свою авиацию на гекс, занятый врагом — награда: 5 монет и контейнер. Сделайте это прямо на гексе с вражеским центром управления, и условие усилится: модуль атаки, 2 трофея и карта задания. Разыграйте карту — откат приносит трофей: небо решает исход."
  # ===== НОВЫЕ ВОЕННЫЕ КАРТЫ (1.7.0) =====
  - id: o41
    name: "Ответный удар"
    kind: regular
    checked_by: card      # условие живёт в коде карты (модуль cards), не в реестре предикатов
    type: incident
    описание: "Уничтожьте чужой жетон В ОТВЕТНОМ БОЮ — когда бьют вас, а падает нападавший. Награда: монета, 3 боеприпаса и контейнер. Усиленно — если в этом же ответном бою вы не потеряли ни одного своего жетона: 2 трофея, жетон модуля атаки и карта задания. Карта поощряет держать оборону зубастой, а не просто копить войска."
    requirement: {predicate: destroyed_in_retaliation, params: {count: 1}}
    enhanced:    {predicate: destroyed_in_retaliation, params: {count: 1, no_losses: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {trophy: 2, module: attack, objective_card: 1}
    top: {effect: gain, params: {ammo: 2}, label: "2 боеприпаса"}
  - id: o42
    name: "Разорение"
    kind: regular
    checked_by: card      # условие живёт в коде карты (модуль cards), не в реестре предикатов
    type: incident
    описание: "Уничтожьте чужой ДОБЫТЧИК или ЭНЕРГОСТАНЦИЮ — не войско, а источник чужого развития. Награда: монета, 3 боеприпаса и контейнер. Усиленно — если снесённое здание было запитано: 3 трофея и карта задания. Самая прямая помеха сопернику в игре: отнятый добытчик стоит ему всех оставшихся раундов добычи."
    requirement: {predicate: destroyed_enemy_economy, params: {count: 1}}
    enhanced:    {predicate: destroyed_enemy_economy, params: {count: 1, powered: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {trophy: 3, objective_card: 1}
    top: {effect: gain, params: {coin: 2}, label: "2 монеты"}
  - id: o43
    name: "Охота на лидера"
    kind: regular
    checked_by: card      # условие живёт в коде карты (модуль cards), не в реестре предикатов
    type: incident
    описание: "Уничтожьте жетон игрока, который ВЕДЁТ по победным очкам. Награда: монета, 3 боеприпаса и контейнер. Усиленно — если это было здание: 2 трофея, жетон модуля атаки и карта задания. Бить лидера выгодно всем, кроме него: карта превращает это в общий интерес и не даёт партии превратиться в гонку в одну калитку."
    requirement: {predicate: destroyed_leader_token, params: {count: 1}}
    enhanced:    {predicate: destroyed_leader_token, params: {count: 1, building: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {trophy: 2, module: attack, objective_card: 1}
    top: {effect: gain, params: {ammo: 2}, label: "2 боеприпаса"}
  - id: o44
    name: "Блокада"
    kind: regular
    checked_by: card      # условие живёт в коде карты (модуль cards), не в реестре предикатов
    type: state
    описание: "Держите свои войска на гексах, соседних с ДВУМЯ РАЗНЫМИ чужими зданиями. Награда: монета, 3 боеприпаса и контейнер. Усиленно — если хотя бы одно из этих зданий запитано: 2 трофея, жетон модуля атаки и карта задания. Осада без штурма: соперник вынужден тратить действия на разблокировку."
    requirement: {predicate: blockading_enemy_buildings, params: {count: 2}}
    enhanced:    {predicate: blockading_enemy_buildings, params: {count: 2, powered: true}}
    base_reward: {coin: 1, ammo: 3, container: 1}
    special_reward: {trophy: 2, module: attack, objective_card: 1}
    top: {effect: move_unit, params: {hexes: 2}, label: "войско идёт на 2 гекса"}

  # ==================== ЭКОНОМИКА, НАУКА, РИСУНКИ (20 карт) ====================
  - id: o01
    name: "Полный залп"
    kind: regular
    type: incident
    описание: "Снарядите минимум 2 войска боеприпасами вместо орудий прямо на сборочной линии — получите монету, 2 боеприпаса и 2 контейнера. Сделайте то же самое на заводе или авиабазе, и награда вырастет до 2 трофеев и новой карты задания. Разыграйте карту — и высадите десант, бесплатную стройку сверху. Патроны в Жёлтой Зоне экономят, а залп бьёт разом по всем стволам."
    # цена: отказ — ни одного войска в ход
    requirement: {predicate: assembly_all_chose_ammo, params: {count: 2}}
    enhanced:    {predicate: assembly_all_chose_ammo, params: {count: 2, include_types: [factory, airbase]}}
