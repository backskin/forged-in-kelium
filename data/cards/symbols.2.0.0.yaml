# CONTENT: symbols  version 2.0.0
# ============================================================================
#  СИМВОЛЫ СУПЕР ЗАДАНИЙ — ПЕРЕРАЗМЕТКА ПОД ДЕЙСТВУЮЩИЕ КОЛОДЫ (17.08.2026)
# ============================================================================
#  ЧТО БЫЛО СЛОМАНО. Разметка 1.0.0 ссылалась на карты арсенала a01–a24 —
#  колоды, которой в игре давно нет. В подключённом арсенале карты называются
#  b*, bs*, v*, и совпадений с разметкой не было НИ ОДНОГО. Значит символ с
#  арсенала не появлялся вообще никогда, ни с руки, ни с установленной карты, и
#  вся вторая часть супер задания держалась на одних контейнерах. Ни один тест
#  этого не ловил — теперь ловит (`SymbolsMarkupTest`).
#
#  ЧТО ТРЕБУЕТ КАРТА СУПЕР ЗАДАНИЯ 3.0. Один символ — тот, что назван на самой
#  карте, — должен быть напечатан на любой ОТКРЫТОЙ (установленной) карте
#  арсенала игрока в момент вскрытия. Набор из трёх символов под планшетом
#  войск отменён вместе с рисунком на рубашке.
#
#  РАСКЛАД:
#    арсенал      — ПО ОДНОМУ символу на КАЖДОЙ карте, включая стартовые и
#                   карты-цели. Формы разложены по кругу ● ■ ▲ ⧗ в порядке
#                   номеров: так ни одна форма не липнет к сильным или к слабым
#                   картам, и стартовая рука не решает, какое супер задание тебе
#                   доступно.
#    супер-арсенал — ПО ДВА РАЗНЫХ символа на каждой из девяти карт. Шесть пар
#                   форм существует всего, и девять карт покрывают все шесть,
#                   три пары повторяются дважды: вершина трека не должна
#                   запирать конкретное супер задание насмерть.
#    контейнеры   — 12 карт из 32, по 3 на форму, из разных ярусов. Прежний
#                   расклад сохранён: id совпадают с действующей колодой.
#
#  ЧИСЛА КАРТ ЗДЕСЬ НЕ ЗАКРЕПЛЕНЫ. Сколько карт в колоде — вопрос открытый
#  (решение дизайнера 17.08.2026), поэтому разметка перечисляет id поимённо и не
#  требует, чтобы их было ровно столько-то.
# ============================================================================
meta:
  id: 2.0.0
  type: symbols

forms:
  - {id: circle,    name: "круг",           glyph: "●"}
  - {id: square,    name: "квадрат",        glyph: "■"}
  - {id: triangle,  name: "треугольник",    glyph: "▲"}
  - {id: hourglass, name: "песочные часы",  glyph: "⧗"}

# ---------------------------------------------------------------------------
#  АРСЕНАЛ: по одному символу на карту. Формы идут по кругу по номерам карт,
#  поэтому соседние по колоде карты почти всегда несут разные формы.
# ---------------------------------------------------------------------------
arsenal:
  circle:    [b01, b05, b09, b13, b17, b21, b25, b29, bs1, bs5, v01, v05]
  square:    [b02, b06, b10, b14, b18, b22, b26, b30, bs2, bs6, v02, v06]
  triangle:  [b03, b07, b11, b15, b19, b23, b27, b31, bs3, bs7, v03]
  hourglass: [b04, b08, b12, b16, b20, b24, b28, bs4, bs8, v04]

# ---------------------------------------------------------------------------
#  СУПЕР-АРСЕНАЛ: по ДВА разных символа на карту. Пар всего шесть, карт девять —
#  первые шесть карт берут все шесть пар, три оставшиеся повторяют самые ходовые.
#  Вершина трека тем самым почти всегда открывает сразу два супер задания.
# ---------------------------------------------------------------------------
super_arsenal:
  sa1: [circle, square]
  sa2: [circle, triangle]
  sa3: [circle, hourglass]
  sa4: [square, triangle]
  sa5: [square, hourglass]
  sa6: [triangle, hourglass]
  sa7: [circle, square]
  sa8: [triangle, hourglass]
  sa9: [circle, triangle]

# ---------------------------------------------------------------------------
#  КОНТЕЙНЕРЫ: 12 карт из 32, по 3 на форму, из разных ярусов — чтобы символ не
#  липнул ни к слабым, ни к сильным бонусам и выбор «взять бонус ИЛИ оставить
#  символ» не был предрешён ценой бонуса.
# ---------------------------------------------------------------------------
containers:
  circle:    [c01, c13, c25]
  square:    [c04, c16, c28]
  triangle:  [c07, c19, c30]
  hourglass: [c10, c22, c32]
