  requires_symbol: square
  vp_on_reveal: 5
  cells:
  - kind: enemy_token
    amount: 1
  - kind: enemy_token
    amount: 1
  - kind: debris
    amount: 2
  - kind: coin
    amount: 1
  текст_карты: |-
    СУПЕРОРУЖИЕ: ПЕХОТА.
    Вскрытие (СПЕЦ): выложи на карту сразу всё — два чужих жетона из своих трофеев, 2 обломка и 1 монету.
    Получи 5 победных очков и жетон супероружия в запас.
    Запуск (СПЕЦ, не чаще раза за круг): пожертвуй открытую карту арсенала с символом ячейки и сними её содержимое, если жетон супероружия стоит на поле, не на гексе со своим зданием, и с этого гекса ты ещё не запускал. Между снятиями жетон обязан переехать.
    Снял с последней занятой ячейки — ты выиграл партию.
    Жетон супероружия не атакует. Символ карты — ■ квадрат.
  описание: Литейня переплавляет чужую броню в свою. Платить приходится трофеями — тем, что уже отобрано
    у соседей, а не тем, что накопано.
