# CONTENT: super_objectives  version таб
# ============================================================================
#  ВЫГРУЖЕНО ИЗ КОДА — файл является ЗЕРКАЛОМ классов карт.
#  снимок для таблиц
#
#  Править этот файл руками бессмысленно: у карт, живущих в коде, движок
#  накрывает запись каталога выгрузкой класса. Менять надо класс, а затем
#  выгружать заново (kelium.ВыгрузкаКаталога).
# ============================================================================
meta:
  id: таб
  type: super_objectives
  выгружено: снимок для таблиц
super_objectives:
- id: prizma
  name: Призма
  subtitle: келемиевый излучатель
  weapon_unit: vehicle
  requires_symbol: circle
  vp_on_reveal: 5
  cells:
  - kind: kelium
    amount: 1
  - kind: ammo
    amount: 2
  - kind: debris
    amount: 1
  - kind: coin
    amount: 1
  текст_карты: |-
    СУПЕРОРУЖИЕ: ТЕХНИКА.
    Вскрытие (СПЕЦ): выложи на карту сразу всё — 1 келемий, 2 боеприпаса, 1 обломок и 1 монету.
    Получи 5 победных очков и жетон супероружия в запас.
    Запуск (СПЕЦ, не чаще раза за круг): пожертвуй открытую карту арсенала с символом ячейки и сними её содержимое, если жетон супероружия стоит на поле, не на гексе со своим зданием, и с этого гекса ты ещё не запускал. Между снятиями жетон обязан переехать.
    Снял с последней занятой ячейки — ты выиграл партию.
    Жетон супероружия не атакует. Символ карты — ● круг.
  описание: 'Призма собирает добытый келемий в один слепящий луч. Келемий тут один, но он и есть половина
    цены: кубик равен победному очку, а карта возвращает пять.'
- id: liteynya
