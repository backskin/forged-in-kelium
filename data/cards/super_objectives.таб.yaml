    Снял с последней занятой ячейки — ты выиграл партию.
    Жетон супероружия не атакует. Символ карты — ▲ треугольник.
  описание: Колосс встаёт на месте разобранного здания. Своё здание уходит из игры навсегда — единственная
    цена в колоде, которая режет собственную экономику.
