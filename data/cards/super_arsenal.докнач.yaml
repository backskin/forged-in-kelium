# CONTENT: super_arsenal  version докнач
# ============================================================================
#  ВЫГРУЖЕНО ИЗ КОДА — файл является ЗЕРКАЛОМ классов карт.
#  снимок для отдельных документов
#
#  Править этот файл руками бессмысленно: у карт, живущих в коде, движок
#  накрывает запись каталога выгрузкой класса. Менять надо класс, а затем
#  выгружать заново (kelium.ВыгрузкаКаталога).
# ============================================================================
meta:
  id: докнач
  type: super_arsenal
  выгружено: снимок для отдельных документов
super_arsenal:
- id: sa1
  name: Гвардия «Кель»
  kind: troop
  unit: infantry
  hp_bonus: 1
  vp_on_card: 1
  passive: super_infantry_demolition
  label: 'супер-пехота: скорость 2, две универсальные атаки по 1 БПР; СПЕЦ (1 БПР) — уничтожить здание
    на своём гексе и забрать в трофеи'
  текст_карты: |-
    СУПЕР-ПЕХОТА. Пятый жетон пехоты сверх личного запаса.
    Скорость 2. Прочность на 1 больше обычной пехоты.
    Две универсальные атаки, каждая по 1 боеприпасу.
    СПОСОБНОСТЬ (СПЕЦ, 1 боеприпас): если этот жетон стоит на гексе со зданием противника — уничтожь это здание и забери его себе в трофеи. Если это ЦУ — забери жетон уничтожения ЦУ; само ЦУ немедленно возвращается владельцу вместе с компенсацией контейнерами.
    Пока карта у тебя — 1 победное очко.
  описание: 'Гвардия воюет не с войсками, а с постройками: подрывник заходит на чужой гекс и снимает здание
    без боя, за один боеприпас. Единственный жетон в игре, который сносит ЦУ, не открывая ответного боя,
    — и потому единственный, ради которого чужой штаб стоит окружать заранее.'
- id: sa2
  name: Тяжёлый танк «Раздор»
  kind: troop
  unit: vehicle
  hp_bonus: 0
  vp_on_card: 1
  passive: super_vehicle_harvester
  label: 'супер-техника: две универсальные атаки по 1 БПР; СПЕЦ (бесплатно) — собрать келемий с примыкающего
    тайла зарождения'
  текст_карты: |-
    СУПЕР-ТЕХНИКА. Пятый жетон техники сверх личного запаса.
    Прочность обычной техники.
    Две универсальные атаки, каждая по 1 боеприпасу.
    СПОСОБНОСТЬ (СПЕЦ, бесплатно): если этот жетон стоит на ячейке, примыкающей к гексу с тайлом зарождения, — забери с этого тайла 1 келемий. Добытчик для этого не нужен, и запитанность не проверяется.
    Пока карта у тебя — 1 победное очко.
  описание: '«Раздор» добывает келемий сам, прямо гусеницами. Прочности сверх обычной у него нет намеренно:
    танк с тремя единицами не берёт уже никакая пехота, и жетон становится не сильным, а безнаказанным.'
- id: sa3
  name: Штурмовик «Гроза»
  kind: troop
  unit: aircraft
  hp_bonus: 1
  vp_on_card: 1
  passive: super_aircraft_transport
  label: 'супер-авиация: две универсальные атаки по 1 БПР; СПЕЦ — перелететь и перенести с собой любое
    число наземных жетонов'
  текст_карты: |-
    СУПЕР-АВИАЦИЯ. Пятый жетон авиации сверх личного запаса.
    Прочность на 1 больше обычной авиации.
    Две универсальные атаки, каждая по 1 боеприпасу.
    СПОСОБНОСТЬ (СПЕЦ): перемести этот жетон на его скорость и возьми с собой любое число своих наземных жетонов войск с его гекса. Перенесённые жетоны игнорируют здания на пути — они летят, а не идут.
    Пока карта у тебя — 1 победное очко.
  описание: «Гроза» возит десант поверх чужих стен. Стена из зданий — главная преграда наземного марша,
    и эта карта её просто отменяет для целого отряда сразу.
- id: sa4
  name: Цитадель
  kind: troop
  unit: tower
  hp_bonus: 1
  vp_on_card: 1
  passive: super_tower_barrage
  label: 'супер-вышка: одна универсальная атака за 1 БПР; СПЕЦ (X БПР) — атака по X разным соседним гексам'
  текст_карты: |-
    СУПЕР-ВЫШКА. Пятый жетон вышки сверх личного запаса.
    Прочность на 1 больше обычной вышки.
    Одна универсальная атака за 1 боеприпас.
    СПОСОБНОСТЬ (СПЕЦ, X боеприпасов): нанеси по одному удару в каждый из X РАЗНЫХ соседних гексов, по любым жетонам на них — на свой выбор. X — сколько боеприпасов ты платишь.
    Пока карта у тебя — 1 победное очко.
  описание: 'Цитадель бьёт веером: обычный Бой выбирает ОДИН соседний гекс, а она накрывает столько, на
    сколько хватит боеприпасов. Обычная атака у неё всего одна — вся сила в залпе, и весь залп стоит запаса.'
- id: sa5
  name: Штабная директива
  kind: power
  passive: ignore_coincidence
  label: правило совпадения приказов тебя не касается; сыграв тот же приказ, что и другой игрок, ты отнимаешь
    у него одно СПЕЦ-действие
  текст_карты: |-
    Правило совпадения приказов на тебя не действует: твой приказ даёт полные два действия, даже если тот же верх вскрыл кто-то ещё.
    Больше того: каждый игрок, вскрывший в этот раунд тот же верхний приказ, что и ты, теряет одно СПЕЦ-действие в свой ход.
  описание: 'Директива снимает с твоего штаба бюрократию и вешает её на чужие. Совпадение приказов из
    помехи превращается в оружие: чем чаще соседи повторяют твой выбор, тем больше они теряют.'
- id: sa6
  name: Келемиевый рудник
  kind: power
  passive: kelium_income
  label: +1 келемий в начале каждого твоего хода
  текст_карты: |-
    В начале каждого своего хода получи 1 келемий сверх обычной добычи.
    Если в хранилище нет свободной ячейки, келемий не берётся.
  описание: 'Своя жила под личным контролем. Раз в ход, а не раз в раунд: до вершины трека игрок добирается
    поздно, и награда за раунд к тому времени уже ничего не решает.'
- id: sa7
  name: Военная машина
  kind: power
  passive: free_ammo_for_move_and_combat
  label: +1 боеприпас на оплату действия Движение и +1 боеприпас на оплату действия Бой
  текст_карты: |-
    Каждый раз, когда ты играешь действие Движение, у тебя есть 1 лишний боеприпас на его оплату. То же и с действием Бой.
    Эти боеприпасы тратятся только внутри своего действия: их нельзя сохранить, отложить в хранилище или потратить на что-то другое.
  описание: Отлаженная машина всегда держит один патрон наготове — но только на марш и на выстрел. Копить
    его нельзя, и потому карта не делает игрока богаче, она делает его подвижнее.
- id: sa8
  name: Мандат совета
  kind: power
  vp_flat: 3
  card_slots: true
  label: +3 ПО в конце партии; поверх этой карты можно держать 1 карту арсенала или до 2 контейнеров
  текст_карты: |-
    В конце партии эта карта приносит 3 победных очка.
    Поверх неё есть место: положи сюда 1 карту арсенала ЛИБО до 2 карт контейнеров. Они лежат здесь так же, как в обычных ячейках планшета, и работают по своим правилам.
  описание: 'Мандат — это и очки, и лишняя полка. Прежняя редакция давала только очки и была самой скучной
    картой набора: приз за вершину трека не может быть просто числом.'
- id: sa9
  name: Параллельные штабы
  kind: power
  passive: three_spec_actions
  label: у тебя три СПЕЦ-действия за ход вместо одного
  текст_карты: В свой ход тебе доступны три СПЕЦ-действия вместо одного.
  описание: Три штаба отдают приказы разом. Два спец-действия дают и обычные карты арсенала — вершина
    трека обязана давать больше, иначе приз за 4 трофея равен приблуде с витрины.
