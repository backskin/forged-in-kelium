# CONTENT: arsenal  version 4.1.0
# КОЛОДА 28 (заказ дизайнера 28.08.2026): 20 самых востребованных карт из
# арсенала 3.0.0 по замеру «арсенал-по-картам» (80 партий вчетвером,
# толк = установки + применения), восемь лучших «ускоряющих» — в двух копиях
# (поле copies), чтобы преимущество не было монополией одного игрока.
# Выброшены 17 карт с нулевым или почти нулевым толком: b01 b02 b03 b06 b11
# b13 b14 b17 b18 b19 b21 b25 b28 b29 v03 v04 v06. Спорная — b06 «Мобилизация»
# (найм за боеприпас): по смыслу ровно «ускоряющая» карта, но ни одной
# установки за 80 партий; вернуть, если боты научатся её ценить.
# Стартовые 8 — без изменений, все уникальные.
meta:
  id: 4.1.0
arsenal:
- id: b04
  name: Патронный ящик
  kind: regular
  container_slot: true
  top:
    effect: gain
    params:
      ammo: 3
    label: 3 боеприпаса
  bottom:
    kind: SPEC
    passive: ammo_cell_and_spec_assembly
    label: '+1 ячейка боеприпаса; СПЕЦ: за 1 монету — сборка боеприпасов любым своим запитанным военным
      зданием'
  описание: Утиль сразу приносит 3 боеприпаса. Пока карта установлена, у вас на 1 ячейку боеприпаса больше,
    а спец-действием за 1 монету можно собрать боеприпасы любым своим запитанным военным зданием. На открытой
    карте нарисована ячейка под контейнер, так что она работает и на запас.
  copies: 2
- id: b05
  name: Келемиевый бак
  kind: regular
  container_slot: true
  top:
    effect: free_action
    params:
      action: mining
      free_miner_moves: 1
      ops: 2
    label: 'Добыча: работает и незапитанный добытчик'
  bottom:
    kind: SPEC
    passive: kelium_cell_and_spec_mining
    label: '+1 ячейка келемия; СПЕЦ: за 1 монету — добыча одним своим запитанным добытчиком'
  описание: Утиль даёт Добычу, в которой работает и добытчик без энергии. Пока карта установлена, у вас
    на 1 ячейку келемия больше, а спец-действием за 1 монету можно провести добычу одним своим запитанным
    добытчиком. На открытой карте нарисована ячейка под контейнер — карта служит и хранилищем.
  copies: 2
- id: b07
  name: Диспетчер энергии
  kind: regular
  top:
    effect: gild_module
    params:
      pay: kelium
      price: 1
    label: улучши 1 жетон модуля за 1 келемий
  bottom:
    kind: SPEC
    passive: spec_move_energy_cube
    label: 'СПЕЦ: перемести 1 свой кубик энергии на любое своё здание'
  описание: Утиль золотит один разложенный жетон модуля за келемий. Пока карта установлена, спец-действием
    можно переместить 1 свой кубик энергии на любое своё здание. Удобно перебрасывать питание туда, где
    оно нужнее.
  copies: 2
- id: b20
  name: Аварийное питание
  kind: regular
  top:
    effect: gain
    params:
      coin: 5
    label: 5 монет
  bottom:
    kind: POST
    passive: pay_energy_with_coin
    label: можешь закрывать недостающие ячейки ЭНР монетами — 1 монета за ячейку, на одно действие
  описание: 'Утиль сразу приносит 5 монет. Пока карта установлена, нехватку энергии на здании можно закрыть
    монетами: по монете за каждую пустую ячейку, только на одно действие. Общего такого правила в игре
    нет — эта карта единственный его источник, и потому стоит ровно столько, сколько стоит весь дефицит
    энергии.'
- id: b08
  name: Резервный штаб
  kind: regular
  top:
    effect: gain
    params:
      objective_cards: 3
    label: 3 карты задания
  bottom:
    kind: SPEC
    passive: kelium_ignores_block
    label: 'СПЕЦ: перенеси на эту карту 1 келемий из хранилища ЛИБО сожги лежащий на ней келемий, чтобы
      сыграть ещё одно основное действие своего приказа — можно повторить уже сыгранное'
  описание: Утиль сразу приносит три карты задания. Пока карта установлена, спец-действием можно перенести
    на неё келемий, а потом сжечь его — и сыграть ещё одно основное действие своего приказа, в том числе
    то, которое вы уже играли в этот ход. Келемий равен победному очку, поэтому лишнее действие стоит
    дорого и берётся только в решающий ход.
  copies: 2
- id: b09
  name: Двойной протокол
  kind: regular
  top:
    effect: refresh_arsenal_row
    params: {}
    label: обнови обе открытые карты арсенала
  bottom:
    kind: POST
    passive: bottom_order_instead_of_top
    label: можешь сыграть ещё одно действие своего НИЖНЕГО приказа вместо одного действия ВЕРХНЕГО — в
      том числе повторить уже сыгранное
  описание: 'Утиль сбрасывает обе открытые карты арсенала и выкладывает новые. Пока карта установлена,
    одно действие верхнего приказа можно обменять на ещё одно действие нижнего — даже на то, которое уже
    сыграно. Это размен, а не подарок: пользоваться необязательно.'
  copies: 2
- id: b10
  name: Параллельный контур
  kind: regular
  top:
    effect: unlimited_spec
    params: {}
    label: СПЕЦ-действий до конца хода без предела
  bottom:
    kind: POST
    passive: bottom_order_instead_of_top
    label: можешь сыграть ещё одно действие своего НИЖНЕГО приказа вместо одного действия ВЕРХНЕГО — в
      том числе повторить уже сыгранное
  описание: Утиль снимает предел СПЕЦ-действий до конца этого хода. Пока карта установлена, одно действие
    верхнего приказа можно обменять на ещё одно действие нижнего. Та же технология, что в парной карте,
    но с другой наградой за утиль — держать открытыми сразу обе копии всё равно не выйдет.
  copies: 2
- id: b22
  name: Параллельные штабы
  kind: regular
  top:
    effect: landing
    params:
      count: 2
      where: any_free_hex
    label: 'ДЕСАНТ: два войска разных родов на гекс без чужих войск'
  bottom:
    kind: POST
    passive: two_spec_without_security
    label: два СПЕЦ-действия за ход, если в этот ход ты не сыграл карту БЕЗОПАСНОСТЬ
  описание: Утиль высаживает два войска разных родов на любой гекс, где нет чужих войск. Пока карта установлена,
    в ход, когда вы не разыграли БЕЗОПАСНОСТЬ, вам доступно два спец-действия вместо одного. Расширяет
    ход тому, кто готов идти без страховки приказа.
- id: b23
  name: Штабная коллегия
  kind: regular
  top:
    effect: steal_arsenal_card
    params: {}
    label: забери карту арсенала из руки противника
  bottom:
    kind: POST
    passive: two_spec_without_security
    label: два СПЕЦ-действия за ход, если в этот ход ты не сыграл карту БЕЗОПАСНОСТЬ
  описание: Утиль забирает у выбранного противника закрытую карту арсенала. Пока карта установлена, в
    ход без БЕЗОПАСНОСТИ вам доступно два спец-действия. Вторая копия той же технологии с другой наградой
    за утиль.
- id: b24
  name: Оперативный отдел
  kind: regular
  top:
    effect: gain_per
    params:
      per: own_military_building
      ammo: 2
      max: 6
    label: по 2 боеприпаса за каждое своё военное здание, не больше 6
  bottom:
    kind: POST
    passive: two_spec_without_security
    label: два СПЕЦ-действия за ход, если в этот ход ты не сыграл карту БЕЗОПАСНОСТЬ
  описание: Утиль приносит по два боеприпаса за каждое военное здание на поле, но не больше шести. Пока
    карта установлена, в ход без БЕЗОПАСНОСТИ вам доступно два спец-действия. Третья копия технологии
    — держать открытыми две одинаковые всё равно нельзя, поэтому копии разведены только утилем.
- id: b12
  name: Научный подлог
  kind: regular
  top:
    effect: discard_enemy_arsenal
    params: {}
    label: противник сбрасывает карту арсенала из руки
  bottom:
    kind: POST
    passive: kelium_instead_of_trophy
    label: можешь тратить келемий вместо обломков в действии Наука
  описание: Утиль заставляет противника сбросить карту арсенала из руки. Пока карта установлена, в действии
    Наука вы можете платить келемием вместо обломков. Развязывает науку от постоянной охоты за трофеями
    — но келемий равен победному очку, так что это обмен очков на темп.
- id: b15
  name: Воздушный щит
  kind: regular
  top:
    effect: shield
    params:
      types:
      - aircraft
      - tower
      all: true
    label: 'ЩИТ: авиация и вышка'
  bottom:
    kind: POST
    passive: air_shields_own_hex
    label: твоя авиация закрывает собой все твои жетоны на своём гексе от атак по ним
  описание: Утиль накрывает щитом авиацию и вышку сразу. Пока карта установлена, ваша авиация закрывает
    собой все ваши жетоны на своём гексе — атаки по ним достаются ей первой. Надёжное укрытие для пехоты
    и техники под воздушным прикрытием.
- id: b16
  name: Лёгкий взлёт
  kind: regular
  top:
    effect: shield
    params:
      types:
      - infantry
      - aircraft
      all: true
    label: 'ЩИТ: пехота и авиация'
  bottom:
    kind: POST
    passive: airbase_needs_one_less_energy
    label: твоя авиабаза требует на одну энергию меньше для Сборки
  описание: Утиль накрывает щитом пехоту и авиацию сразу. Пока карта установлена, ваша авиабаза требует
    на 1 энергию меньше для Сборки. Снижает цену выпуска новой авиации.
  copies: 2
- id: b26
  name: Разгонная полоса
  kind: regular
  top:
    effect: shield
    params:
      types:
      - infantry
      - vehicle
      all: true
    label: 'ЩИТ: пехота и техника'
  bottom:
    kind: POST
    passive: airbase_needs_one_less_energy
    label: твоя авиабаза требует на одну энергию меньше для Сборки
  описание: 'Утиль накрывает щитом пехоту и технику сразу. Пока карта установлена, ваша авиабаза требует
    на 1 энергию меньше для Сборки. Вторая копия «Лёгкого взлёта» с другой наградой за утиль: авиабаза
    стоит трёх кубиков энергии, и одной карты на всю колоду для неё мало.'
- id: b27
  name: Абордаж
  kind: regular
  top:
    effect: shield
    params:
      types:
      - vehicle
      - tower
      all: true
    label: 'ЩИТ: техника и вышка'
  bottom:
    kind: SPEC
    passive: spec_boarding
    label: 'СПЕЦ: забери в свои трофеи чужой жетон с гекса, где стоит твоя пехота, и верни эту пехоту
      в свой запас'
  описание: 'Утиль накрывает щитом технику и вышку сразу. Пока карта установлена, спец-действием пехота
    берёт чужой жетон прямо с гекса и уходит с ним — сама возвращаясь в запас. Размен своего отряда на
    чужой жетон без единого выстрела. Захват НЕ считается уничтожением: ответного боя он не вызывает и
    в счёт убийств не идёт.'
- id: b30
  name: Келемиевый дождь
  kind: regular
  top:
    effect: gain
    params:
      kelium: 2
    label: 2 келемия
  bottom:
    kind: SPEC
    passive: spec_kelium_rain
    label: 'СПЕЦ: заплати 2 келемия, выбери гекс, верни ВСЕ стоящие на нём жетоны владельцам в запас и
      положи туда стартовый тайл зарождения'
  описание: Утиль сразу приносит 2 келемия. Пока карта установлена, спец-действием за 2 келемия можно
    очистить любой гекс — все жетоны с него возвращаются владельцам в запас — и положить на него стартовый
    тайл зарождения. Единственный способ создать источник келемия там, где его не было, и единственный
    способ стереть чужую застройку, не воюя.
- id: b31
  name: Ядерный удар
  kind: regular
  top:
    effect: gain
    params:
      coin: 3
      ammo: 1
    label: 3 монеты и 1 боеприпас
  bottom:
    kind: SPEC
    passive: spec_nuclear_strike
    label: 'СПЕЦ: заплати 4 боеприпаса, выбери гекс, положи на него тайл запретного гекса; все стоявшие
      там жетоны возвращаются владельцам в запас, и ты берёшь по 1 обломку за каждый ЧУЖОЙ жетон, но не
      больше 4'
  описание: 'Утиль сразу приносит 3 монеты и боеприпас. Пока карта установлена, спец-действием за 4 боеприпаса
    любой гекс превращается в запретный: все жетоны с него возвращаются владельцам в запас, а вы берёте
    по обломку за каждый чужой жетон, не больше четырёх. Пара к «Келемиевому дождю» и его противоположность:
    дождь платит очками и создаёт источник, удар платит боеприпасами и навсегда вычёркивает гекс из игры.
    Жетоны при этом НЕ уничтожаются — ни трофеев, ни ответного боя.'
- id: bs1
  name: Полевой генератор
  kind: starting
  top:
    effect: free_action
    params:
      action: market
      ops: 1
    label: один обмен на рынке
  bottom:
    kind: POST
    passive: card_is_energy_source_upkeep
    label: считай эту карту отдельным гексом с одним кубиком энергии; в Обновление заплати 1 монету, иначе
      удали карту из игры
  описание: 'Утиль разыгрывает один обмен на рынке. Пока карта установлена, считайте её отдельным гексом
    с одним кубиком энергии: этот кубик участвует в Смене энергии наравне с кубиками на поле. В фазу Обновления
    за карту нужно платить 1 монету — иначе она уходит из игры навсегда.'
- id: bs2
  name: Ответный залп
  kind: starting
  top:
    effect: gain
    params:
      ammo: 3
    label: 3 боеприпаса
  bottom:
    kind: POST
    passive: ammo_on_retaliation_kill
    label: если тебя контратаковали и уничтожили твой жетон — получи 1 боеприпас
  описание: Утиль сразу приносит 3 боеприпаса. Пока карта установлена, если в ответном бою противник уничтожил
    ваш жетон, вы получаете 1 боеприпас. Карта платит не за сам факт контратаки, а за понесённую потерю.
- id: bs3
  name: Мародёрка
  kind: starting
  top:
    effect: gain
    params:
      kelium: 2
    label: 2 келемия
  bottom:
    kind: SPEC
    passive: spec_loot_enemy_building_hex
    label: 'СПЕЦ: если твои войска на гексе со зданием противника — забери у него 1 боеприпас или 1 келемий'
  описание: Утиль сразу приносит 2 келемия. Пока карта установлена, спец-действием можно забрать у противника
    1 боеприпас или 1 келемий, если ваши войска стоят на гексе с его зданием. Хорошая награда за то, что
    вы стоите там, где вам стоять не должны.
- id: bs4
  name: Штабная почта
  kind: starting
  top:
    effect: gain
    params:
      objective_cards: 3
    label: 3 карты задания
  bottom:
    kind: SPEC
    passive: spec_draw_two_objectives_keep_one
    label: 'СПЕЦ: 1 монета — возьми две карты задания, оставь одну'
  описание: Утиль сразу приносит три карты задания. Пока карта установлена, спец-действием за 1 монету
    можно взять две карты задания и оставить себе одну — по своему выбору. Помогает подобрать задание
    точнее под текущую партию.
- id: bs5
  name: Премия за голову
  kind: starting
  top:
    effect: free_action
    params:
      action: build
      discount_coin: 1
    label: 'Стройка: каждое здание на монету дешевле'
  bottom:
    kind: POST
    passive: coin_on_kill
    label: в конце Боя, если уничтожил хотя бы один жетон — 1 монета
  описание: Утиль даёт Стройку, где каждое здание стоит на монету меньше. Пока карта установлена, если
    в конце Боя вы уничтожили хотя бы один жетон противника, вы получаете 1 монету — один раз за действие,
    а не за каждое убийство.
- id: bs6
  name: Аварийные щиты
  kind: starting
  top:
    effect: swap_order_card
    params: {}
    label: поменяй свою карту приказа на другую из руки
  bottom:
    kind: POST
    passive: economy_plus1_hp_returns_on_damage
    label: твои добытчики и энергостанции с прочностью 1 имеют прочность 2; получив урон, такое здание
      сразу после боя возвращается тебе в запас
  описание: 'Утиль меняет твою карту приказа на другую из руки. Пока карта установлена, ваши добытчики
    и энергостанции с прочностью 1 держат два попадания — но, получив урон, такое здание сразу после боя
    возвращается вам в запас. Карта не спасает здание, а меняет форму его потери: противник тратит боеприпас
    и не получает ни трофея, ни очков.'
- id: bs7
  name: Переформирование
  kind: starting
  top:
    effect: free_action
    params:
      action: assembly
      dual_output: 1
      buildings: 1
    label: 'Снаряжение: одно здание даёт и войско, и боеприпас'
  bottom:
    kind: SPEC
    passive: spec_swap_ground_unit
    label: 'СПЕЦ: 2 монеты — замени на поле один свой жетон наземного войска на другой наземный жетон
      из запаса'
  описание: 'Утиль даёт Снаряжение, в котором одно здание выдаёт сразу и войско, и боеприпас. Пока карта
    установлена, спец-действием за 2 монеты один ваш наземный жетон на поле меняется на другой наземный
    жетон из запаса — пехота на технику или наоборот. Ничего не добавляет, а пересобирает уже стоящее:
    полезно ровно тогда, когда рода войск оказались не там, где нужны.'
