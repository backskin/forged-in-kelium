# ============================================================================
#  РАЗМЕРЫ ПЕЧАТНЫХ КОМПОНЕНТОВ — миллиметры настоящего картона
# ============================================================================
#  Зачем это в данных. Рисункам книги и справочника нужно класть жетоны и
#  карты РЯДОМ, и до сих пор каждый рисунок подбирал масштаб на глаз: жетон
#  пехоты выходил ростом с технику, а жетоны на свалке — размером с карту
#  (замечание дизайнера 16.09.2026). Размер компонента — физический факт, и он
#  обязан лежать в одном месте, а не в двадцати скриптах.
#
#  ЕДИНСТВЕННЫЙ МАСШТАБ ЭКСПОРТА. Все жетоны дизайнер выгружает в одном
#  разрешении: 11,8333 точки на миллиметр. Оно проверяется по трём размерам,
#  названным дизайнером прямо: пехота 18×18, техника 39×28,5, добытчик и
#  энергостанция 39×20. Остальные жетоны считаются по тому же масштабу из
#  размеров их картинок, и сторож `РазмерыПечатиTest` каждый раз сверяет
#  таблицу с набором текстур — разойтись они не могут.
#
#  Размер — [ширина, высота] в миллиметрах, как компонент лежит на столе в
#  своём обычном положении. Техника указана в СИММЕТРИЧНОМ положении: углом
#  строго вверх.
# ============================================================================

meta:
  id: 1.0.0
  type: component_sizes
  единица: мм

печать:
  # Точек на миллиметр в экспорте жетонов. По нему считается всё, что не
  # названо дизайнером прямо.
  точек_на_мм: 11.8333
  # Папка текстур, к которой относится масштаб.
  экспорт: data/textures/token

# ----------------------------------------------------------------------------
#  Карты. Размеры названы дизайнером; скругление углов у всех 3 мм.
# ----------------------------------------------------------------------------
карты:
  скругление: 3.0
  задание: [56, 87]
  супер_задание: [56, 87]
  приказ: [56, 87]
  рынок: [87, 56]
  арсенал: [68, 44]
  супер_арсенал: [68, 44]
  контейнер: [34, 34]

# ----------------------------------------------------------------------------
#  Жетоны игрока. Ключ — тип жетона в движке (BuildingType/UnitType.code).
# ----------------------------------------------------------------------------
жетоны:
  infantry: [18.0, 18.0]        # названо дизайнером
  vehicle: [39.0, 28.5]         # названо дизайнером, углом строго вверх
  aircraft: [21.5, 19.9]
  tower: [31.9, 20.8]
  miner: [39.0, 20.0]           # названо дизайнером
  power_plant: [39.0, 20.0]     # названо дизайнером
  barracks: [62.2, 36.2]
  factory: [62.2, 36.2]
  command_center: [62.2, 36.2]
  airbase: [83.7, 35.9]

# ----------------------------------------------------------------------------
#  Поле. Гекс и тайлы считаются по тому же масштабу экспорта, что и жетоны.
# ----------------------------------------------------------------------------
поле:
  гекс: [87.0, 78.3]            # ширина от вершины до вершины, высота между сторонами
