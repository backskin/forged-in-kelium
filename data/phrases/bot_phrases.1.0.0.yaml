# РЕПЛИКИ БОТОВ — что бот говорит, объясняя свой выбор.
#
# Ключ читается так:  <вид решения>.<что именно>.<насколько полезно>
#   вид решения  — приказ, действие, стройка, движение, бой, спец, пас, манёвр
#   что именно   — конкретный приказ / действие / здание / род войск / цель
#   полезно      — оценка обстановки в момент выбора:
#                  сильно (ход отличный) · норма (обычный) · слабо (от безысходности)
#
# На каждый случай — ЧЕТЫРЕ реплики, бот берёт случайную. Файл можно править
# руками: добавляй и переписывай фразы, перезапуск приложения их подхватит.
# Подстановки в фигурных скобках: {гекс} {род} {цель} {здание} {n} {келемий}.
#
# Если ключа нет, бот ищет более общий (сначала без «полезно», потом без «что
# именно»). Поэтому можно описать не всё — молчать он не станет.

