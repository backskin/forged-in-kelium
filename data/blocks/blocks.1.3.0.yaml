# CONTENT: blocks  version 1.3.0
# ФИЗИЧЕСКИЕ БЛОКИ ПОЛЯ: ЧАСТИЧНОЕ ПОКРЫТИЕ ЖЁЛТОЙ ЯЧЕЙКОЙ.
#
# Поле всегда собирается из картонных блоков: 5 малых (по 5 гексов)
# и 5 больших (по 6 гексов), каждый ДВУСТОРОННИЙ — итого 20 сторон.
# Контейнеры унаследованы от 1.2.0 без единой правки: малый блок несёт
# 4 контейнера из 5 гексов, большой — 5 из 6.
#
# ВАРИАНТ ДИЗАЙНЕРА 18.08.2026: ЖЁЛТАЯ ЯЧЕЙКА ЕСТЬ НЕ НА КАЖДОМ ГЕКСЕ —
# только на 4 из 5 гексов малого блока и 5 из 6 гексов большого. Пустует
# РОВНО ТОТ ЖЕ гекс, что и без контейнера (cell: -1) — новой отдельной
# рандомизации не вводится, пустой гекс один и тот же для обеих ячеек.
# energy: -1 — гекс без жёлтой ячейки: энергостанция там всегда даёт
# 1 кубик независимо от уровня, как и на любом гексе вне жёлтой ячейки.
#
# Жетон войска или здания, ВСТАВШИЙ на ячейку с печатным контейнером,
# немедленно приносит владельцу карту контейнера из запаса.
#
# Набор ЗАФИКСИРОВАН — это физический картон, его нельзя менять без
# перепечатки. Координаты гексов осевые и совпадают с формами в
# kelium.gui.BlockAssembler. Ячейки 0..5 — наземные стороны гекса
# (индексы Field.AXIAL_DIRS), 6 — воздушная ячейка.
