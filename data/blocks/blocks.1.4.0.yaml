# CONTENT: blocks  version 1.4.0
# ФИЗИЧЕСКИЕ БЛОКИ ПОЛЯ: РАЗРЕЖЕННОЕ ПОКРЫТИЕ — 3/5 и 4/6.
#
# Поле всегда собирается из картонных блоков: 5 малых (по 5 гексов)
# и 5 больших (по 6 гексов), каждый ДВУСТОРОННИЙ — итого 20 сторон.
#
# РЕЛИЗ 1.4.0 (заказ дизайнера 30.08.2026): покрытие реже, чем в 1.3.0, —
# контейнеры на 3 из 5 гексов малого блока и 4 из 6 большого, жёлтые
# (энергетические) ячейки — на тех же гексах, что и контейнеры.
# Распределение ПЕРЕПРИДУМАНО ЗАНОВО (зерно 20260830): ячейки НЕ
# унаследованы ни от одной прежней версии.
#
# Пустых гексов на каждой стороне ДВА, и пустуют РОВНО ОДНИ И ТЕ ЖЕ
# гексы для обеих ячеек (принцип 1.3.0 — отдельной рандомизации нет):
# cell: -1 и energy: -1 всегда вместе. Ровно один контейнер каждой
# стороны стоит в ВОЗДУШНОЙ ячейке (индекс 6) — её занимает только
# авиация. Жёлтая ячейка всегда НАЗЕМНАЯ (0..5) и никогда не совпадает
# с наземной ячейкой контейнера того же гекса.
#
# Жетон войска или здания, ВСТАВШИЙ на ячейку с печатным контейнером,
# немедленно приносит владельцу карту контейнера из запаса.
# Энергостанция выдаёт свой номинал по уровню, только стоя на жёлтой
# ячейке; вне её она даёт 1 кубик независимо от уровня.
#
# Набор ЗАФИКСИРОВАН — это физический картон, его нельзя менять без
# перепечатки. Координаты гексов осевые и совпадают с формами в
# kelium.gui.BlockAssembler. Ячейки 0..5 — наземные стороны гекса
# (индексы Field.AXIAL_DIRS), 6 — воздушная ячейка.
