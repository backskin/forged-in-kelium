# CONTENT: blocks  version 1.2.0
# ФИЗИЧЕСКИЕ БЛОКИ ПОЛЯ: ПЕЧАТНЫЕ КОНТЕЙНЕРЫ и ЖЁЛТЫЕ ЯЧЕЙКИ.
#
# Поле всегда собирается из картонных блоков: 5 малых (по 5 гексов)
# и 5 больших (по 6 гексов), каждый ДВУСТОРОННИЙ — итого 20 сторон.
# Малый блок несёт 4 контейнера, большой — 5: один гекс блока пустой.
# Ровно один контейнер каждой стороны стоит в ВОЗДУШНОЙ ячейке
# (индекс 6) — её занимает только авиация. cell: -1 — гекс без контейнера.
#
# ЖЁЛТАЯ ЯЧЕЙКА (energy) есть на КАЖДОМ гексе, в отличие от контейнера.
# Она всегда НАЗЕМНАЯ (0..5) и никогда не совпадает с наземной ячейкой
# контейнера того же гекса: это две разные ячейки, накрыть обе одним
# жетоном нельзя. Энергостанция выдаёт свой номинал по уровню, только
# стоя на жёлтой ячейке; на любой другой она даёт 1 кубик независимо от
# уровня. На ЦУ правило не распространяется.
#
# Жетон войска или здания, ВСТАВШИЙ на ячейку с печатным контейнером,
# немедленно приносит владельцу карту контейнера из запаса.
#
# Набор ЗАФИКСИРОВАН — это физический картон, его нельзя менять без
# перепечатки. Контейнеры унаследованы от 1.1.0 без единой правки
# (зерно 20260812), жёлтые ячейки порождены зерном 20260816.
# Координаты гексов осевые и совпадают с формами в kelium.gui.BlockAssembler.
# Ячейки 0..5 — наземные стороны гекса (индексы Field.AXIAL_DIRS),
# 6 — воздушная ячейка.
