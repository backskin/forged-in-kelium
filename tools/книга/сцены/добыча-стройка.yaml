# Гордон (жёлтый) строит добытчик №1 стенкой к тайлу зарождения:
# новое здание сразу срабатывает один раз, даже без энергии (глава 6)
size: 300
hexStroke: "#5A4A33"
hexes:
  - {q: 0, r: 0, spawn: {kelium: 4}}
  - {q: 1, r: 0}
tokens:
  - {type: miner, owner: 3, q: 1, r: 0, building: true, sides: [3], level: 1, energySlots: 2, energyPlaced: 0}
outline:
  - {q: 1, r: 0, color: "#1F7A3A"}
arrows:
  - path: [[0, 0], [1, 0]]
    color: "#1F7A3A"
    trim: 0.48
    badge: {text: "+1", icon: "rules/иконки-экспорт/келемий.png", dy: 1.02, dx: -0.40, h: 0.42}
